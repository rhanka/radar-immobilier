    affected: { identifier: "@ai-sdk/provider-utils", version: 2.2.8 }
    embedded_path: node_modules/ollama-ai-provider/node_modules/@ai-sdk/provider-utils
    severity: low
    severity_source: GitHub advisory (CVSS 4.3)
    rationale: >-
      Unbounded response-body read from a provider endpoint. graphify imports
      ollama-ai-provider only on its Ollama branch, which the API does not select
      (refresh uses llm-mesh runtime clients). ollama-ai-provider 1.2.0 is the
      latest release (2025-01) and only provider-utils 3.0.28 is patched
      (outside ^2.0.0).
    finding_ref: .security/findings/2026-10-10-provider-utils-ollama.md
    owner: repository owner (to confirm)
    status: proposed
    accepted_by: null
    accepted_on: null
    review_by: "2026-11-09"
    removal_plan:
      target: graphify release without ollama-ai-provider (graphify 0.19.x / engram migration) or a maintained provider
      action: Migrate graphify, regenerate the root lockfile through Make, rescan, delete these rows.

  - id: EXC-2026-10-25-zod
    advisory: GHSA-mrhx-c7xc-m3w5
    scanner: npm-audit
    scanner_input: package-lock.json
    component: root npm workspace
    finding_kind: direct-advisory
    affected: { identifier: zod, version: 3.25.76 }
    embedded_path: node_modules/zod
    severity: high
    severity_source: GitHub advisory (high)
    rationale: >-
      Zod below 4.6.6 is affected and no patched stable 3.x release is
      published; installed 3.25.76 is the latest stable 3.x. Five workspace
      consumers pin ^3.x ranges and the ollama-ai-provider / provider-utils
      2.x peers require ^3.0.0 / ^3.23.8, so a 4.x upgrade needs the separately
      authorized Zod 4 migration. Memory exhaustion on oversized constrained
      collections; no production exploit demonstrated. Temporary acceptance
      until a compatible 3.x backport or the Zod 4 migration lands.
    finding_ref: .security/findings/2026-10-24-zod-body-parser-highs.md
    owner: repository owner
    status: accepted
    accepted_by: repository owner
    accepted_on: "2026-10-25"
    review_by: "2026-11-08"
    expires: "2026-11-08"
    removal_plan:
      target: patched compatible zod 3.x backport, or Zod 4 migration of all five workspace consumers plus the ollama/provider-utils chain
      action: Apply the backport or complete the migration, rescan through the audit gate, delete these rows.

