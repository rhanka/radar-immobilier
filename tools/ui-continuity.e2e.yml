services:
  e2e:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    environment:
      E2E_BROWSER_DEPS: preinstalled
  postgres:
    # No durable data in the synthetic qualification stack.
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
      - type: tmpfs
        target: /var/run/postgresql
