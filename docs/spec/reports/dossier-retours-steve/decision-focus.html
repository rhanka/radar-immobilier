ifier avant l’import.<br>• Droits à cadrer : Steve annote, l’équipe ou le PO valide. |\\n\\n**Recommandation : (c) Compte Steve, pour l’import et la saisie.** (c) : Steve annote et valide avec son propre compte ; ses retours importés lui sont attribués, l’importateur est tracé à part. (a) ne vaut que si la création du compte tarde.\\n\\n#### D6 — Visibilité et données personnelles\\n**Étape 2 · Décide : Farid · Consulté : Steve, Mathieu, Fabien.** Décidée après les décisions de Fabien.\\n\\nLe constat C-79 de Steve signale des noms de particuliers en clair dans des résumés de signaux (§5.6) ; les verbatims importés peuvent en contenir aussi. Règle actuelle des notes (migration 0011) : tout utilisateur approuvé lit tout. Il faut décider qui voit les retours et s’ils sont caviardés avant le premier affichage (U1), au regard de la Loi 25 (exigence E9). Le module comments de sentropic ne masque pas les données personnelles : c’est au radar de le faire (D4, D5).\\n\\n**Dépend de :** D4 (Conformité sentropic et suppression), D5 (Auteur des retours importés). **Conditionne :** D14 (Première livraison UI).\\n\\n| Option | Description | Avantages | Inconvénients |\\n|---|---|---|---|\\n| (a) Tous les approuvés, sans caviardage | Tout utilisateur approuvé voit tous les retours, verbatims compris, comme pour les notes actuelles (règle 0011). Aucun masquage. | • Règle existante, aucun travail.<br>• Toute l’équipe voit tout. | • Expose des noms de particuliers.<br>• Ne répond pas à la demande C-79 de Steve. |\\n| (b) Administrateurs et Steve | Seuls les administrateurs et Steve voient les retours ; le reste de l’équipe ne les voit pas dans le panneau. | • Exposition minimale.<br>• Aucun caviardage à développer. | • L’équipe produit ne voit pas les retours : on perd l’intérêt de les afficher.<br>• Gestion de droits spécifique à construire. |\\n| **(c) Approuvés, verbatims caviardés** (recommandée) | Tout utilisateur approuvé voit les retours, mais les noms de particuliers sont masqués avant affichage, dans les verbatims importés comme dans les résumés de signaux (demande C-79 de Steve). Une colonne pii_status trace le traitement. | • Toute l’équipe voit les retours.<br>• Noms de particuliers masqués dans les retours et dans les résumés de signaux : répond à C-79. | • Détection des données personnelles à écrire et tester (colonne pii_status).<br>• Un caviardage peut masquer un nom utile (élu, promoteur) : règles à préciser. |\\n\\n**Recommandation : (c) Approuvés, verbatims caviardés.** (c) : toute l’équipe garde l’accès aux retours, et les noms de particuliers sont masqués, dans les retours comme dans les résumés de signaux.\\n\\n#### D7 — Définition de C v1\\n**Étape 2 · Décide : Farid · Consulté : Steve, Mathieu, Fabien.** Décidée après les décisions de Fabien.\\n\\nC est la nouvelle sélection de signaux proposée, alignée sur les trois critères de Steve : résidentiel, assouplissement, densification (§2.2, scène 1). Aujourd’hui, deux de ces trois critères n’ont aucune donnée au radar. Steve pose une réserve : un signal dont le sens n’est pas lisible doit rester affiché (« masquer ce qui n’a pas pu être lu transformerait une lacune en dossier manqué »). Il faut fixer la règle de C avant de la développer (lot C1) ; elle sera mesurée par le jeu de référence de ciblage (D10), sur la lecture de la double annotation retenue (D9). Les critères K1 à K9 sont détaillés au §9.2.\\n\\n**Dépend de :** D9 (Sens de « double annotation »), D10 (Jeu de référence #783). **Conditionne :** D8 (Cas contradictoires), D12 (Exposition A/B/C), D16 (Retour à Steve).\\n\\n| Option | Description | Avantages | Inconvénients |\\n|---|---|---|---|\\n| Triplet strict pour toute visibilité | C n’affiche que les signaux qui réunissent les trois critères de façon établie. Exemple : sur la passe 1, seuls 22 signaux sur 73 resteraient ; les 12 Pertinent dont le sens n’est pas donné disparaîtraient. | • Flux court et lisible : seulement ce qui réunit les trois critères (22 sur 73).<br>• Plus simple à calculer : un signal entre ou non. | • Masque les indéterminés : contredit la réserve explicite de Steve.<br>• Perte de rappel sur les dossiers mal lus. |\\n| **K1–K9 + trois états** (recommandée) | C applique les critères K1 à K9 (§9.2) avec trois états : confirmé (critères étayés), à instruire (sens ou effet non déterminable, reste visible), exclu prouvé (masqué, raison affichée). Deux compteurs distincts « confirmés » et « à instruire ». Aucun seuil de taille de projet ni filtre sur l’origine privée. | • Respecte les trois critères et la réserve : on ne masque que ce qui est établi hors critères.<br>• Trois états (confirmé, à instruire, exclu prouvé) et deux compteurs : un cas incertain n’est pas présenté comme une opportunité. | • Le flux garde du travail manuel (les « à instruire »).<br>• Exige des extractions nouvelles (sens, effet sur les unités, portée) : lot C1 de taille L. |\\n| B inchangé, critères pour trier | La sélection affichée reste B ; les critères de Steve servent seulement à trier la liste (les « trois critères » en premier). Aucun signal n’entre ni ne sort. | • Aucun changement d’appartenance, aucun risque.<br>• Aucune extraction nouvelle à développer. | • Le bruit connu (24 sur 73) persiste.<br>• Ne répond pas à Steve : « ce n’est pas une question de hiérarchie ». |\\n\\n**Recommandation : K1–K9 + trois états.** K1–K9 + trois états, après relecture de la table de dérivation par Steve : c’est la seule règle qui applique ses trois critères sans masquer ce qui n’a pas pu être lu. Aucun seuil de taille de projet ni filtre sur l’origine privée.\\n\\n#### D8 — Cas contradictoires (Saint-Victor, Amos, CPTAQ, seconds projets, ODJ, S-RESTRICTIF)\\n**Étape 2 · Décide : Farid · Consulté : Steve, Mathieu.** Décidée après les décisions de Fabien.\\n\\nCertains cas ne se tranchent pas par une règle automatique : Saint-Victor (un resserrement qui favorise pourtant la densification), Amos (logement sur commerce), portée de l’exception CPTAQ, seconds projets, points d’ordre du jour, trois restrictions « À surveiller » (§9.2). Le tableur et l’analyse de Steve se contredisent parfois sur ces cas. Il faut décider qui les arbitre avant de geler le jeu de référence (D10) et la règle C (D7) ; sinon le jeu de référence sanctionnera le bon comportement.\\n\\n**Dépend de :** D7 (Définition de C v1), D10 (Jeu de référence #783). **Conditionne :** D16 (Retour à Steve).\\n\\n| Option | Description | Avantages | Inconvénients |\\n|---|---|---|---|\\n| **Revue métier, abstention en attendant** (recommandée) | Steve et Mathieu examinent les cas listés au §9.2 sur exemples et preuves (Saint-Victor, Amos, CPTAQ, seconds projets, ODJ, trois S-RESTRICTIF). Tant qu’un cas n’est pas tranché, il est marqué « abstention » dans le jeu de référence : il ne compte ni pour ni contre. | • Steve et Mathieu tranchent sur exemples et preuves : la règle reste celle du client.<br>• En attendant, abstention explicite : ces cas ne comptent ni pour ni contre. | • Demande du temps à Steve et Mathieu.<br>• Quelques cas restent ouverts plus longtemps. |\\n| Arbitrage par l’équipe | L’équipe tranche elle-même chaque cas à partir de l’analyse et des règles de Steve, puis lui présente le résultat. | • Plus rapide.<br>• Ne mobilise ni Steve ni Mathieu. | • Risque de prêter à Steve une règle qu’il n’a pas posée.<br>• Le jeu de référence refléterait l’avis de l’équipe, pas celui du client. |\\n| Statu quo | Les cas restent dans le jeu de référence avec l’étiquette du tableur, sans statut particulier, même quand le tableur et l’analyse se contredisent. | • Aucun effort.<br>• Le jeu de référence peut être gelé tout de suite. | • Cas sans statut dans le jeu de référence : mesures faussées.<br>• Désaccords invisibles. |\\n\\n**Recommandation : Revue métier, abstention en attendant.** (a) : la règle reste celle du client, et les cas ouverts ne faussent pas la mesure pendant qu’ils sont arbitrés.\\n\\n#### D12 — Exposition A/B/C (point ouvert)\\n**Étape 2 · Décide : Farid · Consulté : Steve, Mathieu, Fabien.** Décidée après les décisions de Fabien.\\n\\nAujourd’hui l’écran montre la sélection B ; le sélecteur A/B a été retiré en août (§9.1). La demande initiale parle d’un « mécanisme A/B étendu en C », mais les règles de partage validées le 1er octobre (#787, item 4) demandent de ne pas réintroduire de choix entre plusieurs viviers. Les deux lectures sont défendables (§9.5) : Farid tranche. Concrètement : Steve verra-t-il un sélecteur A/B/C, ou une seule sélection qui change le jour où C est prouvée meilleure (D13) ? La règle C (D7) et sa mesure (D10, D11) doivent être connues.\\n\\n**Dépend de :** D7 (Définition de C v1), D10 (Jeu de référence #783), D11 (Benchmark #782). **Conditionne :** D13 (Seuil de bascule B → C).\\n\\n| Option | Description | Avantages | Inconvénients |\\n|---|---|---|---|\\n| **(a) C en shadow, comparaison réservée UAT, puis remplacement de B** (recommandée) | Steve et l’équipe continuent de voir B, sans sélecteur. C est calculée en parallèle par le backend ; une page de comparaison B / C n’est accessible qu’en recette UAT et aux administrateurs. Le jour où le seuil D13 est franchi et que Farid décide, C remplace B à l’écran (scène 5). | • Conforme à #787 : aucun choix de vivier pour les utilisateurs.<br>• Interface simple, comme Steve le demande.<br>• Retour arrière simple : désactiver C. | • Steve ne voit C qu’en UAT (mode réservé) avant la bascule.<br>• La comparaison reste un outil interne. |\\n| (b) Sélecteur A/B/C visible + mode comparatif | Un sélecteur A / B / C apparaît dans le rail pour tous les utilisateurs, avec un mode comparatif ; le choix est porté dans l’URL (filter.targeting=a|b|c). | • Littéralement « A/B étendu en C ».<br>• L’utilisateur compare lui-même les sélections. | • Réintroduit un choix de viviers, contraire à #787 (item 4).<br>• Plus complexe à expliquer et à maintenir (paramètre filter.targeting). |\\n| (c) Incréments dans B | On n’expose pas C comme un tout : on ajoute à B, un par un, les critères de C (sens, plein droit, second projet), chacun livré quand il est prêt. | • Aligné avec #761 ; livrable par petits morceaux (sens, plein droit, second projet).<br>• Chaque amélioration est visible pour Steve dès sa livraison. | • Pas de mesure d’ensemble B contre C.<br>• Les filtres Résidentiel et Zonage restent. |\\n| (d) Application C séparée | On construit une seconde application dédiée à C, avec sa propre carte, ses filtres et ses notes ; Steve choisit l’une ou l’autre application. | • Liberté totale de simplification.<br>• Aucun risque pour l’écran actuel de Steve. | • Duplique sélection, filtres et notes.<br>• Deux applications à maintenir. |\\n\\n**Recommandation : (a) C en shadow, comparaison réservée UAT, puis remplacement de B.** (a), avec des emprunts à (c) : interface simple pour Steve, conforme à #787, retour arrière immédiat. Si Farid veut un sélecteur visible, (b).\\n\\n#### D13 — Seuil de bascule B → C (à fixer)\\n**Étape 2 · Décide : Farid · Consulté : Steve, Mathieu, Fabien.** Décidée après les décisions de Fabien.\\n\\nSi C tourne en parallèle de B (D12), il faut écrire à l’avance quand C remplace B ; sans seuil écrit, la bascule se décidera à l’impression. La mesure viendra du jeu de référence de ciblage (D10), sur le jeu test des 52 villes, dans le volet ciblage du benchmark (D11). Point de départ mesuré sur l’échantillon de Steve : précision P ∪ S de B = 67,1 % (49 sur 73) ; 34 des 40 Pertinent visibles en passe 1 (§9.3). Proposition à amender par Farid dans le commentaire.\\n\\n**Dépend de :** G6 (G6 — Règle et porteur de la promotion), D10 (Jeu de référence #783), D11 (Benchmark #782), D12 (Exposition A/B/C).\\n\\n| Option | Description | Avantages | Inconvénients |\\n|---|---|---|---|\\n| **Aucun P masqué, précision P ∪ S > B, parité** (recommandée) | C remplace B seulement si, sur le jeu test des 52 villes : aucun signal que Steve juge Pertinent n’est masqué ; la précision P ∪ S de C dépasse celle de B (67,1 % sur la passe 1) ; l’API, le rail, la carte et le panneau montrent les mêmes ensembles ; Farid fait la recette. | • Protège la réserve de Steve : aucun Pertinent masqué.<br>• Exige un gain réel de précision, pas seulement un affichage plus court.<br>• Parité API, rail, carte, panneau : aucun écart entre écrans (#786). | • Demande le jeu test complet (52 villes) avant de basculer.<br>• La bascule peut tarder si un seul Pertinent est perdu. |\\n| Seuil chiffré différent | Farid écrit d’autres chiffres dans le commentaire (par exemple une précision minimale ou un rappel minimal), mesurés par le même jeu de référence. | • Farid fixe ses propres chiffres (à écrire dans le commentaire).<br>• Peut refléter un compromis métier que Farid connaît mieux. | • À préciser.<br>• Risque d’un seuil non mesurable par le jeu de référence. |\\n| Bascule sur recette seule | La bascule se décide sur la recette de Farid seule, sans mesure chiffrée par le jeu de référence. | • Rapide : recette de Farid seulement.<br>• Ne dépend pas de l’achèvement du jeu test. | • Sans mesure, aucune garantie de non-régression.<br>• Contraire à l’objet du jeu de référence de ciblage. |\\n\\n**Recommandation : Aucun P masqué, précision P ∪ S > B, parité.** (a) : garantit qu’aucun dossier utile ne disparaît et que C fait réellement mieux que B, sur des écrans cohérents entre eux. Résidentiel et Zonage ne sont retirés qu’après une décision #761 fondée sur la mesure.\\n\\n#### D14 — Première livraison UI\\n**Étape 2 · Décide : Farid · Consulté : Mathieu, Fabien.** Décidée après les décisions de Fabien.\\n\\nUne fois les retours en base, il faut les montrer. L’UI est en migration : 39 composants Svelte sur 69 utilisent le design system, les 3 composants d’annotation aucun, et la carte Signaux est un composant local MapLibre de 2 761 lignes destiné à être remplacé (§8, scène 4). Il faut choisir où le retour de Steve apparaît en premier : dans le panneau du signal et le rail, ou directement sur la carte. Le choix décide si #784 avance sans attendre la migration geo. Il suppose l’ancre réparée (D3), la lecture conforme (D4) et la règle de visibilité (D6).\\n\\n**Dépend de :** D3 (Ancre signal et correctif B0), D4 (Conformité sentropic et suppression), D6 (Visibilité et données personnelles). **Conditionne :** D15 (Séquencement).\\n\\n| Option | Description | Avantages | Inconvénients |\\n|---|---|---|---|\\n| **(a) Panneau + rail + DS ciblé** (recommandée) | Dans le panneau du signal, un badge « Retour de Steve » (vert, jaune, rouge) ouvre une section « Avis de Steve » : classement, motif, sens, analyse, provenance, état du rattachement. Dans le rail, des compteurs P / S / N par ville. Les 3 composants d’annotation passent au design system. Rien sur la carte au premier lot. | • Valeur immédiate : badge et section « Avis de Steve » dans le panneau, compteurs P / S / N dans le rail.<br>• Aucun code ajouté à un composant à remplacer.<br>• Les 3 composants d’annotation migrent au design system dans le même lot. | • Pas d’indicateur sur la carte au premier lot.<br>• Les badges par signal exigent la lecture groupée du lot L2. |\\n| (b) Pastilles sur la carte actuelle dès L3 | En plus du panneau, des pastilles colorées sur la carte Signaux actuelle (composant local MapLibre de 2 761 lignes) dès le lot L3. | • Visibilité cartographique immédiate.<br>• L’ancre ne dépend pas du moteur de carte. | • Code ajouté à un composant de 2 761 lignes voué au remplacement.<br>• Double travail à la migration geo. |\\n| (c) Migration geo complète d’abord | On termine d’abord la migration de la carte vers les composants geo partagés (Porte 2), puis on affiche les retours sur la nouvelle carte et dans le panneau. | • Expérience cohérente d’emblée.<br>• Aucun code d’annotation à reprendre après la migration. | • Dépend de la « Porte 2 » (moteur geo désactivé aujourd’hui).<br>• Retarde #784 sans date. |\\n| (d) Tableau de retours séparé seul | Un écran séparé liste tous les retours de Steve (filtrable par ville, motif, statut de rattachement), sans rien afficher sur les objets du radar. | • Toute la donnée consultable en un seul écran.<br>• Utile comme outil de curation des rattachements. | • N’annote pas l’élément associé : ne répond pas à #784.<br>• Un écran de plus. |\\n\\n**Recommandation : (a) Panneau + rail + DS ciblé.** (a) : valeur visible tout de suite, sans investir dans un composant de carte destiné à être remplacé.\\n\\n#### D15 — Séquencement\\n**Étape 2 · Décide : Farid · Consulté : Mathieu, Fabien.** Décidée après les décisions de Fabien.\\n\\nLa priorité n° 1 de Steve reste la fraîcheur des signaux (#703, rafraîchissement quotidien). Le travail de ce dossier peut avancer en parallèle ou attendre. B0 (D3), l’import (L1) et le jeu de référence (O1, D10) ne touchent pas la chaîne de rafraîchissement ; le classifieur C (C1), lui, a besoin de signaux frais (§12). Le choix fixe quand Steve verra ses retours dans l’outil (D14).\\n\\n**Dépend de :** G7 (G7 — Séquencement, tables immo et pilote C), D3 (Ancre signal et correctif B0), D10 (Jeu de référence #783), D14 (Première livraison UI).\\n\\n| Option | Description | Avantages | Inconvénients |\\n|---|---|---|---|\\n| **(a) B0, import et jeu de référence en parallèle de la fraîcheur** (recommandée) | B0, l’import (L1) et le jeu de référence de ciblage (O1) démarrent maintenant, en parallèle de #703, car ils ne touchent pas la chaîne de rafraîchissement. Le classifieur C (C1) attend que le rafraîchissement soit stable. | • Valeur livrée tôt : annotation réparée, retours visibles, jeu de référence prêt.<br>• Aucune interférence avec la chaîne de rafraîchissement.<br>• C1 démarre sur des signaux stabilisés. | • Deux chantiers en parallèle à suivre.<br>• L’attention de l’équipe est partagée. |\\n| (b) Tout après #703 | Tout le travail de ce dossier attend la clôture de #703 (rafraîchissement quotidien en production). | • Une seule priorité à la fois.<br>• Aucun risque d’interférence, même indirecte, avec le rafraîchissement. | • Rien de visible pour Steve sur ses retours avant #703.<br>• L’annotation de signal reste cassée plus longtemps. |\\n\\n**Recommandation : (a) B0, import et jeu de référence en parallèle de la fraîcheur.** (a) : livre tôt ce qui ne gêne pas le rafraîchissement, et garde C1 pour après sa stabilisation.\\n\\n#### D16 — Retour à Steve\\n**Étape 2 · Décide : Farid · Consulté : Mathieu.** Décidée après les décisions de Fabien.\\n\\nSteve a reconstitué le fonctionnement des filtres en observant l’écran, et écrit qu’« une seule réponse des développeurs remplacerait toute cette reconstitution » (R-16, §5.7). Le dossier a confronté sa reconstitution au code. Il faut décider si on lui renvoie maintenant la définition réelle des filtres et la table qui relie ses codes de motif aux critères C (D7, D8), ou si on attend C.\\n\\n**Dépend de :** D7 (Définition de C v1), D8 (Cas contradictoires).\\n\\n| Option | Description | Avantages | Inconvénients |\\n|---|---|---|---|\\n| **Renvoyer filtres réels et table de dérivation** (recommandée) | Mathieu et Farid envoient à Steve la définition réelle des cinq filtres (§5.7, lue dans le code) et la table qui relie ses 28 codes de motif aux critères C, pour qu’il la corrige avant le développement de C. | • Répond directement à sa demande R-16.<br>• Lui permet de corriger la table de dérivation avant le développement de C.<br>• Renforce la confiance du client. | • Un aller-retour à préparer (relecture par Mathieu et Farid).<br>• Une partie de ses observations date de septembre, en partie périmée depuis #793. |\\n| Ne rien renvoyer avant C | On ne répond pas à sa question R-16 avant que C soit développée ; il reçoit alors directement la nouvelle sélection. | • Évite un aller-retour intermédiaire.<br>• La réponse portera directement sur C, déjà développée. | • Steve continue à deviner le fonctionnement des filtres.<br>• Erreurs de dérivation découvertes trop tard. |\\n\\n**Recommandation : Renvoyer filtres réels et table de dérivation.** Renvoyer, par Mathieu et Farid après relecture : répond à sa question et lui permet de corriger la table de dérivation avant que C soit développée.\\n\\n---\"},{\"id\":\"section-12\",\"heading\":\"11. Risques\",\"markdown\":\"| Risque | Effet | Réponse |\\n|---|---|---|\\n| Dérive des ids du graphe (ré-extraction, nœuds orphelins supprimés) | Annotations orphelines, jeu de référence inapplicable | Ancres texte + instantané `observed` + statut `vanished` ; mesure de résolution en L1 ; clé métier stable en suivi |\\n| Plusieurs objets par ligne, ids abrégés, alias de villes | Note attribuée au mauvais objet | Aperçu de résolution, rôles des liens, revue des ambiguïtés |\\n| Tableur, analyse et règles se contredisent | Jeu de référence qui sanctionne le bon comportement | Sources immuables, double annotation, adjudication nommée, désaccords publiés avant notation |\\n| Échantillon biaisé (51 villes, ordre du relevé ; corpus déjà filtré) | C réglée sur un sous-ensemble ; rappel surestimé | Test sur les 52 villes suivantes ; extension documentaire |\\n| Vue de Steve datée du 15–21 septembre | Constats de filtres périmés | §5.7 ; refaire C-49 et C-55 sur la version actuelle |\\n| Tension R-21 / S-RESTRICTIF ; sens par disposition | Perte d'un droit nouveau ou d'une étape utile | D8 ; sens par disposition ; un mixte reste visible |\\n| Données personnelles dans les verbatims | Exposition non conforme | D6 ; détection avant affichage ; export de benchmark limité |\\n| Paquet `comments` sans tombstone | Dette ou divergence avec sentropic | D4 ; demande à sentropic ; aucun chemin de suppression par le paquet |\\n| Annotation existante cassée sans que les tests le voient | Fonction morte | B0 avec test sur un id réel et preuve navigateur |\\n| Sur-investissement UI avant la maquette | Travail jeté | U1 en lecture seule |\\n| Jeu de référence 676 local contre 674 committé ; prompt gelé modifié | Benchmark non reproductible | Geler par hash ; D11 |\\n| Bascule geo couplée aux annotations | Livraison retardée | Ancre indépendante du moteur (D14) |\\n\\n**Retour arrière.** Désactiver C et revenir à B ; désactiver la publication d'un lot sans effacer source ni réponses ; migrations additives, sans DROP. Une modification du cycle de suppression ou des droits est une décision contractuelle, pas un flag.\\n\\n**Pré-mortem (hypothèse).** Six mois plus tard, l'échec viendrait d'avoir importé les classifications comme vérité définitive, attribué des groupes à un seul signal, affiché un nombre plus faible comme preuve de qualité, laissé disparaître les indéterminés, perdu les cibles à la ré-ingestion et cassé le dénominateur commun du benchmark. Garde-fous prioritaires : traçabilité des ancres, conservation des désaccords, rappel de bout en bout.\\n\\n---\"},{\"id\":\"section-13\",\"heading\":\"12. Plan et suites\",\"markdown\":\"> Diagramme : rendu dans la page, dans les scènes Focus ou dans les options de décision (source Mermaid dans le Markdown du dossier).\\n\\n| Carte | Suite proposée | À ne pas lui attribuer |\\n|---|---|---|\\n| #784 | Sources, import, rattachement, restitution (B0, L1, L2, U1) | Importer un fichier ne clôt ni le jeu de référence ni C |\\n| #783 | Contrat de jeu de référence, double annotation, adjudication, version C (O1) | Aucun résultat C avant campagne ou rescoring valide |\\n| #760 | Parcours manuel et états utilisateur, avec la maquette (L7) | Pas d'extraction ni de benchmark |\\n| #761 | Rôle des filtres, second projet, sens, comparaison C | Rafraîchissement quotidien ≠ précocité réglementaire |\\n| #782 | Résultats post-B′ et post-C à côté de l'extraction | Ne pas appeler « v11 final » le rapport v11alpha |\\n| #697 | Nouvelles preuves de qualité et écarts de périmètre | Pas de choix de modèle C actuel |\\n| #786 / #787 / #788 | Dates et URL complète consommées par C | Aucun nouveau workflow LLM dates |\\n| #703 | Priorité fraîcheur ; snapshots d'évaluation traçables | Ce dossier n'arme aucun CronJob |\\n\\nLes mises à jour de cartes sont des suites proposées, pas des publications effectuées.\\n\\n---\"}]"),z6=[{id:"section-14",heading:"Annexe A — Convergence entre les deux auteurs",markdown:"Légende : **=** convergence · **≈** convergence de fond, forme différente · **≠** divergence. Colonne « Arbitrage » : la source qui tranche, ou le décideur (Farid ou Fabien) si les sources ne suffisent pas.\n\n### A.1 Chiffres\n\n| Point | Auteur A | Auteur B | État | Arbitrage et preuve |\n|---|---|---|---|---|\n| Volumétrie (124 / 121 / 77 / 26 / 28) | identique | identique | = | Recompté sur `workbook-full.json` |\n| Classement × passe (34/15/24 …) | identique | identique | = | Recompté sur `triage-rows.json` |\n| Sens (55/38/14/10/7) | par passe | × classement | ≈ | Les deux tableaux sont repris (§5.3) |\n| Codes employés 24/28 | = | = | = | Feuille Synthèse et Triage |\n| Verdicts d'exclusion (102 …) | = | = | = | Feuille Écartés |\n| Périmètre des constats | 67 V1, 5 Info, 4 « V2 — pour mémoire », 1 V2 | 67 / 5 / 5 V2 | ≈ | Auteur A plus fin, recompté colonne B |\n| Valeurs mémorisées de la Synthèse | 45 formules avec valeurs | « formules sans valeur en cache » | ≠ | **Auteur A** : 45 formules sur 45 portent une valeur (`workbook-full.json`, ex. B4 = 40) |\n| Qualité du filtrage | 5 comptes = 123 | 88/25/8/3 normalisé contre 88/25/7/3 | ≈ | Synthèse : 88/25/7/3/0 ; l'écart d'une ligne tient au regroupement de B |\n| Identifiants candidats | colonne L : 121/124, 148 distincts, 27 multiples | 121/124, 33 multiples, 172 mentions, 227 distincts sur 3 feuilles | ≈ | Recompte : colonne L 121/148/27 ; toutes colonnes 121/150/30 ; 3 feuilles 227–237 selon la règle. Publier par le rapport d'import, avec la règle |\n| Reconstitution 22/12/15/24 | « l'écart 34−22 n'établit pas quels enregistrements changent » | correspondance exacte | ≈ | **Effectifs vérifiés** (Pertinent ∧ Assouplissement = 22 en passe 1, etc.) ; règle de passage non énoncée par Steve → D8 |\n| Jeu de référence 676 | 674/47 committé (`dd0561f6`) ; 676/43 copie locale par sha256 | 676 « introuvable sur les branches distantes » | ≈ | Les deux exacts ; la 676 doit être committée et gelée |\n| Contrôles HTML bruts | 132 `<button>` / 37 fichiers | 125 / 35 | ≈ | 132/37 reproduit sur tous les `.svelte` hors tests ; 125/35 exclut stubs et harnais |\n| Cellule la plus longue | 17 114 caractères vs corps de note 10 000 | — | = | `NOTE_BODY_MAX = 10_000` (`prospect-marks.ts:91`), cellule Constats E57 |\n\n### A.2 Constats\n\n| Point | Auteur A | Auteur B | État | Arbitrage et preuve |\n|---|---|---|---|---|\n| Défaut UUID de l'ancre signal | oui | oui | = | `prospect-marks.ts:107` `signal_id: z.string().uuid()` |\n| Défaut auteur `authorId` / `sub` | — | oui | + | **Confirmé** : `SignalAnnotations.svelte:30` retombe sur `$authStore.user.sub` ; aucun panneau ne passe `currentUserId` ; l'API résout `session.sub` → `account_users.id` |\n| Stabilité des ids du graphe | non mesurée | non garantie, nœuds orphelins supprimés | ≈ | **Auteur B** : suppression des orphelins dans `graph-store.ts` |\n| Table `signals` | UUID volatil | aucune insertion sur `main` | ≈ | Seule insertion : test d'intégration |\n| `packages/focus` sentropic | lu en local (HEAD `97fe9f53`) | supprimé de `main` | ≠ | **Auteur B** : `6ca53d11a chore: delete packages/focus (focus is owned by h2a)` |\n| Suppression `comments` 0.2.0 | physique | physique, écart avec O1 | = | `store.ts:47-48` |\n| Routeur Hono `contextType` fermé | — | oui | + | `hono.ts:17` `z.enum([...])` |\n| Sélecteur A/B retiré | oui | oui (`f2c20573`) | = | `f2c20573` 2026-08-22 |\n| « Décision owner #787 de ne pas réintroduire de choix de viviers » | — | décision du 2026-10-01 | ≠ | **Nuancé** : phrase de l'item 4 du comportement attendu (grammaire d'URL), règles validées le 1er octobre ; absente de la liste « Décisions du propriétaire » |\n| Période datée par le document | écart relatif / personnalisé à réconcilier | #793 fusionnée le 2026-10-02 | ≈ | `27891b10` = merge de #793 |\n| DS : 39/69 ; collab 0/3 ; carte MapLibre locale ; moteur désactivé | = | = | = | `code-audit.mjs`, `geo-engine-flag.ts` |\n\n### A.3 Options, recommandations et décisions\n\n| Sujet | Auteur A | Auteur B | État | Consolidation |\n|---|---|---|---|---|\n| Stockage | D1b sources + assertions + ancres | D1(b) + couches | = | D1 (b) ; D2 : couches devenues l'option b, recommandé désormais (a) modèle minimal (§6.3) |\n| Correctif ancre | branche `entity` + `target_ref` | colonne texte `signal_node_id` + B0 | ≈ | D3 : clé texte namespacée sans FK, B0 immédiat |\n| Conformité sentropic | D2b sous-contrats + mutation Radar | D3(a) adaptateur PG à tombstone hôte | ≠ | **Tranché vers A** par COLLAB §2 (« le paquet porte l'intégrité », tombstone hôte = piège) ; demande de tombstone à sentropic (B) conservée — D4 |\n| Auteur Steve | pas d'identité forgée, auteur = écrivain réel | `ext:chaperon:steve` auteur du fil | ≠ | **Synthèse** : auteur documentaire externe + importateur tracé, sans droit de mutation — D5 |\n| Visibilité / données personnelles | risque C-79 | D5(c) caviardage | ≈ | D6 (c) |\n| Définition de C | D3b confirmés + à instruire | K1–K8 + asymétrie | ≈ | D7 : K1–K9 + trois états |\n| Cas contradictoires | D3-cas | §9, §10 | = | D8 |\n| Double annotation | 3 niveaux (source, référence, calcul) | `label_set` (radar B′ / Steve / prédiction) | ≈ | §6.6 ; sens laissé à Fabien (Farid consulté) — D9 |\n| Jeu de référence | D4b double jeu de référence, corpus indépendant | D9 jeu de référence C, 51 / 52 villes | ≈ | D10 : les deux mécanismes cumulés |\n| Benchmark | colonnes séparées | volet séparé, contrat v10 sous décision | = | D11 |\n| A/B/C | D5b sélecteur + comparatif, B défaut | V2 shadow puis remplacement | ≠ | **Farid** — D12 ; recommandation consolidée : shadow + comparatif UAT |\n| Seuil de bascule | non chiffré | exemple proposé | ≈ | **Farid** — D13 |\n| UI première livraison | D6a panneaux + badges carte | U1 panneau + rail ; carte après migration | ≠ (partiel) | D14 (a) : pastilles carte après migration de `GeoCityMapBase` (2 761 lignes locales) ; (b) reste une option |\n| Séquencement | L4 en parallèle de L3 | D11 (a) | = | D15 |\n| Retour à Steve | — | D12 | + | D16 |\n\n### A.4 Points laissés à la décision (Farid ou Fabien)\n\n1. **D9** (Fabien, Farid consulté) : sens exact de « double annotation ».\n2. **D12** (Farid, Steve, Mathieu et Fabien consultés) : C en shadow avec comparaison UAT, ou sélecteur A/B/C visible.\n3. **D13** (Farid, Steve, Mathieu et Fabien consultés) : seuil chiffré de bascule.\n4. **D4, réserve** (Fabien) : statut du dossier COLLAB hors `main` ; s'il n'est plus valable, l'adaptateur à tombstone hôte redevient une option.\n5. **D8** (Farid) : cas métier contradictoires, à faire trancher avec Steve.\n\n---"}],Wl=JSON.parse('{"schema":"immo-focus-steve-decision-map/v1","dossier":"docs/spec/reports/dossier-retours-steve/DOSSIER_DECISION_RETOURS_STEVE_2026-10-03.md","title":"Analyse des retours d\'usage du 21 septembre 2026 : capitalisation des données annotées, vers de nouveaux critères de ciblage","htmlSha256":"0c976cda5fc02d9d4d374bcf699ea15aa366097cae639430cd3bb8d2922e26dd","dossierHash":"9bbc1fbeaaf308517925bcfa296cf73d8858ea5047a01370c18aab64a120c5b8","choicesHash":"e4f14aa3ede4ab4061a186aa3cfcba988c2ac4ca09f3413dea6f6d268080643b","reuse":"gabarit A’, géométrie Dagre LR et routeur du kit h2a réutilisés depuis docs/architecture/focus","serviceRendererHash":"68f13a69210dfe1009e89503b772793662cd73dfaa4c38a0ea19c5643dba80f2","diagramRendererHash":"14e4e45758214292d7114a0555d5ecd3df89608e8476ae508a33b80161401174","artifactInputHash":"cb3adfc9af2d5091bf0b62b6ae078f09171d284ab99be6bddc4cda2f88657792","mapping":"Scène 1 : matrice (tableau Markdown) ; scène 2 : erDiagram rendu en tables et relations ; scène 3 : flowchart en couloirs verticaux, jeu de référence en bande basse ; scènes 4 et 5 : SvelteFlow natif, subgraphs en parentId.","geometry":" e, verbatim). B0 corrige l’API pour accepter cet identifiant texte. Si une ré-extraction supprime le signal, l’ancre passe « disparue » et le panneau montre l’instantané au lieu de perdre le retour.",b:"On n’ancre rien tant qu’une clé métier stable (dossier réglementaire, étape) n’existe pas dans une ontologie du radar. Aucun lot B0 : l’annotation de signal reste en échec 400 et les retours de Steve ne s’affichent sur aucun signal.",c:"On garde le contrat v1 : une annotation de signal pointe vers l’UUID de la table signals. Mais aucun code de main n’écrit dans signals : il n’existe aucun UUID à viser pour les 124 lignes de Steve. L’ancre ne peut pas être créée."},D4:{a:"Les annotations utilisent les cibles et la lecture du module comments, sans modifier le paquet. Les retours importés sont immuables : aucun bouton de suppression. Les validations et contestations vivent dans les tables du radar (validations) ; un fil de commentaires sentropic pourra s’ajouter avec le port complet. On demande à sentropic une version avec tombstone, puis on adopte le port complet.",b:"On écrit un adaptateur CommentStore côté radar dont le delete pose une marque (tombstone) au lieu d’effacer. Les retours et réponses passent tout de suite par le port complet. Mais le delete du port ne supprime plus vraiment : sa sémantique diffère de celle du paquet.",c:"On attend que sentropic publie un paquet avec tombstone et rétention, puis on branche tout dessus. Aucun retour de Steve n’est affiché avant cette version, sans date connue."},D9:{1:"Le jeu « steve-source » (verdict de Steve) est comparé à la classification du radar : B′ reconstituée à la date du relevé, puis C. Exemple : sur la passe 1, Steve juge 24 signaux sur 73 Non pertinent alors que B les affiche ; c’est cet écart que l’on mesure ligne par ligne.",2:"On compare deux grilles humaines de Steve : son classement actuel (P/S/N, motif) et un nouvel étiquetage selon les critères C. Steve repasse sur les mêmes lignes ; le jeu de référence mesure l’évolution de ses critères, pas le radar.",3:"On rapproche le jeu de référence d’extraction (676 unités sur 100 procès-verbaux) et le jeu de référence de Steve (124 lignes). Le pont passe par les documents communs, probablement peu nombreux (non vérifié)."},D10:{a:"Les 124 lignes du tableur deviennent l’unique jeu de référence, à la place de la version 674/676. Rapide à constituer, mais il ne contient que ce que l’écran montrait à Steve : les sept dossiers manqués (« l’information existait dans la base ») n’y figurent pas.",b:"Deux jeux de référence versionnés et gelés par empreinte. E reste le jeu de référence d’extraction (676 unités). C est construit à partir des évaluations et ancres de Steve, adjugées et étayées. Développement sur ses 51 villes, test sur les 52 suivantes, jamais vues ; toutes les unités d’un même dossier dans la même partition.",c:"On lance une campagne d’annotation neuve, conçue pour le ciblage C, sur un nouveau corpus. Les 124 lignes de Steve servent seulement d’exemples ; la comparaison avec l’historique se fait à part."},D11:{a:"Le rapport du benchmark #782 garde son tableau d’extraction inchangé et ajoute un tableau « ciblage » : précision et rappel de l’historique, de B, puis de C, sur le jeu de référence C. Le prompt gelé immo-pv-extraction-v9 n’est pas modifié ; l’enrichir serait une nouvelle version, décidée à part.",b:"Un seul tableau et un seul score mêlent l’extraction (étape et citation) et le ciblage (fallait-il montrer le signal)."},D1:{a:"On importe seulement la feuille Triage : 124 lignes, 51 villes. Les 121 contrôles d’exclusion (dont 3 faux négatifs « écartés à tort »), les 77 constats et les 26 règles restent dans le fichier.",b:"On importe les 7 feuilles et l’analyse du 21 septembre, sans rien modifier : 124 lignes de triage, 121 contrôles d’exclusion, 77 constats, 26 règles, 28 codes, et la Synthèse avec ses formules et leurs valeurs mémorisées. L’analyse est conservée à part, comme annotation distincte.",c:"Chaque ligne devient une note de texte libre sur une ville ou un signal, dans l’UI des notes actuelle. Le classement, le motif et le sens ne sont plus des champs : ils sont dans le texte."},D5:{a:"Chaque retour importé affiche « Steve Chaperon — importé par <nom> ». Steve est un auteur externe (ext:chaperon:steve) sans compte ; l’importateur réel est enregistré à part. Steve ne peut pas annoter lui-même tant que cette identité externe est utilisée.",b:"Le retour est affiché comme écrit par la personne qui a lancé l’import ; le nom de Steve n’apparaît que dans la provenance (fichier, feuille, ligne).",c:"On crée et vérifie un compte pour Steve. Ses retours importés sont attribués à ce compte (l’importateur est tracé dans importe_par), et ses annotations, triages et réponses aux contestations dans l’application portent le même compte."},D6:{a:"Tout utilisateur approuvé voit tous les retours, verbatims compris, comme pour les notes actuelles (règle 0011). Aucun masquage.",b:"Seuls les administrateurs et Steve voient les retours ; le reste de l’équipe ne les voit pas dans le panneau.",c:"Tout utilisateur approuvé voit les retours, mais les noms de particuliers sont masqués avant affichage, dans les verbatims importés comme dans les résumés de signaux (demande C-79 de Steve). Une colonne pii_status trace le traitement."},D7:{S:"C n’affiche que les signaux qui réunissent les trois critères de façon établie. Exemple : sur la passe 1, seuls 22 signaux sur 73 resteraient ; les 12 Pertinent dont le sens n’est pas donné disparaîtraient.",K:"C applique les critères K1 à K9 (§9.2) avec trois états : confirmé (critères étayés), à instruire (sens ou effet non déterminable, reste visible), exclu prouvé (masqué, raison affichée). Deux compteurs distincts « confirmés » et « à instruire ». Aucun seuil de taille de projet ni filtre sur l’origine privée.",T:"La sélection affichée reste B ; les critères de Steve servent seulement à trier la liste (les « trois critères » en premier). Aucun signal n’entre ni ne sort."},D8:{a:"Steve et Mathieu examinent les cas listés au §9.2 sur exemples et preuves (Saint-Victor, Amos, CPTAQ, seconds projets, ODJ, trois S-RESTRICTIF). Tant qu’un cas n’est pas tranché, il est marqué « abstention » dans le jeu de référence : il ne compte ni pour ni contre.",b:"L’équipe tranche elle-même chaque cas à partir de l’analyse et des règles de Steve, puis lui présente le résultat.",c:"Les cas restent dans le jeu de référence avec l’étiquette du tableur, sans statut particulier, même quand le tableur et l’analyse se contredisent."},D12:{a:"Steve et l’équipe continuent de voir B, sans sélecteur. C est calculée en parallèle par le backend ; une page de comparaison B / C n’est accessible qu’en recette UAT et aux administrateurs. Le jour où le seuil D13 est franchi et que Farid décide, C remplace B à l’écran (scène 5).",b:"Un sélecteur A / B / C apparaît dans le rail pour tous les utilisateurs, avec un mode comparatif ; le choix est porté dans l’URL (filter.targeting=a|b|c).",c:"On n’expose pas C comme un tout : on ajoute à B, un par un, les critères de C (sens, plein droit, second projet), chacun livré quand il est prêt.",d:"On construit une seconde application dédiée à C, avec sa propre carte, ses filtres et ses notes ; Steve choisit l’une ou l’autre application."},D13:{a:"C remplace B seulement si, sur le jeu test des 52 villes : aucun signal que Steve juge Pertinent n’est masqué ; la précision P ∪ S de C dépasse celle de B (67,1 % sur la passe 1) ; l’API, le rail, la carte et le panneau montrent les mêmes ensembles ; Farid fait la recette.",b:"Farid écrit d’autres chiffres dans le commentaire (par exemple une précision minimale ou un rappel minimal), mesurés par le même jeu de référence.",c:"La bascule se décide sur la recette de Farid seule, sans mesure chiffrée par le jeu de référence."},D14:{a:"Dans le panneau du signal, un badge « Retour de Steve » (vert, jaune, rouge) ouvre une section « Avis de Steve » : classement, motif, sens, analyse, provenance, état du rattachement. Dans le rail, des compteurs P / S / N par ville. Les 3 composants d’annotation passent au design system. Rien sur la carte au premier lot.",b:"En plus du panneau, des pastilles colorées sur la carte Signaux actuelle (composant local MapLibre de 2 761 lignes) dès le lot L3.",c:"On termine d’abord la migration de la carte vers les composants geo partagés (Porte 2), puis on affiche les retours sur la nouvelle carte et dans le panneau.",d:"Un écran séparé liste tous les retours de Steve (filtrable par ville, motif, statut de rattachement), sans rien afficher sur les objets du radar."},D15:{a:"B0, l’import (L1) et le jeu de référence de ciblage (O1) démarrent maintenant, en parallèle de #703, car ils ne touchent pas la chaîne de rafraîchissement. Le classifieur C (C1) attend que le rafraîchissement soit stable.",b:"Tout le travail de ce dossier attend la clôture de #703 (rafraîchissement quotidien en production)."},D16:{a:"Mathieu et Farid envoient à Steve la définition réelle des cinq filtres (§5.7, lue dans le code) et la table qui relie ses 28 codes de motif aux critères C, pour qu’il la corrige avant le développement de C.",b:"On ne répond pas à sa question R-16 avant que C soit développée ; il reçoit alors directement la nouvelle sélection."}},TI={D2:{a:gv,c:{colGap:180,layers:["Mesure seule","Affichage, sans lien"],placement:{steve_control_rows:{col:0,row:0},graph_nodes:{col:1,row:0}},existing:["graph_nodes"],labels:{},er:'erDiagram\n    steve_control_rows {\n      uuid id PK\n      text sheet\n      int sheet_row\n      jsonb cells "toutes les cellules"\n      text verdict "classement, motif, sens"\n    }\n    graph_nodes {\n      text id PK "signal-…"\n      text city_slug\n    }'},b:I6,d:{colGap:180,layers:["Paquet sentropic : aucune table radar"],placement:{sentropic_comments:{col:0,row:0}},existing:["sentropic_comments"],labels:{},er:'erDiagram\n    sentropic_comments {\n      text id PK\n      text target_kind "record"\n      text target_id\n      text author_id\n      text body "ni classement ni provenance"\n    }'}},D10:{a:{colGap:180,layers:["Source","Jeu de référence unique","Benchmark #782"],placement:{annotations:{col:0,row:0},jeu_ref_tableur:{col:1,row:0},jeu_ref_e_v3:{col:1,row:1},benchmark:{col:2,row:0}},existing:["jeu_ref_e_v3"],labels:{remplace:"remplace",note_tout:"note tout"},er:'erDiagram\n    annotations ||--|| jeu_ref_tableur : remplace\n    jeu_ref_tableur ||--|| benchmark : note_tout\n    annotations {\n      text source "124 lignes de Steve"\n    }\n    jeu_ref_tableur {\n      text unite "ce que l\'écran montrait"\n      text biais "7 dossiers manqués absents"\n    }\n    jeu_ref_e_v3 {\n      text statut "retiré, historique perdu"\n    }\n    benchmark {\n      text tableau "un seul, extraction et ciblage"\n    }'},b:{colGap:180,layers:["Sources","Deux jeux de référence gelés","Benchmark #782, deux volets"],placement:{consensus_modeles:{col:0,row:0},annotations:{col:0,row:1},jeu_ref_e_v3:{col:1,row:0},jeu_ref_c_v1:{col:1,row:1},volet_extraction:{col:2,row:0},volet_ciblage:{col:2,row:1}},existing:["consensus_modeles","jeu_ref_e_v3","volet_extraction"],labels:{adjugees_gelees:"adjugées, gelées",note_b_puis_c:"note B puis C"},er:'erDiagram\n    consensus_modeles ||--|| jeu_ref_e_v3 : construit\n    annotations ||--|| jeu_ref_c_v1 : adjugees_gelees\n    jeu_ref_e_v3 ||--|| volet_extraction : note\n    jeu_ref_c_v1 ||--|| volet_ciblage : note_b_puis_c\n    consensus_modeles {\n      text methode "7 passes, 3 familles"\n    }\n    annotations {\n      text source "verdicts de Steve"\n    }\n    jeu_ref_e_v3 {\n      int taille "674 / 100 documents"\n    }\n    jeu_ref_c_v1 {\n      text jeux "dev 51 villes, test 52"\n    }\n    volet_extraction {\n      text mesure "inchangée"\n    }\n    volet_ciblage {\n      text mesure "précision, rappel"\n    }'},c:{colGap:180,layers:["Nouvelle campagne","Jeu de référence C neuf","Benchmark #782"],placement:{campagne_c:{col:0,row:0},annotations:{col:0,row:1},jeu_ref_c_neuf:{col:1,row:0},volet_ciblage:{col:2,row:0}},existing:[],labels:{exemples:"exemples seulement"},er:'erDiagram\n    campagne_c ||--|| jeu_ref_c_neuf : construit\n    annotations }o..o| jeu_ref_c_neuf : exemples\n    jeu_ref_c_neuf ||--|| volet_ciblage : note\n    campagne_c {\n      text corpus "nouveau, conçu pour C"\n    }\n    annotations {\n      text role "124 lignes, exemples"\n    }\n    jeu_ref_c_neuf {\n      text comparaison "historique à part"\n    }\n    volet_ciblage {\n      text mesure "précision, rappel"\n    }'}},D3:{a:{colGap:260,layers:["Ancre proposée","Graphe existant"],placement:{annotation_cibles:{col:0,row:0},graph_nodes:{col:1,row:0}},existing:["graph_nodes"],labels:{cle_texte_sans_fk:"clé texte, sans FK"},er:'erDiagram\n    annotation_cibles }o..o| graph_nodes : cle_texte_sans_fk\n    annotation_cibles {\n      uuid id PK\n      text city_slug "ville"\n      text cible_id "signal-… (texte)"\n      jsonb vu_par_steve "ville, date, verbatim"\n      text resolution "résolue … disparue"\n    }\n    graph_nodes {\n      text id PK "signal-… (texte)"\n    }'},b:{colGap:180,layers:["Ancre en attente","Clé métier"],placement:{annotation_cibles:{col:0,row:0},cle_metier_stable:{col:1,row:0}},existing:[],labels:{},er:'erDiagram\n    annotation_cibles }o..o| cle_metier_stable : attend\n    annotation_cibles {\n      uuid id PK\n      text business_key "à définir"\n    }\n    cle_metier_stable {\n      text key PK "n\'existe pas encore"\n    }'},c:{colGap:180,layers:["Note existante","Table signals"],placement:{prospect_notes:{col:0,row:0},signals:{col:1,row:0}},existing:["prospect_notes","signals"],labels:{signal_id:"signal_id, UUID"},er:'erDiagram\n    prospect_notes }o--o| signals : signal_id\n    prospect_notes {\n      uuid id PK\n      uuid signal_id FK "UUID exigé par l\'API"\n    }\n    signals {\n      uuid id PK "table vide sur main"\n    }'}}},Ve=(e,t,n,r,i)=>({key:e,title:t,description:n,pros:r,cons:i}),RI=[{key:"G1",question:"G1 — Terminologie et provenance du jeu de référence",recommended:"c",dependsOn:[],intro:"Le mot « oracle » désigne, en génie logiciel, le mécanisme qui rend le verdict d’un test, pas un jeu de réponses ; les quatre sièges de la convergence le rejettent comme nom d’objet (§6.7). Il faut un terme commun à immo, BPMN et aux paquets génériques avant d’écrire les contrats, et une façon de dire d’où viennent les étiquettes. Ce dossier applique déjà la recommandation : « jeu de référence » partout, avec l’attribut label_provenance (E = machine, « silver » ; C = un seul annotateur humain, Steve, « gold » en construction). Le renommage ne change aucune empreinte.",recommendation:"(c) : seul terme exact pour E comme pour C, aligné sur les usages établis (HF evaluate, spaCy, VIM) ; la provenance devient un attribut au lieu d’un mot dans le nom.",options:[Ve("a","(a) Garder « oracle » avec une définition locale","On garde le mot partout (glossaire, tables, scripts) et on le définit dans chaque dossier comme « jeu de réponses de référence ».",["Aucun renommage de tables, de scripts ni de textes.","Terme déjà connu de l’équipe immo."],["Contredit le sens établi (verdict d’un test) : malentendus avec sentropic, engram et la littérature.","Ne dit rien de la provenance (machine ou humain)."]),Ve("b","(b) « Gold standard » / « vérité terrain »","On nomme le jeu « gold standard » (EN) et « vérité terrain » (FR), pour E comme pour C.",["Termes usuels en évaluation.","Faciles à comprendre."],["Faux pour E, construit par consensus de modèles (silver), et pour C pilote, un seul annotateur.","« Vérité » unique critiquée (Aroyo et Welty 2015 ; IEEE 7014-2024)."]),Ve("c","(c) « Jeu de référence » (ReferenceSet) + label_provenance","Objet ReferenceSet, versions figées ReferenceSetVersion, éléments ReferenceItem ; un attribut label_provenance ∈ {human_single, human_adjudicated, model_consensus, mixed}, d’où les libellés « référence validée (gold) » et « référence machine (silver) ».",["Exact pour E (model_consensus) et pour C (human_single, puis human_adjudicated).","Aligné sur HF evaluate (references), spaCy (Example.reference) et le VIM.","La provenance sert directement à la règle de promotion (G6)."],["Renommage dans le glossaire, les tables proposées et quelques scripts (oracle_eval.py, oracle_versions).","Nouveau vocabulaire à expliquer à l’équipe."])]},{key:"G2",question:"G2 — Porteurs et forme de l’annotation",recommended:"b",dependsOn:["G1"],intro:"Les retours de Steve, ses annotations futures et les validations de l’équipe doivent vivre quelque part ; la même boucle existe déjà trois fois dans les domaines (immo E, brouillon C, BPMN d2d). Le module comments de sentropic ne convient pas à la validation : il édite en place et supprime physiquement (§6.0, §6.7). Il faut décider qui porte l’annotation et sous quelle forme, avant que D2 (modèle immo) puisse être tranchée. Concrètement : soit immo écrit ses tables, soit un paquet générique les fournit, avec ses tables dans le Postgres d’immo.",recommendation:"(b) : réemploi des cibles et des auteurs de comments et de l’IdP sentropic, sans casser la sémantique du commentaire ; les données restent dans la base de l’hôte. L’évaluation reste un module d’engram, indépendant du producteur.",options:[Ve("a","(a) Le domaine (six tables immo)","Chaque domaine écrit ses tables d’annotation : pour immo, les six tables de la version précédente du dossier.",["Livrable vite, sans attendre un paquet.","Modèle sur mesure pour Steve."],["Réimplémentation : chaque domaine refait la boucle (« prevent each new app … from inventing a private model »).","Pas de mise en commun avec BPMN ni avec sentropic."]),Ve("b","(b) Paquet frère @sentropic/annotations","Un nouveau paquet sentropic porte annotations, révisions, validations, adjudications et cibles, avec un adaptateur Postgres (./pg) installé dans la base de l’hôte et un port vers son stockage objet ; comments reçoit seulement deux évolutions (tombstone, types ouverts déplacés vers le port hôte, sans changement d’UI).",["Une seule implémentation pour immo, BPMN et sentropic.","Réemploi de CommentTarget, CommentAuthor et de l’IdP partagé.","Données dans la base de l’hôte (résidence des données respectée)."],["Paquet à créer, avec une consommation réelle dans sentropic exigée dès L2.","Immo dépend de son calendrier (G7)."]),Ve("c","(c) Étendre comments","On ajoute révisions, validations et statuts au module comments existant : un commentaire devient aussi une annotation validable.",["Un seul module à connaître.","Pas de nouveau paquet."],["Casse la sémantique du commentaire : « résolu » n’est pas « validé ».","Les quatre sièges rejettent cette voie."]),Ve("d","(d) h2a ou track","Les annotations sont portées par h2a ou par track, à côté des décisions, dans leurs propres journaux.",["Proche des outils de décision existants.","Pas de nouveau paquet à publier."],["Hors de leur rôle : track porte des décisions, pas des données métier.","Pas d’écran ni de cible métier dans ces outils."]),Ve("e","(e) Tout dans engram, en fichiers","Annotations et validations sont des fichiers versionnés dans le dépôt, lus par engram.",["Simple pour un jeu figé.","Versionnage par git."],["Pas de saisie dans l’application ni de boucle de validation pour Steve.","Données personnelles dans un dépôt."])]},{key:"G3",question:"G3 — Sémantique de version et effacement",recommended:"a",dependsOn:["G2"],intro:"Une annotation change : Steve corrige, l’équipe conteste, un retour est retiré. Il faut décider comment une modification est gardée, sur quoi porte une validation et comment on efface une donnée personnelle (Loi 25, décision O1 du dossier COLLAB : tombstone et rétention). Ce choix fixe ce que le jeu de référence peut citer : une révision précise, désignée par son empreinte. Il remplace, pour les annotations, la question posée par D4 sur la suppression (§6.7).",recommendation:"(a) : l’absence d’écrasement est garantie par construction, une validation reste attachée à ce qu’elle a validé, et l’effacement purge le corps en gardant l’empreinte.",options:[Ve("a","(a) Révisions immuables chaînées, validation liée au hash, tombstone","Chaque modification crée une révision immuable (content_hash, prev_content_hash) ; une validation porte sur une révision désignée par son hash ; le statut courant est calculé ; un effacement laisse un tombstone (corps purgé, hash gardé).",["Aucune modification ne se perd ; l’historique se relit.","Une validation ne « glisse » jamais sur une version qu’elle n’a pas vue.","Compatible Loi 25 et décision O1."],["Plus de lignes stockées.","Calcul du statut à chaque lecture (ou vue matérialisée)."]),Ve("b","(b) État modifiable + journal d’audit","L’annotation est modifiée en place ; un journal à part garde les changements, sans lien avec les validations.",["Simple à lire : une ligne par annotation.","Proche des tables existantes (prospect_notes)."],["Une validation peut porter sur un état qui a changé depuis.","Le journal et l’état peuvent diverger."]),Ve("c","(c) Journal pur (événements)","Seuls des événements sont stockés ; tout état se reconstruit en rejouant le journal.",["Historique complet par construction.","Rejouable pour reconstruire un état passé."],["Lecture coûteuse pour l’application.","Effacement Loi 25 difficile dans un journal immuable."])]},{key:"G4",question:"G4 — Autorité de validation et rôles",recommended:"a",dependsOn:["G2"],intro:"La boucle de validation demandée par l’owner (Steve annote, l’équipe ou le PO valide ou conteste, §6.3) suppose de dire qui a le droit de faire quoi. Sentropic ne connaît aujourd’hui aucun rôle de revue : seulement des rôles de workspace, de tenant et globaux (§6.7). Il faut décider comment ces rôles s’attribuent, ce que peut faire un agent (modèle, MCP) et qui décide d’un gel ou d’une promotion. D5 (compte de Steve) et D8 (cas contradictoires) en dépendent.",recommendation:"(a) : la compétence est liée au profil (Steve sur le ciblage, pas sur BPMN), les agents ne font que proposer, et seul un humain décide d’un gel ou d’une promotion ; une promotion exige une référence human_adjudicated.",options:[Ve("a","(a) Attributions par (workspace, profil), agents en proposition seulement","Chaque rôle (annotateur, validateur, adjudicateur, curateur, décideur) s’attribue pour un workspace et un profil ; un agent ou un connecteur MCP lit et propose, sans valider ; gel et promotion sont des actes humains.",["Steve peut valider le ciblage sans droit sur d’autres domaines.","Les agents ne signent jamais (B2B2B).","Une promotion repose sur une référence humaine adjugée."],["Gestion d’attributions à construire dans sentropic.","Rôles à désigner par l’owner (voir §6.7)."]),Ve("b","(b) Dérivées des rôles de workspace","Les rôles de workspace existants suffisent : un éditeur peut valider, un administrateur peut geler un jeu.",["Aucune nouvelle notion de rôle.","Rien à construire dans sentropic."],["Mélange droit d’édition et compétence métier.","Un éditeur quelconque pourrait valider le ciblage de Steve."]),Ve("c","(c) Validation par la machine seule","Un modèle ou une règle valide automatiquement les annotations, sans intervention de l’équipe ni du PO.",["Rapide, sans charge humaine.","Aucune attente de validation."],["Circularité : le jeu de référence noterait des modèles avec des étiquettes de modèles.","Contraire à la vision owner (validation par l’équipe ou le PO)."])]},{key:"G5",question:"G5 — Scellement et stockage des jeux de référence",recommended:"a",dependsOn:["G1"],intro:"Un jeu de référence n’a de valeur que si sa partie test n’a jamais servi à optimiser un prompt ; le pilote C l’a montré : son test aveugle est consommé et partiellement contaminé (§9.7). Il faut décider comment la partie test est protégée et où les jeux sont stockés, sachant que le dépôt radar est public et qu’un agent en ligne de commande peut lire les fichiers. D10 (jeu de référence #783) et D13 (seuil de bascule) en dépendent.",recommendation:"(a) en v1 (garde, sceau inscrit dans track avant tout appel de modèle, journal d’exposition, stockage privé) ; (b) ou (c) obligatoire pour tout jeu qui fonde une bascule (D13). Stockage : objet privé de l’hôte, derrière un port du paquet ; manifestes publics.",options:[Ve("a","(a) Procédural : garde, sceau track, journal d’exposition","Le runner refuse de passer deux fois sur le test ; l’engagement de contenu est inscrit dans track avant tout appel de modèle ; chaque exposition est journalisée ; les éléments sont dans un stockage objet privé, seuls manifestes et empreintes sont publics.",["Couvre les défauts observés sur le pilote C.","Réalisable tout de suite."],["Repose sur la discipline : un agent peut encore lire un fichier local.","Insuffisant seul pour une bascule (D13)."]),Ve("b","(b) Chiffrement, clé chez un gardien","La partie test est chiffrée ; la clé est détenue par un gardien qui ne l’ouvre que pour la passe unique.",["Protection technique réelle.","Résiste à la lecture des fichiers par un agent."],["Gestion de clés et de rôles à mettre en place.","Passe de notation plus lourde."]),Ve("c","(c) Service de notation","Le test ne quitte jamais un service qui reçoit les prédictions et ne rend que les scores.",["Aucune exposition des attendus.","Une seule passe par candidat, garantie par le service."],["Service à construire et à exploiter.","Diagnostic d’erreurs plus difficile."])]},{key:"G6",question:"G6 — Règle et porteur de la promotion",recommended:"a",dependsOn:["G4","G5"],intro:"Promouvoir un candidat (prompt, modèle, effort) en production doit reposer sur une preuve mesurée sur le jeu figé, pas sur une impression. Il faut décider si la règle est commune aux domaines, qui la décide et qui l’applique. La règle immo de bascule B → C (D13) en est une instance, et D11 (benchmark #782) en fournit les preuves (§6.7).",recommendation:"(a) : gabarit générique préenregistré, instancié par domaine ; décision dans track, attestée par h2a et jamais par l’API sentropic ; signataire humain authentifié par l’IdP ; garde de production dans engram sur l’empreinte exacte.",options:[Ve("a","(a) Gabarit générique préenregistré, décision track, garde engram","Critères écrits avant la passe test (contraintes critiques, non-infériorité avec marge, pas de régression par classe, coût) ; décision track à au moins deux options dont « garder la production » ; la production refuse toute empreinte sans « go ».",["Comparabilité entre domaines.","Preuve liée au tuple exact promu.","Retour arrière par une nouvelle décision."],["Demandes à track (preuve d’évaluation) et à h2a (voie de signature).","Discipline de préenregistrement."]),Ve("b","(b) Règle libre par domaine","Chaque domaine écrit sa règle de promotion et son circuit de décision, sans gabarit commun.",["Souplesse.","Aucun gabarit commun à négocier."],["Pas de comparabilité ; règles réécrites après coup.","Pas de garde commune en production."]),Ve("c","(c) Recette seule","La promotion se décide sur une recette humaine, sans mesure chiffrée sur le jeu de référence.",["Rapide.","Aucun outillage de preuve."],["Aucune garantie de non-régression.","Le jeu de référence ne sert plus à décider."]),Ve("d","(d) Seuil automatique","Un candidat qui dépasse un seuil fixé à l’avance est promu automatiquement, sans décision humaine.",["Aucune attente.","Aucune charge de décision."],["Aucun humain responsable de la mise en production.","Risque de promouvoir sur un test exposé."])]},{key:"G7",question:"G7 — Séquencement, tables immo et pilote C",recommended:"b",dependsOn:["G2"],intro:"Immo pourrait construire ses six tables tout de suite, puis migrer ; ou attendre les paquets génériques et en être le premier adoptant. La convergence recommande de ne pas construire les tables immo et d’ordonner le travail en lots L0 à L4 : contrats, parité des évaluateurs (avec un diagramme BPMN en recette), @sentropic/annotations avec une consommation réelle dans sentropic, jeu de référence C v2, boucle BPMN. Le pilote C actuel devient une version v0 exploratoire, jamais rescellée ; C v2 prend les 51 villes déjà vues en développement et les 52 suivantes en test aveugle. D2 (modèle immo) et D15 (séquencement immo) en dépendent (§6.7).",recommendation:"(b) : pas de double travail, les besoins de Steve deviennent la recette du générique, et le délai est borné par les lots.",options:[Ve("a","(a) Immo construit ses tables, puis migre","Immo livre ses six tables (lot L1 immo), puis les migre vers les paquets génériques quand ils existent.",["Valeur immédiate pour Steve.","Aucune dépendance aux autres dépôts."],["Double travail et migration de données.","Deux modèles pendant la transition."]),Ve("b","(b) Générique d’abord, immo premier adoptant, délai borné","L0 contrats ; L1 parité des évaluateurs (renotation sans appel de modèle) + un diagramme BPMN en recette ; L2 @sentropic/annotations et import, consommé dans sentropic ; L3 jeu de référence C v2 (52 villes en test) ; L4 boucle BPMN.",["Une seule implémentation.","Les besoins de Steve servent de recette.","Pilote C reclassé en v0 exploratoire, sans être rescellé."],["Steve attend L2 pour annoter dans l’application.","Dépend de la coordination entre trois dépôts."]),Ve("c","(c) Attendre sans borne","Immo n’engage rien tant que les paquets génériques ne sont pas livrés, sans date convenue.",["Aucun travail immédiat.","Aucune dette de transition."],["Aucun calendrier pour Steve.","La boucle reste refaite à la main dans les domaines."])]},{key:"G8",question:"G8 — BPMN : producteur, code d2d, constructeur silver",recommended:"a",dependsOn:["G6"],intro:"BPMN est le second domaine qui doit valider le contrat générique : des diagrammes de processus produits par un outil et comparés à des diagrammes validés. Il faut décider si l’on garde le producteur actuel en n’adoptant que l’évaluation, et si le constructeur de références machine (silver) devient générique. Cette décision n’a pas d’effet direct sur immo ; elle conditionne la recette « deux profils sur la même implémentation » de G7 (§6.7).",recommendation:"(a) maintenant, (b) sur mesure sur le même jeu ; constructeur silver générique seulement si BPMN le confirme comme second cas. La propriété du code d2d est à clarifier avant tout réemploi.",options:[Ve("a","(a) Garder le producteur actuel, adopter l’évaluation","Le producteur BPMN actuel (d2d ou F0) reste ; engram apporte seulement l’évaluateur de graphe et le protocole.",["Évaluation indépendante du producteur.","Peu de changement côté BPMN."],["Propriété du code d2d non vérifiée (dépôt Airbus).","Le script Python oracle_eval.py est à réécrire en Node/TS."]),Ve("b","(b) Extraction BPMN par engram","Engram produit lui-même les diagrammes BPMN à partir des textes source, puis les évalue.",["Une seule chaîne de production et d’évaluation.","Producteur sous contrôle d’engram."],["Paires texte → BPMN encore à constituer.","Gros chantier avant toute mesure."]),Ve("c","(c) Reporter BPMN","Le contrat générique est qualifié sur immo seul ; BPMN viendra plus tard, sans recette commune.",["Moins de coordination.","Livraison immo plus directe."],["Pas de preuve que le contrat est générique.","Risque de modèle taillé pour immo."])]}],bv="https://github.com/rhanka/radar-immobilier/pull/794",LI="Ouvrir la PR #794 sur GitHub",OI="2026-10-03",Ql=["Farid","Fabien"],xv=[{id:"fabien",step:1,decides:"Fabien",label:"Étape 1 · Fabien décide d’abord (décisions génériques G1 à G8, puis architecture, données, jeu de référence)"},{id:"farid",step:2,decides:"Farid",label:"Étape 2 · Farid décide ensuite (produit, affichage, priorités)"}],NI="Fabien décide d’abord les huit décisions génériques G1 à G8 (convergence sentropic + engram, §6.7), puis ses sept décisions immo (D1, D2, D3, D4, D9, D10, D11) : D1 est déjà actée par l’owner le 2026-10-04 (tout conserver) ; les autres sont prises telles quelles, sauf incohérence avec une autre décision. Farid décide ensuite ses neuf décisions (D5, D6, D7, D8, D12, D13, D14, D15, D16), en connaissant les choix de Fabien. Si un choix de Farid contredit un choix de Fabien (par exemple D1 « tout conserver » avec D2 = (c), une table de contrôle qui n’affiche rien), on revient à Fabien sur ce seul point.",gt=(e,t,n,r,i)=>({key:e,mode:"single",question:t,recommended:n,options:i,step:Ys[e][0]==="Fabien"?1:2,group:xv.find(a=>a.decides===Ys[e][0]).label,intro:r.intro,dependsOn:r.dependsOn??[],recommendation:r.recommendation,decided:r.decided??null,family:r.family??"immo",decides:Ys[e][0],consulted:Ys[e][1],validators:[]}),Pe=(e,t,n,r,i)=>({key:e,title:t,pros:n,cons:r,description:i}),br=[...RI.map(e=>gt(e.key,e.question,e.recommended,{intro:e.intro,dependsOn:e.dependsOn,recommendation:e.recommendation,family:"générique"},e.options.map(t=>Pe(t.key,t.title,t.pros,t.cons,t.description)))),gt("D1","D1 — Périmètre de conservation des retours de Steve","b",{decided:{option:"b",by:"Fabien (owner)",date:"2026-10-04",note:"Actée par l’owner le 2026-10-04 : on conserve tous les retours de Steve ; il en a besoin pour le jeu de référence."},intro:"Décision actée par l’owner le 2026-10-04 : on conserve tous les retours de Steve ; c’est sa décision, il en a besoin pour le jeu de référence. Steve a livré un classeur de 7 feuilles (124 lignes de triage, 121 contrôles d’exclusion, 77 constats, 26 règles, 28 codes de motif) et une analyse écrite qui pose ses trois critères (§2, §5.1). Ce choix fixe ce que l’équipe pourra montrer sur les objets du radar et ce que le jeu de référence pourra mesurer (D10). Conséquence pour D2 : « tout conserver » suppose un modèle qui garde toutes les lignes, l’option a (ou b) de D2.",dependsOn:[],recommendation:"Tranchée : (b), tout conserver, actée par l’owner le 2026-10-04 ; les options a et c restent affichées pour mémoire."},[Pe("a","(a) Triage seul",["Rapide : une feuille, 124 lignes.","Moins de rattachements à vérifier à l’import."],["Perd les 121 contrôles d’exclusion, là où se trouvent les faux négatifs, ainsi que les constats et les règles.","Jeu de référence incomplet : impossible de mesurer ce que les filtres cachent à tort."]),Pe("b","(b) Tout le classeur et l’analyse, brut immuable",["Aucune perte : chaque cellule, formule et valeur mémorisée.","Le jeu de référence (D10) dispose des exclusions et des règles.","Les 52 villes suivantes s’importeront de la même façon."],["Plus de tables et de curation (rattachements à vérifier).","Import un peu plus long à écrire et à recetter."]),Pe("c","(c) Notes libres seules",["Surface existante : les notes des lots et des signaux.","Aucun schéma nouveau : livrable vite."],["Perd la structure (classement, motif, sens), les groupes et la provenance.","Inutilisable pour le jeu de référence ; une note est limitée à 10 000 caractères."])]),gt("D2","D2 — Modèle de données immo : adoption du générique","a",{intro:"La convergence sentropic + engram (G2, G7) attribue les annotations, révisions et validations à un paquet générique, @sentropic/annotations, et le jeu de référence à engram ; elle recommande qu’immo ne construise pas ses propres tables. Il reste à décider comment immo s’y inscrit : en premier adoptant, qui apporte un profil (schéma d’étiquettes : verdicts, 28 motifs, critères, sens) et ses données (graphe, documents, rattachements geo, classeur de Steve), ou en construisant d’abord six tables à lui. L’état initial et l’état proposé, objet par objet et par propriétaire, sont au §6.0 ; les besoins de Steve au §6.3. L’import (L1), l’affichage (U1, U2) et le jeu de référence C (O1) en dépendent.",dependsOn:["D1","G2","G7"],recommendation:"(a) : aucun double travail, les besoins de Steve deviennent la recette du paquet générique, et immo ne garde que ce qui lui est propre (profil, données, résolveur d’ancres, écrans). (b) ne vaut que si le paquet générique prend un retard non borné."},[Pe("a","(a) Adopter le générique : immo = profil + données",["Aucune table d’annotation propre à immo : pas de migration ultérieure.","Les besoins de Steve servent de recette au paquet générique, sur le PG et le S3 d’immo.","Mêmes règles de version, de validation et de jeu de référence que les autres domaines (BPMN)."],["Dépend du calendrier de @sentropic/annotations (L2) et d’engram (L0, L1).","Un profil de domaine à écrire et à faire valider (schéma d’étiquettes, règle D13)."]),Pe("b","(b) Six tables immo, puis migration",["Livrable sans attendre le générique.","Modèle déjà décrit et testé dans les versions précédentes du dossier."],["Réimplémentation que la convergence interdit (« prevent each new app … from inventing a private model »).","Migration vers @sentropic/annotations à faire ensuite, avec reprise des données.","Deux modèles à maintenir pendant la transition."]),Pe("c","(c) Table de contrôle seule (jeu de référence)",["Rapide : une table.","Respecte le précédent du 2026-06-11 : la mesure ne nourrit pas la production."],["Rien d’affichable : ne répond pas à #784 (« attaché à l’élément associé »).","Steve ne peut ni annoter ni valider dans l’application.","Une seconde structure sera nécessaire plus tard."]),Pe("d","(d) Attendre le générique sans borne",["Aucun travail côté immo maintenant.","Aucune dette de transition."],["Steve ne voit rien dans l’outil tant que le paquet n’est pas livré.","Aucun délai : la recette de Steve n’est pas planifiée."])]),gt("D3","D3 — Ancre signal et correctif B0","a",{intro:"Une ancre est la référence qui attache une annotation à un objet du radar (signal, ville, zone, lot…) ; c’est une ligne de la table annotation_cibles (ville + id texte, scène 2). Aujourd’hui l’annotation d’un signal est cassée : l’UI envoie l’identifiant texte du graphe (« signal-… »), alors que l’API exige un UUID, identifiant aléatoire de l’ancienne table signals que plus aucun code n’alimente (§6.1, défaut 1). « B0 » est le petit lot correctif qui répare cela (§7). Sans ancre fiable, aucun retour de Steve ne s’affiche sur son signal. Risque connu : une ré-extraction du graphe peut supprimer ou renommer des identifiants (graph-store.ts, §6.1).",dependsOn:["G2","D2"],recommendation:"(a) avec B0 tout de suite : c’est le seul choix qui rend l’annotation de signal utilisable maintenant et qui ne perd rien à la ré-extraction. Une clé métier stable reste un suivi séparé."},[Pe("a","(a) Clé texte namespacée + instantané observé, B0 immédiat",["Survit à la ré-extraction : l’ancre passe « disparue » au lieu d’effacer l’annotation, et l’instantané observé (ville, date, type, verbatim) reste lisible.","Répare tout de suite l’annotation existante (B0, taille S).","Aucune clé étrangère vers le graphe, donc aucune suppression en cascade."],["Si l’extraction renomme un identifiant, un rapprochement est nécessaire (file de revue).","La clé texte n’est pas une identité métier définitive."]),Pe("b","(b) Attendre une clé métier stable",["Identité propre et stable par conception.","Évite plus tard tout rapprochement d’identifiants."],["Dépend d’une ontologie qui n’existe pas : bloquant, sans date.","L’annotation de signal reste cassée en attendant."]),Pe("c","(c) Passer par l’UUID signals",["Contrat v1 (migration 0011) inchangé.","Aucune nouvelle colonne d’ancre à créer."],["Aucune insertion dans signals sur main : l’ancre est impossible en pratique.","Maintient le défaut actuel (refus 400 attendu)."])]),gt("D4","D4 — Conformité sentropic et suppression","a",{intro:"Modifiée par G2 et G3 : les annotations de Steve passent par @sentropic/annotations (révisions immuables, tombstone) ; D4 ne porte plus que sur les commentaires de l’équipe et la conformité de lecture. Les annotations doivent suivre le contrat du module comments de sentropic, la plateforme commune (exigence E3, §6.1). Ce module, en version 0.2.0, supprime physiquement un commentaire ; or l’owner a décidé (O1, dossier COLLAB) qu’une suppression laisse une trace (« tombstone ») et une durée de rétention. Il faut décider comment être conforme sans contredire O1, avant l’import (L1) et l’API de lecture (L2). Concrètement : peut-on supprimer un retour de Steve, et par quel chemin ? Dans la scène 2, comment_projection relie une évaluation publiée à son fil de commentaires.",dependsOn:["G2","G3","D2"],recommendation:"(a), puis adoption du port complet quand sentropic publiera la version avec tombstone. Réserve : le dossier COLLAB n’est pas sur main (non vérifié) ; s’il était abandonné, (b) redeviendrait défendable."},[Pe("a","(a) Cibles et lecture conformes, import immuable, demande de tombstone",["Respecte O1 et la ligne COLLAB « le paquet porte l’intégrité ».","Livrable maintenant : cibles et lecture conformes, sans modifier le paquet.","Premier lot en lecture seule : aucune suppression à gérer tant que le paquet n’a pas de tombstone."],["Conformité partielle : pas encore le port complet CommentStore.","Une demande à sentropic (tombstone) à suivre.","Une migration vers le port complet plus tard."]),Pe("b","(b) Adaptateur CommentStore à tombstone hôte",["Port complet utilisé dès maintenant.","Un seul chemin d’écriture et de lecture : celui du port."],["Contredit COLLAB §2 : un tombstone porté seulement par Radar est un piège.","Un delete qui ne supprime pas trahit la sémantique du port.","Dette à défaire quand sentropic livrera."]),Pe("c","(c) Attendre le port complet",["Conformité intégrale, aucun écart.","Aucune migration ultérieure vers le port complet."],["Bloquant tant que sentropic n’a pas livré, sans date.","Rien d’affiché pour Steve en attendant."])]),gt("D9","D9 — Sens de « double annotation » (point ouvert)",null,{intro:"La demande initiale parle de « double annotation (ancienne / nouvelle) » sans dire ce qui est comparé à quoi. Le modèle retenu (D2) garde le verdict de Steve dans annotations ; les autres jeux (adjudication C, prédiction C) vivent dans les versions gelées du jeu de référence, et la classification du radar se recalcule (§6.6) : les trois lectures sont donc possibles techniquement. Mais chacune produit une mesure différente et fixe ce que le jeu de référence (D10) comparera : il faut la préciser avant de geler le jeu de référence de ciblage. Le sens de la demande appartient à Fabien.",dependsOn:["G1","D2"],recommendation:"Point ouvert : aucune option recommandée. La lecture (1) est celle que le dossier a modélisée (§6.6) ; les trois tiennent dans le même schéma."},[Pe("1","Steve contre classification radar",["Mesure directement l’écart entre ce que Steve juge et ce que le radar montre (B aujourd’hui, C demain).","C’est la lecture qui sert la bascule B → C (D13)."],["La classification serveur de septembre n’est pas archivée : la version radar sera reconstituée, en partie.","Ne mesure pas l’accord entre deux humains."]),Pe("2","Ancienne grille de Steve contre grille C",["Suit l’évolution des critères de Steve dans le temps.","Utile si Steve réétiquette ses lignes avec les critères C."],["Exige un second passage de Steve sur les mêmes lignes.","Ne dit rien de la qualité du radar."]),Pe("3","Jeu de référence 676 contre jeu de référence Steve",["Relie l’extraction (jeu de référence E) et le ciblage (jeu de référence C).","Réutilise deux références déjà constituées (674/676 et le tableur)."],["Compare deux questions différentes : « a-t-on extrait l’acte ? » contre « fallait-il le montrer ? ».","Recouvrement des deux corpus probablement faible (non vérifié)."])]),gt("D10","D10 — Jeu de référence #783","b",{intro:"Un jeu de référence est un jeu de réponses de référence qui note automatiquement le radar. Le jeu de référence actuel (674 unités committées, 676 en copie locale) note l’extraction des actes dans les procès-verbaux, pas le choix des signaux à montrer (§9.3). Les retours de Steve sont la première vérité humaine sur ce choix : dans sa vue de travail, 24 signaux sur 73 sont du bruit (32,9 %, scène 1). Il faut décider comment construire le jeu de référence de ciblage (#783) avant de développer C (D7), car c’est lui qui dira si C fait mieux que B (D13). Dans la scène 3, le jeu de référence est la bande du bas : hors ligne, alimenté par les annotations en base. La proposition complète (ancien jeu de référence → nouveau jeu de référence, construction, gel, validation) est au §9.3.",dependsOn:["G1","G5","G7","D2","D9"],recommendation:"Double jeu de référence : c’est la seule façon de mesurer l’utilité (ciblage) sans perdre la mesure de l’extraction ; campagne nouvelle seulement pour ce que les archives ne permettent pas d’évaluer. Unité : le signal, regroupé par dossier ; une unité « dossier » serait plus fidèle mais dépend d’une clé de règlement peu fiable (C-26)."},[Pe("a","Remplacer v3 par le tableur",["Rapide : une seule source.","Aucune adjudication supplémentaire à organiser."],["Les retours ne portent que sur ce que l’écran affichait : échantillon biaisé, les sept dossiers manqués restent invisibles.","Perd l’historique de l’extraction et la comparabilité des benchmarks passés."]),Pe("b","Double jeu de référence E / C, jeu test indépendant",["Mesure séparément « a-t-on extrait l’acte ? » (E) et « fallait-il le montrer ? » (C).","Jeu test indépendant : les 52 villes suivantes de Steve, jamais vues pendant le réglage (51 villes de développement).","Partition par dossier : pas de fuite entre développement et test."],["Adjudication nommée et corpus de test coûtent du travail (Steve, l’équipe).","Deux jeux de référence à versionner et geler par empreinte (sha256)."]),Pe("c","Campagne C entièrement nouvelle",["Conçue pour le besoin réel, sans biais d’affichage.","Peut couvrir d’emblée les 52 villes restantes avec la méthode C."],["Comparaison moins directe avec l’historique.","Repart de zéro : délai et coût d’annotation les plus élevés."])]),gt("D11","D11 — Benchmark #782","a",{intro:"Le benchmark #782 compare des modèles et des réglages sur un même jeu de référence. Si on y ajoute la mesure du ciblage (B, puis C), il faut décider si elle rejoint les métriques d’extraction ou forme un volet à part (§9.4). Le choix fixe aussi le sort du prompt d’extraction gelé (immo-pv-extraction-v9) : lui faire produire sens, effet et portée romprait la comparabilité des campagnes v10 et v11. Ce que verra Farid : un tableau unique, ou deux tableaux qui ne se mélangent pas.",dependsOn:["G6","D10"],recommendation:"Volet ciblage séparé : c’est la condition pour comparer B et C sans casser l’historique de l’extraction."},[Pe("a","Volet ciblage séparé",["Extraction et ciblage restent comparables chacun dans le temps.","Colonnes historique, B et C distinctes : l’effet de C se lit directement.","Tout changement du contrat d’extraction devient une nouvelle version, décidée à part."],["Deux tableaux à lire.","Pont entre les deux seulement sur les 100 documents du corpus commun."]),Pe("b","Métriques fusionnées",["Un seul tableau, un seul score.","Lecture plus simple pour un public non technique."],["Mélange deux questions différentes : un F1 fusionné ne dit plus rien.","Perd la comparabilité avec les campagnes passées."])]),gt("D5","D5 — Auteur des retours importés","c",{intro:"Steve poursuivra son annotation dans l’application (vision owner, §6.3) : ses retours importés et ses annotations futures doivent porter le même auteur. Aujourd’hui il n’a pas de compte vérifié, et ce n’est pas lui qui lance l’import. Il faut décider qui est affiché comme auteur, sans usurper son identité ni effacer celle de l’importateur (exigence E5, §6.2). Effet visible : la ligne « auteur » de chaque annotation dans le panneau du signal, et le nom de qui valide ou conteste.",dependsOn:["G4","D2","D4"],recommendation:"(c) : Steve annote et valide avec son propre compte ; ses retours importés lui sont attribués, l’importateur est tracé à part. (a) ne vaut que si la création du compte tarde."},[Pe("a","(a) Auteur documentaire externe + importateur tracé",["Le contenu est attribué à son vrai auteur sans attendre la création d’un compte.","L’importateur réel est tracé : on sait qui a chargé quoi."],["Steve ne peut ni annoter ni valider dans l’application sous ce nom externe.","Deux identités pour la mê
