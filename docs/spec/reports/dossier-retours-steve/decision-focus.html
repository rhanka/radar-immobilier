nisme, 4 resserrements, 6 sans effet sur la capacité, 8 autorisations individuelles, 3 points d'ordre du jour. Le radar filtre par nature d'instrument et par étape ; Steve demande un filtre par effet du règlement, sens et nombre d'unités, pour lequel aucune donnée n'existe encore (§2.3)."},"modele-donnees":{badge:"§6 · modèle M3 proposé",lede:"Un diagramme entité-relation : chaque boîte est une table avec ses colonnes clés (PK, FK, UK), chaque lien une relation avec sa cardinalité. Cinq couches de gauche à droite : sources immuables, référentiels de Steve, jugements versionnés, ancres durables, publication conforme au contrat sentropic. Seules graph_nodes et prospect_notes existent déjà ; les autres tables sont proposées (§6.3).",note:"Une ligne du classeur produit une évaluation versionnée, rattachée à 1 à N objets par des clés texte sans clé étrangère : une ré-extraction du graphe ne détruit rien, l'ancre passe en « disparue » et l'instantané observé reste lisible. La projection Comment ({kind:'record', recordType:'radar.*'}) suit le contrat sans élargir le port ; aucune suppression physique, conformément à la décision O1."},"flux-import-oracle":{badge:"§6.5, §7, §9.3 · architecture et oracle",lede:"Une architecture en couloirs verticaux, de gauche à droite : les utilisateurs, les écrans de l'UI, les fonctions backend (collecte, détection de signal, import, rattachement, API), puis les données sur les composants réels, S3 et PostgreSQL. L'oracle est en bas, en bande transversale : un système d'évaluation hors ligne, alimenté par les annotations stockées en base.",note:"L'oracle de ciblage C et l'oracle d'extraction E restent séparés jusqu'au benchmark, où ils alimentent deux volets distincts. L'analyse du 21 septembre entre comme annotation distincte de l'adjudication : elle n'écrase pas les classes du tableur, qui font foi pour l'import. L'import est un acte owner distinct, sur l'image Node existante de l'API (§6.5)."},"architecture-ui":{badge:"§8 · état mesuré sur main 27891b10",lede:"Trois conteneurs : l'UI (Vite + Svelte 5), l'API Hono et les paquets sentropic. Les cartes pleines sont constatées dans le code ; les cartes « nouveau » et « nouvelle » sont les ajouts proposés pour la première livraison.",note:"La carte Signaux reste un MapLibre local de 2 761 lignes ; les composants geo partagés ne servent qu'au pilote #/geo et le moteur 3D est désactivé. L'avis de Steve se monte dans le panneau et le rail avec les composants DS déjà adoptés : la première livraison n'attend pas la migration geo."},"affichage-abc":{badge:"§9.5 · D12 et D13 ouverts",lede:"Deux zones. En haut, l'application : ce que voient les utilisateurs et où chaque élément vit (écran, backend, base). Steve et l'équipe voient B, par défaut et sans sélecteur ; C est calculée en shadow par le backend sur le même snapshot, et ne se voit qu'en recette UAT. En bas, l'évaluation hors ligne, un job sans écran : référence A gelée, diff B → C nommé, oracle C, mesure, seuil de bascule, puis décision de Farid, seule à faire passer les utilisateurs de B à C.",note:"À l'écran, C a trois états : « confirmé » et « à instruire » sont visibles, « exclu prouvé » est masqué avec sa raison ; une absence de donnée n'est jamais une exclusion, l'indéterminé et le mixte restent donc visibles. L'exposition de la comparaison (UAT seulement ou sélecteur visible, D12) et le seuil chiffré de bascule (D13) sont laissés à Farid."}};var r=_4();Le(r,21,()=>t.graphs,Fe,(i,a)=>{var s=b4(),o=L(s),c=L(o),u=L(c),d=L(u),p=q(u),f=L(p),h=q(c,2),g=L(h),m=q(o,2),v=L(m),_=L(v),C=q(v,2),k=L(C),x=q(m,2),P=L(x),T=q(x,2);{var R=V=>{TD(V,{get graph(){return l(a)}})},D=V=>{qm(V,{get graph(){return l(a)}})},F=V=>{p4(V,{get graph(){return l(a)}})},Y=V=>{kD(V,{get graph(){return l(a)}})};be(T,V=>{l(a).kind==="matrix"?V(R):l(a).kind==="er"?V(D,1):l(a).kind==="lanes"?V(F,2):V(Y,-1)})}var z=q(T,2),N=L(z),M=q(z,2);{var b=V=>{var X=h4(),H=L(X);ae(()=>J(H,"".concat(l(a).projection.rows.length??""," lignes · matrice ","option_libelle","statut"];function BT(e,t){const n=NT.map(r=>"".concat(r,": ").concat(Kl(e[r])));if(!t.length)return[...n,"decisions: []"].join("\n");n.push("decisions:");for(const r of t){n.push("  - id: ".concat(Kl(r.id,6)));for(const i of qT)n.push("    ".concat(i,": ").concat(Kl(r[i],6)));n.push("    commentaire: ".concat(OT(r.commentaire,6)))}return n.join("\n")}const FT=e=>"```yaml\n".concat(e,"\n```"),zT={D2:{M1:"On ajoute des colonnes à prospect_notes (migration 0011) et chaque ligne du classeur devient une note libre sur un lot ou un signal. Aucune nouvelle table ; l’UI des notes existante affiche le texte. Exemple : la ligne #7 du Triage, qui nomme deux événements, doit être dupliquée en deux notes ; la cellule E57 des Constats (17 114 caractères) ne rentre pas.",M2:"On crée une seule table de contrôle qui recopie le classeur pour mesurer le radar, sans aucun lien vers ce qui est affiché. Le nom de table est indicatif. Rien n’apparaît dans le panneau du signal : Steve ne retrouve pas son verdict sur le signal qu’il a trié ; seul l’oracle lit la table.",M3:"On crée les tables de la scène 2 : le fichier reçu (sha256), toutes ses lignes brutes, une évaluation versionnée par ligne, 1 à N ancres vers les objets du radar, et une projection vers les fils de commentaires sentropic. Exemple : la ligne #7 donne une évaluation et deux ancres (deux événements) ; une ligne agrégée « 13 signaux PIIA » donne une ancre sur la ville. Le panneau affiche le verdict, l’oracle lit les mêmes évaluations.",M4:"On ne construit rien côté radar : on attend que le paquet comments de sentropic porte tout (cibles, verdict, provenance). En attendant, le classeur reste un fichier hors de l’outil. Même livré, le paquet ne porte ni classement, ni motif, ni sens : il faudrait encore des tables radar."},D3:{a:"On stocke la cible sous forme de texte (« radar.signal:<ville>:<id> ») dans annotation_anchors, sans clé étrangère vers le graphe, avec un instantané de ce que Steve a vu (ville, date, type, verbatim). B0 corrige l’API pour accepter cet identifiant texte. Si une ré-extraction supprime le signal, l’ancre passe « disparue » et le panneau montre l’instantané au lieu de perdre le retour.",b:"On n’ancre rien tant qu’une clé métier stable (dossier réglementaire, étape) n’existe pas dans une ontologie du radar. Aucun lot B0 : l’annotation de signal reste en échec 400 et les retours de Steve ne s’affichent sur aucun signal.",c:"On garde le contrat v1 : une annotation de signal pointe vers l’UUID de la table signals. Mais aucun code de main n’écrit dans signals : il n’existe aucun UUID à viser pour les 124 lignes de Steve. L’ancre ne peut pas être créée."},D4:{a:"Les annotations utilisent les cibles et la lecture du module comments, sans modifier le paquet. Les retours importés sont immuables : aucun bouton de suppression. Les réponses de l’équipe vont dans prospect_notes v1, qui sait déjà effacer logiquement. On demande à sentropic une version avec tombstone, puis on adopte le port complet.",b:"On écrit un adaptateur CommentStore côté radar dont le delete pose une marque (tombstone) au lieu d’effacer. Les retours et réponses passent tout de suite par le port complet. Mais le delete du port ne supprime plus vraiment : sa sémantique diffère de celle du paquet.",c:"On attend que sentropic publie un paquet avec tombstone et rétention, puis on branche tout dessus. Aucun retour de Steve n’est affiché avant cette version, sans date connue."},D9:{1:"Le jeu « steve-source » (verdict de Steve) est comparé à la classification du radar : B′ reconstituée à la date du relevé, puis C. Exemple : sur la passe 1, Steve juge 24 signaux sur 73 Non pertinent alors que B les affiche ; c’est cet écart que l’on mesure ligne par ligne.",2:"On compare deux grilles humaines de Steve : son classement actuel (P/S/N, motif) et un nouvel étiquetage selon les critères C. Steve repasse sur les mêmes lignes ; l’oracle mesure l’évolution de ses critères, pas le radar.",3:"On rapproche l’oracle d’extraction (676 unités sur 100 procès-verbaux) et l’oracle de Steve (124 lignes). Le pont passe par les documents communs, probablement peu nombreux (non vérifié)."},D10:{a:"Les 124 lignes du tableur deviennent l’unique oracle, à la place de la version 674/676. Rapide à constituer, mais il ne contient que ce que l’écran montrait à Steve : les sept dossiers manqués (« l’information existait dans la base ») n’y figurent pas.",b:"Deux oracles versionnés et gelés par empreinte. E reste l’oracle d’extraction (676 unités). C est construit à partir des évaluations et ancres de Steve, adjugées et étayées. Développement sur ses 51 villes, test sur les 52 suivantes, jamais vues ; toutes les unités d’un même dossier dans la même partition.",c:"On lance une campagne d’annotation neuve, conçue pour le ciblage C, sur un nouveau corpus. Les 124 lignes de Steve servent seulement d’exemples ; la comparaison avec l’historique se fait à part."},D11:{a:"Le rapport du benchmark #782 garde son tableau d’extraction inchangé et ajoute un tableau « ciblage » : précision et rappel de l’historique, de B, puis de C, sur l’oracle C. Le prompt gelé immo-pv-extraction-v9 n’est pas modifié ; l’enrichir serait une nouvelle version, décidée à part.",b:"Un seul tableau et un seul score mêlent l’extraction (étape et citation) et le ciblage (fallait-il montrer le signal)."},D1:{a:"On importe seulement la feuille Triage : 124 lignes, 51 villes. Les 121 contrôles d’exclusion (dont 3 faux négatifs « écartés à tort »), les 77 constats et les 26 règles restent dans le fichier.",b:"On importe les 7 feuilles et l’analyse du 21 septembre, sans rien modifier : 124 lignes de triage, 121 contrôles d’exclusion, 77 constats, 26 règles, 28 codes, et la Synthèse avec ses formules et leurs valeurs mémorisées. L’analyse est conservée à part, comme annotation distincte.",c:"Chaque ligne devient une note de texte libre sur une ville ou un signal, dans l’UI des notes actuelle. Le classement, le motif et le sens ne sont plus des champs : ils sont dans le texte."},D5:{a:"Chaque retour importé affiche « Steve Chaperon — importé par <nom> ». Steve est un auteur externe (ext:chaperon:steve) sans compte ; l’importateur réel est enregistré à part (recorded_by). Personne ne peut modifier ni supprimer un retour importé.",b:"Le retour est affiché comme écrit par la personne qui a lancé l’import ; le nom de Steve n’apparaît que dans la provenance (fichier, feuille, ligne).",c:"On crée un compte pour Steve et ses retours importés sont rattachés à ce compte, comme s’il les avait saisis lui-même dans l’outil."},D6:{a:"Tout utilisateur approuvé voit tous les retours, verbatims compris, comme pour les notes actuelles (règle 0011). Aucun masquage.",b:"Seuls les administrateurs et Steve voient les retours ; le reste de l’équipe ne les voit pas dans le panneau.",c:"Tout utilisateur approuvé voit les retours, mais les noms de particuliers sont masqués avant affichage, dans les verbatims importés comme dans les résumés de signaux (demande C-79 de Steve). Une colonne pii_status trace le traitement."},D7:{S:"C n’affiche que les signaux qui réunissent les trois critères de façon établie. Exemple : sur la passe 1, seuls 22 signaux sur 73 resteraient ; les 12 Pertinent dont le sens n’est pas donné disparaîtraient.",K:"C applique les critères K1 à K9 (§9.2) avec trois états : confirmé (critères étayés), à instruire (sens ou effet non déterminable, reste visible), exclu prouvé (masqué, raison affichée). Deux compteurs distincts « confirmés » et « à instruire ». Aucun seuil de taille de projet ni filtre sur l’origine privée.",T:"La sélection affichée reste B ; les critères de Steve servent seulement à trier la liste (les « trois critères » en premier). Aucun signal n’entre ni ne sort."},D8:{a:"Steve et Mathieu examinent les cas listés au §9.2 sur exemples et preuves (Saint-Victor, Amos, CPTAQ, seconds projets, ODJ, trois S-RESTRICTIF). Tant qu’un cas n’est pas tranché, il est marqué « abstention » dans l’oracle : il ne compte ni pour ni contre.",b:"L’équipe tranche elle-même chaque cas à partir de l’analyse et des règles de Steve, puis lui présente le résultat.",c:"Les cas restent dans l’oracle avec l’étiquette du tableur, sans statut particulier, même quand le tableur et l’analyse se contredisent."},D12:{a:"Steve et l’équipe continuent de voir B, sans sélecteur. C est calculée en parallèle par le backend ; une page de comparaison B / C n’est accessible qu’en recette UAT et aux administrateurs. Le jour où le seuil D13 est franchi et que Farid décide, C remplace B à l’écran (scène 5).",b:"Un sélecteur A / B / C apparaît dans le rail pour tous les utilisateurs, avec un mode comparatif ; le choix est porté dans l’URL (filter.targeting=a|b|c).",c:"On n’expose pas C comme un tout : on ajoute à B, un par un, les critères de C (sens, plein droit, second projet), chacun livré quand il est prêt.",d:"On construit une seconde application dédiée à C, avec sa propre carte, ses filtres et ses notes ; Steve choisit l’une ou l’autre application."},D13:{a:"C remplace B seulement si, sur le jeu test des 52 villes : aucun signal que Steve juge Pertinent n’est masqué ; la précision P ∪ S de C dépasse celle de B (67,1 % sur la passe 1) ; l’API, le rail, la carte et le panneau montrent les mêmes ensembles ; Farid fait la recette.",b:"Farid écrit d’autres chiffres dans le commentaire (par exemple une précision minimale ou un rappel minimal), mesurés par le même oracle.",c:"La bascule se décide sur la recette de Farid seule, sans mesure chiffrée par l’oracle."},D14:{a:"Dans le panneau du signal, un badge « Retour de Steve » (vert, jaune, rouge) ouvre une section « Avis de Steve » : classement, motif, sens, analyse, provenance, état du rattachement. Dans le rail, des compteurs P / S / N par ville. Les 3 composants d’annotation passent au design system. Rien sur la carte au premier lot.",b:"En plus du panneau, des pastilles colorées sur la carte Signaux actuelle (composant local MapLibre de 2 761 lignes) dès le lot L3.",c:"On termine d’abord la migration de la carte vers les composants geo partagés (Porte 2), puis on affiche les retours sur la nouvelle carte et dans le panneau.",d:"Un écran séparé liste tous les retours de Steve (filtrable par ville, motif, statut de rattachement), sans rien afficher sur les objets du radar."},D15:{a:"B0, l’import (L1) et l’oracle de ciblage (O1) démarrent maintenant, en parallèle de #703, car ils ne touchent pas la chaîne de rafraîchissement. Le classifieur C (C1) attend que le rafraîchissement soit stable.",b:"Tout le travail de ce dossier attend la clôture de #703 (rafraîchissement quotidien en production)."},D16:{a:"Mathieu et Farid envoient à Steve la définition réelle des cinq filtres (§5.7, lue dans le code) et la table qui relie ses 28 codes de motif aux critères C, pour qu’il la corrige avant le développement de C.",b:"On ne répond pas à sa question R-16 avant que C soit développée ; il reçoit alors directement la nouvelle sélection."}},UT={D2:{M1:{colGap:180,layers:["Table existante, étendue","Tables référencées"],placement:{prospect_notes:{col:0,row:0},account_users:{col:1,row:0},signals:{col:1,row:1}},existing:["prospect_notes","account_users","signals"],labels:{cible_signal:"cible signal"},er:'erDiagram\n    prospect_notes }o--|| account_users : auteur\n    prospect_notes }o--o| signals : cible_signal\n    prospect_notes {\n      uuid id PK\n      text target_type "lot ou signal"\n      text city_slug\n      uuid signal_id FK "UUID"\n      uuid author_id FK "compte obligatoire"\n      text body "10 000 caractères max"\n    }\n    account_users {\n      uuid id PK\n    }\n    signals {\n      uuid id PK "aucune insertion sur main"\n    }'},M2:{colGap:180,layers:["Mesure seule","Affichage, sans lien"],placement:{steve_control_rows:{col:0,row:0},graph_nodes:{col:1,row:0}},existing:["graph_nodes"],labels:{},er:'erDiagram\n    steve_control_rows {\n      uuid id PK\n      text sheet\n      int sheet_row\n existing:["graph_nodes"],labels:{cle_texte_sans_fk:"clé texte, sans FK"},er:'erDiagram\n    annotation_anchors }o..o| graph_nodes : cle_texte_sans_fk\n    annotation_anchors {\n      uuid id PK\n      text anchor_key "radar.signal:<ville>:<id>"\n      jsonb observed "ville, date, verbatim"\n      text resolution "résolue … disparue"\n    }\n    graph_nodes {\n      text id PK "signal-… (texte)"\n    }'},b:{colGap:180,layers:["Ancre en attente","Clé métier"],placement:{annotation_anchors:{col:0,row:0},cle_metier_stable:{col:1,row:0}},existing:[],labels:{},er:'erDiagram\n    annotation_anchors }o..o| cle_metier_stable : attend\n    annotation_anchors {\n      uuid id PK\n      text business_key "à définir"\n    }\n    cle_metier_stable {\n      text key PK "n\'existe pas encore"\n    }'},c:{colGap:180,layers:["Note existante","Table signals"],placement:{prospect_notes:{col:0,row:0},signals:{col:1,row:0}},existing:["prospect_notes","signals"],labels:{signal_id:"signal_id, UUID"},er:'erDiagram\n    prospect_notes }o--o| signals : signal_id\n    prospect_notes {\n      uuid id PK\n      uuid signal_id FK "UUID exigé par l\'API"\n    }\n    signals {\n      uuid id PK "table vide sur main"\n    }'}}},tv="https://github.com/rhanka/radar-immobilier/pull/794",jT="Ouvrir la PR #794 sur GitHub",VT="2026-10-03",Yl=["Farid","Fabien"],nv=[{id:"fabien",step:1,decides:"Fabien",label:"Étape 1 · Fabien décide d’abord (architecture, données, oracle)"},{id:"farid",step:2,decides:"Farid",label:"Étape 2 · Farid décide ensuite (produit, affichage, priorités)"}],GT="Fabien décide d’abord ses six décisions (D2, D3, D4, D9, D10, D11) : elles sont prises telles quelles, sauf incohérence avec une autre décision. Farid décide ensuite ses dix décisions (D1, D5, D6, D7, D8, D12, D13, D14, D15, D16), en connaissant les choix de Fabien. Si un choix de Farid contredit un choix de Fabien (par exemple D1 « tout conserver » avec D2 = M1, qui tronque une cellule de 17 114 caractères), on revient à Fabien sur ce seul point.",ht=(e,t,n,r,i)=>({key:e,mode:"single",question:t,recommended:n,options:i,step:Hs[e][0]==="Fabien"?1:2,group:nv.find(a=>a.decides===Hs[e][0]).label,intro:r.intro,dependsOn:r.dependsOn??[],recommendation:r.recommendation,decides:Hs[e][0],consulted:Hs[e][1],validators:[]}),xe=(e,t,n,r)=>({key:e,title:t,pros:n,cons:r}),hr=[ht("D2","D2 — Modèle de données","M3",{intro:"Le classeur de Steve (7 feuilles, 433 lignes, une cellule de 17 114 caractères, §5.1) doit être stocké en base et rattaché aux objets du radar (#784). La seule table d’annotation existante, prospect_notes (migration 0011), exige un auteur avec compte, une seule cible et au plus 10 000 caractères (§6.1). Il faut choisir la forme des tables maintenant : l’import (lot L1), l’affichage (U1) et l’oracle (O1) en dépendent tous (§7). Le schéma proposé est la scène 2 (diagramme entité-relation) : sources immuables → lignes brutes → évaluations versionnées → ancres → publication.",recommendation:"M3 est la seule option qui conserve tout, rattache une ligne à plusieurs objets et sert à la fois l’affichage et l’oracle. Son vrai coût, la curation des identifiants abrégés, existe dans toutes les options."},[xe("M1","M1 — étendre prospect_notes",["Réutilise la migration 0011, l’API et l’UI existantes.","Aucune nouvelle table à créer."],["Auteur = compte obligatoire : Steve n’en a pas (D5).","Une seule cible par note, alors qu’une ligne vise 1 à N objets (signal, ville, règlement…).","Corps limité à 10 000 caractères : la cellule de 17 114 caractères serait tronquée.","Ni provenance (fichier, feuille, ligne) ni verdict structuré : inutilisable pour l’oracle."]),xe("M2","M2 — table de contrôle seule",["Rapide : une table.","Respecte le précédent du 2026-06-11 : la mesure ne nourrit pas la production."],["Rien d’affichable : ne répond pas à #784 (« attaché à l’élément associé »).","Steve ne voit pas ses retours dans l’outil.","Une seconde structure sera nécessaire plus tard pour l’affichage."]),xe("M3","M3 — couches hôtes + projection conforme",["Couvre les neuf exigences E1 à E9 (§6.2) : aucune perte, 1 à N ancres, provenance, révisions sans doublon.","Les couches brutes et évaluations servent de table de contrôle pour l’oracle ; la projection Comment, d’annotation visible.","Conforme au contrat sentropic sans modifier le paquet."],["Neuf tables nouvelles et une migration à écrire et tester.","Une file de rapprochement (identifiants abrégés, ambiguïtés) à traiter à la main.","Plus de code d’import que les autres options."]),xe("M4","M4 — attendre le paquet complet",["Aucune dette côté radar : tout vit dans sentropic.","Aucune migration à écrire ni à maintenir maintenant."],["Bloquant sans date : #784 et l’oracle attendent.","Le paquet ne porte de toute façon ni verdict structuré ni provenance (§6.1)."])]),ht("D3","D3 — Ancre signal et correctif B0","a",{intro:"Une ancre est la référence qui attache une annotation à un objet du radar (signal, ville, zone, lot…) ; c’est la colonne anchor_key de la table annotation_anchors (scène 2). Aujourd’hui l’annotation d’un signal est cassée : l’UI envoie l’identifiant texte du graphe (« signal-… »), alors que l’API exige un UUID, identifiant aléatoire de l’ancienne table signals que plus aucun code n’alimente (§6.1, défaut 1). « B0 » est le petit lot correctif qui répare cela (§7). Sans ancre fiable, aucun retour de Steve ne s’affiche sur son signal. Risque connu : une ré-extraction du graphe peut supprimer ou renommer des identifiants (graph-store.ts, §6.1).",dependsOn:["D2"],recommendation:"(a) avec B0 tout de suite : c’est le seul choix qui rend l’annotation de signal utilisable maintenant et qui ne perd rien à la ré-extraction. Une clé métier stable reste un suivi séparé."},[xe("a","(a) Clé texte namespacée + instantané observé, B0 immédiat",["Survit à la ré-extraction : l’ancre passe « disparue » au lieu d’effacer l’annotation, et l’instantané observé (ville, date, type, verbatim) reste lisible.","Répare tout de suite l’annotation existante (B0, taille S).","Aucune clé étrangère vers le graphe, donc aucune suppression en cascade."],["Si l’extraction renomme un identifiant, un rapprochement est nécessaire (file de revue).","La clé texte n’est pas une identité métier définitive."]),xe("b","(b) Attendre une clé métier stable",["Identité propre et stable par conception.","Évite plus tard tout rapprochement d’identifiants."],["Dépend d’une ontologie qui n’existe pas : bloquant, sans date.","L’annotation de signal reste cassée en attendant."]),xe("c","(c) Passer par l’UUID signals",["Contrat v1 (migration 0011) inchangé.","Aucune nouvelle colonne d’ancre à créer."],["Aucune insertion dans signals sur main : l’ancre est impossible en pratique.","Maintient le défaut actuel (refus 400 attendu)."])]),ht("D4","D4 — Conformité sentropic et suppression","a",{intro:"Les annotations doivent suivre le contrat du module comments de sentropic, la plateforme commune (exigence E3, §6.1). Ce module, en version 0.2.0, supprime physiquement un commentaire ; or l’owner a décidé (O1, dossier COLLAB) qu’une suppression laisse une trace (« tombstone ») et une durée de rétention. Il faut décider comment être conforme sans contredire O1, avant l’import (L1) et l’API de lecture (L2). Concrètement : peut-on supprimer un retour de Steve, et par quel chemin ? Dans la scène 2, comment_projection relie une évaluation publiée à son fil de commentaires.",dependsOn:["D2"],recommendation:"(a), puis adoption du port complet quand sentropic publiera la version avec tombstone. Réserve : le dossier COLLAB n’est pas sur main (non vérifié) ; s’il était abandonné, (b) redeviendrait défendable."},[xe("a","(a) Cibles et lecture conformes, import immuable, demande de tombstone",["Respecte O1 et la ligne COLLAB « le paquet porte l’intégrité ».","Livrable maintenant : cibles et lecture conformes, sans modifier le paquet.","Les réponses des utilisateurs vont dans prospect_notes v1, qui sait déjà faire une suppression logique."],["Conformité partielle : pas encore le port complet CommentStore.","Une demande à sentropic (tombstone) à suivre.","Une migration vers le port complet plus tard."]),xe("b","(b) Adaptateur CommentStore à tombstone hôte",["Port complet utilisé dès maintenant.","Un seul chemin d’écriture et de lecture : celui du port."],["Contredit COLLAB §2 : un tombstone porté seulement par Radar est un piège.","Un delete qui ne supprime pas trahit la sémantique du port.","Dette à défaire quand sentropic livrera."]),xe("c","(c) Attendre le port complet",["Conformité intégrale, aucun écart.","Aucune migration ultérieure vers le port complet."],["Bloquant tant que sentropic n’a pas livré, sans date.","Rien d’affiché pour Steve en attendant."])]),ht("D9","D9 — Sens de « double annotation » (point ouvert)",null,{intro:"La demande initiale parle de « double annotation (ancienne / nouvelle) » sans dire ce qui est comparé à quoi. Le modèle M3 (D2) porte plusieurs jeux d’étiquettes côte à côte (colonnes label_set et annotator_kind, §6.6) : les trois lectures sont donc possibles techniquement. Mais chacune produit une mesure différente et fixe ce que l’oracle (D10) comparera : il faut la préciser avant de geler l’oracle de ciblage. Le sens de la demande appartient à Fabien.",dependsOn:["D2"],recommendation:"Point ouvert : aucune option recommandée. La lecture (1) est celle que le dossier a modélisée (§6.6) ; les trois tiennent dans le même schéma."},[xe("1","Steve contre classification radar",["Mesure directement l’écart entre ce que Steve juge et ce que le radar montre (B aujourd’hui, C demain).","C’est la lecture qui sert la bascule B → C (D13)."],["La classification serveur de septembre n’est pas archivée : la version radar sera reconstituée, en partie.","Ne mesure pas l’accord entre deux humains."]),xe("2","Ancienne grille de Steve contre grille C",["Suit l’évolution des critères de Steve dans le temps.","Utile si Steve réétiquette ses lignes avec les critères C."],["Exige un second passage de Steve sur les mêmes lignes.","Ne dit rien de la qualité du radar."]),xe("3","Oracle 676 contre oracle Steve",["Relie l’extraction (oracle E) et le ciblage (oracle C).","Réutilise deux références déjà constituées (674/676 et le tableur)."],["Compare deux questions différentes : « a-t-on extrait l’acte ? » contre « fallait-il le montrer ? ».","Recouvrement des deux corpus probablement faible (non vérifié)."])]),ht("D10","D10 — Oracle #783","b",{intro:"Un oracle est un jeu de réponses de référence qui note automatiquement le radar. L’oracle actuel (674 unités committées, 676 en copie locale) note l’extraction des actes dans les procès-verbaux, pas le choix des signaux à montrer (§9.3). Les retours de Steve sont la première vérité humaine sur ce choix : dans sa vue de travail, 24 signaux sur 73 sont du bruit (32,9 %, scène 1). Il faut décider comment construire l’oracle de ciblage (#783) avant de développer C (D7), car c’est lui qui dira si C fait mieux que B (D13). Dans la scène 3, l’oracle est la bande du bas : hors ligne, alimenté par les annotations en base.",dependsOn:["D2","D9"],recommendation:"Double oracle : c’est la seule façon de mesurer l’utilité (ciblage) sans perdre la mesure de l’extraction ; campagne nouvelle seulement pour ce que les archives ne permettent pas d’évaluer. Unité : le signal, regroupé par dossier ; une unité « dossier » serait plus fidèle mais dépend d’une clé de règlement peu fiable (C-26)."},[xe("a","Remplacer v3 par le tableur",["Rapide : une seule source.","Aucune adjudication supplémentaire à organiser."],["Les retours ne portent que sur ce que l’écran affichait : échantillon biaisé, les sept dossiers manqués restent invisibles.","Perd l’historique de l’extraction et la comparabilité des benchmarks passés."]),xe("b","Double oracle E / C, jeu test indépendant",["Mesure séparément « a-t-on extrait l’acte ? » (E) et « fallait-il le montrer ? » (C).","Jeu test indépendant : les 52 villes suivantes de Steve, jamais vues pendant le réglage (51 villes de développement).","Partition par dossier : pas de fuite entre développement et test."],["Adjudication nommée et corpus de test coûtent du travail (Steve, l’équipe).","Deux oracles à versionner et geler par empreinte (sha256)."]),xe("c","Campagne C entièrement nouvelle",["Conçue pour le besoin réel, sans biais d’affichage.","Peut couvrir d’emblée les 52 villes restantes avec la méthode C."],["Comparaison moins directe avec l’historique.","Repart de zéro : délai et coût d’annotation les plus élevés."])]),ht("D11","D11 — Benchmark #782","a",{intro:"Le benchmark #782 compare des modèles et des réglages sur un même oracle. Si on y ajoute la mesure du ciblage (B, puis C), il faut décider si elle rejoint les métriques d’extraction ou forme un volet à part (§9.4). Le choix fixe aussi le sort du prompt d’extraction gelé (immo-pv-extraction-v9) : lui faire produire sens, effet et portée romprait la comparabilité des campagnes v10 et v11. Ce que verra Farid : un tableau unique, ou deux tableaux qui ne se mélangent pas.",dependsOn:["D10"],recommendation:"Volet ciblage séparé : c’est la condition pour comparer B et C sans casser l’historique de l’extraction."},[xe("a","Volet ciblage séparé",["Extraction et ciblage restent comparables chacun dans le temps.","Colonnes historique, B et C distinctes : l’effet de C se lit directement.","Tout changement du contrat d’extraction devient une nouvelle version, décidée à part."],["Deux tableaux à lire.","Pont entre les deux seulement sur les 100 documents du corpus commun."]),xe("b","Métriques fusionnées",["Un seul tableau, un seul score.","Lecture plus simple pour un public non technique."],["Mélange deux questions différentes : un F1 fusionné ne dit plus rien.","Perd la comparabilité avec les campagnes passées."])]),ht("D1","D1 — Périmètre de conservation des retours de Steve","b",{intro:"Steve a livré un classeur de 7 feuilles (124 lignes de triage, 121 contrôles d’exclusion, 77 constats, 26 règles, 28 codes de motif) et une analyse écrite qui pose ses trois critères (§2, §5.1). Il faut décider ce qu’on garde en base : seulement le triage, tout, ou de simples notes. Ce choix fixe ce que l’équipe pourra montrer sur les objets du radar et ce que l’oracle pourra mesurer (D10). Cohérence avec D2 : « tout conserver » suppose le modèle M3.",dependsOn:["D2","D10"],recommendation:"(b) : conserve tout ce que Steve a produit et sert à la fois l’affichage et l’oracle. La recommandation changerait seulement si le besoin se limitait à quelques commentaires."},[xe("a","(a) Triage seul",["Rapide : une feuille, 124 lignes.","Moins de rattachements à vérifier à l’import."],["Perd les 121 contrôles d’exclusion, là où se trouvent les faux négatifs, ainsi que les constats et les règles.","Oracle incomplet : impossible de mesurer ce que les filtres cachent à tort."]),xe("b","(b) Tout le classeur et l’analyse, brut immuable",["Aucune perte : chaque cellule, formule et valeur mémorisée.","L’oracle (D10) dispose des exclusions et des règles.","Les 52 villes suivantes s’importeront de la même façon."],["Plus de tables et de curation (rattachements à vérifier).","Import un peu plus long à écrire et à recetter."]),xe("c","(c) Notes libres seules",["Surface existante : les notes des lots et des signaux.","Aucun schéma nouveau : livrable vite."],["Perd la structure (classement, motif, sens), les groupes et la provenance.","Inutilisable pour l’oracle ; une note est limitée à 10 000 caractères."])]),ht("D5","D5 — Auteur des retours importés","a",{intro:"Quand les retours de Steve apparaîtront dans le radar, chacun portera un auteur. Steve n’a pas de compte vérifié, et ce n’est pas lui qui lance l’import. Il faut décider qui est affiché comme auteur, sans usurper l’identité de Steve ni effacer celle de l’importateur (exigence E5, §6.2). Le contrat sentropic accepte un auteur externe sans compte (§6.1), dans le cadre fixé par D4. Effet visible : la ligne « auteur » de chaque retour dans le panneau du signal.",dependsOn:["D4"],recommendation:"(a) : attribue le contenu à son vrai auteur sans créer de compte ni usurper de session. (c) viendra le jour où Steve annotera lui-même dans l’UI."},[xe("a","(a) Auteur documentaire externe + importateur tracé",["Le contenu est attribué à son vrai auteur, Steve Chaperon.","L’importateur réel est tracé (recorded_by) : on sait qui a chargé quoi.","Aucun droit de modifier ou supprimer un retour importé."],["Un auteur sans compte apparaît dans les fils.","Steve ne peut pas répondre sous son nom tant qu’il n’a pas de compte."]),xe("b","(b) Importateur seul comme auteur",["Aucune identité externe à gérer.","Aucun libellé spécial à afficher dans les fils."],["Le fil attribue le texte de Steve à l’importateur : faux pour le lecteur.","Perd la valeur de la parole du client."]),xe("c","(c) Compte Steve",["Steve pourra répondre et annoter lui-même.","Ses réponses futures seront attribuées à un compte réel."],["Compte non vérifié aujourd’hui.","Ne doit jamais servir pour l’import : ce n’est pas lui qui importe."])]),ht("D6","D6 — Visibilité et données personnelles","c",{intro:"Le constat C-79 de Steve signale des noms de particuliers en clair dans des résumés de signaux (§5.6) ; les verbatims importés peuvent en contenir aussi. Règle actuelle des notes (migration 0011) : tout utilisateur approuvé lit tout. Il faut décider qui voit les retours et s’ils sont caviardés avant le premier affichage (U1), au regard de la Loi 25 (exigence E9). Le module comments de sentropic ne masque pas les données personnelles : c’est au radar de le faire (D4, D5).",dependsOn:["D4","D5"],recommendation:"(c) : toute l’équipe garde l’accès aux retours, et les noms de particuliers sont masqués, dans les retours comme dans les résumés de signaux."},[xe("a","(a) Tous les approuvés, sans caviardage",["Règle existante, aucun travail.","Toute l’équipe voit tout."],["Expose des noms de particuliers.","Ne répond pas à la demande C-79 de Steve."]),xe("b","(b) Administrateurs et Steve",["Exposition minimale.","Aucun caviardage à développer."],["L’équipe produit ne voit pas les retours : on perd l’intérêt de les afficher.","Gestion de droits spécifique à construire."]),xe("c","(c) Approuvés, verbatims caviardés",["Toute l’équipe voit les retours.","Noms de particuliers masqués dans les retours et dans les résumés de signaux : répond à C-79."],["Détection des données personnelles à écrire et tester (colonne pii_status).","Un caviardage peut masquer un nom utile (élu, promoteur) : règles à préciser."])]),ht("D7","D7 — Définition de C v1","K",{intro:"C est la nouvelle sélection de signaux proposée, alignée sur les trois critères de Steve : résidentiel, assouplissement, densification (§2.2, scène 1). Aujourd’hui, deux de ces trois critères n’ont aucune donnée au radar. Steve pose une réserve : un signal dont le sens n’est pas lisible doit rester affiché (« masquer ce qui n’a pas pu être lu transformerait une lacune en dossier manqué »). Il faut fixer la règle de C avant de la développer (lot C1) ; elle sera mesurée par l’oracle de ciblage (D10), sur la lecture de la double annotation retenue (D9). Les critères K1 à K9 sont détaillés au §9.2.",dependsOn:["D9","D10"],recommendation:"K1–K9 + trois états, après relecture de la table de dérivation par Steve : c’est la seule règle qui applique ses trois critères sans masquer ce qui n’a pas pu être lu. Aucun seuil de taille de projet ni filtre sur l’origine privée."},[xe("S","Triplet strict pour toute visibilité",["Flux court et lisible : seulement ce qui réunit les trois critères (22 sur 73).","Plus simple à calculer : un signal entre ou non."],["Masque les indéterminés : contredit la réserve explicite de Steve.","Perte de rappel sur les dossiers mal lus."]),xe("K","K1–K9 + trois états",["Respecte les trois critères et la réserve : on ne masque que ce qui est établi hors critères.","Trois états (confirmé, à instruire, exclu prouvé) et deux compteurs : un cas incertain n’est pas présenté comme une opportunité."],["Le flux garde du travail manuel (les « à instruire »).","Exige des extractions nouvelles (sens, effet sur les unités, portée) : lot C1 de taille L."]),xe("T","B inchangé, critères pour trier",["Aucun changement d’appartenance, aucun risque.","Aucune extraction nouvelle à développer."],["Le bruit connu (24 sur 73) persiste.","Ne répond pas à Steve : « ce n’est pas une question de hiérarchie »."])]),ht("D8","D8 — Cas contradictoires (Saint-Victor, Amos, CPTAQ, seconds projets, ODJ, S-RESTRICTIF)","a",{intro:"Certains cas ne se tranchent pas par une règle automatique : Saint-Victor (un resserrement qui favorise pourtant la densification), Amos (logement sur commerce), portée de l’exception CPTAQ, seconds projets, points d’ordre du jour, trois restrictions « À surveiller » (§9.2). Le tableur et l’analyse de Steve se contredisent parfois sur ces cas. Il faut décider qui les arbitre avant de geler l’oracle (D10) et la règle C (D7) ; sinon l’oracle sanctionnera le bon comportement.",dependsOn:["D7","D10"],recommendation:"(a) : la règle reste celle du client, et les cas ouverts ne faussent pas la mesure pendant qu’ils sont arbitrés."},[xe("a","Revue métier, abstention en attendant",["Steve et Mathieu tranchent sur exemples et preuves : la règle reste celle du client.","En attendant, abstention explicite : ces cas ne comptent ni pour ni contre."],["Demande du temps à Steve et Mathieu.","Quelques cas restent ouverts plus longtemps."]),xe("b","Arbitrage par l’équipe",["Plus rapide.","Ne mobilise ni Steve ni Mathieu."],["Risque de prêter à Steve une règle qu’il n’a pas posée.","L’oracle refléterait l’avis de l’équipe, pas celui du client."]),xe("c","Statu quo",["Aucun effort.","L’oracle peut être gelé tout de suite."],["Cas sans statut dans l’oracle : mesures faussées.","Désaccords invisibles."])]),ht("D12","D12 — Exposition A/B/C (point ouvert)","a",{intro:"Aujourd’hui l’écran montre la sélection B ; le sélecteur A/B a été retiré en août (§9.1). La demande initiale parle d’un « mécanisme A/B étendu en C », mais les règles de partage validées le 1er octobre (#787, item 4) demandent de ne pas réintroduire de choix entre plusieurs viviers. Les deux lectures sont défendables (§9.5) : Farid tranche. Concrètement : Steve verra-t-il un sélecteur A/B/C, ou une seule sélection qui change le jour où C est prouvée meilleure (D13) ? La règle C (D7) et sa mesure (D10, D11) doivent être connues.",dependsOn:["D7","D10","D11"],recommendation:"(a), avec des emprunts à (c) : interface simple pour Steve, conforme à #787, retour arrière immédiat. Si Farid veut un sélecteur visible, (b)."},[xe("a","(a) C en shadow, comparaison réservée UAT, puis remplacement de B",["Conforme à #787 : aucun choix de vivier pour les utilisateurs.","Interface simple, comme Steve le demande.","Retour arrière simple : désactiver C."],["Steve ne voit C qu’en UAT (mode réservé) avant la bascule.","La comparaison reste un outil interne."]),xe("b","(b) Sélecteur A/B/C visible + mode comparatif",["Littéralement « A/B étendu en C ».","L’utilisateur compare lui-même les sélections."],["Réintroduit un choix de viviers, contraire à #787 (item 4).","Plus complexe à expliquer et à maintenir (paramètre filter.targeting)."]),xe("c","(c) Incréments dans B",["Aligné avec #761 ; livrable par petits morceaux (sens, plein droit, second projet).","Chaque amélioration est visible pour Steve dès sa livraison."],["Pas de mesure d’ensemble B contre C.","Les filtres Résidentiel et Zonage restent."]),xe("d","(d) Application C séparée",["Liberté totale de simplification.","Aucun risque pour l’écran actuel de Steve."],["Duplique sélection, filtres et notes.","Deux applications à maintenir."])]),ht("D13","D13 — Seuil de bascule B → C (à fixer)","a",{intro:"Si C tourne en parallèle de B (D12), il faut écrire à l’avance quand C remplace B ; sans seuil écrit, la bascule se décidera à l’impression. La mesure viendra de l’oracle de ciblage (D10), sur le jeu test des 52 villes, dans le volet ciblage du b id\\":\\"UATC__APIC__6a1ce53bd7e5\\",\\"source\\":\\"UATC\\",\\"target\\":\\"APIC\\",\\"label\\":\\"B et C côte à côte\\",\\"evidence\\":\\"declared\\"},{\\"id\\":\\"APIB__GRA__a3c7f8cabebc\\",\\"source\\":\\"APIB\\",\\"target\\":\\"GRA\\",\\"label\\":\\"lit\\",\\"evidence\\":\\"observed\\"},{\\"id\\":\\"APIC__GRA__892af3e92c2a\\",\\"source\\":\\"APIC\\",\\"target\\":\\"GRA\\",\\"label\\":\\"même snapshot\\",\\"evidence\\":\\"declared\\"},{\\"id\\":\\"GRA__PA__014e8d5f585a\\",\\"source\\":\\"GRA\\",\\"target\\":\\"PA\\",\\"label\\":\\"snapshot figé\\",\\"evidence\\":\\"historical\\"},{\\"id\\":\\"PA__DIFF__547d9c404c96\\",\\"source\\":\\"PA\\",\\"target\\":\\"DIFF\\",\\"label\\":\\"référence\\",\\"evidence\\":\\"historical\\"},{\\"id\\":\\"APIB__DIFF__84ae3c0328f2\\",\\"source\\":\\"APIB\\",\\"target\\":\\"DIFF\\",\\"label\\":\\"sélection B\\",\\"evidence\\":\\"declared\\"},{\\"id\\":\\"APIC__DIFF__906f300fa4dc\\",\\"source\\":\\"APIC\\",\\"target\\":\\"DIFF\\",\\"label\\":\\"sélection C\\",\\"evidence\\":\\"declared\\"},{\\"id\\":\\"ANN__ORA__2a881a65086d\\",\\"source\\":\\"ANN\\",\\"target\\":\\"ORA\\",\\"label\\":\\"labels étayés\\",\\"evidence\\":\\"declared\\"},{\\"id\\":\\"ORA__ORR__3d1488e9d177\\",\\"source\\":\\"ORA\\",\\"target\\":\\"ORR\\",\\"label\\":\\"version gelée\\",\\"evidence\\":\\"declared\\"},{\\"id\\":\\"DIFF__MES__d4d21cac0efd\\",\\"source\\":\\"DIFF\\",\\"target\\":\\"MES\\",\\"label\\":\\"écarts nommés\\",\\"evidence\\":\\"declared\\"},{\\"id\\":\\"ORA__MES__a8aa71d2e051\\",\\"source\\":\\"ORA\\",\\"target\\":\\"MES\\",\\"label\\":\\"noté sur\\",\\"evidence\\":\\"declared\\"},{\\"id\\":\\"MES__GATE__2dcd0e51363c\\",\\"source\\":\\"MES\\",\\"target\\":\\"GATE\\",\\"label\\":\\"au seuil D13\\",\\"evidence\\":\\"declared\\"},{\\"id\\":\\"GATE__DEC__3fb7d1e9ffeb\\",\\"source\\":\\"GATE\\",\\"target\\":\\"DEC\\",\\"label\\":\\"proposition\\",\\"evidence\\":\\"declared\\"},{\\"id\\":\\"DEC__MAPC__b0263b35bbe9\\",\\"source\\":\\"DEC\\",\\"target\\":\\"MAPC\\",\\"label\\":\\"bascule B → C\\",\\"evidence\\":\\"declared\\"}]}","sceneHash":"19305d932bcac4c039572515c78dbefa59e31393e5d01c69bb8ee26c48615f70"}]'),fO={id:"entete",heading:"Analyse des retours d'usage du 21 septembre 2026 : capitalisation des données annotées, vers de nouveaux critères de ciblage",markdown:"- **Date** : 2026-10-03. Analyse de Steve Chaperon datée du 21 septembre 2026 (date du mail de transmission).\n- **Type** : dossier de décision.\n- **Nature** : dossier consolidé, issu de deux dossiers rédigés indépendamment (auteur A et auteur B), réconciliés point par point. Chaque divergence a été tranchée en revenant aux sources, ou laissée à l'owner (voir annexe A).\n- **Destinataire** : Farid (Product Owner), qui décide le produit, le backlog et les priorités. **Validation technique** : Fabien (AI Builder) pour l'architecture, l'IA, l'oracle et le modèle de données. Consultés : Steve (client, utilisateur principal) et Mathieu (Product Manager).\n- **Statut** : **PROPOSITION**. Aucune décision n'est prise. Aucun code, aucune migration, aucun import, aucune action prod ou cluster.\n- **Cartes** : #783 (nouvel oracle), #784 (données de Steve en annotations), #760 (tri et classement), #761 (filtres), #697 et #782 (benchmark), #703 (rafraîchissement), #786, #787 et #788 (dates et URL), #725 (oracle v3).\n- **Sources** :\n  - `radar-triage-signaux.xlsx`, sha256 `c7e19f46feb78c245fcd04b3e64fd4ac6f174f2d30ff1d4c77aa5a2bf0dc1bb8` ;\n  - `Analyse Radar 21 sept.docx`, sha256 `2dbc1d6f87a92ca128815575eb8e6830d5b552cd15b7c2b1e52a93d05ae067ff` ;\n  - radar-immobilier `origin/main` `27891b10` ; branches `origin/feat/t1-model-benchmark-real` (oracle v3) et `origin/lane/conductor` (dossier COLLAB du 2026-08-16, absent de `main`) ;\n  - sentropic `origin/main` `7d1002505`.\n- **Méthode** : lectures Node uniquement (JSZip, fast-xml-parser, exceljs, mammoth), sans Python ; recomptages reproductibles sur les lignes du classeur ; lectures de code par `git show origin/main:<fichier>`.\n\nConventions : **FAIT** = constaté dans une source citée · **CALCUL** = dérivé des données, méthode donnée · **JUGEMENT** = appréciation · `non vérifié`, `source manquante`, `N-A` = limites déclarées.\n\n---"},pO=JSON.parse("[{\"id\":\"section-1\",\"heading\":\"1. Intention du dossier, objectifs de l'owner\",\"markdown\":\"Reformulation de la demande de l'owner, avant toute modélisation. Chaque objectif renvoie à l'endroit du dossier qui y répond.\\n\\n| # | Objectif de l'owner | Où le dossier y répond | Décisions |\\n|---|---|---|---|\\n| O1 | Stocker **tous** les retours de Steve en base (données du tableur), chacun **attaché à l'élément associé** (ville, zone, signal, lot…), selon l'annotation prévue (#784, contrat d'ancre). | §6.3 (schéma : sources, lignes brutes, évaluations, ancres 1 à N), §6.4 (ancres par type d'objet), §6.5 (import idempotent, aucune ligne rejetée) ; scène `modele-donnees` | D1, D2, D3 |\\n| O2 | **Finaliser la modélisation** et proposer une **première mise en œuvre**, en base et en UI, qui respecte le **contrat sentropic d'annotation et de canevas**. | §6.1 (contrat sentropic lu dans le code), §6.3 (projection `Comment` conforme), §7 (lots B0, L1, L2, U1, O1, C1, C2) ; scènes `modele-donnees` et `flux-import-oracle` | D2, D4, D5, D6, D14, D15 |\\n| O3 | Faire un **focus sur l'état de la migration** vers l'UI de base (composants geo et design system). | §8 (mesures sur `origin/main`, ce qui conditionne l'UI des annotations) ; scène `architecture-ui` | D14 |\\n| O4 | Prendre en compte l'**analyse de Steve**, qui réoriente le ciblage : remettre en place un **oracle** qui détecte ses besoins et s'y aligne ; prévoir peut-être une **double annotation** (ancienne / nouvelle) et un **mécanisme d'affichage A/B étendu en C** (on était déjà sur B). | §2 (ce que veut Steve, écart avec l'existant), §9.2 (critères C), §9.3 (oracle #783), §6.6 (double annotation), §9.5 (A/B/C) ; scènes `criteres-steve` et `affichage-abc` | D7, D8, D9, D10, D11, D12, D13, D16 |\\n\\nLes objectifs O1 à O4 n'emploient aucun terme technique ; les termes repris ensuite sont expliqués au §1.2.\\n\\nContraintes de forme : 0 Python (Node/TS uniquement) ; aucune action prod ou cluster ; aucun chiffre inventé (`non vérifié`, `source manquante`, `N-A` quand la source manque).\\n\\n### 1.1 Destinataires et rôles\\n\\nCe dossier s'adresse à **Farid**. Il est rédigé pour le produit ; la partie technique y figure pour validation par **Fabien**.\\n\\n| Personne | Rôle | Ce qu'on attend de lui dans ce dossier |\\n|---|---|---|\\n| Steve Chaperon | Client (financeur) et utilisateur principal | Ses retours sont la matière du dossier ; il est consulté sur ses critères et les cas ambigus (D7, D8). |\\n| Mathieu Portier | Product Manager : oriente | Consulté sur les orientations produit (priorités, exposition de la nouvelle sélection, retour à Steve). |\\n| Farid | Product Owner / proxy : définit et valide le backlog | **Décide** le produit, le backlog et les priorités : 10 décisions (D1, D5, D6, D7, D8, D12, D13, D14, D15, D16). |\\n| Fabien | AI Builder : propriétaire du code, garant de la livraison | **Valide** l'architecture, les algorithmes d'IA, les modèles, l'oracle et la modélisation technique : 6 décisions (D2, D3, D4, D9, D10, D11). |\\n\\nChaque décision porte la mention « Décide : … · Consulté : … » (§3 et §10).\\n\\n### 1.2 Termes utilisés\\n\\n| Terme | Sens dans ce dossier |\\n|---|---|\\n| Signal | Un événement réglementaire détecté par le radar dans un document municipal (avis de motion, projet de règlement, résolution…), affiché sur la carte. |\\n| Vue de travail, passe 1 | Ce que Steve voit avec ses cinq filtres cochés et une période de six mois : 73 signaux. Les passes 2 et 3 retirent des filtres pour voir ce qui était masqué. |\\n| Vues A, B et C | Trois manières de choisir les signaux affichés. A : l'ancienne sélection, retirée de l'écran depuis août. B (ou B′, « B prime », sa version actuelle) : la sélection affichée aujourd'hui (zonage, résidentiel, étape précoce, sans les exclusions). C : la **proposition** de ce dossier, alignée sur les critères de Steve ; elle n'existe pas encore. |\\n| Filtre, exclusion | Case à cocher qui retire des signaux de la vue ; une exclusion retire une famille entière (par exemple les PIIA ou les dérogations). |\\n| PIIA | Plan d'implantation et d'intégration architecturale : règlement sur l'apparence des bâtiments, sans effet sur le nombre de logements. |\\n| PPCMOI | Projet particulier de construction, de modification ou d'occupation d'un immeuble : autorisation accordée à un projet précis, sur un terrain précis. |\\n| Dérogation (mineure) | Écart autorisé à une norme, pour un seul terrain. |\\n| CPTAQ | Commission de protection du territoire agricole du Québec ; le « dézonage » retire un secteur de la zone agricole. |\\n| ODJ | Ordre du jour d'une séance du conseil : un point inscrit n'est pas une décision. |\\n| Annotation | Note ou verdict attaché à un objet du radar (ville, zone, lot, signal, règlement). |\\n| Oracle | Jeu de réponses de référence, vérifiées, qui sert à noter automatiquement le radar ou un modèle (combien de bonnes réponses, combien d'erreurs). L'oracle actuel (674 ou 676 unités) note l'extraction des actes dans les procès-verbaux, pas le choix des signaux à montrer. |\\n| Benchmark | Campagne de mesure qui compare plusieurs modèles ou réglages sur le même oracle. |\\n| Précision, rappel, bruit | Précision : part des signaux affichés qui sont utiles. Rappel : part des signaux utiles qui sont affichés. Bruit : part des signaux affichés qui sont inutiles. |\\n| Design system (DS), composants geo | Bibliothèque commune de composants d'interface (boutons, badges, cartes) et de cartographie, partagée par les applications sentropic. |\\n| sentropic, contrat d'annotation | Plateforme commune ; son module de commentaires définit comment une annotation désigne sa cible. |\\n| `non vérifié`, `source manquante`, `N-A` | Ce que le dossier n'a pas pu établir, faute d'accès ou de source. |\\n\\n---\"},{\"id\":\"section-2\",\"heading\":\"2. Ce que veut Steve\",\"markdown\":\"Sources : `Analyse Radar 21 sept.docx` (citations entre guillemets, avec la section de l'analyse) et `radar-triage-signaux.xlsx` (recomptes sur la feuille Triage ; passe 1 = la vue de travail de Steve, cinq filtres cochés, 73 signaux).\\n\\n### 2.1 Le principe : appartenance, pas classement\\n\\n> « Un signal m'intéresse quand les trois conditions suivantes sont réunies. Pas deux sur trois - les trois. » (analyse, §1)\\n\\n> « Tout ce qui ne réunit pas ces trois conditions est du bruit pour moi, et je ne devrais pas le recevoir. Ce n'est pas une question de hiérarchie entre les signaux : c'est une question d'appartenance ou non au périmètre. » (analyse, §1)\\n\\n### 2.2 Les trois critères de ciblage\\n\\n**Critère 1 — Résidentiel.**\\n> « Le règlement touche l'habitation. Pas le commercial, pas l'industriel, pas l'institutionnel, pas l'agricole (sauf en cas de dézonage par la CPTAQ), pas le récréatif. » (analyse, §1)\\n\\nIl inclut, en amont, que l'acte soit un règlement d'urbanisme : « Reconnaître qu'un règlement n'est pas un règlement d'urbanisme. Matières résiduelles, gestion contractuelle, règlement d'emprunt, programme de subvention - ces règlements existent dans toutes les municipalités du Québec et reviendront partout. » (analyse, §5) Règles associées : R-18 (exception CPTAQ résidentielle).\\n\\n| Mesure (CALCUL, tableur) | Passe 1 | 124 lignes |\\n|---|---:|---:|\\n| Non pertinent, motif N-NON-RES (zonage non résidentiel) | 1 | 6 |\\n| Non pertinent, motif N-FAUX-POSITIF (pas un règlement d'urbanisme) | 2 | 4 |\\n| Familles de l'analyse : « pas des règlements d'urbanisme » | 4 sur 24 | — |\\n\\n« Ils occupaient à eux seuls toute la vue principale de leur municipalité. » (analyse, §3, à propos de Saint-Louis-de-Gonzague, Saint-Roch-de-Richelieu, Delson, Pointe-Claire.)\\n\\n**Critère 2 — Assouplissement des règles.**\\n> « La modification ouvre, elle ne resserre pas. Un règlement qui réduit une hauteur, restreint un usage ou impose une nouvelle contrainte ne m'intéresse pas. » (analyse, §1)\\n\\n> « Déterminer le sens de la modification. Le verbe du titre suffit le plus souvent : afin de permettre, afin d'autoriser, afin d'agrandir d'un côté ; afin d'interdire, afin de limiter, afin de préserver de l'autre. » (analyse, §5)\\n\\nAvec une réserve explicite : « Quand le sens d'une modification n'est pas déterminable, le signal doit rester affiché. Masquer par défaut ce qui n'a pas pu être lu transformerait une lacune en dossier manqué, et c'est le risque que je ne peux pas prendre. Même chose pour un règlement qui resserre d'un côté et ouvre de l'autre : il y en a cinq dans mon relevé, et aucun ne doit disparaître. » (analyse, §5)\\n\\n| Sens de la modification (CALCUL) | Passe 1 | 124 lignes | dont Pertinent / À surveiller / Non pertinent (124) |\\n|---|---:|---:|---|\\n| Assouplissement | 35 | 55 | 27 / 5 / 23 |\\n| Indéterminé | 21 | 38 | 7 / 21 / 10 |\\n| Restriction | 6 | 10 | 0 / 3 / 7 |\\n| Mixte | 5 | 7 | 5 / 0 / 2 |\\n| Neutre | 6 | 14 | 1 / 0 / 13 |\\n| Motif N-RESTRICTIF (resserrement) | 4 | 7 | Non pertinent |\\n\\n<!-- chart:sens-classement -->\\n\\n**Critère 3 — Densification.**\\n> « Le résultat est plus d'unités que le règlement en permettait avant. C'est le critère qui tranche : un assouplissement résidentiel qui ne change pas le nombre d'unités possibles ne m'apporte rien. » (analyse, §1)\\n\\n> « Reconnaître qu'un règlement d'urbanisme ne touche pas la capacité de construire. Clôtures, cabanons, enseignes, structures de jardin : ce sont des règlements de zonage, mais ils ne changent aucun nombre d'unités. » (analyse, §5)\\n\\n| Mesure (CALCUL) | Passe 1 | 124 lignes |\\n|---|---:|---:|\\n| Pertinent, motifs P-DENSITE + P-USAGE-MULTI (hausse de densité, multilogement) | 13 | 16 |\\n| Non pertinent sans effet sur la capacité : N-ADMIN, N-FORME, N-UNIFAM, N-ACCESSOIRE | 6 | 13 |\\n| Familles de l'analyse : « urbanisme sans effet sur la capacité » | 4 sur 24 | — |\\n| Passe 1 où le critère n'est pas qualifiable (analyse : « sens non donné » 12 + « portée ou ampleur non identifiables » 15) | 27 | — |\\n\\n**Deux règles d'exclusion transversales**, posées par Steve à côté des trois critères :\\n- « Distinguer une décision d'un point d'ordre du jour. Un point inscrit à l'ordre du jour n'est pas une décision du conseil. » (analyse, §5) — N-ODJ-SEUL : 3 en passe 1, 4 au total.\\n- « Distinguer une règle générale d'une autorisation individuelle. Un PPCMOI ou une dérogation accordés à un demandeur pour un immeuble précis ne créent de droit pour personne d'autre. » (analyse, §5) — V2-PRECEDENT : 8 en passe 1, 21 au total, tous Non pertinent (« hors de mon périmètre actuel », analyse, §3).\\n\\nBilan de la passe 1 (CALCUL, recompté par motif) : les 24 Non pertinent se répartissent en **3** hors résidentiel ou hors urbanisme, **4** resserrements, **6** sans effet sur la capacité, **11** hors portée (8 autorisations individuelles, 3 points d'ordre du jour). 22 signaux réunissent les trois critères ; 27 ne sont pas qualifiables avec l'information servie.\\n\\n<!-- chart:bruit-familles -->\\n\\n### 2.3 Écart avec l'existant, critère par critère\\n\\nExistant lu sur `origin/main` `27891b10` : vue A retirée de l'UI depuis `f2c20573` (comptes encore calculés côté serveur) ; vue B′ = `!exclusion && zonage && residentielEligible && precoce` ; classification `vivier_v2` par axes zonage / résidentiel / étape, avec un champ d'effet (`densifie`, `reduit`, `stable`, `inconnu`) ; exclusions d'affichage PIIA et dérogation ; oracle v3 (674 unités committées, 676 en copie locale) qui note l'extraction d'actes.\\n\\n| Critère de Steve | Ce que fait le radar aujourd'hui | Couverture | Effet mesuré sur la vue de travail (passe 1) |\\n|---|---|---|---|\\n| 1. Résidentiel (et règlement d'urbanisme) | Filtre Résidentiel : `res=oui`, ou `res=indetermine` ∧ instrument ∈ {rezonage, refonte} ; `res` par marqueurs regex ; filtre Zonage par catégorie et étape. Aucune reconnaissance de la nature de l'acte : un règlement de matières résiduelles typé `rezonage` passe. | **Partiel** | 3 signaux hors résidentiel ou hors urbanisme affichés (codes) ; 4 selon l'analyse. Commentaire #761 : « résidentiel et zonage ne sont pas utiles pour Steve ». |\\n| 2. Assouplissement | Aucun champ « sens » dans `vivier_v2` ni dans B′ ; aucun filtre. | **Absent** | 6 restrictions affichées, dont 4 Non pertinent (N-RESTRICTIF) ; 21 indéterminés que le radar ne qualifie pas. |\\n| 3. Densification | Champ d'effet présent mais toujours `inconnu` ; `nb_unites_max` partiel ; le contrat B′ précise que l'appartenance au vivier « ne prouve pas une hausse de densité ». | **Absent** | 6 signaux sans effet sur la capacité affichés ; 27 non qualifiables (sens ou ampleur non donnés). |\\n| Exclusion « autorisation individuelle » | Exclusions PIIA (sans preuve résidentielle) et dérogation ; PPCMOI, usage conditionnel, Loi 31 et CPTAQ individuelle ne sont pas exclus. | **Partiel** | 8 autorisations individuelles affichées (V2-PRECEDENT). |\\n| Exclusion « point d'ordre du jour » | Aucune distinction ODJ / décision dans les propriétés lues. | **Absent** | 3 points d'ordre du jour affichés (Mont-Tremblant). |\\n| Ne rien masquer d'illisible (réserve) | B′ garde le résidentiel indéterminé pour certains instruments ; pas de notion de sens ni de mixte. | **Partiel** | 34 des 40 Pertinent sont dans la vue de travail (85 %) ; 6 n'apparaissent qu'en passe 2 ou 3 ; 7 dossiers manqués alors que « l'information existait dans la base du radar » (analyse, §4). |\\n| Mesure de tout cela | L'oracle 674/676 note l'extraction (étape + citation) sur 100 PV ; aucun oracle ne note le ciblage ni le post-filtrage. | **Absent** | Bruit de la vue de travail : 24/73 = **32,9 %** ; précision « trois critères » : 22/73 = **30,1 %** ; précision P ∪ S : 49/73 = 67,1 %. |\\n\\n**Lecture (JUGEMENT).** Le radar actuel filtre par **nature d'instrument et étape** ; Steve demande un filtre par **effet du règlement** (sens et nombre d'unités). Deux des trois critères n'ont aujourd'hui aucune donnée, ce qui explique que C demande une extraction nouvelle (§9.2) et un oracle de ciblage distinct (§9.3). Scène `criteres-steve` : les critères de Steve en regard de l'existant.\\n\\n---\"},{\"id\":\"section-3\",\"heading\":\"3. Synthèse et décisions demandées\",\"markdown\":\"**Recommandation globale (JUGEMENT).** Conserver intégralement les sources de Steve, les rattacher aux objets métier par des ancres durables, afficher son verdict en lecture seule dans les panneaux existants, construire un oracle de ciblage distinct de l'oracle d'extraction, puis développer une vue C mesurée contre B. B reste le défaut jusqu'à une bascule fondée sur la mesure. Tout cela reste subordonné à la priorité n° 1 de Steve : le rafraîchissement (#703, #786, #788).\\n\\n| Sujet | Constat déterminant | Recommandation |\\n|---|---|---|\\n| Ce que Steve a livré | **FAIT.** 7 feuilles : 124 lignes de triage (51 villes sur 103), 121 contrôles d'exclusion, 77 constats, 26 règles, 28 codes de motif ; une analyse qui pose trois critères cumulatifs. | Tout importer, sans supposer « une ligne = un signal ». |\\n| Qualité de la vue de travail | **CALCUL.** Passe 1 (73 lignes) : 34 Pertinent, 15 À surveiller, 24 Non pertinent. L'analyse en retient 22 qui réunissent les trois critères. | Le défaut principal est le bruit (24/73 = 32,9 %) ; le rappel est secondaire. |\\n| Annotation de signal existante | **FAIT.** L'UI envoie l'identifiant texte du graphe ; l'API exige un UUID (`prospect-marks.ts:107`). | Correctif B0 avant tout import. |\\n| Contrat sentropic | **FAIT.** Les cibles `record` conviennent sans changement du paquet ; `delete` est une suppression physique dans la 0.2.0 publiée, alors que l'owner a ratifié tombstone et rétention (O1). | Lecture conforme, import immuable, aucun chemin de suppression par le paquet tant qu'il n'a pas de tombstone. |\\n| UI | **FAIT.** 39 composants Svelte sur 69 importent le DS ; les 3 composants d'annotation n'en importent aucun ; la carte Signaux reste MapLibre local. | Afficher dans le panneau et le rail avec le DS, sans attendre la migration geo. |\\n| Ciblage C | **FAIT.** Aucun champ « sens » ; `effet_densifiant` toujours `inconnu` ; ni « de plein droit », ni « ODJ / décision ». | C demande une extraction nouvelle, mesurée sur un oracle de Steve. |\\n| Oracle | **FAIT.** L'oracle v3 (674 unités committées, 676 en copie locale) mesure l'extraction d'actes, pas le ciblage. | Deux oracles distincts : extraction (E) et ciblage (C). |\\n\\n### Décisions demandées (D1 à D16)\\n\\n**Ordre de décision.** Fabien décide d'abord ses six décisions techniques (D2, D3, D4, D9, D10, D11 : architecture, données, IA, oracle) ; elles sont prises telles quelles, sauf incohérence avec une autre décision. Farid décide ensuite ses dix décisions produit (D1, D5, D6, D7, D8, D12, D13, D14, D15, D16 : backlog, affichage, priorités), en connaissant les choix de Fabien. Si un choix de Farid contredit un choix de Fabien, on revient à Fabien sur ce seul point. Steve et Mathieu sont consultés là où leur avis porte. Les dépendances entre décisions sont indiquées au §10 (« Dépend de », « Conditionne »).\\n\\n| Étape | # | Décision | Décide · Consulté | Option recommandée | Alternatives |\\n|---|---|---|---|---|---|\\n| 1 · Fabien | D2 | Modèle de données | **Fabien** · Farid | **M3** couches : source → lignes brutes → évaluations → ancres → publication | M1 étendre `prospect_notes` ; M2 table de contrôle seule ; M4 attendre le paquet |\\n| 1 · Fabien | D3 | Ancre signal et correctif | **Fabien** · Farid | **(a)** clé texte namespacée sans clé étrangère + instantané observé ; B0 immédiat | (b) attendre une clé métier stable ; (c) passer par l'UUID `signals` |\\n| 1 · Fabien | D4 | Conformité sentropic et suppression | **Fabien** · Farid | **(a)** cibles, lecture et événements conformes ; import immuable ; réponses dans `prospect_notes` v1 ; demande de tombstone à sentropic | (b) adaptateur `CommentStore` à tombstone hôte ; (c) attendre le port complet |\\n| 1 · Fabien | D9 | Sens de « double annotation » | **Fabien** · Farid | **Point ouvert** — lecture proposée : verdict Steve source + ancienne classification radar + adjudication C + prédiction C | ancienne / nouvelle grille de Steve ; oracle 676 / oracle Steve |\\n| 1 · Fabien | D10 | Oracle #783 | **Fabien** · Steve, Farid | **Double oracle E / C** ; unité signal regroupée par dossier ; développement 51 villes, test 52 villes, partition par dossier | remplacer v3 par le tableur ; campagne C entièrement nouvelle |\\n| 1 · Fabien | D11 | Benchmark #782 | **Fabien** · Farid | **Volet ciblage séparé** ; enrichir le contrat d'extraction = nouvelle version, décision dédiée | fusion des métriques ; statu quo |\\n| 2 · Farid | D1 | Périmètre de conservation | **Farid** · Steve, Mathieu | **(b)** tout le classeur et l'analyse, brut immuable | (a) Triage seul ; (c) notes libres seules |\\n| 2 · Farid | D5 | Auteur des retours importés | **Farid** · Steve, Fabien | **(a)** auteur documentaire externe + importateur réel tracé, sans droit de mutation | (b) importateur seul comme auteur ; (c) compte Steve |\\n| 2 · Farid | D6 | Visibilité et données personnelles | **Farid** · Steve, Mathieu, Fabien | **(c)** utilisateurs approuvés, verbatims caviardés | (a) tous les approuvés sans caviardage ; (b) administrateurs et Steve |\\n| 2 · Farid | D7 | Définition de C v1 | **Farid** · Steve, Mathieu, Fabien | **K1–K9 + trois états** : confirmé, à instruire, exclu prouvé | triplet strict ; tri seulement |\\n| 2 · Farid | D8 | Cas contradictoires | **Farid** · Steve, Mathieu | **Revue métier** par Steve et Mathieu ; abstention explicite en attendant | arbitrage par l'équipe ; statu quo |\\n| 2 · Farid | D12 | Exposition A/B/C | **Farid** · Steve, Mathieu, Fabien | **Point ouvert** — recommandation consolidée : C en shadow + mode comparatif réservé à l'UAT ; B défaut | sélecteur A/B/C visible ; incréments dans B ; application C séparée |\\n| 2 · Farid | D13 | Seuil de bascule B → C | **Farid** · Steve, Mathieu, Fabien | **À fixer par Farid** — proposition : aucun Pertinent masqué sur le jeu test, précision P ∪ S > B, parité des ensembles | seuil chiffré différent ; bascule sur recette seule |\\n| 2 · Farid | D14 | Première livraison UI | **Farid** · Mathieu, Fabien | **(a)** panneau + rail + DS ciblé ; pastilles carte plus tard | (b) pastilles sur la carte actuelle dès L3 ; (c) migration geo d'abord ; (d) tableau séparé seul |\\n| 2 · Farid | D15 | Séquencement | **Farid** · Mathieu, Fabien | **(a)** B0, import et oracle en parallèle de la fraîcheur ; C1 après stabilisation du rafraîchissement | (b) tout après #703 |\\n| 2 · Farid | D16 | Retour à Steve | **Farid** · Mathieu | **Oui** : renvoyer la définition réelle des filtres et la table de dérivation, par Mathieu et Farid | ne rien renvoyer avant C |\\n\\nLes options, leurs meilleurs arguments contraires et les conditions qui feraient changer la recommandation figurent au §10.\\n\\n---\"},{\"id\":\"section-4\",\"heading\":\"4. Contexte\",\"markdown\":\"- **FAIT.** Steve Chaperon (Chaperon Immobilier) a préparé le 21 septembre 2026 un relevé sur la période du 15 au 21 septembre. La transmission par Mathieu Portier, puis Farid le 27 septembre, provient du mandat de l'owner ; le courriel original est `source manquante`.\\n- **FAIT.** Le relevé repose sur ce qu'affiche l'interface et sur les outils MCP en lecture (`search_signals`, `query_zoning_events`). Steve écrit qu'il n'a pas eu accès au code et que la majorité des procès-verbaux n'ont pas été contre-vérifiés à la source.\\n- **FAIT.** Protocole en trois passes (règle R-26), période réglée sur 6 mois :\\n  1. passe 1 : les cinq filtres cochés (vue de travail) ;\\n  2. passe 2 : sans le filtre Précoce ;\\n  3. passe 3 : aucun filtre, pour repérer faux négatifs et faux positifs.\\n- **FAIT.** Les colonnes « Classement » (valeur pour Steve) et « Filtrage » (le filtre avait-il raison ?) sont indépendantes.\\n- **FAIT.** Priorités de Steve, dans l'ordre : rafraîchir les signaux ; enlever le bruit ; une interface plus simple pour archiver, classer, lier et épingler.\\n- **FAIT.** #783 et #784 n'ont ni corps ni commentaire : leur titre est tout le cadrage. #760 et #761 attendaient « le document d'analyse de Steve » ; il est disponible, sans que leurs autres critères soient clos pour autant.\\n- **FAIT.** Commentaire de `fbellame` sur #761 : « résidentiel et zonage ne sont pas utiles pour Steve. Précoce ne sera plus nécessaire lorsque la mise à jour des signaux sera quotidienne. »\\n\\n### 4.1 Précédents à respecter\\n\\n| Date | Source | Ce qui s'impose ici |\\n|---|---|---|\\n| 2026-06-11 | `SPEC_CONTROLE_PARITE_VILLES_STEVE.md` (main) | Un corpus de Steve va dans une table de contrôle séparée du store opérationnel : la parité « mesure le pipeline, elle ne le nourrit jamais ». Implémentation sur `main` : non trouvée. |\\n| 2026-08-12 | `SPEC_RAW_STEVE_MEETING_2026-08-12.md` (main) | Cibles annotables ville, signal, zone, lot, règlement. Réutiliser le modèle de commentaires sentropic, « pas de système parallèle ». |\\n| 2026-08-16 | `DOSSIER_DECISION_COLLAB_2026-08-16.md` (`origin/lane/conductor`, absent de `main`) | Décisions owner ratifiées : cible = objet métier ; suppression = tombstone + rétention (O1). « Le paquet porte l'intégrité » : un tombstone porté seulement par un adaptateur Radar est un piège. Tout chemin de suppression attend une version du paquet avec tombstone. Statut actuel du fichier hors `main` : `non vérifié`. |\\n| v1 | `SPEC_CONTRAT_ANCRE_ANNOTATIONS_v1.md` + migration 0011 (main) | Cibles `lot` et `signal` ; `signal_id` UUID `ON DELETE SET NULL` ; lecture par les approuvés, mutation par l'auteur ; suppression logique ; `tenant_id` inerte. Le §3.1 admet l'absence d'identité de signal stable à la ré-ingestion. |\\n| 2026-10-01 | #787, règles de partage validées par l'owner | Une URL avec un paramètre `filter.*` décrit tout l'état. Item 4 du comportement attendu : « sans réintroduire de choix entre plusieurs viviers ». |\\n\\n### 4.2 Ce qui manque et ne doit pas être masqué\\n\\n- Maquette de l'interface simplifiée annoncée par Steve et Mathieu : non fournie.\\n- Taux de résolution des identifiants de Steve contre le graphe actuel : `non vérifié` (aucune requête prod ou préprod).\\n- SHA déployé du 15 au 21 septembre : `non vérifié` (`30-api.yaml` utilise `:latest`).\\n- Classification serveur exacte au moment du relevé : non archivée (`source manquante`).\\n\\n---\"},{\"id\":\"section-5\",\"heading\":\"5. Retours de Steve, chiffrés\",\"markdown\":\"### 5.1 Inventaire du classeur\\n\\n**FAIT.** 7 feuilles visibles, 433 lignes ayant au moins une valeur, 4 392 cellules non vides, 47 cellules de formule, aucun hyperlien Excel.\\n\\n| Feuille | Contenu mesuré | Usage à l'import |\\n|---|---|---|\\n| Triage | 124 lignes (Excel 6–129), 20 colonnes A:T toutes renseignées, 51 municipalités | Évaluations individuelles ou groupées |\\n| Écartés par les filtres | 121 lignes (5–125), 8 colonnes, 46 municipalités ; certaines lignes regroupent plusieurs enregistrements | Évaluations d'exclusion, dont lignes agrégées |\\n| Constats transversaux | 77 constats C-01…C-82 (numéros absents : 40, 50, 62, 70, 71), 7 colonnes | Constats rattachés aux villes ou à un artefact |\\n| Règles de classement | 26 règles R-01…R-26 | Référentiel daté et sourcé |\\n| Codes de motif | 28 codes (8 P-, 8 S-, 11 N-, 1 V2-) | Dictionnaire ; 24 codes employés |\\n| Synthèse | 45 formules, **toutes avec une valeur mémorisée** | Conserver formule et valeur ; recalculer à part |\\n| Villes à couvrir | 51 traitées sur 103, 124 triés sur 146 captés ; pas de liste nominative des 52 restantes | Comptes déclarés |\\n\\n« 124 signaux » est le libellé de Steve ; « 124 lignes » est la mesure reproductible. La ligne #112 traite deux signaux, la #7 nomme deux événements, la #55 décrit un dossier absent du radar.\\n\\n### 5.2 Classement par passe (CALCUL, feuille Triage)\\n\\n| Passe | Pertinent | À surveiller | Non pertinent | Total |\\n|---|---:|---:|---:|---:|\\n| 1 — 5 filtres | 34 | 15 | 24 | **73** |\\n| 2 — sans Précoce | 4 | 11 | 18 | 33 |\\n| 3 — reste | 2 | 3 | 12 | 17 |\\n| Hors radar | 0 | 0 | 1 | 1 |\\n| **Total** | **40** | **29** | **55** | **124** |\\n\\n<!-- chart:classement-passes -->\\n\\nCe sont des distributions d'annotations, pas une précision ni un rappel du système. 34 des 40 Pertinent sont en passe 1, 38 en passe 1 ou 2.\\n\\n### 5.3 Sens de la modification × classement (CALCUL)\\n\\n| Sens | Pertinent | À surveiller | Non pertinent | Total | dont passe 1 |\\n|---|---:|---:|---:|---:|---:|\\n| Assouplissement | 27 | 5 | 23 | 55 | 35 |\\n| Indéterminé | 7 | 21 | 10 | 38 | 21 |\\n| Neutre | 1 | 0 | 13 | 14 | 6 |\\n| Restriction | 0 | 3 | 7 | 10 | 6 |\\n| Mixte | 5 | 0 | 2 | 7 | 5 |\\n\\nLecture (JUGEMENT) : 23 assouplissements sont Non pertinent, surtout des autorisations au cas par cas (V2-PRECEDENT). Le sens seul ne suffit pas : il faut aussi « de plein droit » (R-06). Trois restrictions sont À surveiller (S-RESTRICTIF), ce qui tempère R-21.\\n\\n### 5.4 Motifs, exclusions et constats\\n\\n| Motif le plus employé | Lignes | Motif | Lignes |\\n|---|---:|---|---:|\\n| V2-PRECEDENT | 21 | N-RESTRICTIF | 7 |\\n| P-VILLE-TERRITOIRE | 13 | N-NON-RES | 6 |\\n| S-PORTEE-FLOUE | 10 | N-ACCESSOIRE | 5 |\\n| P-USAGE-MULTI, P-DENSITE, S-INFO-MANQUANTE | 8 chacun | P-PERIM-URB, P-NOUV-ZONE, N-FAUX-POSITIF, N-ODJ-SEUL, N-FORME | 4 chacun |\\n\\nCodes jamais employés : P-TYPO-INTERM, N-RETIRE, N-DOUBLON, N-HORS-TERR.\\n\\n| Verdict « Écartés par les filtres » | Lignes |\\n|---|---:|\\n| Écarté à raison | 102 |\\n| Absent de l'UI | 6 |\\n| Typage fautif — hors fenêtre | 4 |\\n| Écarté — non vérifiable | 3 |\\n| Écarté à tort — faux négatif | 3 |\\n| Typage fautif — filtrage correct | 2 |\\n| Capté à tort — faux positif | 1 |\\n| **Total** | **121** |\\n\\n102/121 n'est pas un rappel : des lignes décrivent des groupes ou des cas déjà présents dans Triage.\\n\\n| Gravité des constats | Lignes | Périmètre | Lignes |\\n|---|---:|---|---:|\\n| Question | 20 | V1 | 67 |\\n| Confort | 19 | Info | 5 |\\n| Erreur vérifiée | 18 | V2 — pour mémoire | 4 |\\n| Exigence | 9 | V2 | 1 |\\n| Info | 7 | | |\\n| V2 | 4 | | |\\n\\nLe bandeau de la feuille indique encore « 3 sur 25 » erreurs vérifiées : texte ancien, incohérent avec les 18 lignes actuelles.\\n\\n**Qualité du filtrage (Synthèse, valeurs mémorisées)** : Correct 88, Fuite 25, Anomalie 7, À vérifier 3, Non évalué 0, soit 123 sur 124. Un regroupement par préfixe des 81 libellés libres de la colonne O donne 88 / 25 / 8 / 3 en rangeant ANOMALIE, ABSENT et SORTI DE LA VUE ensemble ; l'écart d'une ligne tient à ce regroupement.\\n\\n### 5.5 Ce que dit l'analyse, rapprochée du tableur\\n\\n| Catégorie de l'analyse (passe 1) | Analyse | Reconstitution par le tableur | Tableur |\\n|---|---:|---|---:|\\n| Trois critères réunis | 22 | Pertinent ∧ sens = Assouplissement | 22 |\\n| Résidentiel, portée générale, sens non donné | 12 | Pertinent ∧ sens ∈ {Indéterminé 6, Mixte 5, Neutre 1} | 12 |\\n| Portée ou ampleur non identifiable | 15 | À surveiller | 15 |\\n| Hors critères | 24 | Non pertinent | 24 |\\n\\n**CALCUL, recompté.** La correspondance est exacte en effectifs. L'analyse n'énonce pas la règle de passage : le rangement des 5 « Mixte » dans « sens non donné » reste une reconstitution, à confirmer par Steve (D8).\\n\\nApports de l'analyse :\\n- **Trois critères cumulatifs** : résidentiel, assouplissement, densification (« pas deux sur trois — les trois ») ; la densification exige plus d'unités qu'avant.\\n- **Cinq exclusions** : pas un règlement d'urbanisme ; pas d'effet sur la capacité de construire ; sens restrictif ; point d'ordre du jour et non décision ; autorisation individuelle et non règle générale.\\n- **Réserve d'asymétrie** : un sens indéterminé reste affiché, un règlement mixte ne disparaît jamais (R-13, R-21, C-57, C-66).\\n- **Sept dossiers manqués** alors que « l'information existait dans la base » : Saint-Michel (36 logements, résumé tronqué), Richelieu, Deux-Montagnes 1770, Mascouche 1103-81, Sainte-Anne-des-Plaines 1079-1, Saint-Jérôme 0351-006, Saint-Gilbert U-161-2026 (affiché comme projet alors qu'il est en vigueur).\\n- **Interface souhaitée** : archiver sans supprimer ; classer ; lier les signaux d'un même règlement ou secteur ; garder en alerte (épingler hors période, notifier à chaque étape).\\n- **Suite** : 52 municipalités restent à relever selon la même méthode.\\n\\nÉcarts internes à ne pas lisser : la famille « autorisations individuelles » annonce six signaux puis cite sept municipalités ; l'analyse nomme 21 ou 22 cas pour 24 annoncés. **Le tableur fait foi pour l'import** ; l'analyse est conservée comme annotation distincte.\\n\\n### 5.6 Exigences techniques des constats (sélection)\\n\\n| Constat | Exigence | Carte |\\n|---|---|---|\\n| C-21, C-57, C-66 | Le sens devient un filtre coché par défaut qui masque le purement restrictif ; étiqueté par disposition ; « indéterminé » distinct de « neutre », toujours visible ; un restrictif masqué n'emporte pas l'étape d'un dossier visible. | C, #761 |\\n| C-15, C-26, R-07 | Lier les étapes d'un même règlement avec correction manuelle, sans fusion ; `reglement_number` vide ou incohérent (« 026-509 » / « 2026-509 »). | #760 |\\n| C-69, R-25 | Épingler un dossier et une municipalité, hors période, avec notification. | #760 |\\n| C-72 | Ampleur chiffrée : logements, densité, hauteur, avant et après. | extraction |\\n| C-82 | Le second projet est la dernière fenêtre avant le registre référendaire ; exclu de Précoce. | #761 |\\n| C-49, C-34 | Enregistrements servis par l'API et rendus dans aucune vue ; cause inconnue. | #761 |\\n| C-79 | Noms de particuliers en clair dans des résumés de signaux ; caviardage demandé. | conformité |\\n| C-81 | Municipalités introuvables par leur nom (slug désambiguïsé par la MRC). | import, MCP |\\n\\n### 5.7 Filtres reconstitués par Steve (R-16), confrontés au code\\n\\nLecture du code `27891b10` ; les causes sont des hypothèses de lecture, non exécutées, et le code peut différer de celui déployé en septembre.\\n\\n| Filtre | Observé par Steve | Définition dans le code | Lecture (JUGEMENT) |\\n|---|---|---|---|\\n| Précoce | Retient avis_motion, projet_reglement, un ppcmoi mais pas un autre | `etape ∈ {avis_motion, projet_reglement}` ; étape annotée, sinon dérivée par mots-clés (`vivier-view-mode.ts`, `graph-store.ts`) | Étape dérivée différemment selon le texte ; second projet exclu par construction (C-82). |\\n| Résidentiel | « Se prononce sur le type et rien d'autre » ; fuites non urbanistiques | `res=oui` ou `res=indetermine` ∧ instrument ∈ {rezonage, refonte} (`radar-domain/src/vivier/counts.ts`) | Un règlement de matières résiduelles typé `rezonage` passe par l'instrument. |\\n| Zonage | Semble laisser tomber `densification_residentielle` | Liste contenant `densification` mais pas `densification_residentielle` (`graph-store.ts`) | Cohérent avec l'observation. |\\n| Exclure PIIA | Écarte tout `piia` | Masque un PIIA sans preuve de projet résidentiel (`vivier-display-exclusions.ts`) | Proche. |\\n| Exclure dérogation | Écarte dérogation et dérogation mineure | Masque toute dérogation | Cohérent. |\\n| Période | Glissante, datée par la première étape (C-56) | Depuis #793 (fusionnée le 2026-10-02) : date du document par défaut, collecte en période personnalisée (`document-date-filter.ts`) | Observations de Steve en partie périmées. |\\n| Jamais rendus (C-49) | Cause inconnue | `non vérifié` | À reproduire (#761). |\\n\\nSteve écrit (R-16) qu'« une seule réponse des développeurs remplacerait toute cette reconstitution ». Ce tableau peut lui être renvoyé après relecture (D16).\\n\\n---\"},{\"id\":\"section-6\",\"heading\":\"6. Modèle de données conforme au contrat sentropic d'annotation et de canevas\",\"markdown\":\"### 6.1 Contraintes établies\\n\\n**Identité des objets annotables (FAIT).**\\n\\n| Objet | Où il vit | Clé | Stabilité |\\n|---|---|---|---|\\n| Signal `signal-…`, événement `event-…` | `graph_nodes`, projetés depuis `graph/<ville>/latest.json` | `id` texte choisi par l'extraction | **Non garantie** : `upsertGraphAtomic` supprime les nœuds orphelins d'une ville (`graph-store.ts`, vers les lignes 1134–1166). |\\n| `signals` (historique) | table `signals` | UUID aléatoire | Aucune insertion dans le code applicatif de `main` (seulement dans un test d'intégration). |\\n| Municipalité | registre `QC_MUNICIPALITIES` ; nœuds `muni-<slug>` | slug, homonymes suffixés par la MRC | Stable |\\n| Règlement | `bylaw-<slug>-<num>`, `regulatory_stages.bylaw_canonical_id`, `reglement_number` | texte | Peu fiable (C-05, C-26) |\\n| Zone | `zone_versions` bitemporel | `ogc:zones:<ville>:<codeNorm>` | Stable par code |\\n| Lot | `lot_versions` bitemporel | `ogc:lots:<ville>:<noLotNorm>` | Stable |\\n| Document | `documents` | sha256 | Stable |\\n\\n**Annotations existantes (FAIT, lecture de code).**\\n- `prospect_notes` (0011) : cible `lot` ou `signal` (UUID `ON DELETE SET NULL`), auteur `account_users`, corps limité à 10 000 caractères, suppression logique, flux SSE `prospect:note`.\\n- **Défaut 1** : l'UI envoie `GraphSignalNode.id` (texte) alors que l'API exige `z.string().uuid()` (`prospect-marks.ts:107`). Un refus 400 est attendu ; les tests utilisent `\\\"sig-1\\\"` sur un fetch simulé. Effet en prod : `non vérifié`.\\n- **Défaut 2** : `SignalAnnotations` compare `note.authorId` (`account_users.id`) à `$authStore.user.sub` (sujet IdP) quand `currentUserId` n'est pas fourni ; ni `SignauxSelPanel` ni `LotFichePanel` ne le fournissent. Les boutons d'édition n'apparaîtraient pas. Effet : `non vérifié`.\\n- **Défaut 3** : le badge de comptage n'est rempli qu'à l'o
