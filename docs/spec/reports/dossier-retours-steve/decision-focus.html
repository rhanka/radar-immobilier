 Il prévoit d’emblée les réponses de l’équipe et plusieurs jeux d’étiquettes dans les mêmes tables.",c:"On crée une seule table de contrôle qui recopie le classeur pour mesurer le radar, sans aucun lien vers ce qui est affiché. Le nom de table est indicatif. Rien n’apparaît dans le panneau du signal : Steve ne retrouve pas son verdict sur le signal qu’il a trié ; seul l’oracle lit la table.",d:"On ne construit rien côté radar : on attend que le paquet comments de sentropic porte tout (cibles, verdict, provenance). En attendant, le classeur reste un fichier hors de l’outil. Même livré, le paquet ne porte ni classement, ni motif, ni sens : il faudrait encore des tables radar."},D3:{a:"On stocke la cible sous forme de texte (« radar.signal:<ville>:<id> ») dans annotation_cibles (ville + id texte du graphe), sans clé étrangère vers le graphe, avec un instantané de ce que Steve a vu (ville, date, type, verbatim). B0 corrige l’API pour accepter cet identifiant texte. Si une ré-extraction supprime le signal, l’ancre passe « disparue » et le panneau montre l’instantané au lieu de perdre le retour.",b:"On n’ancre rien tant qu’une clé métier stable (dossier réglementaire, étape) n’existe pas dans une ontologie du radar. Aucun lot B0 : l’annotation de signal reste en échec 400 et les retours de Steve ne s’affichent sur aucun signal.",c:"On garde le contrat v1 : une annotation de signal pointe vers l’UUID de la table signals. Mais aucun code de main n’écrit dans signals : il n’existe aucun UUID à viser pour les 124 lignes de Steve. L’ancre ne peut pas être créée."},D4:{a:"Les annotations utilisent les cibles et la lecture du module comments, sans modifier le paquet. Les retours importés sont immuables : aucun bouton de suppression. Les validations et contestations vivent dans les tables du radar (validations) ; un fil de commentaires sentropic pourra s’ajouter avec le port complet. On demande à sentropic une version avec tombstone, puis on adopte le port complet.",b:"On écrit un adaptateur CommentStore côté radar dont le delete pose une marque (tombstone) au lieu d’effacer. Les retours et réponses passent tout de suite par le port complet. Mais le delete du port ne supprime plus vraiment : sa sémantique diffère de celle du paquet.",c:"On attend que sentropic publie un paquet avec tombstone et rétention, puis on branche tout dessus. Aucun retour de Steve n’est affiché avant cette version, sans date connue."},D9:{1:"Le jeu « steve-source » (verdict de Steve) est comparé à la classification du radar : B′ reconstituée à la date du relevé, puis C. Exemple : sur la passe 1, Steve juge 24 signaux sur 73 Non pertinent alors que B les affiche ; c’est cet écart que l’on mesure ligne par ligne.",2:"On compare deux grilles humaines de Steve : son classement actuel (P/S/N, motif) et un nouvel étiquetage selon les critères C. Steve repasse sur les mêmes lignes ; l’oracle mesure l’évolution de ses critères, pas le radar.",3:"On rapproche l’oracle d’extraction (676 unités sur 100 procès-verbaux) et l’oracle de Steve (124 lignes). Le pont passe par les documents communs, probablement peu nombreux (non vérifié)."},D10:{a:"Les 124 lignes du tableur deviennent l’unique oracle, à la place de la version 674/676. Rapide à constituer, mais il ne contient que ce que l’écran montrait à Steve : les sept dossiers manqués (« l’information existait dans la base ») n’y figurent pas.",b:"Deux oracles versionnés et gelés par empreinte. E reste l’oracle d’extraction (676 unités). C est construit à partir des évaluations et ancres de Steve, adjugées et étayées. Développement sur ses 51 villes, test sur les 52 suivantes, jamais vues ; toutes les unités d’un même dossier dans la même partition.",c:"On lance une campagne d’annotation neuve, conçue pour le ciblage C, sur un nouveau corpus. Les 124 lignes de Steve servent seulement d’exemples ; la comparaison avec l’historique se fait à part."},D11:{a:"Le rapport du benchmark #782 garde son tableau d’extraction inchangé et ajoute un tableau « ciblage » : précision et rappel de l’historique, de B, puis de C, sur l’oracle C. Le prompt gelé immo-pv-extraction-v9 n’est pas modifié ; l’enrichir serait une nouvelle version, décidée à part.",b:"Un seul tableau et un seul score mêlent l’extraction (étape et citation) et le ciblage (fallait-il montrer le signal)."},D1:{a:"On importe seulement la feuille Triage : 124 lignes, 51 villes. Les 121 contrôles d’exclusion (dont 3 faux négatifs « écartés à tort »), les 77 constats et les 26 règles restent dans le fichier.",b:"On importe les 7 feuilles et l’analyse du 21 septembre, sans rien modifier : 124 lignes de triage, 121 contrôles d’exclusion, 77 constats, 26 règles, 28 codes, et la Synthèse avec ses formules et leurs valeurs mémorisées. L’analyse est conservée à part, comme annotation distincte.",c:"Chaque ligne devient une note de texte libre sur une ville ou un signal, dans l’UI des notes actuelle. Le classement, le motif et le sens ne sont plus des champs : ils sont dans le texte."},D5:{a:"Chaque retour importé affiche « Steve Chaperon — importé par <nom> ». Steve est un auteur externe (ext:chaperon:steve) sans compte ; l’importateur réel est enregistré à part. Steve ne peut pas annoter lui-même tant que cette identité externe est utilisée.",b:"Le retour est affiché comme écrit par la personne qui a lancé l’import ; le nom de Steve n’apparaît que dans la provenance (fichier, feuille, ligne).",c:"On crée et vérifie un compte pour Steve. Ses retours importés sont attribués à ce compte (l’importateur est tracé dans importe_par), et ses annotations, triages et réponses aux contestations dans l’application portent le même compte."},D6:{a:"Tout utilisateur approuvé voit tous les retours, verbatims compris, comme pour les notes actuelles (règle 0011). Aucun masquage.",b:"Seuls les administrateurs et Steve voient les retours ; le reste de l’équipe ne les voit pas dans le panneau.",c:"Tout utilisateur approuvé voit les retours, mais les noms de particuliers sont masqués avant affichage, dans les verbatims importés comme dans les résumés de signaux (demande C-79 de Steve). Une colonne pii_status trace le traitement."},D7:{S:"C n’affiche que les signaux qui réunissent les trois critères de façon établie. Exemple : sur la passe 1, seuls 22 signaux sur 73 resteraient ; les 12 Pertinent dont le sens n’est pas donné disparaîtraient.",K:"C applique les critères K1 à K9 (§9.2) avec trois états : confirmé (critères étayés), à instruire (sens ou effet non déterminable, reste visible), exclu prouvé (masqué, raison affichée). Deux compteurs distincts « confirmés » et « à instruire ». Aucun seuil de taille de projet ni filtre sur l’origine privée.",T:"La sélection affichée reste B ; les critères de Steve servent seulement à trier la liste (les « trois critères » en premier). Aucun signal n’entre ni ne sort."},D8:{a:"Steve et Mathieu examinent les cas listés au §9.2 sur exemples et preuves (Saint-Victor, Amos, CPTAQ, seconds projets, ODJ, trois S-RESTRICTIF). Tant qu’un cas n’est pas tranché, il est marqué « abstention » dans l’oracle : il ne compte ni pour ni contre.",b:"L’équipe tranche elle-même chaque cas à partir de l’analyse et des règles de Steve, puis lui présente le résultat.",c:"Les cas restent dans l’oracle avec l’étiquette du tableur, sans statut particulier, même quand le tableur et l’analyse se contredisent."},D12:{a:"Steve et l’équipe continuent de voir B, sans sélecteur. C est calculée en parallèle par le backend ; une page de comparaison B / C n’est accessible qu’en recette UAT et aux administrateurs. Le jour où le seuil D13 est franchi et que Farid décide, C remplace B à l’écran (scène 5).",b:"Un sélecteur A / B / C apparaît dans le rail pour tous les utilisateurs, avec un mode comparatif ; le choix est porté dans l’URL (filter.targeting=a|b|c).",c:"On n’expose pas C comme un tout : on ajoute à B, un par un, les critères de C (sens, plein droit, second projet), chacun livré quand il est prêt.",d:"On construit une seconde application dédiée à C, avec sa propre carte, ses filtres et ses notes ; Steve choisit l’une ou l’autre application."},D13:{a:"C remplace B seulement si, sur le jeu test des 52 villes : aucun signal que Steve juge Pertinent n’est masqué ; la précision P ∪ S de C dépasse celle de B (67,1 % sur la passe 1) ; l’API, le rail, la carte et le panneau montrent les mêmes ensembles ; Farid fait la recette.",b:"Farid écrit d’autres chiffres dans le commentaire (par exemple une précision minimale ou un rappel minimal), mesurés par le même oracle.",c:"La bascule se décide sur la recette de Farid seule, sans mesure chiffrée par l’oracle."},D14:{a:"Dans le panneau du signal, un badge « Retour de Steve » (vert, jaune, rouge) ouvre une section « Avis de Steve » : classement, motif, sens, analyse, provenance, état du rattachement. Dans le rail, des compteurs P / S / N par ville. Les 3 composants d’annotation passent au design system. Rien sur la carte au premier lot.",b:"En plus du panneau, des pastilles colorées sur la carte Signaux actuelle (composant local MapLibre de 2 761 lignes) dès le lot L3.",c:"On termine d’abord la migration de la carte vers les composants geo partagés (Porte 2), puis on affiche les retours sur la nouvelle carte et dans le panneau.",d:"Un écran séparé liste tous les retours de Steve (filtrable par ville, motif, statut de rattachement), sans rien afficher sur les objets du radar."},D15:{a:"B0, l’import (L1) et l’oracle de ciblage (O1) démarrent maintenant, en parallèle de #703, car ils ne touchent pas la chaîne de rafraîchissement. Le classifieur C (C1) attend que le rafraîchissement soit stable.",b:"Tout le travail de ce dossier attend la clôture de #703 (rafraîchissement quotidien en production)."},D16:{a:"Mathieu et Farid envoient à Steve la définition réelle des cinq filtres (§5.7, lue dans le code) et la table qui relie ses 28 codes de motif aux critères C, pour qu’il la corrige avant le développement de C.",b:"On ne répond pas à sa question R-16 avant que C soit développée ; il reçoit alors directement la nouvelle sélection."}},oT={D2:{a:av,c:{colGap:180,layers:["Mesure seule","Affichage, sans lien"],placement:{steve_control_rows:{col:0,row:0},graph_nodes:{col:1,row:0}},existing:["graph_nodes"],labels:{},er:'erDiagram\n    steve_control_rows {\n      uuid id PK\n      text sheet\n      int sheet_row\n      jsonb cells "toutes les cellules"\n      text verdict "classement, motif, sens"\n    }\n    graph_nodes {\n      text id PK "signal-…"\n      text city_slug\n    }'},b:{colGap:180,layers:["Source","Jugement","Ancres et publication"],placement:{annotation_sources:{col:0,row:0},annotation_raw_rows:{col:0,row:1},annotation_assessments:{col:1,row:1},comment_projection:{col:2,row:0},annotation_anchors:{col:2,row:1},graph_nodes:{col:2,row:2}},existing:["graph_nodes"],labels:{normalisee_en:"normalisée en",rattachee_a:"1 à N ancres",cle_texte_sans_fk:"clé texte, sans FK",publie_en:"publiée en"},er:'erDiagram\n    annotation_sources ||--o{ annotation_raw_rows : contient\n    annotation_raw_rows ||--o{ annotation_assessments : normalisee_en\n    annotation_assessments ||--o{ annotation_anchors : rattachee_a\n    annotation_anchors }o..o| graph_nodes : cle_texte_sans_fk\n    annotation_assessments ||--o| comment_projection : publie_en\n    annotation_sources {\n      uuid id PK\n      text file_sha256 UK\n    }\n    annotation_raw_rows {\n      uuid id PK\n      uuid source_id FK\n      jsonb cells\n    }\n    annotation_assessments {\n      uuid id PK\n      uuid raw_row_id FK\n      text classement\n      text motif_code\n      text sens\n    }\n    annotation_anchors {\n      uuid id PK\n      uuid assessment_id FK\n      text anchor_key "sans FK"\n    }\n    graph_nodes {\n      text id PK\n    }\n    comment_projection {\n      uuid id PK\n      uuid assessment_id FK\n      text thread_id\n    }'},d:{colGap:180,layers:["Paquet sentropic : aucune table radar"],placement:{sentropic_comments:{col:0,row:0}},existing:["sentropic_comments"],labels:{},er:'erDiagram\n    sentropic_comments {\n      text id PK\n      text target_kind "record"\n      text target_id\n      text author_id\n      text body "ni classement ni provenance"\n    }'}},D10:{a:{colGap:180,layers:["Source","Oracle unique","Benchmark #782"],placement:{annotations:{col:0,row:0},oracle_tableur:{col:1,row:0},oracle_e_v3:{col:1,row:1},benchmark:{col:2,row:0}},existing:["oracle_e_v3"],labels:{remplace:"remplace",note_tout:"note tout"},er:'erDiagram\n    annotations ||--|| oracle_tableur : remplace\n    oracle_tableur ||--|| benchmark : note_tout\n    annotations {\n      text source "124 lignes de Steve"\n    }\n    oracle_tableur {\n      text unite "ce que l\'écran montrait"\n      text biais "7 dossiers manqués absents"\n    }\n    oracle_e_v3 {\n      text statut "retiré, historique perdu"\n    }\n    benchmark {\n      text tableau "un seul, extraction et ciblage"\n    }'},b:{colGap:180,layers:["Sources","Deux oracles gelés","Benchmark #782, deux volets"],placement:{consensus_modeles:{col:0,row:0},annotations:{col:0,row:1},oracle_e_v3:{col:1,row:0},oracle_c_v1:{col:1,row:1},volet_extraction:{col:2,row:0},volet_ciblage:{col:2,row:1}},existing:["consensus_modeles","oracle_e_v3","volet_extraction"],labels:{adjugees_gelees:"adjugées, gelées",note_b_puis_c:"note B puis C"},er:'erDiagram\n    consensus_modeles ||--|| oracle_e_v3 : construit\n    annotations ||--|| oracle_c_v1 : adjugees_gelees\n    oracle_e_v3 ||--|| volet_extraction : note\n    oracle_c_v1 ||--|| volet_ciblage : note_b_puis_c\n    consensus_modeles {\n      text methode "7 passes, 3 familles"\n    }\n    annotations {\n      text source "verdicts de Steve"\n    }\n    oracle_e_v3 {\n      int taille "674 / 100 documents"\n    }\n    oracle_c_v1 {\n      text jeux "dev 51 villes, test 52"\n    }\n    volet_extraction {\n      text mesure "inchangée"\n    }\n    volet_ciblage {\n      text mesure "précision, rappel"\n    }'},c:{colGap:180,layers:["Nouvelle campagne","Oracle C neuf","Benchmark #782"],placement:{campagne_c:{col:0,row:0},annotations:{col:0,row:1},oracle_c_neuf:{col:1,row:0},volet_ciblage:{col:2,row:0}},existing:[],labels:{exemples:"exemples seulement"},er:'erDiagram\n    campagne_c ||--|| oracle_c_neuf : construit\n    annotations }o..o| oracle_c_neuf : exemples\n    oracle_c_neuf ||--|| volet_ciblage : note\n    campagne_c {\n      text corpus "nouveau, conçu pour C"\n    }\n    annotations {\n      text role "124 lignes, exemples"\n    }\n    oracle_c_neuf {\n      text comparaison "historique à part"\n    }\n    volet_ciblage {\n      text mesure "précision, rappel"\n    }'}},D3:{a:{colGap:260,layers:["Ancre proposée","Graphe existant"],placement:{annotation_cibles:{col:0,row:0},graph_nodes:{col:1,row:0}},existing:["graph_nodes"],labels:{cle_texte_sans_fk:"clé texte, sans FK"},er:'erDiagram\n    annotation_cibles }o..o| graph_nodes : cle_texte_sans_fk\n    annotation_cibles {\n      uuid id PK\n      text city_slug "ville"\n      text cible_id "signal-… (texte)"\n      jsonb vu_par_steve "ville, date, verbatim"\n      text resolution "résolue … disparue"\n    }\n    graph_nodes {\n      text id PK "signal-… (texte)"\n    }'},b:{colGap:180,layers:["Ancre en attente","Clé métier"],placement:{annotation_cibles:{col:0,row:0},cle_metier_stable:{col:1,row:0}},existing:[],labels:{},er:'erDiagram\n    annotation_cibles }o..o| cle_metier_stable : attend\n    annotation_cibles {\n      uuid id PK\n      text business_key "à définir"\n    }\n    cle_metier_stable {\n      text key PK "n\'existe pas encore"\n    }'},c:{colGap:180,layers:["Note existante","Table signals"],placement:{prospect_notes:{col:0,row:0},signals:{col:1,row:0}},existing:["prospect_notes","signals"],labels:{signal_id:"signal_id, UUID"},er:'erDiagram\n    prospect_notes }o--o| signals : signal_id\n    prospect_notes {\n      uuid id PK\n      uuid signal_id FK "UUID exigé par l\'API"\n    }\n    signals {\n      uuid id PK "table vide sur main"\n    }'}}},lv="https://github.com/rhanka/radar-immobilier/pull/794",lT="Ouvrir la PR #794 sur GitHub",cT="2026-10-03",Xl=["Farid","Fabien"],cv=[{id:"fabien",step:1,decides:"Fabien",label:"Étape 1 · Fabien décide d’abord (architecture, données, oracle)"},{id:"farid",step:2,decides:"Farid",label:"Étape 2 · Farid décide ensuite (produit, affichage, priorités)"}],uT="Fabien décide d’abord ses sept décisions (D1, D2, D3, D4, D9, D10, D11) : D1 est déjà actée par l’owner le 2026-10-04 (tout conserver) ; les autres sont prises telles quelles, sauf incohérence avec une autre décision. Farid décide ensuite ses neuf décisions (D5, D6, D7, D8, D12, D13, D14, D15, D16), en connaissant les choix de Fabien. Si un choix de Farid contredit un choix de Fabien (par exemple D1 « tout conserver » avec D2 = (c), une table de contrôle qui n’affiche rien), on revient à Fabien sur ce seul point.",mt=(e,t,n,r,i)=>({key:e,mode:"single",question:t,recommended:n,options:i,step:js[e][0]==="Fabien"?1:2,group:cv.find(a=>a.decides===js[e][0]).label,intro:r.intro,dependsOn:r.dependsOn??[],recommendation:r.recommendation,decided:r.decided??null,decides:js[e][0],consulted:js[e][1],validators:[]}),Ce=(e,t,n,r)=>({key:e,title:t,pros:n,cons:r}),yr=[mt("D1","D1 — Périmètre de conservation des retours de Steve","b",{decided:{option:"b",by:"Fabien (owner)",date:"2026-10-04",note:"Actée par l’owner le 2026-10-04 : on conserve tous les retours de Steve ; il en a besoin pour l’oracle."},intro:"Décision actée par l’owner le 2026-10-04 : on conserve tous les retours de Steve ; c’est sa décision, il en a besoin pour l’oracle. Steve a livré un classeur de 7 feuilles (124 lignes de triage, 121 contrôles d’exclusion, 77 constats, 26 règles, 28 codes de motif) et une analyse écrite qui pose ses trois critères (§2, §5.1). Ce choix fixe ce que l’équipe pourra montrer sur les objets du radar et ce que l’oracle pourra mesurer (D10). Conséquence pour D2 : « tout conserver » suppose un modèle qui garde toutes les lignes, l’option a (ou b) de D2.",dependsOn:[],recommendation:"Tranchée : (b), tout conserver, actée par l’owner le 2026-10-04 ; les options a et c restent affichées pour mémoire."},[Ce("a","(a) Triage seul",["Rapide : une feuille, 124 lignes.","Moins de rattachements à vérifier à l’import."],["Perd les 121 contrôles d’exclusion, là où se trouvent les faux négatifs, ainsi que les constats et les règles.","Oracle incomplet : impossible de mesurer ce que les filtres cachent à tort."]),Ce("b","(b) Tout le classeur et l’analyse, brut immuable",["Aucune perte : chaque cellule, formule et valeur mémorisée.","L’oracle (D10) dispose des exclusions et des règles.","Les 52 villes suivantes s’importeront de la même façon."],["Plus de tables et de curation (rattachements à vérifier).","Import un peu plus long à écrire et à recetter."]),Ce("c","(c) Notes libres seules",["Surface existante : les notes des lots et des signaux.","Aucun schéma nouveau : livrable vite."],["Perd la structure (classement, motif, sens), les groupes et la provenance.","Inutilisable pour l’oracle ; une note est limitée à 10 000 caractères."])]),mt("D2","D2 — Modèle de données","a",{intro:"Le classeur de Steve (7 feuilles, 433 lignes, une cellule de 17 114 caractères, §5.1) doit être stocké en base et rattaché aux objets du radar (#784), et Steve doit pouvoir poursuivre son annotation dans l’application, avec des boucles de validation par l’équipe ou le PO (vision owner, §6.3). Les tables d’annotation existantes, prospect_marks et prospect_notes (§6.0), servent à l’équipe sur les lots : elles restent telles quelles, ni étendues ni réutilisées. Le §6.3 part des besoins réels de Steve (verdict, motif, provenance, 1 à N objets visés, révisions, saisie et validation dans l’application, oracle C) et propose un modèle minimal de six tables (scène 2). Il faut choisir la forme des tables maintenant : l’import (lot L1), l’affichage (U1) et l’oracle (O1) en dépendent tous (§7).",dependsOn:["D1"],recommendation:"(a) couvre exactement les besoins listés au §6.3 avec six tables nommées en clair, dont la boucle de validation ; ce qu’il ne fait pas (fil de discussion libre, états archiver, classer, lier, épingler, évaluation en ligne) reste possible plus tard, sans le défaire."},[Ce("a","(a) Modèle minimal « besoins de Steve » (6 tables)",["Une table par besoin réel : provenance, annotations vivantes, validations, codes et critères, objets visés, oracle gelé.","Aucune perte : toutes les cellules sont gardées ; une révision remplace sans effacer.","Signaux visés par ville + id texte, la clé du graphe décidée pour #812 : survit à la ré-extraction.","Le moins de code d’import et de migration parmi les options utiles."],["Pas de fil de discussion libre ni d’états archiver, classer, lier, épingler au premier lot (assumé, §6.3).","Une file de rapprochement (identifiants abrégés, ambiguïtés) reste à traiter à la main."]),Ce("b","(b) Modèle complet en couches (version précédente)",["Prévoit d’emblée les réponses de l’équipe (projection Comment) et plusieurs jeux d’étiquettes.","Sépare lignes brutes et évaluations, référentiels en trois tables distinctes."],["Neuf tables nouvelles et une migration plus lourde à écrire et tester.","Des tables sans usage immédiat (projection, jeux d’étiquettes) : coût sans besoin exprimé par Steve.","Plus de code d’import que l’option a."]),Ce("c","(c) Table de contrôle seule (oracle)",["Rapide : une table.","Respecte le précédent du 2026-06-11 : la mesure ne nourrit pas la production."],["Rien d’affichable : ne répond pas à #784 (« attaché à l’élément associé »).","Steve ne voit pas ses retours dans l’outil.","Une seconde structure sera nécessaire plus tard pour l’affichage."]),Ce("d","(d) Attendre le paquet sentropic complet",["Aucune dette côté radar : tout vit dans sentropic.","Aucune migration à écrire ni à maintenir maintenant."],["Bloquant sans date : #784 et l’oracle attendent.","Le paquet ne porte de toute façon ni verdict structuré ni provenance (§6.1)."])]),mt("D3","D3 — Ancre signal et correctif B0","a",{intro:"Une ancre est la référence qui attache une annotation à un objet du radar (signal, ville, zone, lot…) ; c’est une ligne de la table annotation_cibles (ville + id texte, scène 2). Aujourd’hui l’annotation d’un signal est cassée : l’UI envoie l’identifiant texte du graphe (« signal-… »), alors que l’API exige un UUID, identifiant aléatoire de l’ancienne table signals que plus aucun code n’alimente (§6.1, défaut 1). « B0 » est le petit lot correctif qui répare cela (§7). Sans ancre fiable, aucun retour de Steve ne s’affiche sur son signal. Risque connu : une ré-extraction du graphe peut supprimer ou renommer des identifiants (graph-store.ts, §6.1).",dependsOn:["D2"],recommendation:"(a) avec B0 tout de suite : c’est le seul choix qui rend l’annotation de signal utilisable maintenant et qui ne perd rien à la ré-extraction. Une clé métier stable reste un suivi séparé."},[Ce("a","(a) Clé texte namespacée + instantané observé, B0 immédiat",["Survit à la ré-extraction : l’ancre passe « disparue » au lieu d’effacer l’annotation, et l’instantané observé (ville, date, type, verbatim) reste lisible.","Répare tout de suite l’annotation existante (B0, taille S).","Aucune clé étrangère vers le graphe, donc aucune suppression en cascade."],["Si l’extraction renomme un identifiant, un rapprochement est nécessaire (file de revue).","La clé texte n’est pas une identité métier définitive."]),Ce("b","(b) Attendre une clé métier stable",["Identité propre et stable par conception.","Évite plus tard tout rapprochement d’identifiants."],["Dépend d’une ontologie qui n’existe pas : bloquant, sans date.","L’annotation de signal reste cassée en attendant."]),Ce("c","(c) Passer par l’UUID signals",["Contrat v1 (migration 0011) inchangé.","Aucune nouvelle colonne d’ancre à créer."],["Aucune insertion dans signals sur main : l’ancre est impossible en pratique.","Maintient le défaut actuel (refus 400 attendu)."])]),mt("D4","D4 — Conformité sentropic et suppression","a",{intro:"Les annotations doivent suivre le contrat du module comments de sentropic, la plateforme commune (exigence E3, §6.1). Ce module, en version 0.2.0, supprime physiquement un commentaire ; or l’owner a décidé (O1, dossier COLLAB) qu’une suppression laisse une trace (« tombstone ») et une durée de rétention. Il faut décider comment être conforme sans contredire O1, avant l’import (L1) et l’API de lecture (L2). Concrètement : peut-on supprimer un retour de Steve, et par quel chemin ? Dans la scène 2, comment_projection relie une évaluation publiée à son fil de commentaires.",dependsOn:["D2"],recommendation:"(a), puis adoption du port complet quand sentropic publiera la version avec tombstone. Réserve : le dossier COLLAB n’est pas sur main (non vérifié) ; s’il était abandonné, (b) redeviendrait défendable."},[Ce("a","(a) Cibles et lecture conformes, import immuable, demande de tombstone",["Respecte O1 et la ligne COLLAB « le paquet porte l’intégrité ».","Livrable maintenant : cibles et lecture conformes, sans modifier le paquet.","Premier lot en lecture seule : aucune suppression à gérer tant que le paquet n’a pas de tombstone."],["Conformité partielle : pas encore le port complet CommentStore.","Une demande à sentropic (tombstone) à suivre.","Une migration vers le port complet plus tard."]),Ce("b","(b) Adaptateur CommentStore à tombstone hôte",["Port complet utilisé dès maintenant.","Un seul chemin d’écriture et de lecture : celui du port."],["Contredit COLLAB §2 : un tombstone porté seulement par Radar est un piège.","Un delete qui ne supprime pas trahit la sémantique du port.","Dette à défaire quand sentropic livrera."]),Ce("c","(c) Attendre le port complet",["Conformité intégrale, aucun écart.","Aucune migration ultérieure vers le port complet."],["Bloquant tant que sentropic n’a pas livré, sans date.","Rien d’affiché pour Steve en attendant."])]),mt("D9","D9 — Sens de « double annotation » (point ouvert)",null,{intro:"La demande initiale parle de « double annotation (ancienne / nouvelle) » sans dire ce qui est comparé à quoi. Le modèle retenu (D2) garde le verdict de Steve dans annotations ; les autres jeux (adjudication C, prédiction C) vivent dans les versions gelées de l’oracle, et la classification du radar se recalcule (§6.6) : les trois lectures sont donc possibles techniquement. Mais chacune produit une mesure différente et fixe ce que l’oracle (D10) comparera : il faut la préciser avant de geler l’oracle de ciblage. Le sens de la demande appartient à Fabien.",dependsOn:["D2"],recommendation:"Point ouvert : aucune option recommandée. La lecture (1) est celle que le dossier a modélisée (§6.6) ; les trois tiennent dans le même schéma."},[Ce("1","Steve contre classification radar",["Mesure directement l’écart entre ce que Steve juge et ce que le radar montre (B aujourd’hui, C demain).","C’est la lecture qui sert la bascule B → C (D13)."],["La classification serveur de septembre n’est pas archivée : la version radar sera reconstituée, en partie.","Ne mesure pas l’accord entre deux humains."]),Ce("2","Ancienne grille de Steve contre grille C",["Suit l’évolution des critères de Steve dans le temps.","Utile si Steve réétiquette ses lignes avec les critères C."],["Exige un second passage de Steve sur les mêmes lignes.","Ne dit rien de la qualité du radar."]),Ce("3","Oracle 676 contre oracle Steve",["Relie l’extraction (oracle E) et le ciblage (oracle C).","Réutilise deux références déjà constituées (674/676 et le tableur)."],["Compare deux questions différentes : « a-t-on extrait l’acte ? » contre « fallait-il le montrer ? ».","Recouvrement des deux corpus probablement faible (non vérifié)."])]),mt("D10","D10 — Oracle #783","b",{intro:"Un oracle est un jeu de réponses de référence qui note automatiquement le radar. L’oracle actuel (674 unités committées, 676 en copie locale) note l’extraction des actes dans les procès-verbaux, pas le choix des signaux à montrer (§9.3). Les retours de Steve sont la première vérité humaine sur ce choix : dans sa vue de travail, 24 signaux sur 73 sont du bruit (32,9 %, scène 1). Il faut décider comment construire l’oracle de ciblage (#783) avant de développer C (D7), car c’est lui qui dira si C fait mieux que B (D13). Dans la scène 3, l’oracle est la bande du bas : hors ligne, alimenté par les annotations en base. La proposition complète (ancien oracle → nouvel oracle, construction, gel, validation) est au §9.3.",dependsOn:["D2","D9"],recommendation:"Double oracle : c’est la seule façon de mesurer l’utilité (ciblage) sans perdre la mesure de l’extraction ; campagne nouvelle seulement pour ce que les archives ne permettent pas d’évaluer. Unité : le signal, regroupé par dossier ; une unité « dossier » serait plus fidèle mais dépend d’une clé de règlement peu fiable (C-26)."},[Ce("a","Remplacer v3 par le tableur",["Rapide : une seule source.","Aucune adjudication supplémentaire à organiser."],["Les retours ne portent que sur ce que l’écran affichait : échantillon biaisé, les sept dossiers manqués restent invisibles.","Perd l’historique de l’extraction et la comparabilité des benchmarks passés."]),Ce("b","Double oracle E / C, jeu test indépendant",["Mesure séparément « a-t-on extrait l’acte ? » (E) et « fallait-il le montrer ? » (C).","Jeu test indépendant : les 52 villes suivantes de Steve, jamais vues pendant le réglage (51 villes de développement).","Partition par dossier : pas de fuite entre développement et test."],["Adjudication nommée et corpus de test coûtent du travail (Steve, l’équipe).","Deux oracles à versionner et geler par empreinte (sha256)."]),Ce("c","Campagne C entièrement nouvelle",["Conçue pour le besoin réel, sans biais d’affichage.","Peut couvrir d’emblée les 52 villes restantes avec la méthode C."],["Comparaison moins directe avec l’historique.","Repart de zéro : délai et coût d’annotation les plus élevés."])]),mt("D11","D11 — Benchmark #782","a",{intro:"Le benchmark #782 compare des modèles et des réglages sur un même oracle. Si on y ajoute la mesure du ciblage (B, puis C), il faut décider si elle rejoint les métriques d’extraction ou forme un volet à part (§9.4). Le choix fixe aussi le sort du prompt d’extraction gelé (immo-pv-extraction-v9) : lui faire produire sens, effet et portée romprait la comparabilité des campagnes v10 et v11. Ce que verra Farid : un tableau unique, ou deux tableaux qui ne se mélangent pas.",dependsOn:["D10"],recommendation:"Volet ciblage séparé : c’est la condition pour comparer B et C sans casser l’historique de l’extraction."},[Ce("a","Volet ciblage séparé",["Extraction et ciblage restent comparables chacun dans le temps.","Colonnes historique, B et C distinctes : l’effet de C se lit directement.","Tout changement du contrat d’extraction devient une nouvelle version, décidée à part."],["Deux tableaux à lire.","Pont entre les deux seulement sur les 100 documents du corpus commun."]),Ce("b","Métriques fusionnées",["Un seul tableau, un seul score.","Lecture plus simple pour un public non technique."],["Mélange deux questions différentes : un F1 fusionné ne dit plus rien.","Perd la comparabilité avec les campagnes passées."])]),mt("D5","D5 — Auteur des retours importés","c",{intro:"Steve poursuivra son annotation dans l’application (vision owner, §6.3) : ses retours importés et ses annotations futures doivent porter le même auteur. Aujourd’hui il n’a pas de compte vérifié, et ce n’est pas lui qui lance l’import. Il faut décider qui est affiché comme auteur, sans usurper son identité ni effacer celle de l’importateur (exigence E5, §6.2). Effet visible : la ligne « auteur » de chaque annotation dans le panneau du signal, et le nom de qui valide ou conteste.",dependsOn:["D2","D4"],recommendation:"(c) : Steve annote et valide avec son propre compte ; ses retours importés lui sont attribués, l’importateur est tracé à part. (a) ne vaut que si la création du compte tarde."},[Ce("a","(a) Auteur documentaire externe + importateur tracé",
