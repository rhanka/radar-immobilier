target-3-e43","source":"GEO_CONSTRAINTS","target":"GEO_S3","label":"","dashed":false,"both":false,"line":108},{"id":"target-3-e44","source":"WS_ADMIN","target":"PP_REFRESH","label":"","dashed":true,"both":false,"line":109}]}]'),rE=JSON.parse('{"decision-dossier":"# Architecture decision dossier — before and after\\n\\nRevision **D7**, 2026-09-13. The owner-facing comparison contains exactly two\\ncomplete architecture views: **BEFORE** and **AFTER**. Effective transition facts\\nare supporting text and gates, not a third primary graph. Opening the Focus page\\nperforms no action, creates no Track event and is not an invoice.\\n\\n## 1. Architecture BEFORE\\n\\nThe complete [BEFORE source](../architecture.md) preserves the September 13\\ncapture: production/preproduction access and SSO, Immo and Geo services, shared\\nKubernetes platform, PostgreSQL and object roles, and the workstation LLM path.\\nThe preproduction API still used MinIO `PP-RAW`/`PP-DOCS`; refresh graph objects\\nwere on OVH and LLM-derived processing still depended on the workstation.\\n\\nEvery component and nested subflow is shown together. Each carries a service\\nicon, repository provenance and role. The verified user addresses remain\\n`preprod.immo.sent-tech.ca` and `immo.sent-tech.ca`.\\n\\n## 2. Architecture AFTER\\n\\nThe complete [AFTER source](transitions-target.md) is the one-b3-8 target after\\nT1, T2 and T3 acceptance. It keeps the same user/SSO, Immo, Geo and platform\\nboundaries while moving RAW/DOCS object roles to OVH and running the Immo refresh\\nwith in-process Graphify/llm-mesh in Kubernetes. SCW TEM remains shown until a\\nreplacement is validated.\\n\\nAFTER is not deployed. T3 is **NO-GO today**: one node exposes 1,840m CPU and\\n5,907.82 Mi allocatable versus 4,095m/8,442 Mi requests; required anti-affinity\\nand 16 PVCs/15 Cinder RWO volumes add placement constraints.\\n\\n## 3. Effective delta — context, not a third architecture\\n\\nGraphify **0.18.0** is integrated and **Luna high** selected. The first\\nKubernetes run failed before invoking the LLM because its input was `.html`, not\\na PDF. Preproduction RAW passed parity and its API was rebound to OVH.\\n\\nDOCS OVH bucket/Secret and guarded copy tooling exist, but copy, exact\\nparity/recovery and rebind remain open; the launched production migration has no\\nreported outcome. These facts explain the gap between BEFORE and AFTER without\\nintroducing another graph.\\n\\n## 4. Fixed owner decisions and gates\\n\\nThe ratified order remains T1 refresh → T2 objects → T3 one node, with\\npreproduction before production. The DOCS canonical reference remains exactly\\nthe initial production SCW set of 59,017 keys+hashes; the 85,176-object\\npreproduction surplus is not migrated. Immo retains PV pipeline ownership and\\nSCW TEM is retained until its replacement is validated.\\n\\nT1 requires a valid PDF, provider completion, typed Signal/exact PDF,\\nidempotent replay and unattended schedule. T2 requires manifest diff, selective\\ncopy, exact parity, recovery proof, writer fence and rebind. T3 requires T2,\\nrightsizing, reconciled placement, a verified two-node state, then one-node\\npreproduction acceptance before production authorization.\\n\\n## 5. Rollback boundary\\n\\nObject rollback restores an application-consistent set of canonical graph hash,\\nSQL checkpoint/version, evidence objects and input set. It never assumes a\\ncross-S3/SQL transaction or permits dual writers. A partial transition\\nauthorizes no object deletion, credential revocation or node reduction.\\n\\n## 6. Explicit open questions\\n\\nThe Focus form presents each question before its selectable options and exports\\nthe exact question, all options, the selected value and its comment as JSON.\\nResponses remain local drafts and do not alter fixed decisions.\\n\\n1. **Which preproduction address should be the owner-facing entry point?** Keep\\n   the verified Immo URL; create a separate alias/portal; or defer.\\n2. **Should the future automation boundary remain limited to Immo, or include\\n   assisted Geo extraction?** Immo-only; coordinated Immo+Geo scope; or defer.\\n   This does not reopen Immo ownership of the PV pipeline.\\n3. **Should the audited LLM allocation be ratified, reconciled first, or remain\\n   indicative?** This question is explicitly **non-critical**. No answer leaves\\n   it open and non-blocking.\\n\\n## 7. Rendered evidence and limits\\n\\nExactly two Mermaid sources are rendered as sanitized SVG and complete native\\nSvelteFlow. Nested boxes use `parentId`; service icons and repo labels are\\nmandatory for every node and group. Browser checks cover every node, edge and\\nsubflow, full-graph fit, zoom, offline use, comments and actual clipboard JSON.\\n\\nKnown limits remain explicit: T1 has not reached provider acceptance, DOCS is\\nnot copied/rebound, the production outcome is unknown and T3 has not started.\\n\\n## 8. Billing annex\\n\\nThe joined period is **2026-08-10 through 2026-09-13 inclusive**, 35 days / 840\\nhours, America/Toronto. Infrastructure is the fixed one-b3-8 BHS5 projection:\\n`840 × 0.082 = 68.88 CAD`; observed two/three-node costs remain excluded.\\n\\nThe deduplicated local session audit allocates 139.337732 CAD to immo and\\n111.877705 CAD to geo, or **251.215438 CAD LLM** and **320.095438 CAD** including\\ninfrastructure. These are local allocations, not provider invoice lines. Until\\nthe non-critical question is answered, the LLM amount remains indicative and\\nunratified.\\n","transitions":"# Architecture transition register\\n\\nOwner direction, September 13, 2026: execute the existing work **refresh first,\\nMinIO second, one-node Kubernetes third**, as soon as the corresponding acceptance\\nchecks pass. The earlier presentation-only hold is superseded. The dossier follows\\nexecution; it is not a request to vote again on those three objectives.\\n\\n## Reference and update contract\\n\\n- Before-state source: `docs/architecture.md`; the effective transition snapshot\\n  plus the two after targets are in `docs/architecture/transitions-target.md` and the\\n  detailed T1 causal boundary is in `docs/architecture/proposal.md`.\\n- Committed renderer: `docs/architecture/focus/`, including the Mermaid parser,\\n  SVG renderer, native nested SvelteFlow, service/repository map and tests.\\n  Reference commits: `b1aef3b2`, `df0ac28e`, `63f32086`, `8d3da5b6`, `ef0b24c2`.\\n- Every architecture transition must update the source diagrams, resource/owner\\n  map, this register and evidence in the **same implementation PR**. Rebuild and\\n  run the documented mapping/browser checks. A drawing change is not deployment.\\n- Record before/after runtime, exact image/package/commit, evidence timestamp,\\n  execution owner, acceptance, rollback and unresolved gaps. Preserve history in\\n  Git; retain stable IDs for unchanged physical resources.\\n- The monthly report embeds a dated rendering and source hashes. Later changes\\n  must not silently alter an already issued report. HTML includes interactive\\n  SvelteFlow plus rendered Mermaid; PDF includes static diagrams and the HTML link.\\n\\n## Engaged plan, retained work and remaining transitions\\n\\n| Transition | Existing work retained | Remaining acceptance | Current status |\\n| --- | --- | --- | --- |\\n| T1 — autonomous PV → Signal cron | Graphify 0.18.0 integrated; Luna high selected; K8s validation launched | Re-run with an actual PDF; prove provider completion, typed Signal + exact PDF, idempotent replay and unattended schedule | **IN VALIDATION**: first K8s run failed before the LLM because the supplied object was `.html`, not PDF; no T1 acceptance yet |\\n| T2 — remove MinIO and remaining SCW dependencies | `PP-RAW-OVH` parity + API rebind verified; DOCS bucket/Secret provisioned; inventories show PP 144,193/28.34 GB vs canonical PR 59,017/12,534,514,457 B; guarded copy tooling through `be362561` | Diff manifests; use exact PR 59,017 keys+hashes as canonical set; selectively copy to OVH prod/preprod; prove equality/recovery; then remove all MinIO; TEM excluded | **PARTIAL / IN PROGRESS**: RAW complete; DOCS copy/parity/rebind not complete; production migration outcome unknown |\\n| T3 — one OVH b3-8 | Three b3-8; service plan; 16 PVC/15 Cinder RWO inventory | Finish T2; rightsize; reconcile required affinity/PVC constraints; prove controlled two-node operation; only then test one-node preprod before production | **NO-GO today**: requests and required anti-affinity do not fit one node |\\n\\n[FACT] Graphify producer confirms **0.18.0 published**, tag `v0.18.0`, merge\\n`1a723695d8a23ffe5e13f1988c52ded056f85c96`; exact-version installation and ESM/CJS\\ncontract tests passed on the producer side. H2A envelope\\n`env:graphify-018-final:1789306808055`, 13:40 UTC. This closes the publication\\ndependency, not the Immo consumer acceptance. Earlier open-PR references are dated\\nhistory, not current release status.\\n\\n[FACT] Graphify remains exactly 0.18.0 and `immo-pv-extraction-v3` remains an\\ninternal contract name. Luna high is the selected model. A first Kubernetes run\\nwas executed, but the selected object was `.html` while the contract requires a\\nPDF; execution therefore failed **before the LLM was called**. This proves the\\nworkload reached input validation, not provider completion or T1 acceptance.\\n\\n[FACT · owner correction] Keep llm-mesh 0.19.0. A rare nested `UND_ERR_SOCKET`\\nfails the Job closed; durable state is resumed at the next cycle. No corruption or\\nin-process retry is claimed. The 0.19.1 need is judged probably false and not prioritized:\\ncross-repository implementation is unauthorized, PR #585 is closed and its branches\\nare removed. Diagnosis is deferred to `s-conductor`, with no implementation request.\\n\\n[FACT · gate] The next run must use a valid PDF and prove provider completion,\\ntyped Signal + exact PDF, idempotent replay and unattended scheduling. The Luna\\nhigh selection does not waive any of those acceptance gates.\\n\\n[JUDGMENT] The shortest continuation is the engaged in-pod library integration,\\nnot a new mesh network service, another CLI orchestration layer or completion of\\nthe entire E1–E5 DAG before the first live refresh. Preserve its exclusive-writer\\nand retry invariants. A one-document smoke alone does not satisfy T1.\\n\\n[FACT] Owner reminder: Geo is continuing SCW eradication after missed references\\nwere found. Geo\'s verified GHCR deployment/secret cleanup is **not** certification\\nof every source adapter, S3 binding, Job/CronJob, CI path or backup. SCW closure\\nremains cross-repository work throughout these transitions. Retain **SCW TEM**\\nuntil its replacement is validated. Do not delete shared MatchID SCW resources\\nor historical audit evidence as part of Immo/Geo cleanup.\\n\\n[FACT] Preproduction RAW has completed parity and the API is rebound to\\n`PP-RAW-OVH`; the old identity is fenced/recovery-only. DOCS inventories show\\npreprod MinIO at 144,193 objects / 28.34 GB and production SCW `docs-pocs` at\\n59,017 / 12,534,514,457 B. The OVH bucket and Secret are provisioned; guarded copy\\ntooling is committed on `chore/scw-final-sweep` through `be362561`.\\n\\n[FACT · owner decision] The current production source is the exact initial\\ncanonical reference. Both OVH prod and preprod must converge to the same 59,017\\nkeys and hashes. The preprod surplus is non-canonical and must not be migrated.\\nSequence: manifest diff → canonical set → selective copy → exact parity → recovery\\nproof → recoverable removal of all MinIO. Copy/parity/rebind are not complete;\\nthe launched production migration has no reported outcome. TEM remains retained.\\n\\n[FACT] The current platform audit measured three b3-8 nodes. One node exposes\\n1,840m CPU / 5,907.82 Mi allocatable; workload requests total 4,095m / 8,442 Mi,\\nwhile current pod memory is 5,273 Mi. Required CoreDNS, konnectivity and Traefik\\nanti-affinity cannot be satisfied on one node. Sixteen PVCs include 15 Cinder RWO.\\nT3 is **NO-GO today**: first complete T2, rightsize, reconcile constraints, then\\nprove a controlled two-node state before attempting one-node preprod acceptance.\\n\\n## Requested report period and billing-last direction\\n\\n[FACT] The last cost report merged on `origin/main` ends August 9. The joined\\nwindow is therefore **August 10 through September 13 inclusive**, America/Toronto:\\n`2026-08-10T00:00:00-04:00` to `2026-09-14T00:00:00-04:00`, 35 days / 840 hours.\\nThis is a repository-report boundary; no claim is made about an external invoice\\nthat is absent from the repository.\\n\\n[FACT · owner] Billing comes last. The infrastructure basis is exactly one b3-8\\nBHS5 projection at `0.082 CAD/h`: `840 × 0.082 = 68.88 CAD`. The observed two-\\nand three-node cluster costs are platform pass-through/internal costs and are not\\nbillable in this projection.\\n\\n[FACT · owner] LLM allocation retains the preceding report method and unit basis:\\ntwo Claude seats and one ChatGPT Pro seat at 200 USD/month each, measured seven-\\nday provider capacity, USD→CAD 1.37 and LLM margin ×1.15. The dated token audit\\nrecords actual window totals and deduplication; it is an allocation calculation,\\nnot a provider invoice line.\\n","transitions-target":"# Sequential target architecture — T1 → T2 → T3\\n\\nRevision D6, 2026-09-13. The three diagrams are deliberately different kinds of\\nstate: the first is the **effective transition snapshot** on September 13; the\\nsecond and third are **after targets, not deployed**. The unchanged IDs identify\\nthe same logical or physical resource between views. A production role marked\\n`binding TBD` is a target contract, not observed runtime. Preproduction evidence\\nstill precedes any separately gated production promotion.\\n\\n## Effective transition — T1 validation + partial T2 storage migration\\n\\nGraphify 0.18.0 is integrated and Luna high is selected. The first Kubernetes\\nrun reached the workload but stopped **before any LLM call**: the selected input\\nwas HTML, while the extraction contract requires a PDF. This is useful runtime\\nevidence, not T1 acceptance. In parallel, `PP-RAW-OVH` has passed parity and is\\nthe active API raw binding. `PP-DOCS-OVH` and its Secret are provisioned and the\\ninventory is running; copy tooling is committed, but document copy, parity,\\nrecovery and rebind remain open. The inventory snapshot finds 144,193 / 28.34 GB\\nin preprod versus 59,017 / 12,534,514,457 B in production `docs-pocs`. By owner decision,\\nproduction is the exact initial canonical reference: the target is those same\\n59,017 keys and hashes in OVH prod and OVH preprod. The preprod surplus is\\nnon-canonical and must not be copied. Production audit/migration has\\nstarted without a completed outcome. The detailed causal pipeline is in\\n[`proposal.md`](proposal.md).\\n\\n```mermaid\\nflowchart TB\\n  subgraph T1_CARD[\\"TRANSITION EFFECTIVE · 2026-09-13 · partial, not accepted\\"]\\n    T1_CHANGE[\\"DONE / VERIFIED<br/>Graphify 0.18.0 integrated; Luna high selected<br/>PP-RAW parity + OVH rebind\\"]\\n    T1_KEEP[\\"KEPT<br/>PP-DB, PP-GRAPH, API/UI/MCP, Geo evidence<br/>MinIO documents/history + SCW TEM\\"]\\n    T1_REMOVE[\\"NOT REMOVED<br/>Workstation/admin path and MinIO retained until their gates pass\\"]\\n    T1_GATES[\\"OPEN GATES<br/>Retry T1 with a real PDF → typed Signal + exact PDF → schedule<br/>DOCS diff → PROD canonical 59,017 → selective copy → exact keys+hashes → recoverable MinIO removal\\"]\\n    T1_EVIDENCE[\\"OBSERVED<br/>First K8s run failed before LLM: .html input, PDF required<br/>DOCS PP 144,193/28.34 GB vs canonical PR 59,017/12,534,514,457 B\\"]\\n  end\\n  user[\\"User / browser\\"]\\n  ppurl[\\"preprod.immo.sent-tech.ca<br/>verified access as-of 2026-09-13\\"]\\n  prurl[\\"immo.sent-tech.ca<br/>verified access as-of 2026-09-13\\"]\\n  user --> ppurl\\n  user --> prurl\\n  subgraph OVH_CLUSTER[\\"[OVH-CLUSTER] OVH BHS shared Kubernetes · observed 3 b3-8 nodes · NOT T3\\"]\\n    edge[\\"Traefik / TLS / tenant isolation<br/>shared capacity and safety constraints\\"]\\n    subgraph immo_tenant[\\"Immo tenant · application ownership\\"]\\n      subgraph immo_pp[\\"PREPRODUCTION · first acceptance\\"]\\n        PP_UI[\\"[PP-UI] Immo frontend\\"]\\n        PP_API[\\"[PP-API] Immo API\\"]\\n        PP_MCP[\\"[PP-MCP] OAuth remote MCP\\"]\\n        PP_DB[(\\"[PP-DB] same PostgreSQL/PostGIS\\")]\\n        PP_REFRESH[\\"[PP-REFRESH] K8s validation workload<br/>first run stopped pre-LLM on .html input\\"]\\n        subgraph ppminio[\\"[PP-MINIO] retained for documents/history until T2 gates\\"]\\n          PP_RAW[(\\"[PP-RAW] old raw identity<br/>fenced/recovery after OVH rebind\\")]\\n          PP_DOCS[(\\"[PP-DOCS] empty API documents fallback\\")]\\n          PP_DOCS_LEGACY[(\\"[PP-DOCS-LEGACY] useful replay/history<br/>partial inventory · retained for T2\\")]\\n        end\\n      end\\n      subgraph immo_pr[\\"PRODUCTION · promote only after preprod\\"]\\n        PR_UI[\\"[PR-UI] Immo frontend\\"]\\n        PR_API[\\"[PR-API] Immo API\\"]\\n        PR_MCP[\\"[PR-MCP] OAuth remote MCP · target role\\"]\\n        PR_DB[(\\"[PR-DB] target database role<br/>physical binding TBD / UNVERIFIED today\\")]\\n        PR_REFRESH[\\"[PR-REFRESH] target autonomous CronJob<br/>physical binding TBD / UNVERIFIED today\\"]\\n        PR_OBJECT_GAP[\\"Production object audit/migration<br/>launched in parallel · outcome UNKNOWN\\"]\\n      end\\n    end\\n    subgraph geo_tenant[\\"Geo tenant · geographic inputs and products\\"]\\n      PP_GEO[\\"[PP-GEO] Geo API preprod\\"]\\n      GEO_API[\\"[GEO-API] Geo API production\\"]\\n      GEO_DB[(\\"[GEO-DB] geographic DB role<br/>API dependency UNVERIFIED\\")]\\n      GEO_PROCESS[\\"In-process capture / normalize / joins<br/>no invented SQL spatial join\\"]\\n    end\\n    pidp[\\"preprod.auth.sent-tech.ca orage can support a bounded test; durable\\ncredential refresh and its unique writer remain design/operations questions.\\nNo credentials were read, copied or provisioned during this inspection.\\n\\n## Graphify peer handoff and revision boundary\\n\\n[FACT] At 12:47 UTC `codex:graphify:01a09ac48ec1` reported CI and package-install\\ntests green at #330\'s **older** `ed0bb7da` and three review fixes underway:\\nlate cancellation, validation rejected before generation for a plain LlmMesh,\\nand fenced-JSON handling. Envelope `env:lot-c-icond-successor:1789303674215`.\\nThe newer public SHA above had checks in progress; old green checks do not\\nattest the new revision.\\n\\n[FACT] That peer reports an i-cond-accepted **ESM-only**\\n`@sentropic/graphify/llm-mesh` subpath (`types` + `import`, no `require`), four\\nruntime exports plus option types, with the root CJS entry preserved. Public\\nexports include `createGraphifyMesh`, `classifyRouteFailure`,\\n`meshTextJsonClient`, and `textClientToCallLlm`. The installed published package\\nand Immo integration still need acceptance on the final release SHA.\\n\\n[FACT] The peer was informed of the owner\'s new gate: **no Immo B2 consumer\\nimplementation, migration or deployment before the decision dossier**.\\nEnvelope `env:architecture-owner-gate:1789303843856`.\\n\\n## Unresolved facts, not permission to implement\\n\\n- OVH production Immo runtime inventory remains RBAC-blocked; see the\\n  [storage audit](storage-audit.md). The old SCW cluster is excluded.\\n- API bucket contents and all writers are not inventoried: target bucket names,\\n  migration volume, retention and rollback duration must not be invented.\\n- Exact upstream release availability and cross-package tests remain gates.\\n- Served Signal freshness and PDF resolvability require separate end-to-end\\n  acceptance; scrape success, lowercase PG nodes and dry-run candidates do not\\n  establish either.\\n- Owner decision: retain SCW TEM until an explicitly validated replacement.\\n","storage-audit":"# Effective storage audit — 2026-09-13\\n\\nScope: read-only inspection of current remote main, migration PR state and\\nwhitelisted Kubernetes configuration. No Secret values, object contents, data\\nmigration, deployment or permission changes.\\n\\n## Baseline and migration status\\n\\nImmo `origin/main` was freshly fetched and remains\\n`097036783006226afea53a6b49383bf70890774f`. A branch name or PR title is not\\nevidence of a merged or deployed change.\\n\\n| Change | State at inspection | Actual scope |\\n| --- | --- | --- |\\n| [#671](https://github.com/rhanka/radar-immobilier/pull/671) | In main, merge `7d85ec07` | Application image registry → GHCR; not S3 migration |\\n| [#672](https://github.com/rhanka/radar-immobilier/pull/672) | In main, `c64db578` | Obscura image → public upstream; not S3 migration |\\n| [#674](https://github.com/rhanka/radar-immobilier/pull/674) | In main, `ad26c3a2` | Pins the still-required MinIO image to Quay |\\n| [#675](https://github.com/rhanka/radar-immobilier/pull/675) | In main, `ae62a649` | Production refresh overlay, release-gated; explicitly retains SCW storage TODO #670 |\\n| [#677](https://github.com/rhanka/radar-immobilier/pull/677) | In main, `09703678`; bindings observed in preprod | Both preprod refresh CronJobs → OVH `radar-immobilier-graph-preprod`; does not repoint the API |\\n| [#670](https://github.com/rhanka/radar-immobilier/pull/670) | **OPEN, DRAFT, not merged**; remote head `ae129e1077c871faa115b425c920202a53bc186e` | Remaining reference cleanup; executable S3 coordinates still TODO; MinIO and SCW TEM deliberately retained |\\n\\nThe #670 inventory and PR body explicitly require: OVH bucket provisioned →\\nobjects migrated → clients repointed → MinIO manifests removed **last**, in a\\nseparate gated change. They describe MinIO as still load-bearing in both\\nenvironments on September 11; this is historical operational evidence, **not**\\na fresh production runtime observation. SCW transactional email was retained by\\nowner decision, pending an approved replacement.\\nThe owner explicitly reconfirmed that exception on September 13 during this audit.\\n\\nThe #677 overlay comment claiming the refresh bucket is also the application\'s\\nbucket contradicts the live API ConfigMap below. The executable patch only\\ntargets the two CronJobs. Its historical mirror count is not re-attested here.\\n\\n## Effective preproduction configuration\\n\\nOVH endpoint verified: `https://hlhedx.c1.bhs5.k8s.ovh.net`.\\nNamespace: `radar-immobilier-preprod`. Checks repeated at 12:33–12:37 UTC.\\n\\n| Consumer/resource | Observed binding | Qualification |\\n| --- | --- | --- |\\n| `radar-minio` | StatefulSet, ready replicas **1**; Quay image digest | Still deployed, not removed |\\n| `radar-api` default store | `http://radar-minio:9000`, bucket `radar-immobilier-raw`, region `fr-par`, path-style `true` | Live ConfigMap imported by Deployment; no endpoint/bucket env override |\\n| `radar-api` scrape reader | Same MinIO endpoint; code-default bucket `radar-immobilier-docs` | Derived from absence of `SCRAPE_S3_*` overrides; bucket existence/access not tested |\\n| `radar-api` mapped PV reader | `GEO_DOCUMENTS_REPOINT=1`; OVH `sentropic-geo` | Live Deployment; primary CAS prefix `raw/pv-index/cas/`, no Immo fallback for mapped candidates |\\n| `radar-refresh-scrape` | OVH `radar-immobilier-graph-preprod`, `bhs`, path-style `false` | Enabled; last scheduled Sep 13 03:17, last successful Sep 13 06:13:54 UTC |\\n| `radar-refresh-projection` | Same OVH bucket; `GRAPH_S3_*` take precedence over inherited fallbacks | Enabled; last scheduled Sep 13 04:30, **last successful Sep 11 04:30:13 UTC** |\\n| `radar-immo-mcp` | Separate `immo-mcp-config`; no S3 endpoint/bucket overrides observed | Do not infer a direct bucket dependency from the API image alone |\\n| Grounding Job 41 | Absent from current Job inventory | SCW → MinIO remains in main\'s on-demand template; **not an observed active pipeline** |\\n| `radar-preprod-snapshot-restore` | Completed Job; OVH snapshot bucket; retained SCW snapshot-tools image reference | Historical completed Job, not an active PV component or proof of ongoing SCW image pulls |\\n\\nAPI/UI/MCP live image tag: `8e18f01`. Configuration observation does not establish\\nrequest success, object coverage, or a running process\'s refreshed environment.\\nCronJob `lastSuccessfulTime` is controller status, not proof of fresh signals.\\nThe projection timestamp does not establish the cause of its more recent lack\\nof recorded success; no remediation is part of this architecture task.\\nCurrent main also confirms that the direct scrape feed writes lowercase node\\ntypes while the Signal routes select exact `Signal`/`DesignationEvent` types.\\nScrape success alone is therefore not a fresh served-signal acceptance criterion.\\n\\n## Production: explicit evidence gap\\n\\nThe current main API base still names MinIO. Production refresh still names\\nScaleway for graph projection; scrape endpoint/bucket use Secret references.\\nThe old GitHub Actions grounding publisher still exists on main. **None of these\\nfacts proves those paths are currently executed in production.**\\n\\nThe available OVH Geo credential is `system:serviceaccount:geo:ci-deployer`;\\nproduction Immo workload listing is RBAC-denied. No permission changes attempted.\\nA read-only request was delivered through h2a to the existing k8s agent:\\n`claude:poc-k8s:bc26801997f1`, envelope `env:1789302953010:a370`.\\nNo reply had arrived when this audit was written.\\n\\nThe default local kubecontext points to **the old SCW cluster**, not OVH. Its\\nretained/suspended Immo resources are deliberately excluded from today\'s\\nproduction architecture. Do not confuse a reachable old API server with the\\ncluster serving `immo.sent-tech.ca`.\\n\\nRequired completion evidence: timestamped OVH `radar-immobilier` workload\\ninventory and allowlisted non-secret S3 bindings, ConfigMap references,\\nCronJob schedules/suspension and image identities. An existing authorized\\nread-only kubeconfig or the k8s operator\'s sanitized output is sufficient.\\n","service-provenance":"# Service pictograms and repository responsibility\\n\\nPresentation decision, September 13: use local blue SVG service pictograms with\\nexplicit service names and repository labels, following the owner\'s reference.\\nThis reversible presentation change does not change the architecture or decide\\nany open implementation option. Pictograms are original generic vectors, not\\nvendor logos: an S3 icon does **not** imply AWS, nor a DB icon Google Cloud SQL.\\n\\n`repo:` identifies the repository responsible for the represented code, workload\\nmanifest, client binding or transformation. The smaller role line disambiguates\\nthese responsibilities. It does **not** certify deployment or bucket creation.\\nExternal actors/sources/providers have no generating repo. Unassigned credential\\noperations stay `repo: à décider`; no secret service or owner is invented. Target\\nproduction bindings are repo-owned roles marked TBD, not asserted runtime objects.\\n\\n| Component family | Repository and evidence |\\n| --- | --- |\\n| Immo UI, API, PG, MinIO, CronJobs, four PV stages | `radar-immobilier` main `09703678`: `deploy/k8s/kustomization.yaml`, `20-postgres-postgis.yaml`, `25-minio.yaml`, `refresh-cronjobs/`, `api/src/config.ts`, `tools/graphify-v23/`, `tools/grounding/` |\\n| OVH Immo refresh bucket | Immo client configuration in `refresh-cronjobs/kustomization.yaml`; creation/provisioning not attributed by this audit |\\n| Geo API, PostGIS, S3 bindings, capture, joins, sync | `geo` main `f68d8ddf`: `deploy/k8s/`, `acquisition/config/s3-target.json`, `packages/geo/src/zonage/lotZoneJoin.ts`; bucket creation outside audit |\\n| Shared cluster, ingress/TLS, namespace envelopes | `poc-k8s` local `03acdfd`: `platform/overlays/ovh/`, `tenants/`; this is not the older remote main |\\n| SSO application and its PostgreSQL | `sentropic`: `deploy/k8s/base/{35-auth-idp,20-postgres}.yaml`, included by base kustomization; local HEAD `97fe9f53e8079694e35771227c11544ce8658316`, read September 13 for ownership only. `poc-k8s/tenants/sentropic-preprod/README.md` explicitly assigns workloads to Sentropic |\\n| Published Graphify library | `graphify` 0.18.0; consumer/integration remains `radar-immobilier`. A library dependency is not a transfer of the PV chain to Graphify |\\n| Effective transition / after targets | `transitions-target.md`; Immo/Geo application roles retain their repos, shared cluster roles use `poc-k8s`; `PP-RAW-OVH` is active, DOCS convergence nodes remain gated, and target production bindings stay qualified |\\n| DOCS convergence | `radar-immobilier` owns manifest diff, exact production canonical set, guarded selective copy, keys/hash parity and recoverable MinIO removal; SCW/OVH are storage locations, not code provenance |\\n| Release/copy and mixed Geo views | Both `radar-immobilier` and `geo` where the box combines their operations; individual child boxes retain their specific repo |\\n\\nThe explicit map in `focus/service-provenance.js` covers every leaf and group;\\nunknown IDs fail the build. Shared resource IDs reuse the same attribution across\\nall views, including the three transition states and T1 detail. The detailed inspector exposes the evidence\\npath. This complements the dated runtime register in [architecture](../architecture.md),\\nnot a new live audit. MinIO remains shown during transition until exact DOCS\\nparity/recovery; the owner\'s SCW TEM retention exception is unchanged. No target view uses the\\n`unknown` icon or a permissive provenance fallback; an unmapped ID fails closed.\\n","decision-reviews":"# Decision dossier review records\\n\\nStatus: Codex completed; Opus unavailable due to the native account\'s weekly\\nlimit. **Not consensus, not owner approval.** No retry through a different account.\\n\\n- Codex pass: `h2a run` via MCP, `immo-decision-codex-d1`, runtime-attested\\n  `gpt-6-astra`, high effort; read-only inline D1 dossier and continuation audit.\\n- Opus pass: `h2a run` via MCP, `immo-decision-opus-d1`, native `opus` alias,\\n  requested effort high; same packet, no access to the Codex response. Launch\\n  succeeded but execution exited 1: weekly limit; **no Opus review produced**.\\n- No renderer implementation, new proposal scene or live cluster was independently\\n  tested by those text-only reviews. [Codex\'s actual findings](decision-review-codex.md)\\n  are preserved, not replaced by this reconciliation.\\n\\n| Codex finding | Reconciliation in D2 | Remaining gap |\\n| --- | --- | --- |\\n| H1: production/shared-consumer inventory too late | G0 covers every affected consumer; G5 only verified preprod-exclusive resources | Actual inventory |\\n| H2: credential continuity lacks a gate | G1b refresh/restart/recovery + exclusive credential writer before durable operation | Operated identity contract and tests |\\n| H3: recovery consistency undefined | Coordinated write fence; graph hash, SQL checkpoint and evidence set; intervening-write policy required | Owner RPO/RTO and restore rehearsal |\\n| M4: SCW storage/images not covered by MinIO gate | Executable dependency inventory/replacement and rollback-image checks added; TEM excluded | Complete inventory and migration evidence |\\n| M5: A\'s comparative advantage unproven | A remains provisional; compare all options against identical acceptance boundaries | Current work/effort and urgency evidence |\\n| M6: selection versus presentation ambiguity | D2 explicitly requests framing review, not option selection or approval | Owner decision remains separate |\\n\\n**Self-audit:** FACT/JUDGMENT and sources, symmetric advantages, strongest\\ncounter-case, overturn condition, pre-mortem, presenter/owner interest and no\\nfabricated acceptance are present. Coverage gaps remain explicit. Independent\\nOpus pass is missing, so the dossier stays **INCOMPLETE**. The Codex verdict was\\n\\"Suitable for presentation as INCOMPLETE; insufficient for an execution decision.\\"\\n\\nThe earlier owner-requested Gemini review **did complete via h2a run agy**,\\nrequested `gemini-3.8-flash-high`, effort high, against architecture `2ab8da2b`.\\nIt found ten issues (NEEDS CHANGES). [Raw findings](gemini-review/response-findings.md)\\nand [individual reconciliation](gemini-review/review-inline.md) remain available.\\nIt is not a review of D1 or an attestation that the production cluster was inspected.\\n\\nTrack\'s read-only AWAITED query returned no rows for the root workspace at main\\n`09703678`. This branch forbids `.track` writes; no decision ID, comprehension\\nattestation or owner acceptance has been minted. Registration with the existing\\nTrack single writer remains a handoff, not an implicit scope expansion.\\n","decision-review-codex":"# Independent Codex review — D1\\n\\nRequested through h2a, native Codex `gpt-6-astra`, high effort; session\\n`01a09ad4-3951-7d73-86e2-8d01ab18c1dd`. Text-only review of dossier D1 and the\\ncontinuation audit, before the renderer was tested. Verbatim response follows.\\n\\nVerdict: **Suitable for presentation as INCOMPLETE; insufficient for an execution decision.** The packet clearly distinguishes proposals, reported results and unresolved evidence. Its preference for A is provisional, not yet supported by enough comparative evidence to select a delivery sequence. This review assesses only the inline packet; linked sources and runtime claims were not independently verified.\\n\\n1. **High — Retirement scope and production gate ordering are ambiguous.**\\n\\n   Exact passage (§6): “**G5** MinIO removal only after no clients remain → **G6** separate production inventory/backup/promotion.”\\n\\n   If G5 concerns only a verified preprod-exclusive instance, this ordering may be sound. If any resource or client is shared with production, the required inventory comes too late. The packet does not establish which case applies.\\n\\n   Specify each gate’s environment and resource scope. Require inventory and acceptance from every affected consumer before deleting a resource; retain a separate production promotion gate. This finding identifies an ambiguity, not an assertion that production uses PP-MINIO.\\n\\n2. **High — Credential continuity is recognized but lacks an explicit acceptance gate.**\\n\\n   Exact passage (continuation evidence): “durable credential refresh and its unique writer remain design/operations questions.”\\n\\n   G1 can succeed using ephemeral credentials without establishing that autonomous operation survives refresh, restart or workload replacement. Neither option A nor B resolves this merely by choosing an orchestration model.\\n\\n   Before durable autonomous operation, require an agreed credential owner, persistence contract, exclusive refresh-writer mechanism, and refresh/restart/recovery acceptance evidence. A bounded ephemeral test remains a reasonable earlier step; it cannot qualify ongoing operation.\\n\\n3. **High — Rollback depends on an undefined consistency boundary.**\\n\\n   Exact passage (§6): “restore the captured graph/DB checkpoint and reconcile objects before routing clients back.”\\n\\n   The packet does not define how graph state, SQL projection and referenced evidence objects form a consistent recovery point, or how writes after that point are handled. Object parity alone cannot establish application consistency.\\n\\n   Describe the proposed checkpoint boundary, writer fencing, treatment of intervening writes, and recovery acceptance conditions. A coordinated write pause may simplify this; versioned objects and replayable checkpoints may reduce downtime but add complexity. The owner’s recovery envelope should determine the choice.\\n\\n4. **Medium — The retirement gates do not cover the entire fixed dependency-removal objective.**\\n\\n   Exact passage (§1): “eradicate MinIO and SCW storage/image dependencies, **retain SCW TEM until a replacement is validated**.”\\n\\n   The explicit removal gate addresses MinIO. SCW storage and image dependencies lack corresponding inventory, replacement and retirement criteria. The stated exclusion of old SCW resources also limits what this packet can establish.\\n\\n   Either bound this dossier to an initial retirement tranche and identify the remaining decision surface, or add explicit coverage for those dependencies. Preserve TEM’s existing exclusion without reopening the owner’s decision.\\n\\n5. **Medium — A’s comparative advantage remains unestablished.**\\n\\n   Exact passages (§4–5): “Medium integration + migration; unpriced”; “Highest initial engineering scope; unpriced”; “B can be cheaper overall if the DAG integration is already close to ready.”\\n\\n   These judgments are honestly labeled, but relative effort and readiness are precisely what could overturn A. The reported candidate dry run supports extraction progress; it does not establish reusable publication, recovery or orchestration readiness.\\n\\n   Compare remaining work against the same acceptance boundary: fresh served Signals, resolvable evidence, exclusive writers, durable credentials and recovery. A is stronger if those contracts already exist and can be reused. B is stronger if establishing them constitutes most of A’s work anyway. C is stronger if verified storage urgency dominates refresh delivery.\\n\\n6. **Medium — Presentation and eventual decision need distinct, explicit asks.**\\n\\n   Exact passages (§1 and §8): “Decide the **delivery sequence**”; “This **incomplete presentation does not request approval**.”\\n\\n   The disclaimer prevents execution authorization, but the opening can still suggest that selecting A/B/C is expected now. Clarify that this presentation requests review of the framing and missing criteria; sequence selection remains pending evidence and an explicit owner decision. Neither viewing the page nor expressing a provisional preference should satisfy that later gate.\\n\\nBeyond downtime, RPO/RTO and retention, missing owner criteria include:\\n\\n- Relative priority and deadlines for autonomous refresh versus dependency retirement.\\n- Acceptable duration and operational burden of workstation dependence.\\n- Budget or effort ceiling, including tolerance for temporary orchestration rework.\\n- Required freshness, coverage and evidence availability for initial acceptance.\\n- Who accepts the affected Immo, Graphify, Geo and poc-k8s contracts.\\n\\n**Safe to present as INCOMPLETE: yes**, with these findings visible and unresolved. It provides a useful decision frame without inventing production details. It does not authorize implementation, migration, package integration, infrastructure startup or deployment.\\n","README":"# Local Focus architecture dossier — D7\\n\\nThe entry point is [decision-dossier.md](decision-dossier.md), with the preserved\\nBEFORE state in [architecture.md](../architecture.md), the complete AFTER target\\nin [transitions-target.md](transitions-target.md) and supporting transition facts\\nin the [storage audit](storage-audit.md).\\nThe owner-facing page uses the September 7 Sentropic decision-kit format: DS\\nAppShell/ThemeProvider, Focus orthogonal routing and **native SvelteFlow**, not a\\nMermaid SVG wrapped in an HTML card. The local service-node renderer extends the\\nreference presentation with icons/repo labels and preserves its exact port contract.\\n\\nFrom the documentation worktree:\\n\\n```sh\\nmake -f docs/architecture/focus/Makefile tokens test build ENV=test-architecture\\nmake -f docs/architecture/Makefile serve ENV=docs-architecture\\n```\\n\\nOpen **http://127.0.0.1:5188/**, generated **decision-focus.html**, or the committed\\n**architecture-before-after-2026-09-13.html** monthly copy directly.\\nThe HTML embeds JS, CSS, French presentation and complete source/review documents;\\nit works offline and does not require a Claude session, server or external CDN.\\nThe same build emits the dated interactive architecture HTML, report HTML/PDF,\\ntoken audit and D7 evidence manifest under `docs/reports/architecture-monthly/`.\\n\\n## Navigation and authority\\n\\n- Eight architecture-first sections and exactly two primary graph views:\\n  **Architecture AVANT → Architecture APRÈS**. Transition facts remain prose and\\n  gates, not a third graph. The default is BEFORE.\\n- All components, edges and nested boxes are shown **simultaneously**. Every\\n  Mermaid subgraph maps to a native SvelteFlow `parentId` box with its original ID.\\n  Click a box or use its selector to zoom; no content is collapsed or replaced.\\n- Select `PP-DB`, `PP-GRAPH`, etc. to zoom to it and cross-link to the same identity\\n  in another diagram. External relationships retain original source/target IDs.\\n- Mermaid source is **rendered visually**, both beneath the SvelteFlow and in\\n  embedded source documents; exact code remains available. Two strict, sanitized\\n  SVGs are generated locally and embedded offline, with exact node/group/edge text\\n  checks. Mermaid\'s global `htmlLabels:false` retains SVG text under sanitization.\\n- Every component and nested box has a blue service pictogram, a service name and\\n  a `repo:` label with its role. [Attribution evidence](service-provenance.md)\\n  distinguishes workload manifests, client configuration, external actors and\\n  unresolved ownership. These are generic symbols, not cloud-vendor logos.\\n- Every node/edge/subgraph is covered by tests; dashed and bidirectional semantics\\n  are preserved. Full-diagram fitting uses explicit absolute nested bounds.\\n- Section 6 asks three explicit questions before nine selectable Focus options,\\n  with one comment per question, local persistence, actual **copy JSON** and\\n  download. The LLM ratification question is non-critical and remains open unless\\n  selected; fixed architecture/storage decisions are exported unchanged.\\n  Clipboard denial is explicit; the JSON remains keyboard-selectable/downloadable.\\n- Sources open in an accessible dialog; external evidence links require a click.\\n- The D7 dossier remains **INCOMPLETE** for T1 acceptance, DOCS copy/parity/rebind,\\n  completed production migration and T3. Rendering is not deployment.\\n\\n## Build and verification\\n\\nBuilds run in Docker, without host Node or installs. `KIT_ROOT` defaults to\\n`/home/antoinefa/src/sentropic/.tmp/focus-cluster-mesh-decision-kit`, mounted\\n**read-only** with its existing dependencies. Override it with that kit on another\\nworkstation. This absolute kit dependency is a disclosed portability gap. The\\ngenerated manifests record source hashes and component provenance.\\nThis is a standalone Focus-format host, not the live Track dashboard or its transport.\\nMermaid prerendering needs the isolated local Chromium debugger on port 9238 and\\nthe existing pinned bundles in `vendor/` (available through the older `assets`\\ntarget). The browser renderer blocks HTTP(S); no remote rendering service is used.\\n\\n```sh\\nmake -f docs/architecture/focus/Makefile browser ENV=test-architecture\\nmake -f docs/architecture/focus/Makefile clipboard ENV=test-architecture\\nmake -f docs/architecture/focus/Makefile report-check ENV=test-architecture\\n```\\n\\n`browser` verifies both complete diagrams at their root viewport, visible\\nnested bounds, every icon/repo label, card/header overflow, exact SvelteFlow/Mermaid\\ntexts, before/after navigation, explicit questions/options, fixed decisions,\\ncomments, actual JSON copy, responsive\\nand offline use.\\n`clipboard` checks actual clipboard read-back in a fresh browser context, then\\nrestores its previous contents and disposes only that test context.\\nNo API/UI/DB application stack or data volume is started or modified.\\n\\nGeometry checks prevent node overlap, out-of-parent bounds and routes through\\nunrelated nodes. **Zero edge/label/arrow overlap is not certified**; dense views\\noffer zoom and exact relationship details. This is not a live-data certification.\\nThe generated HTML, build output and screenshots are ignored by Git. The old\\nFocusSnapshot/Mermaid prototype remains at `/architecture.html` for historical\\ncomparison; it is superseded and is not the owner-requested decision surface.\\n","focus-verification":"# Focus dossier verification — D6 — 2026-09-13\\n\\nDocumentation worktree: `docs/architecture-platform`.\\n\\n| Check | Result | Boundary |\\n| --- | --- | --- |\\n| Token audit | PASS | Exact 2026-08-10 00:00−04 → 2026-09-14 00:00−04 window; Claude/Codex deduplicated |\\n| Static tests | 9/9 PASS | Mapping, nested bounds, exact edges, decisions JSON, provenance |\\n| Architecture views | 8/8 PASS | 232 leaf nodes, 232 edges, 39 nested subflows |\\n| Three-state entry | PASS | Default `target-1`; Avant → Transition effective → Après T2 → Après cible |\\n| Mermaid | 8/8 PASS | Strict sanitized SVG; all node/group labels retained; network blocked |\\n| Native SvelteFlow | PASS at 47 viewports | Every node/edge/`parentId` subflow simultaneous; no clipping |\\n| Service icons / provenance | 271/271 occurrences | Every leaf and parent maps to service plus repo/evidence |\\n| DOCS owner rule | PASS | Prod SCW 59,017 keys+hashes is exact canonical reference; surplus PP excluded |\\n| Browser | PASS | 1440×1100 + 390×844; offline Focus; zero external requests/runtime errors |\\n| Clipboard | PASS | D6 JSON read back; no option; exact fixed facts and amounts |\\n| Report PDF | PASS | A4, 5 pages, tagged, no JavaScript; required period/corpus/total text extracted |\\n| Report HTML | PASS | Static state strip plus effective and final Mermaid SVGs |\\n| Diff | PASS | `git diff --check` |\\n\\nReplay:\\n\\n```sh\\nmake -f docs/architecture/focus/Makefile tokens test build browser clipboard report-check ENV=test-architecture\\n```\\n\\nThe effective transition claims only what is observed: Graphify 0.18.0 and Luna\\nhigh selection, a first Kubernetes failure before LLM on an HTML input, RAW OVH\\nparity/rebind, DOCS provisioning/inventory and committed copy tooling. It does\\nnot claim a successful LLM run, DOCS copy/parity/rebind, completed production\\nmigration or T3 start.\\n\\nDOCS converges through manifest diff → exact production canonical set → guarded\\nselective copy → 59,017 keys/hash equality on OVH prod and preprod → recovery\\nproof → recoverable removal of all MinIO. The 144,193-object preprod population\\nis not a source of truth and its surplus is not migrated. SCW TEM remains.\\n\\nBilling is fixed to August 10 through September 13 inclusive (35 days / 840 h).\\nOne b3-8 at 0.082 CAD/h projects to 68.88 CAD; two/three-node platform costs are\\nexcluded. The measured LLM allocation is 251.215438 CAD and the indicative sum\\nis 320.095438 CAD. The longer correct window is not forced downward against the\\nlogs; uncertainty and prior-method reuse are explicit.\\n","focus-service-review":"---\\nstatus: selection-failed\\nreview-author:\\n  host: codex\\n  model: unknown\\n  effort: unknown\\ntarget-ref: \\"8d3da5b67943c390f820f1ea98e8a8a1c89c4260:docs/architecture/focus/\\"\\nlegs: []\\nobserved-failure: \\"Exact author model and effort are not attested in this turn\'s available metadata; the owner-requested astra nickname does not attest execution identity. Reviewer selection stopped before dispatch, as required by harness/review.\\"\\n---\\n\\n# Service presentation review boundary\\n\\nScope: the September 13 service icons, repository attribution and Mermaid label\\ncorrection, through the committed target above. No independent leg was launched,\\nand no consensus verdict is claimed. Local rendering/regression checks are recorded\\nseparately in [verification](focus-verification.md); they are not peer review.\\n\\nThis selection failure does not replace or erase the earlier Codex findings or\\nOpus quota failure in [the decision review register](decision-reviews.md).\\nThe architecture dossier remains incomplete and does not authorize refactoring,\\nstorage migration or deployment. This is a local documentation handoff, not a\\nmerge-ready or independently approved implementation.\\n","response-findings":"# Independent Architecture Review: Immo, Geo, and Kubernetes Storage/Pipeline Topology\\n\\n**Review Target:** Immo, Geo, and Kubernetes Architecture Document (Snapshot: 2026-09-13, 11:38 UTC, commit baseline `2ab8da2b`).  \\n**Review Type:** Adversarial Text-Only Third-Party Technical Audit.  \\n**Auditor Mode:** Independent Third-Party Reviewer (requested via `h2a run agy`).\\n\\n---\\n\\n## 1. Verdict\\n\\n### **NEEDS CHANGES**\\n\\nWhile the prose in §§1–5 and the Resource Register (§3) display rigorous intellectual honesty regarding unverified overrides and transitional duct tape, **Diagrams 1, 2, and 3 fail to provide an unambiguous, self-contained visual mapping of the physical DB/S3 resources and reader/writer contracts.** \\n\\nA human relying primarily on the diagrams cannot reliably trace physical bucket/prefix identities, encounters severed execution pipelines, faces contradictory tenant/environment subgraph boundaries, and cannot deduce the exact storage paths for critical runtime flows (notably the live PDF repoint and the grounding-to-projection disconnect).\\n\\n---\\n\\n## 2. Numbered Findings\\n\\n### Finding 1: Severed Stage 3 (Grounding) to Stage 4 (Projection) Pipeline\\n* **Severity:** **CRITICAL**\\n* **Exact Location:** Diagram 2 (`[PP-PUBLISH]`, `[PP-GROUND]`, `[PP-PROJECT]`, `[PP-GRAPH]`), §2, §3.\\n* **Reasoning:** In Diagram 2, `PP_PUBLISH` (Job 41) is shown writing `graph/` to `PP_GROUND` (`radar-immobilier-docs-preprod` on in-cluster MinIO). However, `PP_PROJECT` (Stage 4) reads `graph/` exclusively from `PP_GRAPH` (`radar-immobilier-graph-preprod` on OVH S3). \\n  - `PP_GROUND` is a visual and architectural dead-end with no downstream consumer.\\n  - `PP_GRAPH` has no automated cluster-side writer for `graph/`; the only incoming edge is an unverified, dashed workstation line from `WS_IMMO`.\\n  - A human operator reading Diagram 2 would assume the preproduction grounding pipeline feeds the projection pipeline. In reality, the preprod pipeline is completely fractured across two distinct physical storage providers (MinIO vs. OVH S3) with no bridge.\\n* **Minimal Remedy:** Annotate `PP_GROUND` in Diagram 2 with an explicit dead-end warning (`[PP-GROUND] MinIO · ⚠️ DECOUPLED FROM PROJECTION`). Draw an explicit visual break or red-flag callout between `PP_GROUND` and `PP_GRAPH` confirming that automated grounding output does not reach preprod projection without manual intervention or unverified job overrides.\\n\\n---\\n\\n### Finding 2: Omission of Physical Object Prefix for Repointed PV PDF Reads\\n* **Severity:** **HIGH**\\n* **Exact Location:** Diagrams 1, 2, and 3 (`PP_API --> GEO_S3`), §1, §2, §4.\\n* **Reasoning:** In all three diagrams, `PP_API` points to `GEO_S3` (`sentropic-geo`) with labels such as `\\"READ PV PDFs · LIVE repoint shared corpus\\"` or `\\"READ mapped PV PDFs · no Immo fallback\\"`. \\n  - Diagram 3 explicitly partitions `GEO_S3` into `raw / manifests` and `normalized/` for Geo runners.\\n  - None of the three diagrams identifies which prefix `PP_API` reads inside `GEO_S3`. \\n  - An engineer configuring IAM policies, bucket lifecycles, or debugging `/api/documents/raw` 404s cannot determine whether Immo queries `raw/`, `documents/`, `pv/`, or the bucket root.\\n* **Minimal Remedy:** Update the edge labels across Diagrams 1, 2, and 3 to include the exact target prefix: e.g., `PP_API -->|\\"READ mapped PV PDFs (prefix: raw/...)\\"| GEO_S3`.\\n\\n---\\n\\n### Finding 3: Misplaced Snapshot-Restore Boundary and Orphaned Flow in Diagram 1\\n* **Severity:** **HIGH**\\n* **Exact Location:** Diagram 1 (`restore`, `PP_BACKUP`), §1, §3.\\n* **Reasoning:** \\n  - The node `restore[\\"Snapshot-restore Job<br/>Completed; separate from refresh\\"]` is drawn in the external region outside both the `cloud` and `preprod` subgraphs, grouped alongside external cloud object storage.\\n  - In reality, the restore job was a Kubernetes Job running inside the `radar-immobilier-preprod` namespace.\\n  - Furthermore, `restore` shows an incoming read edge from `PP_BACKUP`, but zero outgoing write edges. A restore job that reads a backup and restores nothing is an incomplete and misleading data flow.\\n* **Minimal Remedy:** Move `restore` inside `subgraph preprod` in Diagram 1, and add the missing write edge: `restore -->|\\"Restore data\\"| PP_DB`.\\n\\n---\\n\\n### Finding 4: Contradictory Scoping and Environment Ownership of `LEGACY-POC`\\n* **Severity:** **HIGH**\\n* **Exact Location:** Diagram 2 (`LEGACY_POC`, `subgraph immo`), Diagram 1, §1, §3.\\n* **Reasoning:** \\n  - In Diagram 2, `LEGACY_POC` (`radar-immobilier-docs-pocs` on Scaleway S3) is nested inside `subgraph immo[\\"IMMO · preprod PV chain\\"]`.\\n  - However, §1 and §3 explicitly establish that `LEGACY-POC` is a shared reference bucket, not an environment-isolated preprod store: production `PR_REFRESH` declares a read dependency on it, and the production GitHub Actions grounding workflow publishes directly to it.\\n  - Nesting `LEGACY_POC` inside a preprod Immo subgraph creates a false boundary, directly contradicting Diagram 1 (where it is placed outside the cluster) and masking cross-environment pollution.\\n* **Minimal Remedy:** In Diagram 2, extract `LEGACY_POC` outside `subgraph immo` and place it alongside `GEO_S3` and `PP_GEO_S3` as an external shared/reference resource.\\n\\n---\\n\\n### Finding 5: Flat Topology and Obscured Cross-Environment Reads in Diagram 3\\n* **Severity:** **MEDIUM**\\n* **Exact Location:** Diagram 3 (`PP_API`, `PR_API`, `GEO_API`, `PP_GEO`, `PP_GEO_S3`, `GEO_S3`), §4.\\n* **Reasoning:** \\n  - Diagram 3 completely omits environment/tenant subgraphs. Production consumers (`PR_API`), preproduction consumers (`PP_API`), production serving (`GEO_API`), preproduction serving (`PP_GEO`), and shared storage (`GEO_S3`) all float in an uncontained diagram space.\\n  - Because there are no boundary boxes for `preprod` and `prod`, the cross-environment dependency where `PP_API` (preprod) directly bypasses preprod and reads from `GEO_S3` (prod/shared) looks identical to a standard local read.\\n* **Minimal Remedy:** Introduce visual environment grouping in Diagram 3 (`subgraph prod[\\"Production\\"]` enclosing `PR_API`, `GEO_API`, and `GEO_S3`; `subgraph preprod[\\"Preproduction\\"]` enclosing `PP_API`, `PP_GEO`, and `PP_GEO_S3`), making the cross-environment line visually evident.\\n\\n---\\n\\n### Finding 6: Omission of `GEO-DB` (`geo/postgis`) from Geo Processing View\\n* **Severity:** **MEDIUM**\\n* **Exact Location:** Diagram 3, §3 (`GEO-DB`), §4.\\n* **Reasoning:** \\n  - Diagram 1 models `[GEO-DB] geo/postgis` as a live PostgreSQL/PostGIS StatefulSet in the `geo` namespace.\\n  - Diagram 3 shows intensive spatial joins (`join[\\"Spatial join: parcel ∩ zoning polygons\\"]`) and semantic joins (`fold`), but omits `GEO-DB` entirely.\\n  - While §3 notes that no `GEO-API -> GEO-DB` dependency was demonstrated for OGC serving, a human reviewer cannot discern whether the spatial join workers execute in-memory/file-based calculations (e.g., via Parquet/DuckDB/Turf) or if they connect to `geo/postgis`.\\n* **Minimal Remedy:** Either add `GEO_DB` to Diagram 3 with an explicit label (`[GEO-DB] geo/postgis · Unused / No batch join dependency verified`) or annotate the `join` node: `Spatial join (In-process Parquet / No PostGIS dependency)`.\\n\\n---\\n\\n### Finding 7: Inverted and Conflated Edge Semantics on `PR_REFRESH`\\n* **Severity:** **MEDIUM**\\n* **Exact Location:** Diagram 1 (`PR_REFRESH --> LEGACY_POC`), §1, §3.\\n* **Reasoning:** \\n  - In Diagram 1, the edge is drawn as: `PR_REFRESH -.->|\\"Declared graph READ; scrape target secret-backed\\"| LEGACY_POC`.\\n  - The arrow points from the worker `PR_REFRESH` to the storage `LEGACY_POC`. Everywhere else in Diagram 1, an arrow from worker to storage denotes a WRITE, while an arrow with label READ denotes a consumer reading from storage.\\n  - Labeling a single unidirectional arrow with both `\\"Declared graph READ\\"` and `\\"scrape target secret-backed\\"` conflates input and output, leaving it completely ambiguous whether `PR_REFRESH` writes scraped data to `LEGACY_POC` or if `LEGACY_POC` is only a read target.\\n* **Minimal Remedy:** Separate this into two distinct edges:\\n  1. `PR_REFRESH -.->|\\"Declared graph READ\\"| LEGACY_POC` (pointing according to the diagram\'s read convention).\\n  2. A dedicated dashed stub: `PR_REFRESH -.->|\\"Scrape target (Secret-backed S3, unverified)\\"| UNVERIFIED_S3[(\\"Unverified S3 Bucket\\")]`.\\n\\n---\\n\\n### Finding 8: Orphaned Storage Node `PP-DOCS` with Zero Ingestion Writers\\n* **Severity:** **MEDIUM**\\n* **Exact Location:** Diagrams 1 and 2 (`PP_DOCS`), §1, §2, §3.\\n* **Reasoning:** \\n  - Diagrams 1 and 2 depict `PP_API -->|\\"Legacy document READ\\"| PP_DOCS`.\\n  - There are no incoming edges to `PP_DOCS` anywhere in the diagrams. \\n  - While §3 explains that `PP-DOCS` is derived from the code fallback `SCRAPE_S3_BUCKET ?? \'radar-immobilier-docs\'`, a reader cannot tell whether `PP-DOCS` contains historical static objects, is populated by an unlisted pipeline, or is a completely empty fallback.\\n* **Minimal Remedy:** Annotate `PP_DOCS` directly on the diagrams as `[PP-DOCS] radar-immobilier-docs<br/>MinIO · Legacy static / No active writer`.\\n\\n---\\n\\n### Finding 9: Conflation of Intra-Process Execution with Inter-Process Pipes\\n* **Severity:** **LOW**\\n* **Exact Location:** Diagram 2 (`PP_SCRAPE --> parse`), §2.\\n* **Reasoning:** \\n  - Diagram 2 shows an arrow `PP_SCRAPE -->|\\"Same worker\\"| parse`.\\n  - Node labels state that `parse` runs \\"Inside PP-SCRAPE\\".\\n  - In a dataflow diagram, drawing an edge between a container and an internal subroutine mimics an IPC pipe, network hop, or queued message, confusing the physical execution boundaries.\\n* **Minimal Remedy:** Merge `PP_SCRAPE` and `parse` into a single container node or enclose them within a sub-box representing the `radar-refresh-scrape` Pod boundary.\\n\\n---\\n\\n### Finding 10: Mermaid Layout Tangling and Edge Collision Hazards\\n* **Severity:** **LOW**\\n* **Exact Location:** Diagrams 1 and 2 (Mermaid `flowchart TB` definitions).\\n* **Reasoning:** \\n  - Diagram 1 features 13 cross-subgraph edges connecting deeply nested Kubernetes workloads (`preprod`, `prod`) to external S3 buckets (`PP_GRAPH`, `GEO_S3`, `PP_GEO_S3`, `LEGACY_POC`, `PP_BACKUP`) and workstation nodes.\\n  - In standard Mermaid renderers, routing cross-subgraph edges in a top-to-bottom layout (`TB`) causes severe layout instability, line overlapping, crossed text labels, and unpredictable vertical stretching.\\n* **Minimal Remedy:** Enclose external storage resources in a unified `subgraph external[\\"External Storage & Providers (OVH / Scaleway)\\"]` positioned laterally, or adopt `flowchart LR` with subgraphs aligned to cleanly delineate cluster compute from external cloud storage.\\n\\n---\\n","review-inline":"---\\nstatus: completed\\nreviewer-host: agy\\nreviewer-model: gemini-3.8-flash-high\\nreviewer-effort: high\\ntarget-ref: 2ab8da2b:docs/architecture.md\\nlens: Cross-diagram identity and human comprehension; inline packet only, zero tools\\n---\\n\\n# Independent inline Gemini review — attempt 3\\n\\nThe complete bounded document and non-sensitive excerpts were supplied inline.\\nAGY returned SUCCESS with a non-empty final response, verdict **NEEDS CHANGES**.\\nSession: `arch-storage-gemini38-inline`; native conversation:\\n`cb16dd2d-afcd-459f-95ed-f612bbe7c23a`. No reviewer tool calls occurred in this run.\\nThe model/effort above are requested identities, not upstream attestation.\\n\\nThe unedited response is preserved in order as [findings](response-findings.md)\\nand [mapping/limitations](response-mapping.md). The first launch rejection and\\nthe second empty-response failure remain recorded separately; neither is a review.\\nThis is the owner\'s single AGY review, **not formal multi-peer consensus**.\\n\\n## Coordinator reconciliation against current main and runtime\\n\\n| Finding | Disposition | Evidence / change |\\n| --- | --- | --- |\\n| 1: Severed grounding/projection, CRITICAL | Accept clarity issue; **reject proven live outage** | Job 41 absent live. Remove it and SCW/MinIO publication targets from operational diagrams; retain main-only template mismatch and unverified stage-3 publication |\\n| 2: Missing Geo PDF prefix | Accept | `document-resolver.ts` primary mapping is `raw/pv-index/cas/`; added to diagrams 1–3 and prose; optional URL index qualified |\\n| 3: Restore location/target | Accept misleading placement; **reject invented DB target** | Completed historical Job removed from active overview. No write-to-PG edge without target evidence |\\n| 4: Shared legacy SCW bucket inside preprod | Accept | Unobserved SCW binding removed from operational views, retained in main-only reference table |\\n| 5: Geo environment boundaries | Accept | Separate production/shared and preproduction groups; mark cross-environment PV reads |\\n| 6: Geo DB ambiguity | Accept | Repeat same GEO-DB identity unconnected in Geo view; join is in-process Turf/proj4, not inferred SQL |\\n| 7: Mixed production refresh edge | Accept ambiguity | Remove unverified production worker/store edges; explicit OVH inventory gap, separate declarations |\\n| 8: No writer for PP-DOCS | Accept missing qualification; **reject proven empty/static store** | Label code-derived reader default with writer unverified, not “no writer” or an empty bucket claim |\\n| 9: Scrape worker versus parse process | Accept | One PP-SCRAPE node, stages 1+2 explicitly within same worker |\\n| 10: Wide Mermaid layout | Accept | Legacy nodes removed; layout/fit inspection handled locally, not claimed as Gemini browser validation |\\n\\nThe review\'s mapping table overstates several “Active Writers” (notably restore\\nand workstation) and gives an unsupported Geo DB target architecture. It is\\npreserved as reviewer output, not adopted as infrastructure evidence.\\n\\nFurther coordinator checks found #670 still OPEN DRAFT, retained live MinIO API\\nconfiguration, and lowercase scrape nodes excluded from Signal serving. Those\\nfindings come from main/runtime/i-cond checks, not from Gemini\'s response.\\nNo revised-document reapproval is claimed; production OVH inventory remains open.\\n","response-mapping":"## 3. Explicit Shared-Resource Mapping Summary\\n\\nThe following matrix resolves all physical identities, hosting boundaries, tenant ownership, prefix paths, and actual vs. target roles across the three views:\\n\\n| Shared ID | Physical Provider & Host | Logical Tenant & Env | Internal Bucket / Path Identity | Active Readers (Audited) | Active Writers (Audited) | Actual State vs. Target Architecture |\\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\\n| **`PP-DB`** | OVH K8s `poc-ca` / PVC | Immo Preprod | PostgreSQL 16 + PostGIS (`radar-postgres`) | `PP-API` (SQL) | `PP-SCRAPE` (interim direct feed), `PP-PROJECT` (`upsertGraphAtomic`), `restore` | **Actual:** Dual-writer interim state. **Target (E5):** `upsertGraphAtomic` as sole PG writer. |\\n| **`PR-DB`** | OVH K8s `poc-ca` / PVC | Immo Prod | PostgreSQL 16 + PostGIS (`radar-postgres`) | `PR-API` (SQL) | `PR-REFRESH` (declared write) | Production live state unverified; declared symmetry. |\\n| **`GEO-DB`** | OVH K8s `poc-ca` / PVC | Geo Prod | PostgreSQL 16 + PostGIS 3.4 (`geo/postgis`) | *None demonstrated* | *None demonstrated* | **Actual:** Running StatefulSet, but no API or batch join dependency verified. **Target:** File-based Parquet serving. |\\n| **`PP-MINIO`** | OVH K8s `poc-ca` / PVC | Immo Preprod | `http://radar-minio:9000` (PVC-backed service) | Hosts `PP-RAW`, `PP-DOCS`, `PP-GROUND` | Internal cluster workloads | **Actual:** Legacy/interim in-cluster object store. **Target:** Complete migration to OVH S3. |\\n| **`PP-RAW`** | OVH K8s / `PP-MINIO` | Immo Preprod | Bucket: `radar-immobilier-raw` | `PP-API` (default store / state) | `PP-API` (state/metadata writes) | Active default store for `radar-api`. |\\n| **`PP-DOCS`** | OVH K8s / `PP-MINIO` | Immo Preprod | Bucket: `radar-immobilier-docs` | `PP-API` (fallback scrape reader) | *None* (Orphaned / No writer) | Code-derived fallback (`SCRAPE_S3_BUCKET ?? \'radar-immobilier-docs\'`). |\\n| **`PP-GROUND`**| OVH K8s / `PP-MINIO` | Immo Preprod | Bucket: `radar-immobilier-docs-preprod`<br/>Prefix: `graph/` | *None* (Dead-end) | `PP-PUBLISH` (Job 41, declared) | **Severed Pipeline:** Grounding writes here; projection reads `PP-GRAPH`. |\\n| **`PR-MINIO`** | OVH K8s `poc-ca` / PVC | Immo Prod | `radar-minio` in namespace `radar-immobilier` | `PR-API` (declared base S3) | Unverified | Production overrides not audited live. |\\n| **`PP-GRAPH`**| OVHcloud S3 (BHS) | Immo Preprod | Bucket: `radar-immobilier-graph-preprod`<br/>Prefixes: `raw/`, `parsed/`, `ontology/`, `runs/`, `graph/` | `PP-PROJECT` (reads `graph/`), `WS_IMMO` (reads corpus) | `PP-SCRAPE` (writes `raw/`, `runs/`), `parse` (writes `parsed/`, `ontology/`), `WS_IMMO` (writes `graph/`) | **Single physical bucket** fulfilling both corpus and canonical graph roles. |\\n| **`LEGACY-POC`**| Scaleway S3 | Shared Reference / Historical | Bucket: `radar-immobilier-docs-pocs`<br/>Prefixes: `candidats/`, `graph/` | `PP-PUBLISH` (reads `candidats/`), `PR_REFRESH` (declared graph read) | `WS_IMMO` (declared staging write `candidats/`), GH Actions Prod Grounding | **Cross-Environment:** Shared between preprod Job 41 and prod GH Actions. |\\n| **`PP-GEO-S3`**| OVHcloud S3 (BHS) | Geo Preprod | Bucket: `sentropic-geo-preprod`<br/>Prefix: `normalized/` | `PP-GEO` (`geo-api` preprod OGC) | `sync` (controlled preprod sync job) | Serving copy for preproduction Geo OGC features. |\\n| **`GEO-S3`** | OVHcloud S3 (BHS) | Geo Prod / Shared | Bucket: `sentropic-geo`<br/>Prefixes: `raw/`, `manifests/`, `normalized/`, *unspecified PV prefix* | `GEO-API` (reads `normalized/`), `sync` (reads `normalized/`), `normalize`, **`PP-API` (reads mapped PV PDFs directly)** | Geo `capture` (writes `raw/`), `normalize`, `fold`, `constraints` (write `normalized/`) | **Shared Cross-Environment Read:** `PP-API` (preprod) reads PV documents directly from production `GEO-S3` without fallback. |\\n| **`PP-BACKUP`**| OVHcloud S3 (BHS) | Platform Preprod | Bucket: `radar-preprod-snapshot` | `restore` (snapshot restore Job) | Backup operators | Operational restore source, distinct from refresh/corpus. |\\n| **`PP/PR-SSO-DB`**| OVH K8s `poc-ca` | Sentropic Platform | PostgreSQL in `sentropic[-preprod]` | `pidp` / `idp` (auth-idp) | Auth IDP service | Platform identity stores. Not Immo graph databases. |\\n\\n---\\n\\n## 4. Limitations of this Review\\n\\n1. **Static Manifest & Textual Scope:** This audit is strictly an evaluation of the architecture document, commit references (`2ab8da2b`, `09703678`, `f68d8ddf`, `03acdfd`, `6296396f`, `73172214`), and the verified configuration excerpts provided.\\n2. **No Dynamic Execution or Cluster Querying:** No live `kubectl` API queries, SSH sessions, database connections, DNS resolutions, or browser rendering tests were executed by the auditor during this pass.\\n3. **No Secret or Object-Level Inspection:** In accordance with non-sensitive inspection boundaries, Kubernetes Secret values (e.g., `POSTGRES_PASSWORD`, S3 access keys) and exact S3 object inventories/keys were not inspected. The presence of a binding in a manifest or code path does not guarantee runtime execution success, network reachability, or data freshness.\\n","architecture":"# Immo, Geo and Kubernetes architecture\\n\\n**BEFORE baseline.** Snapshot captured on **2026-09-13** against remote **main\\n`09703678`**, with read-only preprod storage checks at **12:33–12:37 UTC** and a\\nworkload/CronJob recheck at **15:38 UTC**. It is intentionally preserved as the\\nbefore view; it is no longer the latest effective transition state. See the\\n[dated transition snapshot and after targets](architecture/transitions-target.md)\\nfor the later September 13 RAW rebind, T1 Kubernetes attempt and DOCS migration\\nprogress. This baseline describes observed configuration, not an assertion that\\nevery configured path succeeds. The workstation was still required for the\\ndeployed LLM-derived graph path at this capture.\\n\\nEvidence labels: **LIVE** = observed during this inspection; **DECLARED** = repository configuration, not proof of deployment; **PLANNED** = documented evolution. Links and source revisions are collected at the end.\\n\\n**Reading the diagrams:** bracketed IDs identify the **same resource in every view**. `PP-` = preproduction, `PR-` = production; `GEO-S3` is a shared corpus. Diagram 1 locates resources, diagram 2 zooms into **preprod Immo** using those exact IDs, and diagram 3 follows Geo products. READ arrows point from consumer to store, not in the direction of byte transfer. Dashed edges are conditional/unverified. Unobserved legacy publication templates are listed in §3, **not drawn as active workloads**. Production storage is explicitly unknown until an OVH inventory is available.\\n\\nThe [local SvelteFlow dossier](architecture/README.md) adds service pictograms and\\nan explicit **repo + responsibility** label inside every component and nested box.\\n[Attribution evidence](architecture/service-provenance.md) separates application\\ncode/manifests, platform provisioning, S3 client bindings and external services;\\nneither an icon nor a repo label is a new claim of runtime activation.\\n\\n**Storage migration at this BEFORE capture was partial, not complete** ([dated\\naudit and migration PRs](architecture/storage-audit.md)). Later that day RAW\\nreached OVH parity/rebind; the table below remains the auditable before state:\\n\\n| Effective path | Preproduction | Production |\\n| --- | --- | --- |\\n| API default object store | **MinIO still deployed and configured**: live `radar-immobilier-raw`; empty derived fallback `radar-immobilier-docs`; separate retained `radar-immobilier-docs-preprod` history | OVH runtime not audited; main still declares MinIO |\\n| Scrape + canonical projection | **OVH S3**, same `radar-immobilier-graph-preprod` bucket | OVH runtime not audited; main retains SCW refresh bindings |\\n| Mapped PV document reader | **OVH `sentropic-geo/raw/pv-index/cas/`** | Repoint activation not audited |\\n| Eradication work | #677 migrated preprod CronJobs, not API; #674 retains/pins MinIO | #670 is **OPEN DRAFT**, not merged; registry migration #671/#672 is not storage migration |\\n\\nDo not read the old SCW cluster\'s retained workloads as today\'s production. The public production application is reachable, but the available OVH credential cannot inventory its namespace. No SCW S3 path is asserted as live here solely because a main manifest names it.\\n\\nA later September 13 inventory established the two DOCS source populations used\\nfor migration planning: preprod MinIO has **144,193 objects / 28.34 GB** and the\\nproduction SCW `docs-pocs` source has **59,017 objects / 12,534,514,457 B**. These counts\\ndo not prove equivalence. By owner decision, the production population is the\\nexact initial canonical reference: OVH prod and preprod must each end with those\\nsame **59,017 keys and hashes**. The preprod surplus is classified non-canonical\\nand is not migrated. All MinIO content/store is removed only after exact parity\\nand recovery evidence, never prematurely.\\n\\n## 1. User access and environment boundaries\\n\\n| Surface | Production | Preproduction | Evidence |\\n| --- | --- | --- | --- |\\n| Immo application | `https://immo.sent-tech.ca` | `https://preprod.immo.sent-tech.ca` | LIVE login redirects |\\n| Sent-tech SSO / OIDC issuer | `https://auth.sent-tech.ca` | `https://preprod.auth.sent-tech.ca` | LIVE discovery and redirects |\\n| OIDC client | `radar-immobilier` | `radar-immobilier-preprod` | LIVE redirect parameters |\\n| Geo OGC API | `https://api.geo.sent-tech.ca` | `https://api.preprod.geo.sent-tech.ca` | LIVE ingress / HTTP 200 conformance |\\n| Immo Kubernetes namespace | `radar-immobilier` | `radar-immobilier-preprod` | DECLARED / LIVE preprod |\\n| Geo Kubernetes namespace | `geo` | `geo-preprod` | LIVE prod / DECLARED preprod |\\n| SSO platform namespace | `sentropic` | `sentropic-preprod` | Platform records; not re-inventoried live |\\n\\nThe requested `preprod.sent-tech.ca` did **not resolve in DNS** during this inspection. It is not the observed Immo or SSO hostname. `sent-tech.ca` is the DNS domain; the actual identity-provider hosts include `auth` as shown above.\\n\\n```mermaid\\nflowchart TB\\n  user[\\"User / browser\\"]\\n  ppurl[\\"preprod.immo.sent-tech.ca\\"]\\n  prurl[\\"immo.sent-tech.ca\\"]\\n  user --> ppurl\\n  user --> prurl\\n  subgraph cloud[\\"OVHcloud Canada · BHS · shared Kubernetes cluster poc-ca\\"]\\n    edge[\\"Shared load balancer → Traefik<br/>TLS: cert-manager / Let\'s Encrypt\\"]\\n    subgraph preprod[\\"PREPRODUCTION · namespaces\\"]\\n      PP_UI[\\"[PP-UI] radar-ui<br/>radar-immobilier-preprod\\"]\\n      PP_API[\\"[PP-API] radar-api<br/>radar-immobilier-preprod\\"]\\n      PP_DB[(\\"[PP-DB] radar-postgres<br/>radar-immobilier-preprod · PG/PostGIS\\")]\\n      subgraph ppminio[\\"[PP-MINIO] radar-minio · PVC\\"]\\n        PP_RAW[(\\"[PP-RAW] radar-immobilier-raw<br/>MinIO · API state / legacy objects\\")]\\n        PP_DOCS[(\\"[PP-DOCS] radar-immobilier-docs<br/>MinIO · empty derived reader fallback\\")]\\n        PP_DOCS_LEGACY[(\\"[PP-DOCS-LEGACY] radar-immobilier-docs-preprod<br/>MinIO · 144,193 objects / 28.34 GB later inventoried\\")]\\n
