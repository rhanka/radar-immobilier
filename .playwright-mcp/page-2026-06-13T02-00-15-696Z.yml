      - generic [ref=e89]:
        - paragraph [ref=e90]: La personne élue au poste de maire préside généralement les séances publiques. Les membres du conseil, la direction générale et la direction générale adjointe de la Municipalité participent également aux séances. Des séances extraordinaires peuvent être convoquées et se tenir à un endroit différent de celui des séances ordinaires.
        - paragraph [ref=e91]: Le conseil municipal des Éboulements se réunit généralement le premier lundi de chaque mois. Les séances se tiennent à la salle du Club de la FADOQ, dans l’édifice municipal situé au 2335 route du Fleuve, Les Éboulements. Lorsque le lundi est un jour férié, la réunion est remise au lendemain à la même heure. L’ordre du jour est publié sur notre site Internet le vendredi qui précède la séance. Des copies sont disponibles à la salle de réunion le soir même.
        - paragraph [ref=e92]:
          - strong [ref=e93]: Règlement de régie interne des séances du conseil municipal
          - text: "Le conseil municipal s’est doté d’un règlement pour diriger la conduite des débats du conseil municipal et pour maintenir l’ordre et la bienséance pendant les séances publiques. Certaines dispositions encadrent spécifiquement le déroulement de la période de questions. Pour consulter le règlement 283-24 sur la régie interne des séances du conseil municipal, cliquer sur le lien suivant :"
        - link "Règlement de régie interne des séances 283-24" [ref=e96] [cursor=pointer]:
          - /url: https://leseboulements.com/wp-content/uploads/2025/07/03-Adoption-Reglement-283-24-Regie-interne.pdf
      - generic [ref=e98]:
        - paragraph [ref=e99]: Un dossier vous préoccupe?
        - paragraph [ref=e100]: Les citoyens qui souhaitent poser des questions aux élus municipaux peuvent le faire sur place, durant la période de questions à chacune des séances.
        - paragraph [ref=e101]: Il est également possible de soumettre par écrit ses questions en utilisant nos coordonnées.
        - link "Nous joindre" [ref=e104] [cursor=pointer]:
          - /url: https://leseboulements.com/vie-municipale/nous-joindre/
