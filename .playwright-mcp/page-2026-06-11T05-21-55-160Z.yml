        - region "Les séances sont-elles accessibles aux personnes sourdes?" [ref=e316]:
          - button "Les séances sont-elles accessibles aux personnes sourdes?" [ref=e317] [cursor=pointer]:
            - text: Les séances sont-elles accessibles aux personnes sourdes?
            - img [ref=e318]
          - generic:
            - paragraph [ref=e320]: Tel qu’inscrit au Plan d’action de la politique d’accessibilité universelle, toutes les séances publiques du Conseil télédiffusées bénéficient du travail d’interprètes en langage des signes.
            - paragraph [ref=e321]: Cette mesure s’ajoute aux nombreux efforts pour rendre les séances publiques accessibles. Notre politique d’accessibilité universelle continue ainsi ses efforts depuis 1999 de favoriser une meilleure qualité de vie pour l'ensemble de nos citoyens.
        - region "Quelle est la différence entre une séance ordinaire et extraordinaire?" [ref=e322]:
          - button "Quelle est la différence entre une séance ordinaire et extraordinaire?" [ref=e323] [cursor=pointer]:
            - text: Quelle est la différence entre une séance ordinaire et extraordinaire?
            - img [ref=e324]
          - generic:
            - paragraph [ref=e326]: Une séance ordinaire est planifiée et couvre les sujets courants. Elle est télédiffusée à la Télévision communautaire des Bois-Francs et webdiffusée en simultané sur la page Facebook et la chaîne YouTube de la Ville. La période de questions peut porter sur tout sujet relevant de la Ville.
            - paragraph [ref=e327]: Une séance extraordinaire est convoquée au besoin. Elle n’est pas télédiffusée ni webdiffusée, et les questions du public présent doivent porter uniquement sur les sujets à l’ordre du jour.
