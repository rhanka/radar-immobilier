            - listitem [ref=e101]: Séances du conseil
          - generic [ref=e102]:
            - heading "Séances du conseil" [level=1] [ref=e103]
            - heading "Les séances du conseil sont les moments où les élus se rassemblent pour prendre des décisions dans l’intérêt de la ville, sous forme de règlement ou de résolution." [level=2] [ref=e104]
            - paragraph [ref=e105]: Les membres du conseil se réunissent une fois par mois en séances ordinaires et, lorsque la situation le requiert, en séances extraordinaires. Le maire ou, en cas d’absence, le maire ou la mairesse suppléant(e), préside chaque séance à laquelle participent les élus ainsi que la greffière et le directeur général de la Ville.
            - paragraph [ref=e106]:
              - text: Les séances du conseil ont lieu à l’hôtel de ville situé au 682, rue Saint-Charles. Les séances ordinaires sont diffusées en direct sur la
              - link "page Facebook officielle de la Ville" [ref=e107] [cursor=pointer]:
                - /url: https://www.facebook.com/villedemarieville
              - text: . Les captations vidéos sont rendues disponibles pour visionnement en différé dès le lendemain sur cette page du site Web.
            - generic [ref=e108]:
              - heading "Périodes de questions +" [level=3] [ref=e109] [cursor=pointer]
              - generic:
                - paragraph [ref=e110]: Les séances sont un outil démocratique important puisque tout citoyen peut intervenir lors des périodes de questions, au début et à la fin de la séance. Les questions doivent porter sur un sujet d’intérêt public municipal qui relève de la compétence de la Ville.
                - paragraph [ref=e111]:
                  - generic [ref=e112]:
                    - text: "1"
                    - superscript [ref=e113]: re
                    - text: "période de questions : en début de séance"
                  - text: Disponible uniquement pour les citoyens présents à l’endroit physique où se déroule la séance.
                - paragraph [ref=e114]:
                  - generic [ref=e115]:
                    - text: "2"
                    - superscript [ref=e116]: e
                    - text: "période de questions : en fin de séance"
                  - text: Ouverte aux citoyens s’adressant au conseil par le biais de la page Facebook de la Ville (diffusion en direct) et à ceux qui se trouvent dans la salle.
                - paragraph [ref=e117]:
                  - text: Les demandes peuvent également être adressées par la poste au 682, rue Saint-Charles, ou par courriel à
                  - link "greffe@ville.marieville.qc.ca" [ref=e118] [cursor=pointer]:
                    - /url: mailto:greffe@ville.marieville.qc.ca
                  - text: jusqu’à 16 h 30 le jour de la séance.
            - generic [ref=e119]:
              - heading "Question jeunesse (5-17 ans) +" [level=3] [ref=e120] [cursor=pointer]
              - generic:
                - paragraph:
                  - img [ref=e121]
                - paragraph [ref=e122]
                - paragraph [ref=e123]: Tu es un(e) jeune qui s’intéresse à la vie démocratique de sa ville? Le conseil municipal de la Ville de Marieville t’offre l’opportunité de t’exprimer en posant une question sur un sujet qui t’intéresse et qui relève des compétences de la Ville.
                - paragraph [ref=e124]: "Les municipalités ont plusieurs responsabilités et la vie citoyenne est un sujet bien large, mais voici quelques exemples de sujets qui pourraient piquer ta curiosité : les loisirs, les bâtiments, les routes, la sécurité et l’environnement."
                - paragraph [ref=e125]: Pour soumettre une question, tu dois être âgé entre 5 et 17 ans et être domicilié sur le territoire de Marieville.
                - list [ref=e126]:
                  - listitem [ref=e127]: Tu dois formuler ta question par écrit, inscrire ton prénom, ton adresse de résidence ainsi qu’une adresse courriel. L’adresse courriel peut être celle de ton père, de ta mère ou de ton tuteur.
                  - listitem [ref=e128]: "Envoie ta question à la Ville au plus tard le 15 du mois pour la séance ordinaire du mois suivant :"
                  - list [ref=e129]:
                    - listitem [ref=e130]:
                      - text: par courriel à
                      - link "greffe@ville.marieville.qc.ca" [ref=e131] [cursor=pointer]:
                        - /url: mailto:greffe@ville.marieville.qc.ca
                    - listitem [ref=e132]: sur la messagerie Facebook de la Ville de Marieville
                    - listitem [ref=e133]: en personne au 682, rue St-Charles.
                - paragraph [ref=e134]: Les questions jeunesse reçues seront soumises au conseil lors d’une réunion de travail et une question sera retenue et présentée à la séance ordinaire suivante. Si ta question est choisie, un membre du conseil y répondra durant la première période de questions de la séance. Il faut savoir, par contre, que le conseil n’est pas tenu de répondre à toutes les questions qui lui sont transmises.
            - generic [ref=e135]:
              - heading "Documentation +" [level=3] [ref=e136] [cursor=pointer]
              - paragraph [ref=e137]:
                - generic [ref=e138]:
                  - text: Le Service du greffe rend disponibles les
                  - strong [ref=e139]: projets d’ordres du jour
                  - text: et les
                  - strong [ref=e140]: projets de règlements
                  - text: quelques jours avant chaque séance ordinaire sur le site Web et à l’hôtel de ville. Les
                  - strong [ref=e141]: procès-verbaux
                  - text: ne sont rendus publics qu'après leur adoption par le conseil à la séance subséquente.
                - text: La documentation reste accessible sur le site Web pour une durée de 12 mois. Pour consulter les documents de séances antérieures, adressez-vous au
                - link "Service du greffe" [ref=e142] [cursor=pointer]:
                  - /url: /fr/la-ville/coordonnees-des-services-municipaux
                - text: .
