              - text: avant midi, le jour de la séance.
            - paragraph [ref=e247]:
              - link "En savoir plus" [ref=e248] [cursor=pointer]:
                - /url: https://victoriaville.ca/conseil-municipal-et-elections/poser-une-question-a-la-prochaine-seance
            - paragraph [ref=e249]:
              - text: À noter que les questions doivent porter sur des sujets d’intérêt public et respecter les règles de civilité. Les questions personnelles ou diffamatoires ne seront pas retenues. Pour plus d'informations, consulter le
              - link "Règlement de la période de questions" [ref=e250] [cursor=pointer]:
                - /url: https://d16k40le270owi.cloudfront.net/Documents/service-juridique/reglements/deroulement-periode-questions.pdf
              - text: .
        - region "Les séances sont-elles accessibles aux personnes sourdes?" [ref=e251]:
          - button "Les séances sont-elles accessibles aux personnes sourdes?" [ref=e252] [cursor=pointer]:
            - text: Les séances sont-elles accessibles aux personnes sourdes?
            - img [ref=e253]
          - generic:
            - paragraph [ref=e255]: Tel qu’inscrit au Plan d’action de la politique d’accessibilité universelle, toutes les séances publiques du Conseil télédiffusées bénéficient du travail d’interprètes en langage des signes.
            - paragraph [ref=e256]: Cette mesure s’ajoute aux nombreux efforts pour rendre les séances publiques accessibles. Notre politique d’accessibilité universelle continue ainsi ses efforts depuis 1999 de favoriser une meilleure qualité de vie pour l'ensemble de nos citoyens.
        - region "Quelle est la différence entre une séance ordinaire et extraordinaire?" [ref=e257]:
          - button "Quelle est la différence entre une séance ordinaire et extraordinaire?" [ref=e258] [cursor=pointer]:
            - text: Quelle est la différence entre une séance ordinaire et extraordinaire?
            - img [ref=e259]
          - generic:
            - paragraph [ref=e261]: Une séance ordinaire est planifiée et couvre les sujets courants. Elle est télédiffusée à la Télévision communautaire des Bois-Francs et webdiffusée en simultané sur la page Facebook et la chaîne YouTube de la Ville. La période de questions peut porter sur tout sujet relevant de la Ville.
            - paragraph [ref=e262]: Une séance extraordinaire est convoquée au besoin. Elle n’est pas télédiffusée ni webdiffusée, et les questions du public présent doivent porter uniquement sur les sujets à l’ordre du jour.
