# Test surcharge: same services as base, no host ports exposed, no UI
# dev container, no maildev UI. Test isolation comes from the per-branch
# `ENV=test-<slug>` compose project name (each branch gets its own
# namespaced volumes). `make clean ENV=test-<slug>` removes them.
#
# Apply with:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml ...

services:
  api:
    # UIDFIX-EX1: run as the host user so bind-mounted outputs stay
    # host-owned (Sentropic PRs #973/#987 pattern).
    user: "${UID:-1000}:${GID:-1000}"
    # UIDFIX-EX1: poppler-utils baked in (api/Dockerfile.dev); the
    # entrypoint apt-get fallback needs root and no longer applies.
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    image: radar-immobilier-api-dev:${API_VERSION:-local}
    working_dir: /workspace
    command: sh -c "npm run test --workspace=api"
    volumes:
      - .:/workspace
      - radar-test-root-node-modules:/workspace/node_modules
      - radar-test-api-node-modules:/workspace/api/node_modules
    environment:
      # UIDFIX-EX1: npm cache under the container /tmp (HOME is not
      # writable for the host user inside the stock node image).
      HOME: /tmp
      npm_config_cache: /tmp/npm-cache
      NODE_ENV: test

volumes:
  radar-test-root-node-modules:
  radar-test-api-node-modules:
