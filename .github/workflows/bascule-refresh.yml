# Independent writer: never invoked by restoration or release cutover.
name: bascule-refresh (force preprod refresh)
on:
  workflow_dispatch:
    inputs:
      RUN:
        description: Start radar-refresh-pv outside its schedule
        required: true
        type: boolean
        default: false
      WAIT_COMPLETE:
        description: Compatibility input; lock ownership always lasts until Job termination
        required: false
        type: boolean
        default: true
concurrency:
  group: bascule-refresh
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  force-refresh:
    # G0 v3 §5 P7: preprod mutations run only from main or a version tag.
    if: ${{ inputs.RUN && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      # G0 v3 §5 P7 (#1012 review E2): a version tag deploys only from main history.
      - name: Refuse a version tag outside main history
        if: startsWith(github.ref, 'refs/tags/')
        run: bash deploy/ci/require-main-ancestry.sh
      - uses: azure/setup-kubectl@v4
      - name: Configure dedicated preprod deployer
        env:
          KUBE_CONFIG_DATA_PREPROD: ${{ secrets.KUBE_CONFIG_DATA_PREPROD }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$RUNNER_TEMP/radar-tenant.kubeconfig"
          printf 'KUBECONFIG=%s\n' "$KUBECONFIG" >> "$GITHUB_ENV"
          if printf '%s' "$KUBE_CONFIG_DATA_PREPROD" | base64 -d 2>/dev/null | grep -q '^apiVersion:'; then
            printf '%s' "$KUBE_CONFIG_DATA_PREPROD" | base64 -d > "$KUBECONFIG"
          else
            printf '%s' "$KUBE_CONFIG_DATA_PREPROD" > "$KUBECONFIG"
          fi
          chmod 600 "$KUBECONFIG"
      - name: Force refresh under namespace lock
        run: make -f deploy/cutover/operator.mk force-refresh ENV=preprod
