# Independent writer: never invoked by restoration or release cutover.
name: bascule-refresh (force preprod refresh)
on:
  workflow_dispatch:
    inputs:
      RUN:
        description: Start radar-refresh-pv outside its schedule
        required: true
        type: boolean
        default: false
      WAIT_COMPLETE:
        description: Compatibility input; lock ownership always lasts until Job termination
        required: false
        type: boolean
        default: true
concurrency:
  group: bascule-refresh
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  force-refresh:
    if: ${{ inputs.RUN }}
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure dedicated preprod deployer
        env:
          KUBE_CONFIG_DATA_PREPROD: ${{ secrets.KUBE_CONFIG_DATA_PREPROD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBE_CONFIG_DATA_PREPROD" | base64 -d 2>/dev/null | grep -q '^apiVersion:'; then
            printf '%s' "$KUBE_CONFIG_DATA_PREPROD" | base64 -d > "$HOME/.kube/config"
          else
            printf '%s' "$KUBE_CONFIG_DATA_PREPROD" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
      - name: Force refresh under namespace lock
        run: make -f deploy/cutover/operator.mk force-refresh ENV=preprod
