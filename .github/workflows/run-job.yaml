# run-job — lance un Job one-shot du namespace radar-immobilier, à la demande.
#
# Pourquoi : les Jobs one-shot (mapper #74, snapshot cohérence, projection,
# migration) ne sont PAS dans kustomization ; historiquement il fallait un
# `kubectl apply` manuel (opérateur poc-k8s). Ce workflow rend ces jobs
# AUTO-SERVIS par le conducteur via `gh workflow run`, avec la même credential
# KUBE_CONFIG_DATA que le CD — plus besoin de pinger l'opérateur par job.
#
# Trigger : manuel (workflow_dispatch), input `job`.
#
# RBAC requis : radar-ci-deployer doit avoir create/get/list/watch/delete sur
# `batch/jobs` + get/list sur pods/pods-log (lecture des logs). Si le RBAC ne
# couvre pas encore batch/jobs, l'étape `apply` échoue en Forbidden — c'est le
# signal précis à transmettre à poc-k8s (extension RBAC durable).
name: Run one-shot job
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Quel job one-shot lancer"
        required: true
        type: choice
        options:
          - mapper
          - snapshot
          - projection
          - scrape
          - graphify34-apply
          - graphify34-emit-candidates
          - export-graph-nodes
          - export-gt
          - document-date-recovery
      backup_id:
        description: "Optional --backup-id for graphify34-apply (empty ⇒ date-based default phaseA-144-<UTC>)"
        required: false
        type: string
        default: ""
      scrape_cities:
        description: "For job=scrape: space-separated city slugs to scrape (e.g. 'brossard')"
        required: false
        type: string
        default: ""
      scrape_chunk_size:
        description: "For job=scrape: new documents per city and worker iteration (default 25)"
        required: false
        type: string
        default: "25"
      project_cities:
        description: "For job=projection: space-separated slugs to project S3→PG (empty ⇒ all cities)"
        required: false
        type: string
        default: ""
      recovery_mode:
        description: "For job=document-date-recovery: preview (read-only) or apply (writes graph + PG)"
        required: false
        type: choice
        options:
          - preview
          - apply
        default: preview
      recovery_heal:
        description: "For job=document-date-recovery: add --heal (plan from the served PG graph for cities whose latest.json drifted; writes only with apply)"
        required: false
        type: boolean
        default: false
      recovery_cities:
        description: "For job=document-date-recovery: space-separated city slugs (empty ⇒ every graph/<city>/latest.json)"
        required: false
        type: string
        default: ""
      recovery_image:
        description: "For job=document-date-recovery: ghcr.io/rhanka/radar-api:<tag> or @sha256:<digest> (empty ⇒ image served by deploy/radar-api)"
        required: false
        type: string
        default: ""

concurrency:
  group: run-job-${{ github.event.inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 20 min for every job, unchanged. document-date-recovery only: its Job runs up to
    # activeDeadlineSeconds 5400 and the wait below observes it for 5700s, so the run
    # needs 110 min (setup + wait + logs) to report the real outcome.
    timeout-minutes: ${{ github.event.inputs.job == 'document-date-recovery' && 110 || 20 }}
    env:
      NAMESPACE: radar-immobilier
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # Même pré-vol bloquant que build-push-images.yml (cf. son en-tête,
      # section « PRE-FLIGHT / TARGET CLUSTER ») : ce workflow crée/supprime des
      # Jobs sur le cluster vif avec le MÊME secret KUBE_CONFIG_DATA. Contrôle
      # POSITIF (on exige le cluster attendu) exécuté AVANT tout delete/apply.
      - name: Pre-flight — assert target cluster
        env:
          EXPECTED_KUBE_APISERVER_HOST: ${{ vars.EXPECTED_KUBE_APISERVER_HOST }}
        run: |
          set -euo pipefail
          DEFAULT_HOST='hlhedx.c1.bhs5.k8s.ovh.net'
          expected="${EXPECTED_KUBE_APISERVER_HOST:-}"
          if [ -z "$expected" ]; then
            expected="$DEFAULT_HOST"
            echo "::warning title=Pre-flight using built-in default::repo variable EXPECTED_KUBE_APISERVER_HOST is unset — falling back to ${DEFAULT_HOST}."
          fi
          # `kubectl config view` sans --raw redacte les credentials ; on ne lit
          # que l'hôte de l'apiserver (identifiant de cluster, pas un secret).
          server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          host="${server#*://}"; host="${host%%/*}"; host="${host%%:*}"
          echo "kubeconfig apiserver host : ${host:-<none>}"
          echo "expected apiserver host   : ${expected}"
          if [ "$host" != "$expected" ]; then
            echo "::error title=Wrong cluster — job refused::kubeconfig targets '${host:-<none>}' but this repo deploys to '${expected}'. Nothing was applied."
            exit 1
          fi
          kubectl -n "$NAMESPACE" get deploy radar-api -o name
          echo "pre-flight OK — ${expected} / namespace ${NAMESPACE}"

      - name: Resolve manifest + job name
        id: resolve
        run: |
          # Wait deadline (seconds) for the Job to reach a terminal state; overridden per job.
          wait_seconds=3900
          case "${{ github.event.inputs.job }}" in
            mapper)
              echo "file=deploy/k8s/35-run-geo-mapper-job.yaml" >> "$GITHUB_OUTPUT"
              echo "name=radar-run-geo-mapper" >> "$GITHUB_OUTPUT" ;;
            snapshot)
              echo "file=deploy/k8s/35-consistency-snapshot-job.yaml" >> "$GITHUB_OUTPUT"
              echo "name=radar-consistency-snapshot-once" >> "$GITHUB_OUTPUT" ;;
            projection)
              echo "file=deploy/k8s/32-graph-projection-only-job.yaml" >> "$GITHUB_OUTPUT"
              echo "name=radar-graph-projection-only" >> "$GITHUB_OUTPUT" ;;
            graphify34-apply)
              echo "file=deploy/k8s/37-graphify34-apply-job.yaml" >> "$GITHUB_OUTPUT"
              echo "configmap=deploy/k8s/37-graphify34-slugs-configmap.yaml" >> "$GITHUB_OUTPUT"
              echo "name=radar-graphify34-apply" >> "$GITHUB_OUTPUT" ;;
            graphify34-emit-candidates)
              echo "file=deploy/k8s/38-graphify34-emit-candidates-job.yaml" >> "$GITHUB_OUTPUT"
              echo "configmap=deploy/k8s/38-graphify34-set167-configmap.yaml" >> "$GITHUB_OUTPUT"
              echo "name=radar-graphify34-emit-candidates" >> "$GITHUB_OUTPUT" ;;
            scrape)
              echo "file=deploy/k8s/33b-scrape-cities-job.yaml" >> "$GITHUB_OUTPUT"
              echo "configmap=deploy/k8s/33-scrape-chunk-loop-configmap.yaml" >> "$GITHUB_OUTPUT"
              echo "name=radar-scrape-cities" >> "$GITHUB_OUTPUT" ;;
            export-graph-nodes)
              echo "file=deploy/k8s/39-export-graph-nodes-job.yaml" >> "$GITHUB_OUTPUT"
              echo "name=radar-export-graph-nodes" >> "$GITHUB_OUTPUT" ;;
            export-gt)
              echo "file=deploy/k8s/40-export-gt-designation-events-job.yaml" >> "$GITHUB_OUTPUT"
              echo "configmap=deploy/k8s/38-graphify34-set167-configmap.yaml" >> "$GITHUB_OUTPUT"
              echo "name=radar-export-gt-designation-events" >> "$GITHUB_OUTPUT" ;;
            document-date-recovery)
              echo "file=deploy/k8s/41-document-date-recovery-job.yaml" >> "$GITHUB_OUTPUT"
              echo "name=radar-document-date-recovery" >> "$GITHUB_OUTPUT"
              # Job activeDeadlineSeconds is 5400; observe past it to see the real outcome.
              wait_seconds=5700 ;;
            *)
              echo "job inconnu"; exit 1 ;;
          esac
          echo "wait_seconds=${wait_seconds}" >> "$GITHUB_OUTPUT"

      # Jobs are immutable : on supprime une éventuelle instance précédente avant
      # de ré-appliquer (sinon `apply` échoue sur un Job terminé/existant).
      - name: Apply job (delete previous, then apply)
        id: apply
        env:
          # User input — injected via env (never inline ${{ }} in the script) and
          # validated below before it touches sed.
          JOB: ${{ github.event.inputs.job }}
          BACKUP_ID: ${{ github.event.inputs.backup_id }}
          SCRAPE_CITIES: ${{ github.event.inputs.scrape_cities }}
          SCRAPE_CHUNK_SIZE: ${{ github.event.inputs.scrape_chunk_size }}
          PROJECT_CITIES: ${{ github.event.inputs.project_cities }}
          RECOVERY_MODE: ${{ github.event.inputs.recovery_mode }}
          RECOVERY_HEAL: ${{ github.event.inputs.recovery_heal }}
          RECOVERY_CITIES: ${{ github.event.inputs.recovery_cities }}
          RECOVERY_IMAGE: ${{ github.event.inputs.recovery_image }}
          CONFIGMAP: ${{ steps.resolve.outputs.configmap }}
          MANIFEST: ${{ steps.resolve.outputs.file }}
          JOB_NAME: ${{ steps.resolve.outputs.name }}
        run: |
          set -euo pipefail
          # backup_id must be a safe token (used in a sed replacement + S3 prefix).
          if [ -n "${BACKUP_ID}" ] && ! printf '%s' "${BACKUP_ID}" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error title=Invalid backup_id::backup_id must match [A-Za-z0-9._-]+"; exit 1
          fi
          # scrape_cities = space-separated slugs (safe token: slug chars + spaces).
          if [ -n "${SCRAPE_CITIES}" ] && ! printf '%s' "${SCRAPE_CITIES}" | grep -Eq '^[A-Za-z0-9 ._-]+$'; then
            echo "::error title=Invalid scrape_cities::scrape_cities must match [A-Za-z0-9 ._-]+"; exit 1
          fi
          if ! printf '%s' "${SCRAPE_CHUNK_SIZE}" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error title=Invalid scrape_chunk_size::scrape_chunk_size must be a positive integer"; exit 1
          fi
          # project_cities = space-separated slugs (empty ⇒ all cities in the projection).
          if [ -n "${PROJECT_CITIES}" ] && ! printf '%s' "${PROJECT_CITIES}" | grep -Eq '^[A-Za-z0-9 ._-]+$'; then
            echo "::error title=Invalid project_cities::project_cities must match [A-Za-z0-9 ._-]+"; exit 1
          fi
          # document-date-recovery: __IMAGE__ + __RECOVERY_ARGS__ (absent from every other
          # manifest, so both substitutions below are no-ops for the other jobs).
          recovery_image=""
          recovery_args=""
          if [ "${JOB}" = "document-date-recovery" ]; then
            case "${RECOVERY_MODE}" in
              preview|apply) ;;
              *) echo "::error title=Invalid recovery_mode::recovery_mode must be preview or apply"; exit 1 ;;
            esac
            case "${RECOVERY_HEAL}" in
              true|false) ;;
              *) echo "::error title=Invalid recovery_heal::recovery_heal must be true or false"; exit 1 ;;
            esac
            # bash =~ anchors on the whole value: a newline cannot slip past the check.
            cities_re='^[A-Za-z0-9 ._-]*$'
            if ! [[ "${RECOVERY_CITIES}" =~ ${cities_re} ]]; then
              echo "::error title=Invalid recovery_cities::recovery_cities must match [A-Za-z0-9 ._-]*"; exit 1
            fi
            image_re='^ghcr\.io/rhanka/radar-api(:[A-Za-z0-9._-]+|@sha256:[0-9a-f]{64})$'
            recovery_image="${RECOVERY_IMAGE}"
            if [ -z "${recovery_image}" ]; then
              recovery_image="$(kubectl -n "$NAMESPACE" get deploy radar-api -o jsonpath='{.spec.template.spec.containers[?(@.name=="api")].image}')" \
                || { echo "::error title=Cannot read the served image::kubectl get deploy/radar-api failed. Nothing was applied."; exit 1; }
              echo "recovery_image empty ⇒ image of deploy/radar-api (container api): ${recovery_image:-<none>}"
            fi
            if ! [[ "${recovery_image}" =~ ${image_re} ]]; then
              echo "::error title=Invalid recovery image::the image must match ghcr.io/rhanka/radar-api:<tag> or ghcr.io/rhanka/radar-api@sha256:<64 hex>. Nothing was applied."; exit 1
            fi
            # Fail-closed pre-check, BEFORE delete/apply, read-only: never alongside a refresh
            # pass (name radar-refresh-pv* or owner CronJob/radar-refresh-pv), a backup Job
            # (name radar-backup*) or a recovery still in flight (deleting it below would
            # kill it mid-write). Why: namespace memory quota + concurrent graph writes.
            jobs_table="$(kubectl -n "$NAMESPACE" get jobs -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .metadata.ownerReferences[*]}{.kind}/{.name}{end}{"\t"}{.status.active}{"\t"}{.status.startTime}{"\n"}{end}')" \
              || { echo "::error title=Cannot list Jobs::kubectl get jobs in ${NAMESPACE} failed (RBAC or API), so a running refresh/backup cannot be ruled out. Nothing was applied."; exit 1; }
            busy="$(printf '%s\n' "${jobs_table}" | awk -F'\t' '($3 + 0) > 0 && ($1 ~ /^radar-refresh-pv/ || $2 == "CronJob/radar-refresh-pv" || $1 ~ /^radar-backup/ || $1 == "radar-document-date-recovery") { printf "%s (started %s) ", $1, ($4 == "" ? "unknown" : $4) }')"
            if [ -n "${busy}" ]; then
              echo "active Job(s) found: ${busy}"
              echo "::error title=Recovery refused — Job(s) active::${busy}— retry once they have finished. Nothing was applied."; exit 1
            fi
            echo "pre-check OK: no active refresh, backup or recovery Job in ${NAMESPACE}"
            if [ "${RECOVERY_MODE}" = "apply" ]; then recovery_args="--apply"; fi
            if [ "${RECOVERY_HEAL}" = "true" ]; then recovery_args="${recovery_args:+${recovery_args} }--heal"; fi
            if [ -n "${RECOVERY_CITIES}" ]; then recovery_args="${recovery_args:+${recovery_args} }${RECOVERY_CITIES}"; fi
            echo "document-date-recovery: mode=${RECOVERY_MODE} image=${recovery_image} args=${recovery_args:-<none>}"
            {
              echo "### document-date-recovery (${RECOVERY_MODE})"
              echo ""
              echo "- image: \`${recovery_image}\`"
              echo "- args: \`${recovery_args:-<none>}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          kubectl -n "$NAMESPACE" delete job "${JOB_NAME}" --ignore-not-found
          # ConfigMap(s) FIRST (the Job mounts them). apply is idempotent.
          if [ -n "${CONFIGMAP}" ]; then
            kubectl -n "$NAMESPACE" apply -f "${CONFIGMAP}"
          fi
          # Template BACKUP_ID (placeholder only present in the apply manifest;
          # a no-op for every other job). Empty ⇒ the manifest's date-based
          # default phaseA-144-<UTC> kicks in.
          sed -e "s/__BACKUP_ID__/${BACKUP_ID}/" -e "s/__SCRAPE_CITIES__/${SCRAPE_CITIES}/" -e "s/__SCRAPE_CHUNK_SIZE__/${SCRAPE_CHUNK_SIZE}/" -e "s/__PROJECT_CITIES__/${PROJECT_CITIES}/" \
            -e "s#__IMAGE__#${recovery_image}#" -e "s#__RECOVERY_ARGS__#${recovery_args}#" "${MANIFEST}" \
            | kubectl -n "$NAMESPACE" apply -f -

      - name: Wait for completion
        env:
          JOB: ${{ github.event.inputs.job }}
          WAIT_SECONDS: ${{ steps.resolve.outputs.wait_seconds }}
        run: |
          set -eu
          NAME="${{ steps.resolve.outputs.name }}"
          # Poll the Job to a TERMINAL state (Complete OR Failed) with a deadline that
          # EXCEEDS its activeDeadlineSeconds (jobs 37/38 use 3600s → 3900s here;
          # document-date-recovery uses 5400s → 5700s, see Resolve), so this workflow
          # observes the REAL outcome instead of giving up early. A Job that FAILED must
          # RED this run. Incident 2026-08-02 (PASS-1): the old `kubectl wait
          # --timeout=900s; exit 0` reported a misleading SUCCESS while the emit job
          # actually Failed at ~29m (S3 scratch left empty) — the exact "green but broken"
          # trap. Now: succeeded ⇒ green; failed ⇒ red; neither by the deadline ⇒ red.
          deadline=$(( $(date +%s) + WAIT_SECONDS ))
          stuck=0
          while :; do
            succeeded="$(kubectl -n "$NAMESPACE" get job "$NAME" -o jsonpath='{.status.succeeded}' 2>/dev/null || echo '')"
            failed="$(kubectl -n "$NAMESPACE" get job "$NAME" -o jsonpath='{.status.failed}' 2>/dev/null || echo '')"
            if [ "${succeeded:-0}" = "1" ]; then
              echo "job ${NAME} Complete"; exit 0
            fi
            if [ -n "${failed:-}" ] && [ "${failed:-0}" != "0" ]; then
              echo "::error title=Job failed::${NAME} failed (status.failed=${failed}). See 'Job logs' below for the pod error."; exit 1
            fi
            # document-date-recovery only: a pod that cannot start (unknown image tag,
            # missing Secret/ConfigMap key) would otherwise hold the namespace memory quota
            # and this run for the whole 5400s deadline. Four polls in a row ⇒ red + delete.
            if [ "${JOB}" = "document-date-recovery" ]; then
              reason="$(kubectl -n "$NAMESPACE" get pods -l job-name="$NAME" -o jsonpath='{.items[*].status.containerStatuses[*].state.waiting.reason}' 2>/dev/null || echo '')"
              case " ${reason} " in
                *" ImagePullBackOff "*|*" ErrImagePull "*|*" InvalidImageName "*|*" CreateContainerConfigError "*|*" CreateContainerError "*)
                  stuck=$((stuck + 1)) ;;
                *) stuck=0 ;;
              esac
              if [ "${stuck}" -ge 4 ]; then
                echo "::error title=Job cannot start::${NAME} pod waiting on '${reason}' for 4 polls; the Job is deleted so it does not hold the namespace quota."
                kubectl -n "$NAMESPACE" delete job "$NAME" --ignore-not-found || true
                exit 1
              fi
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error title=Job wait deadline::${NAME} did not reach a terminal state within ${WAIT_SECONDS}s. See 'Job logs'."; exit 1
            fi
            sleep 15
          done

      - name: Job logs (diagnostic)
        if: always()
        env:
          JOB: ${{ github.event.inputs.job }}
          JOB_NAME: ${{ steps.resolve.outputs.name }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          if [ "${JOB}" != "document-date-recovery" ]; then
            kubectl -n "$NAMESPACE" logs "job/${JOB_NAME}" --tail=80 || true
          elif [ "${APPLY_OUTCOME}" != "success" ]; then
            # Logs of an earlier run would be misread as this run's report.
            echo "document-date-recovery: Job not (re)applied by this run — no report."
            echo "Job not (re)applied by this run — no report." >> "$GITHUB_STEP_SUMMARY"
          else
            # Every city/report line, every written city (its backupPrefix is the rollback
            # archive) and every HALT/aborted/fatal line, whatever the log length; the
            # report line also goes to the run summary.
            log="${RUNNER_TEMP}/document-date-recovery.log"
            kubectl -n "$NAMESPACE" logs "job/${JOB_NAME}" >"${log}" 2>&1 || true
            grep -E 'recover-document-dates:(city|report)|recover: written|HALT|aborted|fatal' "${log}" || echo "(no recovery line in the Job log)"
            echo "--- last 20 log lines ---"
            tail -n 20 "${log}"
            report="$(grep -F 'recover-document-dates:report' "${log}" || true)"
            {
              echo ""
              if [ -n "${report}" ]; then
                echo '```json'
                printf '%s\n' "${report}"
                echo '```'
              else
                echo "No recover-document-dates:report line in the Job log (failed before the end, or still running) — see the Job logs step."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "--- status ---"
          kubectl -n "$NAMESPACE" get "job/${JOB_NAME}" -o wide || true
