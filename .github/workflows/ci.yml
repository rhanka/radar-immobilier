name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject Python files under deploy
        run: |
          bash deploy/ci/check-no-python.sh
          bash deploy/ci/check-no-python.test.sh

      - name: Reject retired unscoped signal routes in the UI (6H)
        run: |
          bash deploy/ci/check-ui-scoped-signal-routes.sh
          bash deploy/ci/check-ui-scoped-signal-routes.test.sh

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.test.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml config -q

      - name: Validate e2e immo+geo orchestrator (offline selftest)
        run: node deploy/ci/bascule-2tenants/orchestrator.selftest.mjs

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate K8s manifests (radar as a sentropic app, offline render)
        run: make k8s-validate ENV=ci

      - name: Validate refresh overlays (preprod and prod)
        run: make -f deploy/k8s/refresh-cronjobs/refresh-018.mk verify-renders ENV=ci

      - name: Validate refresh render guards (mutation tests — stagger, pending watchdog)
        run: bash deploy/k8s/refresh-cronjobs/verify-renders.test.sh

      - name: Validate object-storage contracts (offline)
        run: bash deploy/ci/check-object-storage-bindings.test.sh

      - name: Validate preprod auth isolation (offline render, no PROD auth value)
        run: bash deploy/ci/check-preprod-auth-isolation.test.sh

      - name: Validate preprod reconcile immo-mcp branch (hermetic, fake kubectl)
        run: bash deploy/ci/reconcile-preprod-mcp.test.sh

      - name: Validate manifest filter equivalence (fixtures and preprod render)
        run: bash deploy/ci/kfilter.test.sh

      - name: Validate projection declared-changes inputs (offline, GH #817)
        run: bash deploy/ci/projection-declared-args.test.sh

      - name: Validate daily prod backup logic (offline selftest)
        run: node deploy/ci/backup/backup-daily.selftest.mjs

      - name: Validate cutover controller and backup adapters (hermetic tests)
        run: make -f deploy/cutover/operator.mk test TEST_PATTERN='one command restores|long owned radar-refresh-pending-watchdog|failure remains closed.*failJob|daily restoration|daily and inter-tenant interfaces|prepare|prepared|rollback patches|resume reconciles|main deployment' ENV=test-cutover

      - name: Install workspace deps
        run: make install ENV=ci

      - name: Typecheck
        run: make typecheck ENV=ci

      - name: Lint
        run: make lint ENV=ci

      - name: Audit gate (HIGH/CRITICAL with expiring exceptions)
        run: make test-audit-security audit-security ENV=ci

      - name: Build
        run: make build ENV=ci

      - name: Smoke UI bundle
        run: make smoke-ui-bundle ENV=ci

      - name: Test (unit + integration, boots postgres + minio)
        run: make test ENV=test-ci

      - name: Tear down
        if: always()
        run: make clean ENV=test-ci

  e2e:
    name: Real-stack e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Real-stack Playwright suite (production images, synthetic data)
        run: make test-e2e ENV=test-e2e-ci

      - name: Upload Playwright traces and network log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-real
          path: tmp/e2e-real/
          retention-days: 7

      - name: Tear down
        if: always()
        run: make test-e2e-down ENV=test-e2e-ci
