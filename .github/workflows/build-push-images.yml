name: Build & push images

# Builds the production api + ui images on GitHub-hosted runners and pushes them
# to GHCR, so the local box (which hosts the k8s demo + agents)
# no longer has to carry the heavy `docker build`. This is the CI counterpart of
# the Makefile `build-images` / `push-images` targets (deploy/k8s/README.md step 2:
# "CI does this on the live path").
#
# Deploy (CD) is wired below in the `deploy` job, but ONLY on pushes to `main`
# (never on PRs / feature branches). It rolls the live OVH MKS cluster
# with `kubectl set image` against the same short-sha tag the build just pushed.
#
# Auth uses the `KUBE_CONFIG_DATA` gh secret (same pattern as rhanka/surch
# ci-k8s.yml): a kubeconfig (base64 OR raw) for a NAMESPACE-SCOPED ServiceAccount
# `radar-ci-deployer` that can get/list/patch/update Deployments, read
# pods/replicasets for `rollout status`, and manage `batch/cronjobs` for the gated
# production refresh inside `radar-immobilier` — it cannot read Secrets or touch
# any other namespace. There is no GitOps controller (Argo/Flux) on this cluster,
# so `kubectl set image` is not reverted.
#
# The deploy job also rolls `radar-immo-mcp` (the remote MCP server) to the same
# radar-api sha — it runs the SAME radar-api image, so without this it drifted on
# :latest and served stale code (mock signals). The step is guarded (skips if the
# mcp Deployment is absent, since 40/41 are applied out-of-band via
# k8s-apply-mcp.yaml rather than kustomization.yaml).
#
# CONFIG DURABILITY (incident 2026-07-13): `kubectl set image` only patches the
# image field — it never reasserts `deploy/k8s/40-immo-mcp-http-deploy.yaml`'s
# ConfigMap (`IMMO_MCP_DATA_MODE`, `RADAR_API_BASE_URL`, …) or the Deployment's
# `envFrom`. Previously the ONLY thing that ever re-applied that manifest was
# the manual, human-triggered `k8s-apply-mcp.yaml` workflow, so any out-of-band
# drift on the live ConfigMap/Deployment (e.g. a hand kubectl-edit, or a stale
# apply) silently survived every ordinary push to `main` — exactly what caused
# the pod to fall back to mock mode in prod. The `deploy` job below now also
# runs `kubectl apply -f deploy/k8s/40-immo-mcp-http-deploy.yaml` (guarded the
# same way as the image roll: only once the Deployment already exists, i.e.
# after the first manual bootstrap via k8s-apply-mcp.yaml) BEFORE the sha
# set-image step, on every deploy — so config drift self-heals within one
# `main` push instead of waiting for someone to remember the manual workflow.
# Ordering matters: 40-immo-mcp-http-deploy.yaml pins the container to the
# fixed `:latest` tag, so applying it AFTER the sha set-image would clobber the
# just-pinned sha back to `:latest`; applying it BEFORE means the following
# set-image step is always the last word on which image tag actually runs.
#
# PRE-FLIGHT / TARGET CLUSTER (2026-07-28): the live tenant moved to OVH MKS
# (BHS5). The previous provider node pool that hosted it HAS BEEN
# DELETED, so there is no rollback target left there. The `deploy` job now runs
# a BLOCKING pre-flight before the first mutating kubectl: it extracts the
# apiserver HOST from the kubeconfig (`kubectl config view` without --raw, which
# redacts credentials) and refuses to deploy unless it equals the expected host.
# The check is POSITIVE (it requires the expected cluster; it does not blacklist
# known-bad ones) — anything unforeseen is refused by construction.
#
# Expected host comes from the NON-SECRET repo variable
# `EXPECTED_KUBE_APISERVER_HOST`:
#   gh variable set EXPECTED_KUBE_APISERVER_HOST --body 'hlhedx.c1.bhs5.k8s.ovh.net'
# If the variable is unset the job falls back to the OVH host hardcoded in the
# step and emits a ::warning — so the guard is active by default and never
# silently disabled. A cluster rebuild = update the variable (no code change).
#
# Why this exists: `KUBE_CONFIG_DATA` has not been rotated since 2026-06-22,
# five weeks BEFORE the OVH cluster existed for this tenant, and a wrong-cluster
# deploy is not necessarily loud — if the stale namespace still holds
# Deployments scaled to 0, `kubectl set image` + `rollout status` both SUCCEED
# instantly and the pipeline goes green while production is untouched.
#
# POST-DEPLOY PROOF / PUBLIC PATH (2026-08-02): the pre-flight above proves the
# KUBECONFIG targets the right cluster, but not that the public endpoint users
# actually hit (immo.sent-tech.ca) still resolves to THAT cluster — a DNS/ingress
# cutover can drift independently. The `deploy` job now ends with a BLOCKING
# post-deploy proof by TLS certificate serial (poc-k8s recommendation, mirrors
# transpose-cv / pokemon-cards): it compares the serial served via NORMAL DNS
# resolution against the serial served when the connection is FORCED to the
# target cluster's LoadBalancer IP (SNI preserved). Equal serials ⇒ public DNS
# points at the cluster this run deployed to. This is RENEWAL-ROBUST by
# construction: it never hardcodes a serial (which would break on every Let's
# Encrypt renewal ~60d) — it compares live-vs-live. A code HTTP status
# discriminates nothing (both clusters serve the same app); only the cert serial
# does. Cert serials are public identifiers, never credentials — safe to print.
# Both inputs are NON-SECRET repo variables (fallbacks hardcoded, guard never
# silently off): `PUBLIC_ENDPOINT_HOST` (default immo.sent-tech.ca) and
# `EXPECTED_OVH_LB_IP` (default 51.79.100.177, the OVH BHS5 Traefik LB).
#   gh variable set PUBLIC_ENDPOINT_HOST --body 'immo.sent-tech.ca'
#   gh variable set EXPECTED_OVH_LB_IP  --body '51.79.100.177'
#
# To roll back or deploy by hand, the same commands still work with a full
# kubeconfig:
#   kubectl -n radar-immobilier apply -f deploy/k8s/40-immo-mcp-http-deploy.yaml
#   kubectl -n radar-immobilier set image deploy/radar-api       api=ghcr.io/rhanka/radar-api:<sha>
#   kubectl -n radar-immobilier set image deploy/radar-ui        ui=ghcr.io/rhanka/radar-ui:<sha>
#   kubectl -n radar-immobilier set image deploy/radar-immo-mcp  mcp=ghcr.io/rhanka/radar-api:<sha>
#   kubectl -n radar-immobilier rollout status deploy/radar-api deploy/radar-ui deploy/radar-immo-mcp

on:
  push:
    branches: [main]
    # CD refonte Lot 3: a semver tag v* on a main commit promotes that commit's
    # already-built images to prod by digest (job promote-prod). `v[0-9]*` is
    # semver-only — it will not match vanity tags like `validated`/`vanity`.
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to push alongside the commit sha (optional; e.g. main-pdfgeo)"
        required: false
        type: string

concurrency:
  # Cancel superseded builds on the same ref (a newer push to main / re-dispatch
  # makes the in-flight build redundant).
  group: build-push-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/rhanka

jobs:
  build-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CD refonte Lot 3 (build-once): a v* TAG must NOT rebuild — promote-prod
    # promotes the existing main-built digest. Skip build-push on tag refs so the
    # promoted image is exactly the CI-validated main build (main push + dispatch
    # still build normally).
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: radar-api
            dockerfile: api/Dockerfile
          - service: ui
            image: radar-ui
            dockerfile: ui/Dockerfile
          # Grounding image (citations) — PUBLISH-ONLY (plan 4.4.3): the in-cluster
          # No `obscura` entry on purpose: deploy/k8s/35-obscura.yaml runs the
          # upstream PUBLIC Docker Hub image (docker.io/h4ckf0r0day/obscura,
          # tag + digest pinned) — nothing to build, no GHCR package.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_PREFIX}/${{ matrix.image }}:${{ steps.vars.outputs.sha }}"
            echo "${IMAGE_PREFIX}/${{ matrix.image }}:latest"
            if [ -n "${{ inputs.tag }}" ]; then
              echo "${IMAGE_PREFIX}/${{ matrix.image }}:${{ inputs.tag }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Build context is the repo ROOT (the SPA / API import the @radar/* workspace
      # packages — see api/Dockerfile & ui/Dockerfile comments and docker-compose.e2e.yml).
      #
      # Cache: GitHub Actions cache (type=gha), scoped per service. Both Dockerfiles
      # COPY the package manifests and run `npm install` BEFORE COPYing the sources,
      # so the (heavy) install layer is cached and reused as long as the manifests are
      # unchanged; only the source + `vite build` / esbuild bundle layer re-runs when
      # the source changes. The cache key is bound to the layer contents (Dockerfile
      # ordering), so a stale bundle is impossible BY CONSTRUCTION — no global --no-cache.
      - name: Build & push ${{ matrix.service }}
        # id: build exposes steps.build.outputs.digest — the immutable
        # sha256 manifest digest this push produced. Recorded in the summary
        # below for traceability; the tag->prod `promote-prod` job (CD refonte
        # Lot 3) RE-RESOLVES the digest of radar-<svc>:<sha7> from the registry
        # at promote time (authoritative, survives job/run boundaries), so no
        # cross-run state is threaded here — this capture is trace + fallback.
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          # Stamp the full SHA into the API image (api/Dockerfile `ARG GIT_SHA`,
          # placed LAST in the runtime stage so it never busts the cached COPY
          # layers). The api process surfaces it on /livez + /health; the deploy
          # job's "Assert served sha" step reads it back from the public URL to
          # prove the rolled-out build is actually SERVED. UI build.json and
          # all image tags retain the short SHA used by CD.
          build-args: |
            GIT_SHA=${{ matrix.service == 'api' && github.sha || steps.vars.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Record immutable cutover image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg digest "$DIGEST" \
            '{gitSha:$sha,digest:$digest}' > "cutover-$SERVICE.json"

      - uses: actions/upload-artifact@v4
        with:
          name: cutover-image-${{ matrix.service }}-${{ github.sha }}
          path: cutover-${{ matrix.service }}.json

      - name: Summary
        run: |
          {
            echo "### Pushed \`${{ matrix.image }}\`"
            echo ""
            echo '```'
            echo "${{ steps.tags.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  cutover-release:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cutover-image-*-${{ github.sha }}
          merge-multiple: true
      - name: Generate release manifest
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export API_DIGEST=$(jq -er --arg sha "$GIT_SHA" 'select(.gitSha==$sha).digest' cutover-api.json)
          export UI_DIGEST=$(jq -er --arg sha "$GIT_SHA" 'select(.gitSha==$sha).digest' cutover-ui.json)
          fail(){ echo 'Release manifest refused' >&2; exit 1; }
          source tools/make/cutover-release.sh
          generate_release release.json
      - uses: actions/upload-artifact@v4
        with:
          name: cutover-release-${{ github.sha }}
          path: release.json

  prepare-preprod-db:
    name: Prepare preprod database for cutover
    needs: [build-push, cutover-release]
    # Same arming as deploy-preprod: a disarmed preprod CD never prepares (variable read only).
    if: github.ref == 'refs/heads/main' && vars.PREPROD_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      # "adopted": blue/green slots in place, the release is delegated to the cutover rehearsal;
      # "legacy": slots not adopted yet, deploy-preprod keeps the direct roll (old path).
      slots: ${{ steps.slots.outputs.state }}
      # "run": rehearse this release; "skip": a re-run of a SHA whose rehearsal was green (nothing to do).
      rehearse: ${{ steps.change.outputs.state }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cutover-release-${{ github.sha }}
          path: cutover-release
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Configure namespace-scoped preprod identity
        env:
          KUBE_CONFIG_DATA_PREPROD: ${{ secrets.KUBE_CONFIG_DATA_PREPROD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBE_CONFIG_DATA_PREPROD" | base64 -d 2>/dev/null | grep -q '^apiVersion:'; then
            printf '%s' "$KUBE_CONFIG_DATA_PREPROD" | base64 -d > "$HOME/.kube/config"
          else
            printf '%s' "$KUBE_CONFIG_DATA_PREPROD" > "$HOME/.kube/config"
          fi
      - name: Blue/green slot state
        id: slots
        # An unreadable slots state fails this step (no state output): deploy-preprod then refuses.
        run: |
          set -euo pipefail
          state=$(make -s -f deploy/cutover/operator.mk slots-status ENV=preprod)
          echo "state=$state" >> "$GITHUB_OUTPUT"
      # Before any clone: a re-run of the same SHA after a green rehearsal skips the preparation and
      # the rehearsal (neutral, job summary); a red or missing rehearsal is replayed in full.
      - name: Rehearsal need
        id: change
        if: steps.slots.outputs.state == 'adopted'
        run: echo "state=$(make -s -f deploy/cutover/operator.mk rehearse-check RELEASE=cutover-release/release.json ENV=preprod)" >> "$GITHUB_OUTPUT"
      - name: Rehearsal skipped (green rehearsal of this SHA already served)
        if: steps.change.outputs.state == 'skip'
        run: |
          echo "::notice title=Rehearsal skipped::release ${{ github.sha }} is served and its rehearsal was green (re-run)"
          printf '### Zero-downtime preparation and rehearsal skipped\n\nRelease `%s` is already served in preprod and its rehearsal receipt is green (re-run of the same workflow).\n' "${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare restore, migrations, 6H and the prepared slot
        if: steps.slots.outputs.state == 'adopted' && steps.change.outputs.state == 'run'
        run: make -f deploy/cutover/operator.mk prepare RELEASE=cutover-release/release.json ENV=preprod
      - name: Legacy path notice
        if: steps.slots.outputs.state != 'adopted'
        run: echo "::notice title=Blue/green slots not adopted::deploy-preprod keeps the direct roll until slots-adopt"

  rehearse-preprod-bluegreen:
    name: Rehearse zero-downtime cutover in preprod
    # Conductor decision: once the slots are adopted, deploy-preprod no longer rolls the canonical
    # slot; this job IS the preprod release (previous -> new release, under probes). Both take
    # radar-change-lock, so they run in sequence. Legacy path (slots not adopted): skipped.
    needs: [prepare-preprod-db, deploy-preprod]
    # Same arming as prepare/deploy-preprod (variable read only, never written).
    if: github.ref == 'refs/heads/main' && vars.PREPROD_CD_ENABLED == 'true' && needs.prepare-preprod-db.outputs.slots == 'adopted' && needs.prepare-preprod-db.outputs.rehearse == 'run'
    runs-on: ubuntu-latest
    # Four scenarios (release with drill, rollback, re-promotion, same database): ~35 min.
    timeout-minutes: 80
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cutover-release-${{ github.sha }}
          path: cutover-release
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Configure namespace-scoped preprod identity
        env:
          KUBE_CONFIG_DATA_PREPROD: ${{ secrets.KUBE_CONFIG_DATA_PREPROD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBE_CONFIG_DATA_PREPROD" | base64 -d 2>/dev/null | grep -q '^apiVersion:'; then
            printf '%s' "$KUBE_CONFIG_DATA_PREPROD" | base64 -d > "$HOME/.kube/config"
          else
            printf '%s' "$KUBE_CONFIG_DATA_PREPROD" > "$HOME/.kube/config"
          fi
      - name: Release with drill, rollback, re-promotion and same-database scenarios under read and writer probes
        env:
          CUTOVER_PROBE_TOKEN: ${{ secrets.CUTOVER_PROBE_TOKEN }}
        run: make -f deploy/cutover/operator.mk rehearse RELEASE=cutover-release/release.json OUTPUT=rehearsal ENV=preprod
      - name: Rehearsal evidence (receipts, probes, verdicts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutover-rehearsal-${{ github.sha }}
          path: rehearsal
          retention-days: 30

  deploy:
    name: Deploy to cluster
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # LEGACY main->prod. Only rolls prod on pushes to main; PRs / feature-branch
    # dispatches build & push images but never deploy.
    # CUTOVER SWITCH (CD refonte): this legacy path is DISARMED by the SAME
    # variable that ARMS preprod-first — `vars.PREPROD_CD_ENABLED == 'true'`.
    # So one atomic flip (`gh variable set PREPROD_CD_ENABLED true`) swaps the
    # prod path from `main->prod` (this job) to `main->preprod` + `tag->prod`
    # (deploy-preprod + promote-prod) with NO 2-path window, and an instant
    # rollback (`--body false`/unset restores this job). While the var is unset
    # (default), main->prod keeps working exactly as before merge — so this PR
    # is safe to merge ahead of the owner cutover GO; the GO is the var flip.
    if: github.ref == 'refs/heads/main' && vars.PREPROD_CD_ENABLED != 'true'
    permissions:
      contents: read
      # Lets the deployment-notification steps record a GitHub Deployment +
      # success/failure status for this roll (auditable deploy history + served
      # sha, no external secret). See "Create GitHub deployment" below.
      deployments: write
    env:
      NAMESPACE: radar-immobilier
    steps:
      - name: Checkout
        # Needed to `kubectl apply -f deploy/k8s/40-immo-mcp-http-deploy.yaml`
        # below (the config-durability step) — earlier steps here only ran
        # `kubectl set image` by literal deployment/container name and never
        # needed repo files.
        uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        # Same short-sha the build job tags with (GITHUB_SHA::7), so the deploy
        # always targets the image this run just pushed.
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p "$HOME/.kube"
          # Accept the secret in either raw YAML or base64-encoded form.
          if printf '%s' "$KUBE_CONFIG_DATA" | base64 -d 2>/dev/null | grep -q '^apiVersion:'; then
            printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          else
            printf '%s' "$KUBE_CONFIG_DATA" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"

      # PRE-FLIGHT (2026-07-28) — see "PRE-FLIGHT / TARGET CLUSTER" in the file
      # header. Blocking, POSITIVE check: it must run BEFORE the first mutating
      # kubectl (apply / set image / rollout) so a wrong-cluster kubeconfig
      # changes nothing at all. It is also the connectivity gate that used to
      # live at the end of "Configure kubeconfig" (`get deploy radar-api
      # radar-ui`) — moved here so the cluster IDENTITY is asserted before we
      # talk to it.
      - name: Pre-flight — assert target cluster
        env:
          EXPECTED_KUBE_APISERVER_HOST: ${{ vars.EXPECTED_KUBE_APISERVER_HOST }}
        run: |
          set -euo pipefail
          DEFAULT_HOST='hlhedx.c1.bhs5.k8s.ovh.net'
          expected="${EXPECTED_KUBE_APISERVER_HOST:-}"
          if [ -z "$expected" ]; then
            expected="$DEFAULT_HOST"
            echo "::warning title=Pre-flight using built-in default::repo variable EXPECTED_KUBE_APISERVER_HOST is unset — falling back to ${DEFAULT_HOST}. Set it with: gh variable set EXPECTED_KUBE_APISERVER_HOST --body '<apiserver-host>'"
          fi
          # `kubectl config view` WITHOUT --raw redacts credentials
          # (client-certificate-data, token, …). We read ONLY the host of the
          # `server:` field — a cluster identifier, never a credential. The
          # kubeconfig itself is never printed, echoed or uploaded.
          server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          host="${server#*://}"; host="${host%%/*}"; host="${host%%:*}"
          echo "kubeconfig apiserver host : ${host:-<none>}"
          echo "expected apiserver host   : ${expected}"
          if [ "$host" != "$expected" ]; then
            echo "::error title=Wrong cluster — deploy refused::kubeconfig targets '${host:-<none>}' but this repo deploys to '${expected}'. Nothing was applied. Rotate the KUBE_CONFIG_DATA secret (or fix the EXPECTED_KUBE_APISERVER_HOST repo variable) before retrying."
            exit 1
          fi
          # Positive liveness proof ON the expected cluster: the two live-path
          # Deployments must exist and be readable by the scoped SA.
          kubectl -n "$NAMESPACE" get deploy radar-api radar-ui -o name
          echo "pre-flight OK — ${expected} / namespace ${NAMESPACE}"

      # Record a GitHub Deployment for this roll (env=production, ref=sha) —
      # created only AFTER the pre-flight passes, so a wrong-cluster refusal
      # never leaves a phantom "production deployment". The success/failure
      # status is set at the end of the job (see the two steps after Summary),
      # giving an auditable deploy history + served sha with NO external secret.
      - name: Create GitHub deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
              transient_environment: false,
              production_environment: true,
              description: 'CD build-push-images → radar-immobilier',
            });
            // A 202 (queued/merged-branch) response carries a message, not a
            // deployment object — degrade gracefully so the roll is never blocked
            // by the notification bookkeeping.
            if (!dep.data || dep.data.id === undefined) {
              core.warning(`createDeployment returned no id: ${dep.data && dep.data.message ? dep.data.message : 'unknown'}`);
              core.setOutput('id', '');
            } else {
              core.setOutput('id', String(dep.data.id));
            }

      - name: Acquire namespace change lock
        uses: ./deploy/cutover/lock-action
        with:
          action: lock
          environment: prod

      - name: Apply immo-mcp declarative config
        # MUST run before "Roll deployments to pushed sha": see the file header
        # ("CONFIG DURABILITY") for why the ordering (apply, then set-image)
        # keeps the config in sync WITHOUT clobbering the sha this run just
        # pushed. Guarded exactly like the mcp set-image step below — 40 is
        # deliberately not in kustomization.yaml yet (IdP cadrage gap), so this
        # only re-syncs an already-bootstrapped Deployment; it never performs
        # the first go-live (that stays a deliberate manual
        # k8s-apply-mcp.yaml dispatch).
        run: |
          set -eu
          if kubectl -n "$NAMESPACE" get deploy radar-immo-mcp >/dev/null 2>&1; then
            kubectl -n "$NAMESPACE" apply -f deploy/k8s/40-immo-mcp-http-deploy.yaml
          else
            echo "radar-immo-mcp Deployment absent — skipping immo-mcp config apply"
          fi

      - name: Roll deployments to pushed sha
        env:
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          set -eu
          kubectl -n "$NAMESPACE" set image deploy/radar-api \
            api="${IMAGE_PREFIX}/radar-api:${SHA}"
          kubectl -n "$NAMESPACE" set image deploy/radar-ui \
            ui="${IMAGE_PREFIX}/radar-ui:${SHA}"
          # radar-immo-mcp runs the SAME radar-api image (container `mcp`, see
          # deploy/k8s/40-immo-mcp-http-deploy.yaml). It was never rolled by CD, so
          # it drifted on radar-api:latest and served STALE code (e.g. mock
          # signals). Pin it to the pushed sha too. Guarded: the mcp Deployment is
          # applied out-of-band (k8s-apply-mcp.yaml, not in kustomization.yaml) —
          # if it is absent, skip rather than fail the api/ui rollout.
          if kubectl -n "$NAMESPACE" get deploy radar-immo-mcp >/dev/null 2>&1; then
            kubectl -n "$NAMESPACE" set image deploy/radar-immo-mcp \
              mcp="${IMAGE_PREFIX}/radar-api:${SHA}"
          else
            echo "radar-immo-mcp Deployment absent — skipping mcp roll"
          fi

      - name: Wait for rollouts
        run: |
          set -eu
          # radar-api and radar-ui are the live path: their rollout MUST succeed,
          # so a failure here is fatal and reds the deploy.
          kubectl -n "$NAMESPACE" rollout status deploy/radar-api --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deploy/radar-ui  --timeout=180s
          # radar-immo-mcp is an OPTIONAL connector (out-of-band via
          # k8s-apply-mcp.yaml). Right now it can fail to come up on cluster
          # capacity (poc-k8s), which must NOT red the UI/API deploy. Treat its
          # rollout as non-fatal: surface a GitHub Actions warning instead. The
          # `if !` captures the non-zero exit so `set -e` does not propagate it.
          if kubectl -n "$NAMESPACE" get deploy radar-immo-mcp >/dev/null 2>&1; then
            if ! kubectl -n "$NAMESPACE" rollout status deploy/radar-immo-mcp --timeout=120s; then
              echo "::warning title=radar-immo-mcp rollout incomplete::optional MCP connector not ready (likely cluster capacity) — UI/API deploy unaffected"
            fi
          fi

      # POST-DEPLOY PROOF (2026-08-02) — see "POST-DEPLOY PROOF / PUBLIC PATH" in
      # the file header. Blocking, renewal-robust, live-vs-live TLS serial compare:
      # proves the public endpoint (immo.sent-tech.ca) is served by the SAME
      # cluster this run just rolled. Runs AFTER the rollouts so it attests the
      # freshly-deployed state; needs no kubeconfig (pure network). Cert serials
      # are public identifiers — printing them leaks nothing.
      - name: Post-deploy — prove public endpoint serves the deployed cluster (TLS serial)
        env:
          PUBLIC_HOST: ${{ vars.PUBLIC_ENDPOINT_HOST }}
          EXPECTED_LB_IP: ${{ vars.EXPECTED_OVH_LB_IP }}
        run: |
          set -euo pipefail
          host="${PUBLIC_HOST:-immo.sent-tech.ca}"
          lb_ip="${EXPECTED_LB_IP:-51.79.100.177}"
          if [ -z "${PUBLIC_HOST:-}" ] || [ -z "${EXPECTED_LB_IP:-}" ]; then
            echo "::warning title=Post-deploy proof using built-in defaults::set repo variables PUBLIC_ENDPOINT_HOST / EXPECTED_OVH_LB_IP to make the public-path guard explicit (falling back to ${host} / ${lb_ip})."
          fi
          # Read the cert serial for a given connect target, keeping the public
          # SNI so the LB selects the same virtual host. `openssl x509 -serial`
          # emits `serial=XXXX`; strip the label.
          serial_of() {
            echo | openssl s_client -connect "$1:443" -servername "$host" 2>/dev/null \
              | openssl x509 -noout -serial 2>/dev/null | cut -d= -f2
          }
          sn_dns="$(serial_of "$host")"
          sn_lb="$(serial_of "$lb_ip")"
          echo "public host      : ${host}"
          echo "target LB IP     : ${lb_ip}"
          echo "serial via DNS   : ${sn_dns:-<none>}"
          echo "serial via LB IP : ${sn_lb:-<none>}"
          if [ -z "$sn_dns" ] || [ -z "$sn_lb" ]; then
            echo "::error title=Post-deploy TLS proof — unreachable::could not read a cert serial (host=${host} lb=${lb_ip}). Rollouts succeeded but the PUBLIC path is UNVERIFIED — investigate before trusting this deploy."
            exit 1
          fi
          if [ "$sn_dns" != "$sn_lb" ]; then
            echo "::error title=Post-deploy TLS proof FAILED — public path drifted::DNS for ${host} does NOT serve the target LB ${lb_ip} (serial ${sn_dns} vs ${sn_lb}). The endpoint users hit is NOT the cluster this run deployed to. Fix DNS/ingress before trusting this deploy."
            exit 1
          fi
          echo "post-deploy proof OK — ${host} is served by the deployed cluster (${lb_ip}); TLS serial ${sn_dns}"
      # Post-deploy PROOF that the rolled-out sha is actually SERVED — not just
      # that the ReplicaSet rolled. `rollout status` above goes green even
      # against a stale/wrong cluster (see the pre-flight rationale in the file
      # header: a namespace with Deployments scaled to 0 makes set-image +
      # rollout succeed instantly while production is untouched). This step
      # closes that gap on BOTH served surfaces, over the public URL with NO
      # in-cluster access or credentials:
      #   - /health       — the api/mcp build sha (api/Dockerfile ARG GIT_SHA);
      #                      the UI nginx is the only api route it reverse-proxies
      #                      publicly (`location = /health` -> radar-api/health).
      #   - /build.json    — the ui BUNDLE build sha (ui/Dockerfile stamps
      #                      dist/build.json; nginx serves it as a static file).
      # Both must equal the sha this run pushed, or the deploy REDs.
      - name: Assert served sha
        env:
          SHA: ${{ steps.vars.outputs.sha }}
          API_SHA: ${{ github.sha }}
          PUBLIC_ENDPOINT_HOST: ${{ vars.PUBLIC_ENDPOINT_HOST }}
        run: |
          set -euo pipefail
          host="${PUBLIC_ENDPOINT_HOST:-immo.sent-tech.ca}"
          api_url="https://${host}/health"      # api/mcp sha (nginx -> radar-api/health)
          ui_url="https://${host}/build.json"    # ui bundle sha (nginx static dist/build.json)
          echo "asserting API SHA ${API_SHA} at ${api_url}, UI SHA ${SHA} at ${ui_url}"
          # Reads .sha from the JSON body regardless of HTTP status (/health can
          # be 503 on a db/objectStore blip while still serving the right build;
          # /build.json falls back to index.html until the new ui pod is live —
          # jq then yields empty, which just keeps us retrying).
          fetch_sha() { curl -s --max-time 10 "$1" | jq -r '.sha // empty' 2>/dev/null || true; }
          # Retry up to ~180s: even after `rollout status` returns, the ingress/LB
          # needs a moment to route to the freshly-ready api AND ui pods.
          deadline=$(( $(date +%s) + 180 ))
          while :; do
            api_sha="$(fetch_sha "$api_url")"
            ui_sha="$(fetch_sha "$ui_url")"
            if [ "$api_sha" = "$API_SHA" ] && [ "$ui_sha" = "$SHA" ]; then
              echo "served sha OK: api=${api_sha} ui=${ui_sha} — build ${SHA} is live at ${host}"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error title=Served sha mismatch::${host} serves api='${api_sha:-<none>}' ui='${ui_sha:-<none>}' but this deploy pushed '${SHA}'. Rollout went green but the PUBLIC endpoint is NOT serving the new build (stale/wrong cluster, ingress cache, or unready pod). Do not trust this deploy."
              exit 1
            fi
            sleep 10
          done

      # Both post-deploy proofs (TLS serial = right cluster, served sha = right
      # build) passed → mark the GitHub Deployment success, with the public URL
      # and the served sha. Guarded on the deployment id so it no-ops if the
      # create step degraded (202) rather than failing the roll.
      - name: Deployment status — success
        if: success() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          SHA: ${{ steps.vars.outputs.sha }}
          PUBLIC_ENDPOINT_HOST: ${{ vars.PUBLIC_ENDPOINT_HOST }}
        with:
          script: |
            const host = process.env.PUBLIC_ENDPOINT_HOST || 'immo.sent-tech.ca';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: 'success',
              environment_url: `https://${host}`,
              description: `served sha ${process.env.SHA} verified live (pre-flight + TLS serial + served-sha)`,
            });

      - name: Summary
        if: always()
        run: |
          SHA="${{ steps.vars.outputs.sha }}"
          {
            echo "### Deployed to \`${NAMESPACE}\`"
            echo ""
            echo '```'
            echo "deploy/radar-api -> ${IMAGE_PREFIX}/radar-api:${SHA}"
            echo "deploy/radar-ui  -> ${IMAGE_PREFIX}/radar-ui:${SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Any deploy-step failure (pre-flight, rollout, TLS serial, served sha) →
      # mark the GitHub Deployment failure. `if: failure()` fires on any prior
      # failure; the id guard skips it when the deployment was never created
      # (e.g. pre-flight refused a wrong cluster before the create step).
      - name: Deployment status — failure
        if: failure() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          SHA: ${{ steps.vars.outputs.sha }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: 'failure',
              description: `deploy ${process.env.SHA} failed (rollout OR post-deploy proof) — public path unverified`,
            });

  # ===========================================================================
  # CD refonte — Lot 2 : main -> PREPROD (radar-immobilier-preprod).
  # See tmp/handoff/preprod/DESIGN-CD-REFONTE.md. Mirrors the `deploy` job above
  # (main -> prod) STEP-FOR-STEP so the eventual tag->prod cutover (Lot 4) is a
  # small refactor, with these DELIBERATE deltas:
  #   - namespace radar-immobilier-preprod + preprod-scoped SA kubeconfig
  #     (secret KUBE_CONFIG_DATA_PREPROD, exported by poc-k8s from
  #     deploy/k8s/11-ci-deployer-preprod-rbac.yaml);
  #   - no separate "Apply immo-mcp declarative config" step: the immo-mcp
  #     ConfigMap is reconciled from the preprod overlay (namespace + preprod
  #     resource/issuer/public URL, #835) by deploy/ci/reconcile-preprod.sh, and
  #     radar-immo-mcp is rolled by set-image like api/ui (guarded: absent => skip);
  #   - the GitHub Deployment is recorded as environment=preprod (transient),
  #     never production.
  # Runs ALONGSIDE the legacy `deploy` job (main -> prod) until the tag->prod
  # cutover (Lot 4, owner GO S00 removes the prod-on-main path). Same-host caveat:
  # prod & preprod share BOTH the OVH apiserver host AND the OVH LB IP, so the
  # pre-flight host check and the TLS-serial proof cannot tell the two apart —
  # the SA namespace scope is the real deploy frontier (DESIGN §2.4), and the
  # served-sha assert on the PREPROD URL is what proves the preprod build.
  # ===========================================================================
      - name: Release namespace change lock
        if: always() && env.CUTOVER_LOCK_RUN != ''
        uses: ./deploy/cutover/lock-action
        with:
          action: release-lock
          environment: prod

  deploy-preprod:
    name: Deploy to preprod cluster
    needs: [build-push, prepare-preprod-db]
    runs-on: ubuntu-latest
    # Rollouts and public-path proofs retain bounded deployment headroom.
    timeout-minutes: 45
    # Only roll preprod on pushes to main. PRs / feature-branch dispatches build
    # & push images but never deploy.
    # ARMING SWITCH (decouples merge from activation): this job stays SKIPPED
    # until the repo variable PREPROD_CD_ENABLED == 'true'. poc-k8s flips it ON
    # only AFTER it has (1) applied deploy/k8s/11-ci-deployer-preprod-rbac.yaml
    # and (2) created the KUBE_CONFIG_DATA_PREPROD secret — so merging this PR
    # can never red a main push against a not-yet-provisioned preprod deployer.
    # (`gh variable set PREPROD_CD_ENABLED --body true`.) Variables are allowed
    # in `if:`; secrets are not — hence a variable, not the secret itself.
    # prepare-preprod-db is a rehearsal: its failure (e.g. a long refresh still
    # draining) is reported below but never blocks the preprod rollout. Only the slots
    # selector output is read (adopted -> delegate, legacy -> direct roll); an unknown slots
    # state refuses the job. !cancelled() runs it when prepare failed or was skipped, never on a cancelled run.
    if: "!cancelled() && needs.build-push.result == 'success' && github.ref == 'refs/heads/main' && vars.PREPROD_CD_ENABLED == 'true'"
    permissions:
      contents: read
      deployments: write
    env:
      NAMESPACE: radar-immobilier-preprod
      # Blue/green slots adopted: no direct roll, migration or CronJob image change here; the
      # release is delegated to rehearse-preprod-bluegreen (old -> new). Legacy path otherwise.
      SLOTS: ${{ needs.prepare-preprod-db.outputs.slots }}
    steps:
      - name: Report prepare rehearsal outcome
        if: needs.prepare-preprod-db.result != 'success'
        env:
          PREPARE_RESULT: ${{ needs.prepare-preprod-db.result }}
        run: |
          echo "::warning title=Preprod preparation rehearsal::prepare-preprod-db ended '${PREPARE_RESULT}'; preprod is deployed anyway (the rehearsal does not gate the rollout)."
          {
            echo '### Preprod preparation rehearsal'
            echo "prepare-preprod-db result: \`${PREPARE_RESULT}\`. The rollout continues; inspect that job before the next cutover."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse an unknown blue/green slots state
        # A failed or skipped slots-status must never fall back to a direct roll on adopted slots.
        if: env.SLOTS != 'adopted' && env.SLOTS != 'legacy'
        run: |
          echo "::error title=Blue/green slots state unknown::prepare-preprod-db reported slots='${SLOTS}'; no direct roll without a known slots state."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Configure kubeconfig (preprod)
        env:
          KUBE_CONFIG_DATA_PREPROD: ${{ secrets.KUBE_CONFIG_DATA_PREPROD }}
        run: |
          mkdir -p "$HOME/.kube"
          # Accept the secret in either raw YAML or base64-encoded form.
          if printf '%s' "$KUBE_CONFIG_DATA_PREPROD" | base64 -d 2>/dev/null | grep -q '^apiVersion:'; then
            printf '%s' "$KUBE_CONFIG_DATA_PREPROD" | base64 -d > "$HOME/.kube/config"
          else
            printf '%s' "$KUBE_CONFIG_DATA_PREPROD" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"

      # PRE-FLIGHT — identical guard to prod, but the positive proof runs in the
      # PREPROD namespace. prod & preprod share the OVH apiserver host, so the
      # host check alone cannot distinguish them: the SA (namespace-scoped) being
      # able to `get deploy radar-api radar-ui` INSIDE radar-immobilier-preprod is
      # the real frontier (DESIGN §2.4). The kubeconfig is never printed.
      - name: Pre-flight — assert target cluster + preprod namespace
        env:
          EXPECTED_KUBE_APISERVER_HOST: ${{ vars.EXPECTED_KUBE_APISERVER_HOST }}
        run: |
          set -euo pipefail
          DEFAULT_HOST='hlhedx.c1.bhs5.k8s.ovh.net'
          expected="${EXPECTED_KUBE_APISERVER_HOST:-}"
          if [ -z "$expected" ]; then
            expected="$DEFAULT_HOST"
            echo "::warning title=Pre-flight using built-in default::repo variable EXPECTED_KUBE_APISERVER_HOST is unset — falling back to ${DEFAULT_HOST}."
          fi
          # `kubectl config view` WITHOUT --raw redacts credentials; we read ONLY
          # the apiserver host (a cluster id, never a credential).
          server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          host="${server#*://}"; host="${host%%/*}"; host="${host%%:*}"
          echo "kubeconfig apiserver host : ${host:-<none>}"
          echo "expected apiserver host   : ${expected}"
          if [ "$host" != "$expected" ]; then
            echo "::error title=Wrong cluster — deploy refused::kubeconfig targets '${host:-<none>}' but this repo deploys to '${expected}'. Nothing was applied."
            exit 1
          fi
          # Positive proof ON the preprod namespace: the preprod-scoped SA must
          # see the two live deployments. Reachable only by that SA => env-frontier.
          kubectl -n "$NAMESPACE" get deploy radar-api radar-ui -o name
          echo "pre-flight OK — ${expected} / namespace ${NAMESPACE}"

      - name: Create GitHub deployment (preprod)
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'preprod',
              required_contexts: [],
              auto_merge: false,
              transient_environment: true,
              production_environment: false,
              description: 'CD build-push-images → radar-immobilier-preprod',
            });
            if (!dep.data || dep.data.id === undefined) {
              core.warning(`createDeployment returned no id: ${dep.data && dep.data.message ? dep.data.message : 'unknown'}`);
              core.setOutput('id', '');
            } else {
              core.setOutput('id', String(dep.data.id));
            }

      # BACKUP-BEFORE-RELEASE (§1(a), ruling i-infra B′) — take a FAIL-CLOSED
      # pg_dump of the preprod DB to an EXTERNAL S3 bucket BEFORE rolling the
      # image, so a failed backup ABORTS the release (no un-backed-up roll). The
      # runner (deploy/ci/run-db-backup.sh) applies an in-cluster Job that dumps
      # as a NETWORK CLIENT (pg_dump -h radar-postgres, NOT kubectl exec) and
      # uploads via s5cmd, then polls it fail-closed; retention prunes runner-side
      # (S3-only). The CI SA needs only `batch/jobs` — no pods/exec, no secret-read.
      #
      # ARMING SWITCH (decouple merge from activation — same pattern as
      # PREPROD_CD_ENABLED): both steps stay SKIPPED until the repo variable
      # BACKUP_BEFORE_RELEASE_ENABLED == 'true'. The owner flips it ON only AFTER
      # provisioning (1) the external bucket + RW cred (repo vars BACKUP_S3_BUCKET/
      # ENDPOINT[/REGION] + secrets BACKUP_S3_ACCESS_KEY/BACKUP_S3_SECRET_KEY for
      # runner-side retention), (2) the in-cluster S3 secret radar-backup-s3-
      # credentials the Job's upload container reads, and (3) the `batch/jobs` RBAC
      # on the preprod deployer SA (deploy/k8s/11-ci-deployer-preprod-rbac.yaml).
      # So merging this can NEVER red a main push against not-yet-provisioned
      # backup infra. Once armed, the fail-closed gate is live: no preprod roll
      # without a fresh backup.
      #
      # LOUD-WARN when DISARMED (B1): backup AND migrate are both gated on this
      # var, so when it is not 'true' this deploy rolls with NEITHER a
      # pre-migration backup NOR the pending migrations applied — a schema-change
      # release (e.g. drizzle 0011) would then serve new code on an un-migrated DB.
      # The skip is by design (staged arming) but must never be silent.
      - name: Warn if DB backup+migrate DISARMED (preprod)
        if: vars.BACKUP_BEFORE_RELEASE_ENABLED != 'true'
        run: |
          echo "::warning title=DB backup+migrate DISARMED (preprod)::BACKUP_BEFORE_RELEASE_ENABLED is not 'true' — this deploy rolls WITHOUT a pre-migration backup AND WITHOUT applying pending migrations. Arm it for any schema-change release."

      - name: Install s5cmd
        if: vars.BACKUP_BEFORE_RELEASE_ENABLED == 'true'
        run: |
          set -euo pipefail
          ver=2.2.2
          url="https://github.com/peak/s5cmd/releases/download/v${ver}/s5cmd_${ver}_Linux-64bit.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" | tar -xz -C "$tmp" s5cmd
          sudo install -m 0755 "$tmp/s5cmd" /usr/local/bin/s5cmd
          s5cmd version

      - name: Acquire namespace change lock
        uses: ./deploy/cutover/lock-action
        with:
          action: lock
          environment: preprod

      - name: Backup DB before release (fail-closed)
        if: vars.BACKUP_BEFORE_RELEASE_ENABLED == 'true'
        env:
          BACKUP_ENV: preprod
          BACKUP_TAG: ${{ steps.vars.outputs.sha }}
          NAMESPACE: ${{ env.NAMESPACE }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_RETAIN_COUNT: ${{ vars.BACKUP_RETAIN_COUNT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
        run: bash deploy/ci/run-db-backup.sh

      # MIGRATE DB (fail-closed) — AFTER the pre-migration backup, BEFORE set-image.
      # Applies the drizzle migration Job (deploy/k8s/36-db-migrate-job.yaml) pinned
      # to the EXACT image this path deploys (preprod: the pushed short-sha tag),
      # waits for Job=Complete, and ABORTS the release before set-image if it fails
      # or times out — the app never rolls onto an un-migrated DB. Idempotent
      # (drizzle journal → an already-applied migration is a no-op), so preprod
      # replays every migration each deploy = a test-before-prod. Gated on the SAME
      # var as the backup so a migrate NEVER runs without a fresh pre-migration
      # rollback point (order: backup → migrate → set-image → assert).
      - name: Migrate DB before release (fail-closed)
        if: vars.BACKUP_BEFORE_RELEASE_ENABLED == 'true' && env.SLOTS != 'adopted'
        env:
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          : "${SHA:?SHA is empty — refusing to name/apply the migrate Job}"
          JOB="radar-db-migrate-${SHA}"
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp deploy/k8s/36-db-migrate-job.yaml "$tmp/job.yaml"
          # Overlay: pin the migrate image to the EXACT image this path deploys,
          # scope it to this path's namespace, and give the immutable Job a per-sha
          # name (avoids an apply collision on a re-deploy within ttlSecondsAfterFinished).
          {
            echo "apiVersion: kustomize.config.k8s.io/v1beta1"
            echo "kind: Kustomization"
            echo "resources: [job.yaml]"
            echo "namespace: ${NAMESPACE}"
            echo "nameSuffix: \"-${SHA}\""  # quoted: an all-digit sha7 (e.g. 85055419) would parse as a negative integer
            echo "images:"
            echo "  - name: ghcr.io/rhanka/radar-api"
            echo "    newName: ${IMAGE_PREFIX}/radar-api"
            echo "    newTag: \"${SHA}\""
          } > "$tmp/kustomization.yaml"
          kubectl -n "$NAMESPACE" delete job "$JOB" --ignore-not-found
          kubectl kustomize "$tmp" | kubectl -n "$NAMESPACE" apply -f -
          # Fail-closed poll: Complete=go, Failed=abort, timeout=abort — a broken
          # migration stops the release BEFORE set-image.
          deadline=$((SECONDS + 600))
          while :; do
            complete="$(kubectl -n "$NAMESPACE" get job "$JOB" -o 'jsonpath={.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)"
            failed="$(kubectl -n "$NAMESPACE" get job "$JOB" -o 'jsonpath={.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)"
            if [ "$complete" = "True" ]; then
              echo "db-migrate: Job $JOB Complete"
              # Bounded summary written by dist/db/migrate.js (status + NOTICE counts, e.g. 0013
              # deleted NULL-city rows — GH #812); readable without pods/log.
              echo "db-migrate summary: $(kubectl -n "$NAMESPACE" get pods -l job-name="$JOB" -o 'jsonpath={range .items[*]}{.status.containerStatuses[0].state.terminated.message}{end}' 2>/dev/null || true)"
              break
            fi
            if [ "$failed" = "True" ]; then
              echo "::error title=DB migrate FAILED::$JOB — aborting release BEFORE set-image"
              echo "db-migrate summary: $(kubectl -n "$NAMESPACE" get pods -l job-name="$JOB" -o 'jsonpath={range .items[*]}{.status.containerStatuses[0].state.terminated.message}{end}' 2>/dev/null || true)"
              kubectl -n "$NAMESPACE" logs "job/$JOB" --tail=80 || true
              # Backstop: kill the in-cluster Job so a hung migration (blocked
              # ALTER/CREATE INDEX) actually stops — the `exit 1` only ends the CI
              # poller, not the pod. Pairs with the Job's activeDeadlineSeconds.
              kubectl -n "$NAMESPACE" delete job "$JOB" --ignore-not-found || true
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=DB migrate TIMEOUT::$JOB did not complete in 600s — aborting BEFORE set-image"
              kubectl -n "$NAMESPACE" logs "job/$JOB" --tail=80 || true
              # Backstop: kill the in-cluster Job so a hung migration (blocked
              # ALTER/CREATE INDEX) actually stops — the `exit 1` only ends the CI
              # poller, not the pod. Pairs with the Job's activeDeadlineSeconds.
              kubectl -n "$NAMESPACE" delete job "$JOB" --ignore-not-found || true
              exit 1
            fi
            sleep 5
          done

      # RECONCILE MANIFESTS (CD refonte, targeted / option A) — apply the drifted
      # DURABLES so preprod tracks git, not just images. Runs AFTER the fail-closed
      # backup and BEFORE set-image (the pushed digest stays the final image; the
      # set-image step below is last, so no flap back to the manifest image).
      # Scoped to what the preprod deployer SA may touch: the generated
      # radar-ui-nginx ConfigMap (#608), radar-api/radar-ui Deployments +
      # radar-consistency-snapshot CronJob (#611). The Namespace PSS labels stay an
      # operator act (k8s), and the env ConfigMaps + maildev/obscura Deployments
      # are excluded (see deploy/ci/reconcile-preprod.sh header + PR follow-ups).
      # Fail-closed: a failed ConfigMap apply exits BEFORE set-image, so radar-ui
      # never rolls onto a Deployment referencing an absent ConfigMap.
      - name: Reconcile preprod manifests (server-side apply — targeted)
        env:
          # Slots adopted: ConfigMaps only; the workloads change through the blue/green cutover.
          RECONCILE_CONFIG_ONLY: ${{ env.SLOTS == 'adopted' && '1' || '0' }}
        run: bash deploy/ci/reconcile-preprod.sh

      # NOTE: no separate "Apply immo-mcp declarative config" step here: the
      # reconcile above applies ConfigMap immo-mcp-config from the preprod overlay
      # (#835) while radar-immo-mcp exists and rolls it (pod-template annotation =
      # the ConfigMap resourceVersion) when that ConfigMap changed. The preprod
      # Ingress stays operator-applied (no Ingress grant).
      - name: Roll preprod deployments to pushed sha
        if: env.SLOTS != 'adopted'
        id: roll
        env:
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          set -eu
          kubectl -n "$NAMESPACE" set image deploy/radar-api \
            api="${IMAGE_PREFIX}/radar-api:${SHA}"
          kubectl -n "$NAMESPACE" set image deploy/radar-ui \
            ui="${IMAGE_PREFIX}/radar-ui:${SHA}"
          # Parité immo-mcp (préprod) : le connecteur MCP embarque la même image
          # radar-api ; sans ce set-image il restait sur son ancien registre/tag
          # (constat k8s 2026-09-11 : ancien tag privé pendant que
          # api/ui étaient sur ghcr.io/…:1a1d218). Guardé : absent ⇒ skip. Le
          # Deployment est patché seulement : son ConfigMap immo-mcp-config vient
          # du reconcile ci-dessus (#835), son spec n'est pas réappliqué.
          if kubectl -n "$NAMESPACE" get deploy radar-immo-mcp >/dev/null 2>&1; then
            kubectl -n "$NAMESPACE" set image deploy/radar-immo-mcp \
              mcp="${IMAGE_PREFIX}/radar-api:${SHA}"
            # Constat k8s 2026-10-25 : le Deployment restait à replicas=0 (ancien
            # last-applied), le Service n'avait aucun endpoint et /mcp retombait
            # sur l'UI. set image ne touche pas replicas : on rétablit 1 si 0.
            MCP_REPLICAS="$(kubectl -n "$NAMESPACE" get deploy radar-immo-mcp -o jsonpath='{.spec.replicas}')"
            if [ "$MCP_REPLICAS" = "0" ]; then
              kubectl -n "$NAMESPACE" patch deploy radar-immo-mcp --type=merge -p '{"spec":{"replicas":1}}'
            fi
            kubectl -n "$NAMESPACE" rollout status deploy/radar-immo-mcp --timeout=180s \
              || echo "::warning::radar-immo-mcp rollout not complete within 180s (optional connector, deploy continues)"
          else
            echo "radar-immo-mcp Deployment absent in ${NAMESPACE} — skipping immo-mcp parity set-image"
          fi

      - name: Wait for rollouts
        if: env.SLOTS != 'adopted'
        id: wait
        run: |
          set -euo pipefail
          # radar-api and radar-ui are the preprod live path. A slow-but-HEALTHY
          # roll must NOT red the deploy: under quota pressure the RollingUpdate
          # +1 surge pod can sit Pending on CPU well past the rollout-status
          # timeout while the OLD pod keeps serving (maxUnavailable:0 ⇒ never 0
          # replicas). So: wait up to 600s; if the rollout still hasn't completed,
          # read availableReplicas — >=1 (old and/or new serving) ⇒ warn + pass;
          # only 0 available (a genuine outage) hard-fails the deploy.
          # slow_healthy tracks whether ANY deployment took the warn+pass path, so
          # the served-sha assert below can tolerate a still-converging rollout
          # instead of hard-failing a healthy-but-slow roll (rollout_state output).
          slow_healthy=0
          wait_rollout() {
            dep="$1"
            if kubectl -n "$NAMESPACE" rollout status "deploy/${dep}" --timeout=600s; then
              echo "rollout OK — ${dep}"
              return 0
            fi
            comp="${dep#radar-}"   # radar-api -> api, radar-ui -> ui
            updated="$(kubectl -n "$NAMESPACE" get "deploy/${dep}" -o jsonpath='{.status.updatedReplicas}' 2>/dev/null || echo 0)"; updated="${updated:-0}"
            desired="$(kubectl -n "$NAMESPACE" get "deploy/${dep}" -o jsonpath='{.spec.replicas}' 2>/dev/null || echo '?')"
            avail="$(kubectl -n "$NAMESPACE" get "deploy/${dep}" -o jsonpath='{.status.availableReplicas}' 2>/dev/null || echo 0)"; avail="${avail:-0}"
            echo "rollout timeout — ${dep}: updatedReplicas=${updated}/${desired}, availableReplicas=${avail}"
            # HARD-FAIL if the NEW revision cannot become ready — otherwise
            # availableReplicas>=1 (the OLD pod still serving STALE code) would
            # silently pass. Inspect NOT-READY pods only (a ready old pod is
            # excluded); a terminal/stuck container reason ⇒ broken new pod, while
            # a Pending pod (Unschedulable / no CPU) has no such reason ⇒ the #620
            # slow-but-healthy case.
            bad="$(kubectl -n "$NAMESPACE" get pods -l "app.kubernetes.io/component=${comp}" -o json 2>/dev/null \
              | jq -r '.items[]
                  | select([.status.containerStatuses[]? | select(.ready == true)] | length == 0)
                  | .status.containerStatuses[]?
                  | (.state.waiting.reason // ""), (.lastState.terminated.reason // "")' \
              | grep -Ew 'CrashLoopBackOff|ImagePullBackOff|ErrImagePull|InvalidImageName|CreateContainerError|OOMKilled|Error' \
              | sort -u | paste -sd, - || true)"
            if [ -n "$bad" ]; then
              echo "::error title=Rollout failed — new pod unhealthy::${dep}: the new revision cannot become ready [${bad}] — the old pod would keep serving STALE code. updatedReplicas=${updated}/${desired}."
              return 1
            fi
            if [ "$avail" -ge 1 ]; then
              slow_healthy=1
              echo "::warning title=Rollout slow but healthy::${dep} did not finish within 600s, but ${avail} replica(s) stayed available and no crash/imagepull/OOM on any pod (the new pod is Pending — e.g. Unschedulable / waiting for CPU under quota). Not failing; k8s finishes the roll asynchronously. updatedReplicas=${updated}/${desired}."
              return 0
            fi
            echo "::error title=Rollout failed — service DOWN::${dep}: 0 available replicas after 600s. updatedReplicas=${updated}/${desired}."
            return 1
          }
          wait_rollout radar-api
          wait_rollout radar-ui
          # Thread the rollout outcome to the served-sha assert: slow-healthy if any
          # deployment warned (surge pod still Pending), else complete.
          state=complete
          if [ "$slow_healthy" -eq 1 ]; then state=slow-healthy; fi
          echo "rollout state: ${state}"
          echo "rollout_state=${state}" >> "$GITHUB_OUTPUT"

      # POST-DEPLOY PROOF (TLS serial) — proves the preprod public endpoint is
      # served by the OVH LB. prod & preprod share the LB IP, so this attests
      # preprod DNS -> LB (NOT prod-vs-preprod); the served-sha step below is what
      # proves the preprod BUILD. Pure network, no kubeconfig. Cert serials are
      # public identifiers — printing them leaks nothing.
      - name: Post-deploy — prove preprod endpoint serves the deployed LB (TLS serial)
        if: env.SLOTS != 'adopted'
        env:
          PUBLIC_HOST: ${{ vars.PREPROD_ENDPOINT_HOST }}
          EXPECTED_LB_IP: ${{ vars.EXPECTED_OVH_LB_IP }}
        run: |
          set -euo pipefail
          host="${PUBLIC_HOST:-preprod.immo.sent-tech.ca}"
          lb_ip="${EXPECTED_LB_IP:-51.79.100.177}"
          if [ -z "${PUBLIC_HOST:-}" ] || [ -z "${EXPECTED_LB_IP:-}" ]; then
            echo "::warning title=Preprod post-deploy proof using built-in defaults::set repo variables PREPROD_ENDPOINT_HOST / EXPECTED_OVH_LB_IP to make the preprod public-path guard explicit (falling back to ${host} / ${lb_ip})."
          fi
          serial_of() {
            echo | openssl s_client -connect "$1:443" -servername "$host" 2>/dev/null \
              | openssl x509 -noout -serial 2>/dev/null | cut -d= -f2
          }
          sn_dns="$(serial_of "$host")"
          sn_lb="$(serial_of "$lb_ip")"
          echo "preprod host     : ${host}"
          echo "target LB IP     : ${lb_ip}"
          echo "serial via DNS   : ${sn_dns:-<none>}"
          echo "serial via LB IP : ${sn_lb:-<none>}"
          if [ -z "$sn_dns" ] || [ -z "$sn_lb" ]; then
            echo "::error title=Preprod post-deploy TLS proof — unreachable::could not read a cert serial (host=${host} lb=${lb_ip}). Rollouts succeeded but the preprod PUBLIC path is UNVERIFIED."
            exit 1
          fi
          if [ "$sn_dns" != "$sn_lb" ]; then
            echo "::error title=Preprod post-deploy TLS proof FAILED::DNS for ${host} does NOT serve the target LB ${lb_ip} (serial ${sn_dns} vs ${sn_lb})."
            exit 1
          fi
          echo "post-deploy proof OK — ${host} is served by the LB (${lb_ip}); TLS serial ${sn_dns}"

      # Served-sha proof on the PREPROD URL — the real preprod frontier on the
      # public path. /health (api sha) AND /build.json (ui bundle sha) must equal
      # the sha this run pushed, or the deploy REDs. Closes the silent-no-op gap
      # (wrong ns / scaled-to-0 makes set-image + rollout succeed instantly).
      - name: Assert served sha (preprod)
        if: env.SLOTS != 'adopted'
        env:
          SHA: ${{ steps.vars.outputs.sha }}
          API_SHA: ${{ github.sha }}
          PREPROD_ENDPOINT_HOST: ${{ vars.PREPROD_ENDPOINT_HOST }}
          # Threaded from the "Wait for rollouts" step: 'slow-healthy' when any
          # deployment warned (surge pod still Pending, old pod still serving) or
          # 'complete' when both rollouts finished. Coherence: a lag that "Wait"
          # tolerated must not be hard-required here.
          ROLLOUT_STATE: ${{ steps.wait.outputs.rollout_state }}
        run: |
          set -euo pipefail
          host="${PREPROD_ENDPOINT_HOST:-preprod.immo.sent-tech.ca}"
          rollout_state="${ROLLOUT_STATE:-complete}"
          api_url="https://${host}/health"      # api/mcp sha (nginx -> radar-api/health)
          ui_url="https://${host}/build.json"    # ui bundle sha (nginx static dist/build.json)
          echo "asserting API SHA ${API_SHA} at ${api_url}, UI SHA ${SHA} at ${ui_url} (rollout_state=${rollout_state})"
          fetch_sha() { curl -s --max-time 10 "$1" | jq -r '.sha // empty' 2>/dev/null || true; }
          deadline=$(( $(date +%s) + 180 ))
          while :; do
            api_sha="$(fetch_sha "$api_url")"
            ui_sha="$(fetch_sha "$ui_url")"
            if [ "$api_sha" = "$API_SHA" ] && [ "$ui_sha" = "$SHA" ]; then
              echo "served vs pushed: api='${api_sha}' ui='${ui_sha}' pushed='${SHA}' — served == pushed"
              echo "served sha OK: api=${api_sha} ui=${ui_sha} — build ${SHA} is live at ${host}"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              # Coherent with the tolerant "Wait for rollouts" step: if the rollout
              # was slow-but-healthy the new pod may not be serving yet — warn, do
              # not red the run (k8s converges asynchronously). Only a 'complete'
              # rollout that still serves the wrong sha is a genuine mismatch.
              echo "served vs pushed: api='${api_sha:-<none>}' ui='${ui_sha:-<none>}' pushed='${SHA}' — served != pushed"
              if [ "$rollout_state" = "slow-healthy" ]; then
                echo "::warning title=Preprod served sha lag::served sha lag: api='${api_sha:-<none>}' ui='${ui_sha:-<none>}' expected '${SHA}' — rollout still converging (new pod not yet serving); k8s finishes it asynchronously"
                exit 0
              fi
              echo "::error title=Preprod served sha mismatch::${host} serves api='${api_sha:-<none>}' ui='${ui_sha:-<none>}' but this deploy pushed '${SHA}'. Rollout went green but the preprod endpoint is NOT serving the new build."
              exit 1
            fi
            sleep 10
          done

      # §6 DEPLOY REFRESH CRONJOBS (preprod) — deploy + un-suspend the two refresh
      # CronJobs in radar-immobilier-preprod, pinned to this release's :<sha>
      # (reused, no 2nd resolution), via the refresh-cronjobs overlay
      # (namespace->preprod + suspend:false). Production uses its own twin overlay
      # and independent gate in promote-prod. Gated by
      # REFRESH_CRONJOB_PREPROD_ENABLED — armed by the owner AFTER the diag PASS.
      # Needs batch/cronjobs on the preprod deployer
      # (deploy/k8s/11-…rbac.yaml, owner-applied). Once live, radar-refresh-pv runs
      # at 00:00, 06:00, 12:00, 18:00 UTC (prod: 05:00, 11:00, 17:00, 23:00), and
      # radar-refresh-pending-watchdog every 5 min requests the deletion of a refresh pod still Pending
      # 15 min after creation (its SA/Role are in the same 11-…rbac.yaml).
      - name: Deploy refresh CronJobs (preprod)
        if: ${{ vars.REFRESH_CRONJOB_PREPROD_ENABLED == 'true' && env.SLOTS != 'adopted' }}
        env:
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          kver=5.4.3
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${kver}/kustomize_v${kver}_linux_amd64.tar.gz" | tar -xz -C "$tmp" kustomize
          sudo install -m 0755 "$tmp/kustomize" /usr/local/bin/kustomize
          cd deploy/k8s/refresh-cronjobs
          kustomize edit set image ghcr.io/rhanka/radar-api=ghcr.io/rhanka/radar-api:${SHA}
          kustomize build --load-restrictor LoadRestrictionsNone . | kubectl -n "$NAMESPACE" apply -f -
          echo "refresh CronJobs deployed to ${NAMESPACE} (radar-api:${SHA}, suspend:false):"
          kubectl -n "$NAMESPACE" get cronjob radar-refresh-pv radar-refresh-pending-watchdog -o wide || true

      - name: Deployment status — success (preprod)
        if: success() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          SHA: ${{ steps.vars.outputs.sha }}
          PREPROD_ENDPOINT_HOST: ${{ vars.PREPROD_ENDPOINT_HOST }}
        with:
          script: |
            const host = process.env.PREPROD_ENDPOINT_HOST || 'preprod.immo.sent-tech.ca';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: 'success',
              environment_url: `https://${host}`,
              description: `preprod served sha ${process.env.SHA} verified live (pre-flight + TLS serial + served-sha)`,
            });

      - name: Summary
        if: always()
        run: |
          SHA="${{ steps.vars.outputs.sha }}"
          {
            echo "### Deployed to \`${NAMESPACE}\` (preprod)"
            echo ""
            echo '```'
            echo "deploy/radar-api -> ${IMAGE_PREFIX}/radar-api:${SHA}"
            echo "deploy/radar-ui  -> ${IMAGE_PREFIX}/radar-ui:${SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ROLLBACK-ON-FAILED-RELEASE (§1(b), ruling i-infra) — IMAGE-ONLY, AUTO,
      # scoped to a DEPLOYMENT-HEALTH failure. Runs only when the job is failing
      # AND the `roll` step was reached (steps.roll.conclusion != 'skipped') — a
      # failure BEFORE the roll (checkout, kubeconfig, pre-flight, backup)
      # deployed nothing, so there is nothing to roll back and this stays skipped.
      # `rollout undo` re-pins the N-1 image (0 new RBAC — the deployer already
      # has deployments/patch). Guards G1 (previous revision exists), G2 (rollout
      # Ready + served health-check; never claim success on a broken state), G3
      # (log landed image) and B3/B5 (loud surfacing, one-shot fail-loud) live in
      # deploy/ci/rollback-release.sh. ARMED only when ROLLBACK_ON_FAILURE_ENABLED
      # == 'true' (decouple merge from activation).
      #
      # MIGRATION SEAM (links §1a+§1b+§2): image-rollback is safe only under
      # backward-compatible (expand-contract/additive) migrations. A release with
      # a BREAKING migration is caught by the served health-check and fail-loud →
      # the correct recovery is the OWNER-GATED DB-restore (§1a backup), NOT this
      # step (which never touches the DB).
      - name: Rollback preprod on failed release (image-only)
        if: ${{ failure() && steps.roll.conclusion != 'skipped' && vars.ROLLBACK_ON_FAILURE_ENABLED == 'true' }}
        env:
          NAMESPACE: ${{ env.NAMESPACE }}
          ROLLBACK_ENV: preprod
          DEPLOYMENTS: radar-api radar-ui
          PUBLIC_HOST: ${{ vars.PREPROD_ENDPOINT_HOST || 'preprod.immo.sent-tech.ca' }}
          FAILED_REF: ${{ steps.vars.outputs.sha }}
        run: bash deploy/ci/rollback-release.sh

      - name: Deployment status — failure (preprod)
        if: failure() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          SHA: ${{ steps.vars.outputs.sha }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: 'failure',
              description: `preprod deploy ${process.env.SHA} failed (rollout OR post-deploy proof)`,
            });

  # ===========================================================================
  # CD refonte — Lot 3 : tag v* -> PROD (radar-immobilier) par PROMOTION DIGEST.
  # See tmp/handoff/preprod/DESIGN-CD-REFONTE.md §2.3/§2.4. build-once-promote:
  # the image was built+pushed on the main push (radar-<svc>:<sha7>); a semver
  # tag on that same commit promotes the EXACT digest to prod — no rebuild.
  # This job coexists with the legacy `deploy` (main->prod) UNTIL the cutover:
  # the atomic cutover merge removes `deploy` and provisions the GitHub
  # Environment `production` (tag refs + reviewer) that makes THIS the sole prod
  # path. Held until owner GO.
  # ===========================================================================
      - name: Release namespace change lock
        if: always() && env.CUTOVER_LOCK_RUN != ''
        uses: ./deploy/cutover/lock-action
        with:
          action: release-lock
          environment: preprod

  promote-prod:
    name: Promote rehearsed release through cutover
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment: production
    permissions:
      contents: read
      actions: read
    concurrency:
      group: promote-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Resolve the original successful main build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          build_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-push-images.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '[.workflow_runs[]|select(.head_branch=="main")]|first|.id')
          [[ $build_run =~ ^[0-9]+$ ]]
          mkdir -p cutover-release
          gh run download "$build_run" --name "cutover-release-$GITHUB_SHA" --dir cutover-release
          jq -e --arg sha "$GITHUB_SHA" '.gitSha==$sha and .dataMigration=="6h"' cutover-release/release.json >/dev/null
          echo "Promoting immutable release from build run $build_run"
      - name: Configure namespace-scoped production identity
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBE_CONFIG_DATA" | base64 -d 2>/dev/null | grep -q '^apiVersion:'; then
            printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          else
            printf '%s' "$KUBE_CONFIG_DATA" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
      - name: Prepare production recovery backup and verify live migrations
        run: make -f deploy/cutover/operator.mk prepare RELEASE=cutover-release/release.json ENV=prod
      - name: Sequential cutover (same manifest as rehearsal)
        run: make -f deploy/cutover/operator.mk run RELEASE=cutover-release/release.json ENV=prod
