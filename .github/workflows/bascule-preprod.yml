# Daily backup restoration and cross-tenant reporting share the cutover engine.
name: bascule-preprod (iso-prod)
run-name: "bascule-preprod ${{ github.event_name == 'schedule' && 'restore' || inputs.MODE || 'restore' }} ${{ inputs.CYCLE_ID }}"
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      CONFIRM:
        description: Legacy cross-tenant dispatcher correlation (no date token required)
        required: false
        type: string
      DRY_RUN:
        description: List verified backups without closing workloads
        required: false
        type: boolean
        default: true
      MODE:
        description: Restore from a pinned backup, or list available backups
        required: false
        type: choice
        options: [restore, list]
        default: restore
      BACKUP_ID:
        description: latest or explicit YYYY-MM-DD
        required: false
        type: string
        default: latest
      ALLOW_STALE_BACKUP:
        description: Legacy dispatcher input; latest always enforces 24-hour freshness
        required: false
        type: boolean
        default: false
      CYCLE_ID:
        description: Optional cross-tenant reporting cycle identifier
        required: false
        type: string
        default: ""
concurrency:
  group: bascule-preprod
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  bascule:
    if: ${{ github.event_name != 'schedule' || vars.BASCULE_SCHEDULE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: radar-bascule
    timeout-minutes: 330
    env:
      MODE: ${{ inputs.DRY_RUN && 'list' || inputs.MODE || 'restore' }}
      BACKUP_ID: ${{ inputs.BACKUP_ID || 'latest' }}
      CYCLE_ID: ${{ inputs.CYCLE_ID }}
    outputs:
      backup_id: ${{ steps.engine.outputs.backup_id }}
      backup_date: ${{ steps.engine.outputs.backup_date }}
      manifest_sha256: ${{ steps.engine.outputs.manifest_sha256 }}
      pg_sha256: ${{ steps.engine.outputs.pg_sha256 }}
      dump_started_at: ${{ steps.engine.outputs.dump_started_at }}
      o_restore_backup: ${{ steps.engine.outputs.o_restore }}
      o_migrate: ${{ steps.engine.outputs.o_ddl }}
      o_docs_backup: ${{ steps.engine.outputs.o_docs }}
      o_recon_backup: ${{ steps.engine.outputs.o_recon }}
      o_smoke: ${{ steps.engine.outputs.o_reopen }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: azure/setup-kubectl@v4
      - name: Configure dedicated preprod credential
        env:
          KUBE_CONFIG_DATA_BASCULE_PREPROD: ${{ secrets.KUBE_CONFIG_DATA_BASCULE_PREPROD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBE_CONFIG_DATA_BASCULE_PREPROD" | base64 -d 2>/dev/null | grep -q '^apiVersion:'; then
            printf '%s' "$KUBE_CONFIG_DATA_BASCULE_PREPROD" | base64 -d > "$HOME/.kube/config"
          else
            printf '%s' "$KUBE_CONFIG_DATA_BASCULE_PREPROD" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
      - name: Restore on deployed images (no 6H hook, no refresh)
        id: engine
        env:
          RADAR_BACKUP_READER_PREPROD_ACCESS_KEY: ${{ secrets.RADAR_BACKUP_READER_PREPROD_ACCESS_KEY }}
          RADAR_BACKUP_READER_PREPROD_SECRET_KEY: ${{ secrets.RADAR_BACKUP_READER_PREPROD_SECRET_KEY }}
          RADAR_BACKUP_RESTORE_DOCS_ACCESS_KEY: ${{ secrets.RADAR_BACKUP_RESTORE_DOCS_ACCESS_KEY }}
          RADAR_BACKUP_RESTORE_DOCS_SECRET_KEY: ${{ secrets.RADAR_BACKUP_RESTORE_DOCS_SECRET_KEY }}
        run: make -f deploy/cutover/operator.mk run RELEASE=deployed ENV=preprod
      - name: Publish backup list adapter
        if: env.MODE == 'list'
        uses: actions/upload-artifact@v4
        with:
          name: backup-list-immo-${{ inputs.CYCLE_ID || github.run_id }}
          path: .bascule-work/backup-list.json
          include-hidden-files: true
          if-no-files-found: error
        run: node "$CLI" served-refs

      - name: e2e — artefact immo-served-refs-<CYCLE_ID> (for the served-ids job)
        if: ${{ !inputs.DRY_RUN && env.MODE != 'list' && env.CYCLE_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: immo-served-refs-${{ inputs.CYCLE_ID }}
          path: ${{ github.workspace }}/.bascule-work/served-refs/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      # ── Failure AFTER a successful S2 (inherited from the chain, unchanged):
      # the un-quiesce put preprod back in service on the database of day D while
      # docs/recon/flip may be incomplete, and nothing rolled back. The summary
      # says it explicitly, with the G1 rollback procedure (debt noted in the PR).
      - name: Failure after S2 — summary (preprod state + G1 rollback procedure)
        if: ${{ failure() && !inputs.DRY_RUN && env.MODE != 'list' && (steps.restore_chain.outcome == 'success' || steps.restore_backup.outcome == 'success') }}
        env:
          O_MIGRATE: ${{ steps.migrate.outcome }}
          O_DOCS: ${{ env.MODE == 'restore' && steps.docs_backup.outcome || steps.docs_chain.outcome }}
          O_RECON: ${{ env.MODE == 'restore' && steps.recon_backup.outcome || steps.recon_chain.outcome }}
          O_FLIP: ${{ steps.flip.outcome }}
          O_UNQUIESCE: ${{ steps.unquiesce.outcome }}
          O_SMOKE: ${{ steps.smoke.outcome }}
        run: node "$CLI" failure-summary

      # ── Rollback DURABLE : les DUMPS ne transitent plus par le runner ──────
      # Le dump prod (S1, CronJob owner) ET le dump rollback préprod (G1, Job)
      # vivent dans le bucket de backups (radar-immobilier-backups-preprod) —
      # DURABLES, hors workdir éphémère. On n'uploade en artefact GitHub que les
      # POINTEURS/états (clés S3 + T1 + quiesce/recon), en `if: always()` pour la
      # traçabilité même sur échec. Restaurer le rollback : rejouer le Job restore
      # avec DUMP_KEY = contenu de LATEST_PREPROD_ROLLBACK_KEY.txt (voir README).
      # MODE=restore adds backup-pin.json (backup date + manifest/dump sha256).
      - name: Rollback pointeurs + états (clés S3, PAS de dump runner)
        if: ${{ always() && !inputs.DRY_RUN && env.MODE != 'list' }}
        uses: actions/upload-artifact@v4
        with:
          name: bascule-rollback-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/.bascule-work/T1.txt
            ${{ github.workspace }}/.bascule-work/LATEST_PROD_DUMP_KEY.txt
            ${{ github.workspace }}/.bascule-work/LATEST_PREPROD_ROLLBACK_KEY.txt
            ${{ github.workspace }}/.bascule-work/quiesce-state.json
            ${{ github.workspace }}/.bascule-work/recon.ok.json
            ${{ github.workspace }}/.bascule-work/backup-pin.json
          if-no-files-found: warn
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # e2e CONTRACT (CYCLE_ID set by bascule-e2e.yml) — two jobs WITHOUT any cluster
  # credential (the kubeconfigs stay in `bascule`):
  #   served-ids  immo-served-canonical-ids-<CYCLE_ID>: zone ids immo references,
  #               computed with the PUBLISHED builder @sentropic/geo (same pin as
  #               the geo leg, installed outside the workspace) from the artefact
  #               immo-served-refs-<CYCLE_ID> (O1: extracted read-only from the
  #               restored preprod DB by the `bascule` job; no HTTP endpoint).
  #   cycle-leg   cycle-leg-immo-<CYCLE_ID>: `legs.immo` (run, sha, MODE, backup
  #               date + sha256, verdict pg/s3). Reports only, always runs.
  # A standalone or scheduled bascule (CYCLE_ID empty) never runs them.
  # ═══════════════════════════════════════════════════════════════════════════
  served-ids:
    needs: bascule
    if: ${{ inputs.CYCLE_ID != '' && !inputs.DRY_RUN && (inputs.MODE || 'chain') != 'list' && needs.bascule.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CYCLE_ID: ${{ inputs.CYCLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: e2e — validate CYCLE_ID
        run: node deploy/ci/bascule-preprod/served-ids.mjs validate-cycle-id

      - name: e2e — download immo-served-refs-<CYCLE_ID> (refs from the restored DB)
        uses: actions/download-artifact@v4
        with:
          name: immo-served-refs-${{ inputs.CYCLE_ID }}
          path: ${{ runner.temp }}/served-refs

      - name: e2e — install the published builder @sentropic/geo (temp dir, pinned version)
        run: |
          set -euo pipefail
          version="$(node deploy/ci/bascule-preprod/served-ids.mjs builder-version)"
          npm install --prefix "$RUNNER_TEMP/served-ids-builder" --no-save --no-audit --no-fund --ignore-scripts "@sentropic/geo@${version}"

      - name: e2e — served canonical ids (zones) referenced by immo
        env:
          IMMO_SERVED_REFS_FILE: ${{ runner.temp }}/served-refs/immo-served-refs.tsv.gz
        run: node deploy/ci/bascule-preprod/served-ids.mjs build --builder-dir "$RUNNER_TEMP/served-ids-builder" --out "$RUNNER_TEMP/served-ids"

      - name: e2e — artefact immo-served-canonical-ids-<CYCLE_ID>
        uses: actions/upload-artifact@v4
        with:
          name: immo-served-canonical-ids-${{ inputs.CYCLE_ID }}
          path: ${{ runner.temp }}/served-ids/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  cycle-leg:
    needs: [bascule, served-ids]
    if: ${{ always() && inputs.CYCLE_ID != '' && (inputs.MODE || 'chain') != 'list' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CYCLE_ID: ${{ inputs.CYCLE_ID }}
      MODE: ${{ inputs.MODE || 'chain' }}
      BACKUP_ID: ${{ needs.bascule.outputs.backup_id }}
      BACKUP_DATE: ${{ needs.bascule.outputs.backup_date }}
      MANIFEST_SHA256: ${{ needs.bascule.outputs.manifest_sha256 }}
      PG_SHA256: ${{ needs.bascule.outputs.pg_sha256 }}
      DUMP_STARTED_AT: ${{ needs.bascule.outputs.dump_started_at }}
      O_DUMP: ${{ needs.bascule.outputs.o_dump }}
      O_RESTORE_CHAIN: ${{ needs.bascule.outputs.o_restore_chain }}
      O_RESTORE_BACKUP: ${{ needs.bascule.outputs.o_restore_backup }}
      O_MIGRATE: ${{ needs.bascule.outputs.o_migrate }}
      O_DOCS_CHAIN: ${{ needs.bascule.outputs.o_docs_chain }}
      O_RECON_CHAIN: ${{ needs.bascule.outputs.o_recon_chain }}
      O_DOCS_BACKUP: ${{ needs.bascule.outputs.o_docs_backup }}
      O_RECON_BACKUP: ${{ needs.bascule.outputs.o_recon_backup }}
      O_SMOKE: ${{ needs.bascule.outputs.o_smoke }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: e2e — validate CYCLE_ID
        run: node deploy/ci/bascule-preprod/served-ids.mjs validate-cycle-id

      # Absent when served-ids did not run or failed → served_ids_sha256 = null.
      - name: Download the served-ids artefact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: immo-served-canonical-ids-${{ inputs.CYCLE_ID }}
          path: ${{ runner.temp }}/cycle-leg/served-ids

      - name: Build legs.immo (report only)
        run: node deploy/ci/bascule-preprod/served-ids.mjs cycle-leg --served-dir "$RUNNER_TEMP/cycle-leg/served-ids" --out "$RUNNER_TEMP/cycle-leg/out/cycle-leg-immo.json"

      - name: e2e — artefact cycle-leg-immo-<CYCLE_ID>
        uses: actions/upload-artifact@v4
        with:
          name: cycle-leg-immo-${{ inputs.CYCLE_ID }}
          path: ${{ runner.temp }}/cycle-leg/out/cycle-leg-immo.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
