# k8s-apply-mcp — one-shot manual deploy of the immo-mcp HTTP resources.
#
# Why a dedicated workflow: the immo-mcp Deployment/Service/Ingress
# (deploy/k8s/40-41) are deliberately NOT in kustomization.yaml until the IdP
# handover completes (see deploy/k8s/40-immo-mcp-http-deploy.yaml header), so
# they cannot go through the normal kustomize apply path. This workflow is
# still the ONLY thing that (a) performs the FIRST bootstrap apply (before the
# Deployment exists — build-push-images.yml's own config-durability step
# skips itself until then), (b) applies 41-immo-mcp-ingress.yaml and the
# NetworkPolicy update, which build-push-images.yml never touches, and
# (c) forces a rollout restart + smoke check on demand, e.g. when only the
# `:latest` image or the ConfigMap changed without a git-sha bump on
# radar-api (a plain `kubectl apply` does not restart pods in that case).
#
# Since 2026-07 (fix/cd-immo-mcp-config-durable), build-push-images.yml's
# `deploy` job ALSO re-applies 40-immo-mcp-http-deploy.yaml (ConfigMap +
# Deployment only) on every push to `main`, once this workflow has bootstrapped
# the Deployment at least once — so ordinary config drift (the original
# incident: IMMO_MCP_DATA_MODE/RADAR_API_BASE_URL silently reverted) now
# self-heals on the next `main` push instead of requiring this manual
# dispatch. Run this workflow by hand for the initial bootstrap, for
# ingress/networkpolicy changes, or to force an immediate restart.
#
# Trigger: manual only (workflow_dispatch).
name: Apply immo-mcp manifests
on:
  workflow_dispatch: {}

concurrency:
  group: k8s-apply-mcp
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NAMESPACE: radar-immobilier
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl -n "$NAMESPACE" get deploy radar-api >/dev/null

      - name: Apply immo-mcp manifests
        run: |
          kubectl apply \
            -f deploy/k8s/30-api.yaml \
            -f deploy/k8s/40-immo-mcp-http-deploy.yaml \
            -f deploy/k8s/41-immo-mcp-ingress.yaml \
            -f deploy/k8s/70-networkpolicy.yaml

      # `kubectl apply` alone does NOT redeploy when only the :latest image
      # changed (the Deployment spec is unchanged). Force a restart so
      # dispatching this workflow == deploying the freshly pushed MCP image
      # (imagePullPolicy: Always re-pulls). RBAC: radar-ci-deployer has patch
      # on deployments.
      - name: Restart deployment (pull the new image)
        run: |
          kubectl -n "$NAMESPACE" rollout restart deploy/radar-immo-mcp

      - name: Wait for rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status deploy/radar-immo-mcp --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deploy/radar-api --timeout=300s
          kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/component=mcp -o wide

      # RBAC: radar-ci-deployer cannot create pods, so smoke via the PUBLIC
      # ingress from the runner instead of a kubectl-run curl pod.
      - name: Smoke check PRM through the ingress
        run: |
          curl -sf https://immo.sent-tech.ca/mcp/.well-known/oauth-protected-resource | head -c 200
