# Default nginx conf baked into the radar-ui image.
#
# In K8s the radar-ui-nginx ConfigMap (deploy/k8s/50-ui.yaml) is mounted over
# /etc/nginx/conf.d and WINS — there the `radar-api` Service DNS always exists,
# so that conf can `proxy_pass http://radar-api:3000` directly.
#
# This baked copy is what runs standalone (compose / e2e / `docker run`), where
# the api may be absent or slow to come up. So it resolves the upstream LAZILY
# (via a `resolver` + a variable proxy_pass) instead of at config-parse time —
# otherwise nginx aborts on boot with "host not found in upstream" and the
# container crashloops. The behaviour for a live api is identical.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers & information disclosure mitigation
  server_tokens off;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), clipboard-write=(self)" always;
  add_header Content-Security-Policy "worker-src 'self'" always;

  # Docker's embedded DNS (compose) / the cluster DNS; `valid` keeps it fresh
  # so a restarted api is picked up without reloading nginx.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $radar_api "radar-api:3000";
  set $geo_api "geo-api.geo.svc.cluster.local";

  # Stable SW entrypoint. expires emits no-cache without shadowing inherited
  # security add_header directives (nginx 1.27 inheritance is all-or-nothing).
  location = /immo-sw.js {
    types { }
    default_type text/javascript;
    expires -1;
    try_files $uri =404;
  }

  # MapLibre and pdf.js workers require JS MIME and must never receive SPA HTML.
  location ~ \.(js|mjs)$ {
    types { }
    default_type text/javascript;
    try_files $uri =404;
  }

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API proxy to the radar api Service (incl. the sentropic
  # OIDC callback /api/v1/auth/oauth/callback handled by the api RP glue).
  # The variable upstream forces per-request resolution (no boot-time crash).
  # Same-origin proxy to geo OGC API for immo consumers.
  # Only /api/geo/collections is owned by geo-api; radar-api owns the
  # application-specific /api/geo/:city/zones routes.
  location /api/geo/collections {
    rewrite ^/api/geo/(.*)$ /$1 break;
    proxy_pass http://$geo_api;
    proxy_set_header Host api.geo.sent-tech.ca;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/geo/ {
    proxy_pass http://$radar_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://$radar_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # PW-C: same-origin application write-intent surface (summary HTML at
  # /artifact-write/intents/*, confirm/revoke/result under
  # /api/v1/artifacts/write-intents/*). The PW cookie-only guard refuses any
  # forwarded host metadata, so clear it even when supplied by an ingress.
  location /artifact-write/ {
    proxy_pass http://$radar_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
  }

  location /api/v1/artifacts/write-intents/ {
    proxy_pass http://$radar_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
  }

  location = /health {
    proxy_pass http://$radar_api/health;
  }
}
