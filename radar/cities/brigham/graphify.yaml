# graphify PROJECT for brigham (brigham.ca WordPress, Brome-Missisquoi).
version: 1
profile:
  path: ../../ontology/ontology-profile.yaml
inputs:
  corpus:
    - raw/proces-verbaux-brigham
  registries:
    - references/municipalities.csv
dataprep:
  pdf_ocr: auto
  prefer_ocr_markdown: true
  citation_minimum: page
  preserve_source_structure: true
outputs:
  state_dir: .graphify/brigham
  write_html: true
  write_wiki: true
