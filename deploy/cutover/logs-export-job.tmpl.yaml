# Cutover log export (R5): copies the current and previous logs of every container of the
# listed Pods to the recovery bucket, with a re-read sha256 manifest, BEFORE those Pods are
# deleted or re-rolled. Rendered by tools/make/cutover-render.sh (steps `logsmain`,
# `logsprep`); the controller only reads Job status and sanitized termination messages.
# Placeholders: ${JOB_NAME} ${NAMESPACE} ${IMAGE} ${TTL_SECONDS} ${LOG_PODS} ${LOG_PREFIX}
# ${BACKUP_S3_ENDPOINT} ${BACKUP_S3_REGION} ${BACKUP_S3_BUCKET} ${S3_SECRET}, plus the
# LOG_SCRIPT placeholder under the container args (multi-line, never written in a comment).
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: cutover-logs
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: ${TTL_SECONDS}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/component: cutover-logs
    spec:
      restartPolicy: Never
      # Reads Pods and their logs through the Kubernetes API (see rbac-logs-<env>.yaml).
      serviceAccountName: radar-cutover-logs
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
      containers:
        - name: export
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/api
          command: ["node", "-e"]
          args:
            - |
${LOG_SCRIPT}
          env:
            - { name: NODE_PATH, value: "/workspace/node_modules" }
            - { name: AWS_EC2_METADATA_DISABLED, value: "true" }
            - { name: LOG_PODS, value: '${LOG_PODS}' }
            - { name: LOG_PREFIX, value: "${LOG_PREFIX}" }
            - { name: LOG_BUCKET, value: "${BACKUP_S3_BUCKET}" }
            - { name: S3_ENDPOINT, value: "${BACKUP_S3_ENDPOINT}" }
            - { name: S3_REGION, value: "${BACKUP_S3_REGION}" }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: ${S3_SECRET}, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: ${S3_SECRET}, key: S3_SECRET_KEY } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { cpu: 200m, memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
