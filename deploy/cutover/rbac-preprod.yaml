# Install through the infrastructure owner; never self-apply from the controller.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar-ci-deployer-preprod
  namespace: radar-immobilier-preprod
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radar-cutover
  namespace: radar-immobilier-preprod
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [radar-api-prepared]
    verbs: [delete]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [radar-db-credentials]
    verbs: [patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [apps]
    resources: [replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  # Inventory refuses unsupported autoscalers/rollouts: it must be able to list them.
  - apiGroups: [keda.sh, http.keda.sh]
    resources: [scaledobjects, scaledjobs, httpscaledobjects]
    verbs: [get, list]
  - apiGroups: [autoscaling.k8s.io]
    resources: [verticalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [rollouts]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch, update]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [radar-change-lock]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radar-cutover
  namespace: radar-immobilier-preprod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: radar-cutover
subjects:
  - kind: ServiceAccount
    name: radar-ci-deployer-preprod
    namespace: radar-immobilier-preprod

  - kind: ServiceAccount
    name: radar-ci-bascule-preprod
    namespace: radar-immobilier-preprod
