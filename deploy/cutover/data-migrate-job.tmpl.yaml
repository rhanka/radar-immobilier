apiVersion: batch/v1
kind: Job
metadata:
  name: cutover-data
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 540
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
    spec:
      restartPolicy: Never
      serviceAccountName: radar-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: data-migrate
          image: ${IMAGE}
          workingDir: /workspace/api
          command: [node, dist/scripts/database-cutover.js]
          envFrom:
            - configMapRef: {name: radar-api}
          env:
            - name: CUTOVER_PLAN
              valueFrom: {configMapKeyRef: {name: radar-cutover-6h, key: plan.json}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: radar-db-credentials, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: radar-db-credentials, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: radar-db-credentials, key: POSTGRES_DB}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
