# Recovery-backup write probe: proves, before any closure, that the namespace
# backup Secret can write to and read back from this environment's recovery
# bucket. Write a small object, upload it, then list that exact key.
# Rendered by tools/make/cutover-render.sh (step `probe`); the controller only
# reads Job status and sanitized termination messages.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: db-backup-probe
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: ${TTL_SECONDS}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/component: db-backup-probe
    spec:
      restartPolicy: Never
      serviceAccountName: radar-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: work
          emptyDir: { sizeLimit: 1Mi }
      initContainers:
        - name: write
          image: ${UPLOAD_IMAGE}
          command: ["/bin/sh", "-c"]
          args: ["printf 'cutover recovery backup write probe\\n' > /work/probe.txt"]
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts: &work
            - { name: work, mountPath: /work }
        - name: put
          image: ${UPLOAD_IMAGE}
          args: ["--endpoint-url", "${BACKUP_S3_ENDPOINT}", "cp", "/work/probe.txt", "s3://${BACKUP_S3_BUCKET}/${KEY}"]
          env: &credentials
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: ${S3_SECRET}, key: S3_ACCESS_KEY } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: ${S3_SECRET}, key: S3_SECRET_KEY } }
            - name: AWS_REGION
              value: ${BACKUP_S3_REGION}
          securityContext: *restricted
          volumeMounts: *work
      containers:
        - name: head
          image: ${UPLOAD_IMAGE}
          args: ["--endpoint-url", "${BACKUP_S3_ENDPOINT}", "ls", "s3://${BACKUP_S3_BUCKET}/${KEY}"]
          env: *credentials
          securityContext: *restricted
          volumeMounts: *work
