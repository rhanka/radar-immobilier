# ONE-TIME operator rights, installed for the slot adoption (slots-adopt) and the volume
# expansion (pvc-expand), then REMOVED by the infrastructure owner. The permanent cutover Role
# (rbac-prod.yaml) never deletes a canonical Deployment, an unnamed ReplicaSet or patches the
# PostgreSQL claim; no Role grants pods/exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radar-cutover-adopt
  namespace: radar-immobilier
rules:
  # Orphaning delete of the canonical Deployments (recreated with the slot label).
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [radar-api, radar-ui, radar-immo-mcp]
    verbs: [delete]
  # Orphaned ReplicaSets have generated names: RBAC cannot name them in advance.
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    resourceNames: [postgres-data-radar-postgres-0]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radar-cutover-adopt
  namespace: radar-immobilier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: radar-cutover-adopt
subjects:
  - kind: ServiceAccount
    name: radar-ci-deployer
    namespace: radar-immobilier
