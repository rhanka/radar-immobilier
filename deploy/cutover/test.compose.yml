services:
  postgres:
    image: postgis/postgis:16-3.4
    environment: {POSTGRES_USER: radar, POSTGRES_PASSWORD: synthetic-only, POSTGRES_DB: radar}
    tmpfs: [/var/lib/postgresql/data]
    volumes: [./:/cutover:ro]
    networks:
      default:
        aliases: [radar-postgres]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U radar -d radar]
      interval: 2s
      retries: 30
  api:
    image: ${CUTOVER_TEST_IMAGE:-node:24-bookworm-slim}
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    tmpfs:
      - /tmp:size=512m
      - /workspace/node_modules:size=3g
      - /workspace/api/node_modules:size=512m
    environment:
      NODE_ENV: test
      LOT_MIGRATION_DB_TEST: "1"
      LOG_LEVEL: silent
      DOTENV_CONFIG_PATH: /dev/null
      POSTGRES_HOST: postgres
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: synthetic-only
      POSTGRES_DB: radar
      S3_ACCESS_KEY: synthetic
      S3_SECRET_KEY: synthetic
      S3_ENDPOINT: http://minio:9000
    entrypoint: []
