services:
  postgres:
    image: postgis/postgis:16-3.4
    environment: {POSTGRES_USER: radar, POSTGRES_PASSWORD: synthetic-only, POSTGRES_DB: radar}
    tmpfs: [/var/lib/postgresql/data]
    volumes: [./:/cutover:ro]
    networks:
      default:
        aliases: [radar-postgres]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U radar -d radar]
      interval: 2s
      retries: 30
  api:
    # UIDFIX-EX2: run as the host user so bind-mounted outputs stay
    # host-owned (Sentropic PRs #973/#987 pattern); tools baked in
    # deploy/cutover/Dockerfile.test (apt-get needs root).
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: ../..
      dockerfile: deploy/cutover/Dockerfile.test
    image: radar-cutover-test:local
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - modules:/workspace/node_modules
      - api-modules:/workspace/api/node_modules
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/npm-cache
      NODE_ENV: test
      LOT_MIGRATION_DB_TEST: "1"
      LOG_LEVEL: silent
      DOTENV_CONFIG_PATH: /dev/null
      POSTGRES_HOST: postgres
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: synthetic-only
      POSTGRES_DB: radar
      S3_ACCESS_KEY: synthetic
      S3_SECRET_KEY: synthetic
      S3_ENDPOINT: http://minio:9000
    entrypoint: []
volumes:
  modules:
  api-modules:
