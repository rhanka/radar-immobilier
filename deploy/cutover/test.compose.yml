services:
  postgres:
    image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
    # Same server flags as the radar-pg18 StatefulSet (deploy/k8s/pg18).
    command: [postgres, -c, wal_level=logical, -c, wal_receiver_status_interval=1s]
    environment: {POSTGRES_USER: radar, POSTGRES_PASSWORD: synthetic-only, POSTGRES_DB: radar}
    tmpfs: [/var/lib/postgresql]
    volumes: [./:/cutover:ro]
    networks:
      default:
        aliases: [radar-postgres, radar-pg18]
    healthcheck:
      # TCP check: the init-time server listens on the socket only, then restarts.
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U radar -d radar]
      interval: 2s
      retries: 30
  # PG16 source of the logical-replication upgrade test (test-pg only).
  postgres16:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    command: [postgres, -c, wal_level=logical, -c, max_slot_wal_keep_size=2GB]
    environment: {POSTGRES_USER: radar, POSTGRES_PASSWORD: synthetic-only, POSTGRES_DB: radar}
    tmpfs: [/var/lib/postgresql/data]
    networks:
      default:
        aliases: [radar-pg16]
    healthcheck:
      # TCP check: the init-time server listens on the socket only, then restarts.
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U radar -d radar]
      interval: 2s
      retries: 30
  api:
    image: node:24-bookworm-slim
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - modules:/workspace/node_modules
      - api-modules:/workspace/api/node_modules
    environment:
      NODE_ENV: test
      LOT_MIGRATION_DB_TEST: "1"
      LOG_LEVEL: silent
      DOTENV_CONFIG_PATH: /dev/null
      POSTGRES_HOST: postgres
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: synthetic-only
      POSTGRES_DB: radar
      S3_ACCESS_KEY: synthetic
      S3_SECRET_KEY: synthetic
      S3_ENDPOINT: http://minio:9000
    entrypoint: []
volumes:
  modules:
  api-modules:
