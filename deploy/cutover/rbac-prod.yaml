# Install through the infrastructure owner; never self-apply from the controller.
# Owner install (once, cluster-admin identity, explicit namespace):
#   kubectl -n radar-immobilier apply -f deploy/cutover/rbac-prod.yaml
#   kubectl -n radar-immobilier apply -f deploy/ci/bascule-preprod/rbac-ci-bascule-prod.yaml
# Then mint/rotate the namespace-scoped tokens into the GitHub secrets
# KUBE_CONFIG_DATA (promote-prod, SA radar-ci-deployer) and
# KUBE_CONFIG_DATA_PROD (bascule-bundle-cd, SA radar-ci-bascule-prod).
# Verify before arming any CD job (read-only):
#   kubectl -n radar-immobilier auth can-i get configmaps/radar-change-lock --as=system:serviceaccount:radar-immobilier:radar-ci-bascule-prod
#   kubectl -n radar-immobilier auth can-i update configmaps/radar-change-lock --as=system:serviceaccount:radar-immobilier:radar-ci-bascule-prod
#   kubectl -n radar-immobilier auth can-i delete configmaps/radar-change-lock --as=system:serviceaccount:radar-immobilier:radar-ci-bascule-prod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar-ci-deployer
  namespace: radar-immobilier
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radar-cutover
  namespace: radar-immobilier
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [radar-api-prepared]
    verbs: [delete]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [radar-db-credentials]
    verbs: [patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [apps]
    resources: [replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  # Inventory refuses unsupported autoscalers/rollouts: it must be able to list them.
  - apiGroups: [keda.sh]
    resources: [scaledobjects, scaledjobs]
    verbs: [get, list]
  - apiGroups: [http.keda.sh]
    resources: [httpscaledobjects]
    verbs: [get, list]
  - apiGroups: [autoscaling.k8s.io]
    resources: [verticalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [rollouts]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods, endpoints]
    verbs: [get, list, watch]
  # Job logs: the promote-prod migrate step and the cutover engine read
  # `kubectl logs job/...`, which is get on pods/log (not covered above).
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch, update]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [radar-change-lock]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radar-cutover
  namespace: radar-immobilier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: radar-cutover
subjects:
  - kind: ServiceAccount
    name: radar-ci-deployer
    namespace: radar-immobilier
# radar-ci-bascule-prod is deliberately NOT a subject here: this Role also
# grants patch on secret radar-db-credentials, deployments, ingresses,
# services and pods/portforward, none of which bascule-bundle-cd needs. Its
# lock verbs (create on configmaps; get/update/delete on radar-change-lock;
# get/list on jobs and pods for the writer release) already live, name-scoped,
# in deploy/ci/bascule-preprod/rbac-ci-bascule-prod.yaml.
