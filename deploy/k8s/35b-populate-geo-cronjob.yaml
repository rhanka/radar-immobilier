# populate-geo-cronjob.yaml — refresh quotidien geo → PG + mapper.
#
# One-shot depuis le cron :
#   kubectl create job radar-populate-geo-manual-$(date +%Y%m%d%H%M) \
#     --from=cronjob/radar-populate-geo-daily -n radar-immobilier
#   kubectl logs -l job-name=<job-name> -n radar-immobilier -f
apiVersion: batch/v1
kind: CronJob
metadata:
  name: radar-populate-geo-daily
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: populate-geo
spec:
  schedule: "17 4 * * *"
  timeZone: "America/Toronto"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: radar-immobilier
            app.kubernetes.io/component: graph-projection
        spec:
          restartPolicy: Never
          serviceAccountName: radar-app
          containers:
            - name: populate-geo
              image: rg.fr-par.scw.cloud/radar-immobilier/radar-api:latest
              imagePullPolicy: Always
              workingDir: /workspace/api
              command: ["node", "dist/services/geo/run-populate-geo.js"]
              envFrom:
                - configMapRef:
                    name: radar-api
              env:
                - name: NODE_OPTIONS
                  value: "--max-old-space-size=512 --dns-result-order=ipv4first"
                - name: POPULATE_LOTS
                  value: "1"
                - name: RUN_RESOLUTION
                  value: "1"
                - name: POSTGRES_USER
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
                - name: POSTGRES_PASSWORD
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
                - name: POSTGRES_DB
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
                - name: DATABASE_URL
                  value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: 500m, memory: 768Mi }
