apiVersion: batch/v1
kind: Job
metadata:
  name: radar-db-restore-verify
  namespace: radar-immobilier-preprod
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/component: db-restore-verify
        radar-pra: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - { name: work, emptyDir: { sizeLimit: 2Gi } }
        - { name: scratch, emptyDir: { sizeLimit: 6Gi } }
      initContainers:
        - name: download
          image: ghcr.io/rhanka/radar-backup:PIN-BEFORE-APPLY
          args: [download]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 50m, memory: 64Mi, ephemeral-storage: 1Gi }
            limits: { cpu: 500m, memory: 128Mi, ephemeral-storage: 8Gi }
          envFrom: [{ configMapRef: { name: radar-pra-settings } }]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: radar-pra-reader, key: S3_ACCESS_KEY } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-pra-reader, key: S3_SECRET_KEY } }
            - { name: BACKUP_OBJECT, value: SELECT-A-COMPLETE-SET }
          volumeMounts:
            - { name: work, mountPath: /work }

        - name: restore-and-verify
          image: ghcr.io/rhanka/radar-backup:PIN-BEFORE-APPLY
          args: [restore]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 50m, memory: 64Mi, ephemeral-storage: 1Gi }
            limits: { cpu: 500m, memory: 512Mi, ephemeral-storage: 8Gi }
          envFrom: [{ configMapRef: { name: radar-pra-settings } }]
          env:
            - name: JOB_UID
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['batch.kubernetes.io/controller-uid']" } }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: scratch, mountPath: /scratch }

      containers:
        - name: report
          image: ghcr.io/rhanka/radar-backup:PIN-BEFORE-APPLY
          args: [report]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 50m, memory: 64Mi, ephemeral-storage: 1Gi }
            limits: { cpu: 500m, memory: 128Mi, ephemeral-storage: 8Gi }
          envFrom: [{ configMapRef: { name: radar-pra-settings } }]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: radar-pra-reporter, key: S3_ACCESS_KEY } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-pra-reporter, key: S3_SECRET_KEY } }
          volumeMounts:
            - { name: work, mountPath: /work }
