# Owner-triggered preprod rehearsal only. This file is deliberately excluded
# from kustomization: BACKUP_OBJECT must name a verified backup before apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: radar-db-restore-verify
  namespace: radar-immobilier-preprod
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/component: db-restore-verify
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/component: db-restore-verify
    spec:
      restartPolicy: Never
      serviceAccountName: radar-app
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - { name: work, emptyDir: {} }
        - name: scripts
          configMap: { name: radar-db-backup-scripts, defaultMode: 0555 }
      initContainers:
        - name: download
          image: public.ecr.aws/aws-cli/aws-cli:2.17.0
          command: ["/bin/sh", "-ec"]
          args: ["aws --endpoint-url $BACKUP_S3_ENDPOINT s3 cp s3://$BACKUP_S3_BUCKET/$BACKUP_OBJECT.dump /work/restore.dump && aws --endpoint-url $BACKUP_S3_ENDPOINT s3 cp s3://$BACKUP_S3_BUCKET/$BACKUP_OBJECT.dump.sha256 /work/restore.dump.sha256"]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: { drop: ["ALL"] } }
          env: &restore-env
            - { name: BACKUP_S3_BUCKET, value: radar-immobilier-backups-preprod }
            - { name: BACKUP_S3_ENDPOINT, value: https://s3.bhs.io.cloud.ovh.net }
            - { name: BACKUP_OBJECT, value: REPLACE_WITH_POSTGRES_PREPROD_BACKUP_STEM }
            - { name: RESTORE_DATABASE, value: radar_restore_verify }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: radar-backup-s3-credentials, key: S3_ACCESS_KEY } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-backup-s3-credentials, key: S3_SECRET_KEY } }
          volumeMounts: [{ name: work, mountPath: /work }]
      containers:
        - name: restore-and-verify
          image: postgis/postgis:16-3.4
          command: ["/scripts/restore-verify.sh"]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: { drop: ["ALL"] } }
          env:
            - { name: PGHOST, value: radar-postgres }
            - { name: RESTORE_DATABASE, value: radar_restore_verify }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
          volumeMounts: [{ name: work, mountPath: /work }, { name: scripts, mountPath: /scripts, readOnly: true }]
