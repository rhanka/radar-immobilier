# allow-grounding-to-minio (PREPROD) — §citations publish-only Job → minio.
#
# The publish-only grounding Job (41-grounding-citation-job.yaml, extraction #588)
# PUBLISHES the grounded graph to radar-minio:9000 (graph/<city>/latest.json).
# radar-minio's default-deny ingress only allows component=api + snapshot-dump +
# graph-projection (71-…), so the Job would be DROPPED. This adds the missing
# ingress rule for the grounding Job's component.
#
# ⚠ CONTRACT with #588 (extraction) — the publish-only Job pod MUST carry the
# label `app.kubernetes.io/component: grounding` (proposed; consistent with the
# `radar-grounding` image). If extraction uses a different component label, this
# NP's `from` selector must match it — align at co-val.
#
# Modeled on 71-…/allow-api-to-minio (ingress on minio, port 9000). PREPROD ns
# only. APPLICATION = out-of-band by k8s in cluster-admin (like 71-… + the RBAC;
# routed by i-cond, applied before the Job) — NOT the CD deployer (no
# networkpolicies grant) and NOT the owner directly; not in any kustomization:
#   kubectl apply -f deploy/k8s/72-networkpolicy-grounding-minio-preprod.yaml
# i-infra co-vals (selectors + ns); extraction confirms the component label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grounding-to-minio
  namespace: radar-immobilier-preprod
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: minio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: radar-immobilier
      app.kubernetes.io/component: minio
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: radar-immobilier
              app.kubernetes.io/component: grounding
      ports:
        - protocol: TCP
          port: 9000
