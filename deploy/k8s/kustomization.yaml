# Kustomization for radar-immobilier as a sentropic app.
#
# `secrets.example.yaml` is intentionally NOT a resource (it carries no real
# values); real Secrets are created out-of-band (SealedSecrets or
# `make k8s-create-secrets`). The `00-namespace.yaml` is included so the bundle
# renders/validates standalone and can be applied to a throwaway/kind cluster
# for review; on the live poc-k8s cluster the operator owns the Namespace +
# ResourceQuota + baseline NetworkPolicy, and its copy wins.
#
# `40-immo-mcp-http-deploy.yaml` / `41-immo-mcp-ingress.yaml` (remote MCP HTTP
# server for claude.ai, see docs/spec/mcp/immo-mcp-remote-deploy.md) are
# PREPARED but deliberately NOT listed below yet, same reasoning as the
# 31/32/33 one-shot Jobs: the image does not carry the entrypoint yet (see
# that file's header) and the IdP issuer/JWKS are placeholders. Apply by hand
# (`kubectl apply -f deploy/k8s/40-immo-mcp-http-deploy.yaml -f
# deploy/k8s/41-immo-mcp-ingress.yaml`) once the runbook's prerequisites are
# met, then fold both into `resources:` below. The companion
# `allow-traefik-to-immo-mcp` NetworkPolicy IS already appended to
# `70-networkpolicy.yaml` (harmless no-op until the mcp Deployment exists).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: radar-immobilier

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: sentropic
      sentropic.dev/workspace: radar-immobilier

resources:
  - 00-namespace.yaml
  - 10-rbac.yaml
  - 20-postgres-postgis.yaml
  - 25-minio.yaml
  - 30-api.yaml
  # 31/32/33 = Jobs one-shot (projection, projection-only, scrape) appliqués À LA
  # MAIN par le conducteur (kubectl apply -f), pas dans le bundle permanent.
  - 34-refresh-cronjob.yaml
  - 35-obscura.yaml
  - 40-maildev.yaml
  - 50-ui.yaml
  - 60-ingress.yaml
  - 70-networkpolicy.yaml
  - 80-auth.yaml
