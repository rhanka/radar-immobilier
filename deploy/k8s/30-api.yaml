# radar API (Hono) Deployment + Service. Brought in from draft PR #8
# (deploy/k8s/api.yaml) and extended for the sentropic-app model:
#   - runs under the radar-app ServiceAccount (SCW registry pull);
#   - object storage points at the in-cluster MinIO (25-minio.yaml);
#   - the SENTROPIC_* / OAUTH_* / AUTH_* env wires human auth to the shared
#     sentropic IdP (OIDC, see 80-auth.yaml + README "Auth delegation").
#     The api is the OIDC *relying party*: it runs the authorization-code +
#     PKCE flow against auth.sent-tech.ca, verifies the id_token against the
#     IdP JWKS, and mints its OWN session cookie (per sentropic's
#     apps/auth-idp/RP_SESSION_GLUE.md recipe).
apiVersion: v1
kind: ConfigMap
metadata:
  name: radar-api
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: api
data:
  NODE_ENV: "production"
  PORT: "3000"
  # IPv4-first DNS on the IPv4-only POC egress path (mirrors sentropic 30-api).
  # --max-old-space-size borne le vieux-espace V8 SOUS la limite cgroup (768Mi) :
  # sans lui, V8 se cale à ~2Go et le RSS dépasse la limite AVANT que V8 ne GC →
  # OOMKill (exit 137). 512 laisse ~256Mi pour natif/buffers sous 768Mi et
  # convertit l'OOMKill en pression GC gérée (étude crashloop 2026-07-02).
  NODE_OPTIONS: "--dns-result-order=ipv4first --max-old-space-size=512"
  POSTGRES_HOST: "radar-postgres"
  POSTGRES_PORT: "5432"
  # In-cluster MinIO (25-minio.yaml). Replace with an external SCW S3 endpoint
  # if the operator provisions a managed bucket.
  S3_ENDPOINT: "http://radar-minio:9000"
  S3_REGION: "fr-par"
  S3_BUCKET: "radar-immobilier-raw"
  S3_FORCE_PATH_STYLE: "true"
  OBSCURA_CDP_URL: "http://radar-obscura:9222"
  # ── Scaleway TEM outbound (invitation / enrolment mail) ───────────────────
  # SMTP egress (:587) is BLOCKED at the Kapsule platform level (BR-37b), so the
  # nodemailer/smtp.tem.scw.cloud relay never delivers. The api sends mail via
  # the Scaleway Transactional Email HTTP API instead — same approach as the
  # sentropic tenant (api/src/services/scw-tem-client.ts):
  #   POST {SCW_TEM_API_BASE_URL}/transactional-email/v1alpha1/regions/{region}/emails
  #   X-Auth-Token: {SCW_TEM_SECRET_KEY}
  # config.ts resolveTemConfig reads these non-secret keys; SCW_TEM_SECRET_KEY
  # comes from the radar-tem-credentials Secret (see env + secrets.example.yaml).
  # When SCW_TEM_SECRET_KEY is empty the mailer logs the link to stdout (degraded
  # mode) and the admin copies it from the UI instead. The sender domain
  # (sent-tech.ca) must be validated in the SCW TEM console first.
  SCW_TEM_API_BASE_URL: "https://api.scaleway.com"
  SCW_TEM_REGION: "fr-par"
  SCW_TEM_PROJECT_ID: "09ac728a-e3b9-4a5b-9749-664b0f147c70"
  SCW_TEM_FROM_EMAIL: "no-reply@sent-tech.ca"
  SCW_TEM_FROM_NAME: "Radar"
  # ── Sentropic app / auth delegation (OIDC relying party) ──────────────
  # The shared sentropic IdP issuer (sentropic deploy/k8s/35-auth-idp.yaml:
  # OAUTH_ISSUER_URL=https://auth.sent-tech.ca; discovery at
  # /.well-known/openid-configuration, JWKS at /.well-known/jwks.json).
  SENTROPIC_IDP_ISSUER: "https://auth.sent-tech.ca"
  # This app's registered oauth_clients id at the IdP. The `radar-immobilier`
  # client row is seeded at auth.sent-tech.ca with redirect_uri below.
  # resolveAuthConfig() (api/src/config.ts) sets `enabled=true` only when all
  # five OIDC fields are non-empty — this completes the set.
  SENTROPIC_OAUTH_CLIENT_ID: "radar-immobilier"
  SENTROPIC_OAUTH_SCOPES: "openid profile email"
  # Public base URL of this app (the Ingress host) — used for the OIDC
  # redirect_uri and user-facing callbacks (mirrors sentropic AUTH_CALLBACK_BASE_URL).
  AUTH_CALLBACK_BASE_URL: "https://immo.sent-tech.ca"
  SENTROPIC_OAUTH_REDIRECT_URI: "https://immo.sent-tech.ca/api/v1/auth/oauth/callback"
  # Durable RP session (cf. docs/spec/reports/wp5-plateforme.md §B). The api
  # cookie lasts 15 days and SLIDES (re-mints in protect/`/me`) on activity, so
  # an active user almost never bounces back to the IdP — this is the main fix
  # for the "re-authorise the app every time" symptom. The absolute ceiling
  # (30 days) bounds the rolling window so a stolen cookie cannot live forever.
  # These mirror the config.ts defaults; set here so the values are declarative.
  SESSION_TTL_SECONDS: "1296000"
  SESSION_ABSOLUTE_TTL_SECONDS: "2592000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar-api
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: api
spec:
  replicas: 1
  # RollingUpdate keeps >=1 replica up during a roll: on a failed new-pod create
  # (e.g. a transient quota pinch) the old pod is NOT torn down first, so the
  # service never drops to 0. maxUnavailable:0 = never below 1 running; maxSurge:1
  # = at most 1 extra pod (needs quota headroom for the surge). radar-api is
  # stateless (network to postgres/minio, no RWO PVC / hostPort) so two versions
  # may briefly coexist. (Was Recreate — a conservative single-replica default.)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: radar-immobilier
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/part-of: sentropic
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: radar-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          # :latest (comme radar-immo-mcp) — un tag FIGÉ ici faisait reverter
          # radar-api sur une vieille image à chaque `kubectl apply` du workflow
          # k8s-apply-mcp, annulant le `set image` du CD (pod bloqué pré-#326,
          # /livez 401 ; diag poc-k8s 2026-07-03). Avec :latest + Always, l'apply
          # + rollout restart tire toujours la dernière image publiée par le CD.
          image: rg.fr-par.scw.cloud/radar-immobilier/radar-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: radar-api
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_SECRET_KEY } }
            # OIDC RP client secret for the sentropic IdP token exchange
            # (confidential client). Seeded with the client row at the IdP.
            - name: SENTROPIC_OAUTH_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: radar-sentropic-auth, key: SENTROPIC_OAUTH_CLIENT_SECRET } }
            # Symmetric key the api uses to sign its OWN RP session cookie
            # (the id_token proves identity; the RP session is separate — see
            # RP_SESSION_GLUE.md Step 5).
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: radar-sentropic-auth, key: SESSION_SECRET } }
            # LLM provider keys (optional; chat reports "no provider" if unset).
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: radar-llm-credentials, key: OPENAI_API_KEY, optional: true } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: radar-llm-credentials, key: ANTHROPIC_API_KEY, optional: true } }
            # Scaleway TEM API secret key (X-Auth-Token). Optional: when the
            # Secret is absent the mailer stays in degraded/log mode (invitation
            # link is shown in the admin UI instead of emailed). Generated in the
            # SCW console (Transactional Email → API keys); reused from the same
            # SCW project as sentropic. Secret radar-tem-credentials is created
            # out-of-band in the namespace.
            - name: SCW_TEM_SECRET_KEY
              valueFrom: { secretKeyRef: { name: radar-tem-credentials, key: SCW_TEM_SECRET_KEY, optional: true } }
          # Probes DÉCOUPLÉES des dépendances (étude crashloop 2026-07-02, C2) :
          # startup + liveness tapent /livez (process vivant, SANS DB/S3) — un
          # hoquet Postgres/S3 ne doit PAS tuer le pod. Seule la readiness tape
          # /health (DB+S3) : en cas de panne dépendance, le pod sort du LB
          # (readiness) au lieu d'être tué en boucle (liveness). La startupProbe
          # couvre jusqu'à 30×5s = 150s de démarrage.
          startupProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            # 384Mi étranglait l'app depuis l'alourdissement de l'image (quota
            # namespace élargi par poc-k8s le 2026-07-02 pour permettre ceci).
            limits: { cpu: 500m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: radar-api
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
