# Namespace-scoped ServiceAccount used by every radar Pod. Runtime images are
# public and digest/tag-pinned by their deployment paths.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar-app
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: app
automountServiceAccountToken: false

---
# Additive least-privilege grant for the existing production CI deployer. The
# `radar-ci-deployer` ServiceAccount is provisioned out-of-band; keeping refresh
# permissions in a separate Role avoids replacing its existing deployment and
# one-shot Job permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radar-ci-deployer-refresh-cronjobs
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: ci-deployer
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "create", "patch", "update"]
  # PVC KEYRING REFRESH (2026-09-14, jumeau prod du correctif préprod) — CAUSE :
  # le PVC `radar-refresh-keyring` (34-refresh-keyring-pvc.yaml, T2 #683/#685) a
  # été ajouté à l'overlay préprod sans verbes PVC sur le Role, cassant 6 runs CD
  # préprod d'affilée depuis le 2026-09-13 23:00. ÉTAT MESURÉ CÔTÉ PROD : le rendu
  # de deploy/k8s/refresh-cronjobs-prod (kubectl kustomize --load-restrictor
  # LoadRestrictionsNone) émet 3 CronJob et AUCUN PVC — le step « Deploy refresh
  # CronJobs (prod) » n'applique donc pas encore de PVC et n'est PAS cassé
  # aujourd'hui. Le grant est posé en JUMEAU pour que la promotion du keyring en
  # prod (le CronJob `radar-refresh-pv` monte déjà claimName radar-refresh-keyring)
  # ne reproduise pas la panne en fenêtre de promotion. Mêmes bornes qu'en préprod :
  # get/list/watch/create/patch/update, PAS de `delete` (le PVC porte l'état
  # keyring ; sa suppression reste un acte owner/poc-k8s), Role namespace-borné,
  # 0 wildcard. L'APPLY sur le cluster est un acte cluster-admin (poc-k8s, GO owner).
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radar-ci-deployer-refresh-cronjobs
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: ci-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: radar-ci-deployer-refresh-cronjobs
subjects:
  - kind: ServiceAccount
    name: radar-ci-deployer
    namespace: radar-immobilier
