# Namespace-scoped ServiceAccount used by every radar Pod. Mirrors sentropic's
# deploy/k8s/10-rbac.yaml (ServiceAccount `sentropic-app`).
#
# No imagePullSecrets: every radar image (radar-api / radar-ui / radar-grounding
# / radar-obscura) is a PUBLIC ghcr.io/rhanka package. The legacy SCW
# `radar-registry-pull` dockerconfigjson Secret (kept only for radar-obscura
# after the GHCR cutover, #671) is retired now that radar-obscura is built +
# pushed to GHCR too (build-push-images.yml matrix `obscura`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar-app
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: app
automountServiceAccountToken: false

