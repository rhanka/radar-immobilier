# Namespace-scoped ServiceAccount used by every radar Pod. Production images
# are public GHCR packages, so no registry pull secret is required.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar-app
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: app
automountServiceAccountToken: false
