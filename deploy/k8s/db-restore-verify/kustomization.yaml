# Owner-only renderer for a one-shot preprod restore rehearsal.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: radar-immobilier-preprod
resources:
  - ../42-db-restore-verify-job.yaml
configMapGenerator:
  - name: radar-db-backup-scripts
    files:
      - ../db-backup/dump.sh
      - ../db-backup/upload.sh
      - ../db-backup/retention.sh
      - ../db-backup/restore-verify.sh
