apiVersion: batch/v1
kind: Job
metadata:
  name: radar-db-migrate
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: api
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  # Hard wall-clock cap on the whole Job (incl. the backoffLimit retry): the
  # cluster self-terminates a migration that hangs (e.g. an ALTER/CREATE INDEX
  # blocked on a lock) → the pod is killed and the request actually stops, not
  # just the CI poller. Kept BELOW the CD migrate poll (600s) so the Job fails
  # with DeadlineExceeded BEFORE the CI times out, giving the pipeline a clean
  # `Failed` condition to abort on (the CD step also deletes the Job as a belt).
  activeDeadlineSeconds: 540
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/part-of: sentropic
        app.kubernetes.io/component: api
    spec:
      restartPolicy: Never
      serviceAccountName: radar-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-migrate
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image: rg.fr-par.scw.cloud/radar-immobilier/radar-api:main-8909943-pdfgeo
          imagePullPolicy: Always
          workingDir: /workspace/api
          command: ["node", "dist/db/migrate.js"]
          envFrom:
            - configMapRef:
                name: radar-api
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_SECRET_KEY } }
