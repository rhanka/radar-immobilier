# 38-graphify34-emit-candidates-job.yaml — Graphify v3.4 Phase A EMIT (PASS-1).
#
# One-shot Job that runs `emit-graphify34-candidates.js`, which is READ-ONLY on
# Postgres: for every v2.3 city in SET-167 B' (ConfigMap radar-graphify34-set167,
# mounted at /config/set-167.tsv) it reads the existing PG projection and writes,
# under --out-dir, an enriched `<city>/latest.json` plus — with --emit-preenrich —
# a `preenrich/<city>/latest.json`, so recette can diff enriched vs pre-enriched
# bit-for-bit intra-cluster. It NEVER writes S3 or PG.
#
# S3 SINK — via `--s3-prefix` (the emit script gained the flag in #447, reusing
# the in-repo S3ObjectStore + resolveGraphS3Config; the guard only refuses the
# canonical graph/<city>/latest.json key, so the scratch/ prefix is free). The
# script uploads the whole /tmp/candidates tree (enriched `<city>/latest.json` +
# `preenrich/<city>/latest.json`) to S3 `scratch/phaseA-candidates/<BACKUP_ID>/`
# using the GRAPH_S3_* creds below; recette reads that prefix. The JSON report on
# stdout includes `uploaded=<n>`. The emptyDir just gives the script a writable
# /tmp/candidates.
apiVersion: batch/v1
kind: Job
metadata:
  name: radar-graphify34-emit-candidates
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    # component: graph-projection (NOT graphify34) — see the pod-template note below.
    app.kubernetes.io/component: graph-projection
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        # component MUST be graph-projection (NOT graphify34): the postgres ingress
        # NetworkPolicy `allow-graph-projection-to-postgres` (70-networkpolicy.yaml)
        # only admits component:{api,graph-projection} on :5432. Under the namespace
        # default-deny, a graphify34 pod is DROPPED → the pg Pool never connects →
        # 3s connect-timeout → a plain (non-pg) Error → every city aborts (the
        # PASS-1 emitted=0/144 blocage, 2026-08-02). This job is a projection reader.
        app.kubernetes.io/component: graph-projection
    spec:
      restartPolicy: Never
      serviceAccountName: radar-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: set167
          configMap:
            name: radar-graphify34-set167
        - name: candidates
          emptyDir: {}
      containers:
        - name: graphify34-emit-candidates
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image: rg.fr-par.scw.cloud/radar-immobilier/radar-api:latest
          imagePullPolicy: Always
          workingDir: /workspace/api
          command: ["sh", "-c"]
          args:
            - |
              node dist/scripts/emit-graphify34-candidates.js \
                --tsv /config/set-167.tsv \
                --out-dir /tmp/candidates \
                --emit-preenrich \
                --s3-prefix "scratch/phaseA-candidates/${BACKUP_ID:-manual}"
          volumeMounts:
            - name: set167
              mountPath: /config
              readOnly: true
            - name: candidates
              mountPath: /tmp/candidates
          envFrom:
            - configMapRef:
                name: radar-api
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=400 --dns-result-order=ipv4first"
            # Templated by run-job.yaml (sed __BACKUP_ID__). Empty ⇒ the command's
            # 'manual' default prefix. Extraction passes the SAME backup_id it uses
            # for the apply job so PASS-1 (emit) and PASS-2 (apply) correlate on S3.
            - name: BACKUP_ID
              value: "__BACKUP_ID__"
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_SECRET_KEY } }
            - name: GRAPH_S3_ENDPOINT
              value: "https://s3.fr-par.scw.cloud"
            - name: GRAPH_S3_BUCKET
              value: "radar-immobilier-docs-pocs"
            - name: GRAPH_S3_REGION
              value: "fr-par"
            - name: GRAPH_S3_FORCE_PATH_STYLE
              value: "false"
            - name: GRAPH_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_ACCESS_KEY } }
            - name: GRAPH_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_SECRET_KEY } }
            - name: SCRAPE_S3_ENDPOINT
              valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_ENDPOINT, optional: true } }
            - name: SCRAPE_S3_BUCKET
              valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_BUCKET, optional: true } }
            - name: SCRAPE_S3_REGION
              valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_REGION, optional: true } }
            - name: SCRAPE_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_ACCESS_KEY, optional: true } }
            - name: SCRAPE_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_SECRET_KEY, optional: true } }
            - name: SCRAPE_S3_FORCE_PATH_STYLE
              value: "false"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
