# Cluster nginx conf for radar-ui (the radar-ui-nginx ConfigMap source).
#
# SINGLE SOURCE for the IN-CLUSTER config: the preprod overlay's
# configMapGenerator (deploy/k8s/overlays/preprod) hashes this file so a
# content change rolls the radar-ui Deployment automatically (fixes the #608
# CM-drift: live CM != git). Uses DIRECT proxy_pass — in-cluster the radar-api
# Service DNS always exists, so no resolver is needed (and 127.0.0.11 is
# Docker-compose-only). The standalone/compose variant with a lazy resolver
# lives at ui/nginx/default.conf; the two MUST keep identical security
# headers (guarded by deploy/k8s/nginx/check-header-parity.sh).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers & information disclosure mitigation
  server_tokens off;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), clipboard-write=(self)" always;

  # ES module assets (.mjs) — notably the pdf.js worker bundled by Vite as
  # `pdf.worker.min-*.mjs`. nginx 1.27's stock mime.types maps .js but NOT
  # .mjs, so .mjs falls back to application/octet-stream. pdf.js loads its
  # worker with `new Worker(src, { type: "module" })`; browsers REJECT a
  # module worker whose Content-Type is not a JavaScript MIME → the worker
  # fails → pdf.js raises loadError → the "preuve non rendue" fallback. Map
  # .mjs to a JavaScript MIME so the worker loads. (Same-origin, no CORS.)
  location ~ \.mjs$ {
    types { }
    default_type text/javascript;
  }

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API proxy to the radar api Service (incl. the sentropic
  # OIDC callback /api/v1/auth/oauth/callback handled by the api RP glue).
  # Same-origin proxy to geo OGC API for immo consumers.
  # Only /api/geo/collections is owned by geo-api; radar-api owns the
  # application-specific /api/geo/:city/zones routes.
  location /api/geo/collections {
    rewrite ^/api/geo/(.*)$ /$1 break;
    proxy_pass http://geo-api.geo.svc.cluster.local;
    proxy_set_header Host api.geo.sent-tech.ca;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/geo/ {
    proxy_pass http://radar-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://radar-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://radar-api:3000/health;
  }
}
