# refresh-cronjob.yaml — RAFRAÎCHISSEMENT PÉRIODIQUE du pipeline DÉTERMINISTE.
#
# Deux CronJobs distincts, deux cadences (cf. brainstorm §4.1 « 3 régimes »
# et SPEC_PERSISTENCE_S3_FIRST §6 « SCW Serverless Jobs + Cron quotidien ») :
#
#   A. radar-refresh-scrape  (QUOTIDIEN, 03:17 UTC)
#      scrape + parse + exploit déterministe des ~528 villes config-only → raw/ parsed/
#      (sur 563 configs ALL_PV_CITIES − 35 fixtures ; couverture data actuelle ~1007)
#      ontology/ sur SCW. AUCUN LLM. HEAD-skip CAS → ne capte que le NOUVEAU.
#      C'est le moteur du « refresh des nouveaux PV tout seul » de la Vague A.
#
#   B. radar-refresh-projection  (QUOTIDIEN, 04:30 UTC, APRÈS le scrape)
#      projette graph/<ville>/latest.json (SCW) → PG. Idempotent (upsert ON
#      CONFLICT). Rattrape en PG tout graphe re-graphifié hors-bande depuis la
#      veille. NE migre PAS (schéma supposé à jour ; reset DB → passer d'abord
#      par 31-graph-projection-job.yaml une fois).
#
# NB cadences DÉCOUPLÉES volontairement : le scrape (déterministe, gratuit) peut
# tourner tous les jours ; la projection suit le scrape. Le graphify (agentique,
# coûteux, saturable) N'EST PAS ici — il reste piloté à la main en Vague A et
# passera en file agentique en Vague B. Bien séparer les cadences = clé de
# l'anti-saturation (brainstorm §4.1).
#
# Observabilité : chaque run laisse ses logs (logs jalons "worker-live: done"
# new/seen/errors ; "project-graph-from-s3: terminé" ok/skipped/errors) +
# successfulJobsHistoryLimit/failedJobsHistoryLimit pour inspection a posteriori.
#
# Budget mémoire tenant serré (cf. 31-graph-projection-job.yaml) :
# requests 96Mi/50m, limits 256Mi/150m, NODE_OPTIONS=--max-old-space-size=200.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: radar-refresh-scrape
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: scrape
spec:
  # SUSPENDU 2026-07-01 (FinOps poc-k8s) : échoue chaque nuit et réveille le pool
  # burst-rwx (coût). Root cause à réparer avant réactivation (image :latest désync /
  # secret / schéma). Réactiver = suspend:false.
  suspend: true
  # Quotidien 03:17 UTC (heure creuse ; minute décalée pour éviter le top-heure).
  schedule: "17 3 * * *"
  timeZone: "Etc/UTC"
  # Jamais deux scrapes en parallèle (politeness + budget mémoire).
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: radar-immobilier
            app.kubernetes.io/component: scrape
        spec:
          restartPolicy: Never
          serviceAccountName: radar-app
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scrape
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
              # image tag is OVERRIDDEN at release by the Kustomize `images:`
              # transformer in deploy/k8s/refresh-cronjobs/ (CI pins the SAME
              # immutable digest as the deployed release). This base tag is a
              # bootstrap default only — the CronJobs must be applied via the
              # refresh-cronjobs overlay, never with :latest live (§6).
              image: ghcr.io/rhanka/radar-api:latest
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/api
              command: ["node", "dist/scripts/worker-live.js"]
              envFrom:
                - configMapRef:
                    name: radar-api
              env:
                - name: NODE_OPTIONS
                  value: "--max-old-space-size=512 --dns-result-order=ipv4first"
                - name: LIVE_SCRAPE_EXPLOIT
                  value: "1"
                # Direct PG feed (design a): worker-live upserts the per-city graph
                # into Postgres during EXPLOITATION. HOST/PORT come from the radar-api
                # ConfigMap (envFrom); the credentials come from the DB secret. When
                # these are absent, worker-live runs S3-only ("PG feed: OFF") — see
                # api/src/scripts/pg-feed-decision.ts (decidePgFeed).
                - name: POSTGRES_USER
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
                - name: POSTGRES_PASSWORD
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
                - name: POSTGRES_DB
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
                - name: S3_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_ACCESS_KEY } }
                - name: S3_SECRET_KEY
                  valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_SECRET_KEY } }
                # SCRAPE_S3 EXPLICITE vers Scaleway (bucket scrape = radar-immobilier-docs-pocs,
                # même que raw/proces-verbaux-<city>/cas/). Le secret radar-scrape-s3-credentials
                # est ABSENT sur OVH → le worker retombait sur l'endpoint MinIO in-cluster
                # (radar-immobilier-docs.radar-minio, virtual-hosted) → ENOTFOUND (échec 2026-08-03).
                # Creds depuis radar-s3-credentials (le secret Scaleway qui marche pour emit/apply).
                - name: SCRAPE_S3_ENDPOINT
                  value: "https://s3.fr-par.scw.cloud"
                - name: SCRAPE_S3_BUCKET
                  value: "radar-immobilier-docs-pocs"
                - name: SCRAPE_S3_REGION
                  value: "fr-par"
                - name: SCRAPE_S3_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_ACCESS_KEY } }
                - name: SCRAPE_S3_SECRET_KEY
                  valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_SECRET_KEY } }
                - name: SCRAPE_S3_FORCE_PATH_STYLE
                  value: "false"
              resources:
                # 256Mi structurally too low (node heap ~240-280Mi + poppler/pdftotext
                # in the same cgroup) — this is the latent OOM masked while the CronJob
                # is suspended. 512Mi floor / 768Mi comfort from extraction runs;
                # NODE_OPTIONS max-old-space-size=512 pairs with the 768Mi limit.
                requests: { cpu: 50m, memory: 256Mi }
                limits: { cpu: 150m, memory: 768Mi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: radar-refresh-projection
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: graph-projection
spec:
  # SUSPENDU 2026-07-01 (FinOps poc-k8s) : échoue chaque nuit avec le scrape et
  # réveille le pool burst-rwx (coût). Réactiver après fix root cause = suspend:false.
  suspend: true
  # Quotidien 04:30 UTC, ~1 h après le scrape (laisse le scrape finir).
  schedule: "30 4 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # backoffLimit: 1 → 1 retry (au lieu de 0) pour absorber un aléa réseau S3/PG
      # transitoire. NB : le script lui-même exit !=0 si des villes sont abortées
      # (régression de preuves) ou si des upserts ont échoué (cf.
      # project-graph-from-s3.ts), ce qui rend l'échec visible dans
      # failedJobsHistoryLimit + les logs jalons "project-graph-from-s3: terminé".
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: radar-immobilier
            app.kubernetes.io/component: graph-projection
        spec:
          restartPolicy: Never
          serviceAccountName: radar-app
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: project-graph
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
              # image tag is OVERRIDDEN at release by the Kustomize `images:`
              # transformer in deploy/k8s/refresh-cronjobs/ (CI pins the SAME
              # immutable digest as the deployed release). This base tag is a
              # bootstrap default only — the CronJobs must be applied via the
              # refresh-cronjobs overlay, never with :latest live (§6).
              image: ghcr.io/rhanka/radar-api:latest
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/api
              command: ["node", "dist/scripts/project-graph-from-s3.js"]
              envFrom:
                - configMapRef:
                    name: radar-api
              env:
                - name: NODE_OPTIONS
                  value: "--max-old-space-size=200 --dns-result-order=ipv4first"
                - name: POSTGRES_USER
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
                - name: POSTGRES_PASSWORD
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
                - name: POSTGRES_DB
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
                - name: S3_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_ACCESS_KEY } }
                - name: S3_SECRET_KEY
                  valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_SECRET_KEY } }
                # ── Store de graphes EXPLICITE (GRAPH_S3_*) ───────────────────
                # Garantit le bon bucket SCW (radar-immobilier-docs-pocs)
                # INDÉPENDAMMENT du secret radar-scrape-s3-credentials, absent en
                # prod (sa disparition faisait tomber resolveGraphS3Config sur
                # S3_ENDPOINT=radar-minio + bucket "radar-immobilier-docs" →
                # ENOTFOUND, projection gelée). GRAPH_S3_* a priorité sur
                # SCRAPE_S3_*/S3_* dans resolveGraphS3Config (config.ts).
                - name: GRAPH_S3_ENDPOINT
                  value: "https://s3.fr-par.scw.cloud"
                - name: GRAPH_S3_BUCKET
                  value: "radar-immobilier-docs-pocs"
                - name: GRAPH_S3_REGION
                  value: "fr-par"
                - name: GRAPH_S3_FORCE_PATH_STYLE
                  value: "false"
                - name: GRAPH_S3_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_ACCESS_KEY } }
                - name: GRAPH_S3_SECRET_KEY
                  valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_SECRET_KEY } }
                # Bloc SCRAPE_S3_* conservé (optional:true → ne gêne pas ; sert de
                # repli quand GRAPH_S3_* ne serait pas fourni). Sans effet ici.
                - name: SCRAPE_S3_ENDPOINT
                  valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_ENDPOINT, optional: true } }
                - name: SCRAPE_S3_BUCKET
                  valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_BUCKET, optional: true } }
                - name: SCRAPE_S3_REGION
                  valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_REGION, optional: true } }
                - name: SCRAPE_S3_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_ACCESS_KEY, optional: true } }
                - name: SCRAPE_S3_SECRET_KEY
                  valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_SECRET_KEY, optional: true } }
                - name: SCRAPE_S3_FORCE_PATH_STYLE
                  value: "false"
              resources:
                requests: { cpu: 50m, memory: 96Mi }
                limits: { cpu: 150m, memory: 256Mi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: radar-refresh-pv
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: graph-projection
spec:
  # Production-dormant base. Only the preprod overlay activates this workload.
  suspend: true
  schedule: "17 5 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A later cycle resumes durable, hash-checked state; do not duplicate a
      # provider call automatically inside the same scheduled execution.
      backoffLimit: 0
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: radar-immobilier
            app.kubernetes.io/part-of: sentropic
            app.kubernetes.io/component: graph-projection
        spec:
          restartPolicy: Never
          serviceAccountName: radar-app
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: seed-keyring-once
              image: ghcr.io/rhanka/radar-api:latest
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              command:
                - /bin/sh
                - -ceu
                - |
                  mkdir -p /keyring/runtime
                  flock -x /keyring/runtime/.bootstrap.lock -c '
                    if [ ! -f /keyring/runtime/.key ]; then
                      cp -a /bootstrap/. /keyring/runtime/
                      chmod 0700 /keyring/runtime
                      chmod 0600 /keyring/runtime/.key /keyring/runtime/*.json
                    fi
                  '
              resources:
                requests: { cpu: 5m, memory: 16Mi }
                limits: { cpu: 50m, memory: 64Mi }
              volumeMounts:
                - { name: keyring, mountPath: /keyring }
                - { name: keyring-bootstrap, mountPath: /bootstrap, readOnly: true }
          containers:
            - name: refresh-pv
              image: ghcr.io/rhanka/radar-api:latest
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/api
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              command: ["/usr/bin/flock", "-n", "/keyring/runtime/.refresh.lock", "node", "dist/scripts/refresh-pv.js", "waterloo"]
              envFrom:
                - configMapRef: { name: radar-api }
              env:
                - { name: NODE_OPTIONS, value: "--max-old-space-size=1024 --dns-result-order=ipv4first" }
                - { name: REFRESH_PROVIDER, value: "openai" }
                - { name: REFRESH_MODEL, value: "gpt-5.6-luna" }
                - { name: REFRESH_REASONING_EFFORT, value: "high" }
                - { name: REFRESH_MAXIMUM_ATTEMPTS, value: "1" }
                - { name: REFRESH_TIMEOUT_MS, value: "900000" }
                - { name: REFRESH_BUDGET_LIMIT, value: "20000" }
                - { name: REFRESH_MAX_OUTPUT_TOKENS, value: "4096" }
                - { name: REFRESH_ACQUISITION_LIMIT, value: "10" }
                - { name: SENTROPIC_LLM_MESH_KEYRING_DIR, value: "/keyring/runtime" }
                - name: REFRESH_PRINCIPAL_REF
                  valueFrom: { secretKeyRef: { name: radar-refresh-runtime, key: REFRESH_PRINCIPAL_REF } }
                - name: REFRESH_OWNER_SCOPE_REF
                  valueFrom: { secretKeyRef: { name: radar-refresh-runtime, key: REFRESH_OWNER_SCOPE_REF } }
                - name: POSTGRES_USER
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
                - name: POSTGRES_PASSWORD
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
                - name: POSTGRES_DB
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
                - name: SCRAPE_S3_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_ACCESS_KEY } }
                - name: SCRAPE_S3_SECRET_KEY
                  valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_SECRET_KEY } }
              resources:
                # Keep this network-bound pilot within the live preprod quota;
                # 1Gi of Node heap retains 512Mi for native/runtime overhead.
                requests: { cpu: 50m, memory: 512Mi }
                limits: { cpu: 150m, memory: 1536Mi }
              volumeMounts:
                - { name: keyring, mountPath: /keyring }
                - { name: scratch, mountPath: /tmp }
          volumes:
            - name: keyring
              persistentVolumeClaim: { claimName: radar-refresh-keyring }
            - name: keyring-bootstrap
              # Secret volumes are projected root:fsGroup. Group-read is needed
              # by the non-root bootstrap initContainer; the copied keyring is
              # immediately tightened to 0600 on the private PVC.
              secret: { secretName: radar-refresh-keyring-bootstrap, defaultMode: 0440 }
            - name: scratch
              emptyDir: { sizeLimit: 512Mi }
