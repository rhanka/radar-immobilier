# refresh-cronjob.yaml — RAFRAÎCHISSEMENT PÉRIODIQUE des procès-verbaux → signaux.
#
# Un seul CronJob : radar-refresh-pv, lancé avec `--all`. Il balaie la liste
# déterministe des ~528 villes config-only. Pour CHAQUE ville il rescrape la
# source (fenêtre REFRESH_WINDOW_DAYS), puis traite AU PLUS UN document : le plus
# récemment publié dont les signaux ne sont pas déjà projetés en PostgreSQL. Une
# ville dont tous les documents sont déjà projetés ne coûte aucun appel modèle.
# Le document retenu est extrait par le modèle (principal puis repli), publié
# dans le graphe canonique et projeté en PostgreSQL.
#
# Ce que le balayage garantit, et ce qu'il ne garantit pas :
#   - il REPREND au curseur durable `refresh/018/sweep/cursor.json`, écrit AVANT
#     chaque ville : une exécution coupée par activeDeadlineSeconds continue là
#     où elle s'est arrêtée au lieu de repartir du premier slug, et aucune ville
#     ne peut bloquer la rotation ;
#   - il s'arrête sur REFRESH_SWEEP_DEADLINE_MS (horloge) ou sur
#     REFRESH_SWEEP_MAX_DOCUMENTS (documents extraits), ce second plafond étant
#     ce qui borne la dépense modèle quotidienne ;
#   - une ville en erreur — source injoignable, aucun PV dans la fenêtre, pas
#     encore de graphe canonique — est comptée et le balayage continue. Seul un
#     TAUX systémique d'échecs inattendus fait sortir le Job en 1 ;
#   - il NE rattrape PAS un arriéré : un document par ville et par passage. Une
#     ville qui publie deux PV le même jour voit le second au passage suivant.
#
# Avancement mesurable : toutes les lignes `refresh_document_outcomes` d'une
# exécution portent le même `cycle_id`, donc l'état d'un passage se lit d'un seul
# GROUP BY. Une ville sans document neuf n'écrit aucune ligne — c'est voulu, le
# journal est par document soumis, pas par ville visitée.
#
# Base dormante (suspend: true) ; l'overlay préprod l'active,
# l'overlay prod (refresh-cronjobs-prod) l'active derrière la promotion gardée.
#
# Retirés le 2026-09-18 (décision owner) : radar-refresh-scrape (scrape
# déterministe nocturne des ~528 villes) et radar-refresh-projection (projection
# nocturne graph → PG). Suspendus depuis le 2026-07-01 et remplacés par
# radar-refresh-pv, qui acquiert et projette lui-même. Le scrape en masse reste
# disponible à la demande via le Job ponctuel 33-scrape-job.yaml.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: radar-refresh-pv
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: graph-projection
spec:
  # Production-dormant base. Only the preprod overlay activates this workload.
  suspend: true
  schedule: "17 5 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A later cycle resumes durable, hash-checked state; do not duplicate a
      # provider call automatically inside the same scheduled execution.
      backoffLimit: 0
      # Le balayage complet, pas un document isolé. Mesure du 2026-09-05 sur la
      # même liste de 528 villes : 2 h 41 pour l'acquisition seule (fenêtre 183 j).
      # S'y ajoute l'extraction d'au plus REFRESH_SWEEP_MAX_DOCUMENTS documents.
      # 4 h 30 ici, contre 4 h 15 pour REFRESH_SWEEP_DEADLINE_MS : le balayage
      # s'arrête de lui-même, curseur à jour, avant le SIGKILL du contrôleur.
      activeDeadlineSeconds: 16200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: radar-immobilier
            app.kubernetes.io/part-of: sentropic
            app.kubernetes.io/component: graph-projection
        spec:
          restartPolicy: Never
          serviceAccountName: radar-app
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: seed-keyring-once
              image: ghcr.io/rhanka/radar-api:latest
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              command:
                - /bin/sh
                - -ceu
                - |
                  mkdir -p /keyring/runtime
                  flock -x /keyring/runtime/.bootstrap.lock -c '
                    if [ ! -f /keyring/runtime/.key ]; then
                      cp -a /bootstrap/. /keyring/runtime/
                      chmod 0700 /keyring/runtime
                      chmod 0600 /keyring/runtime/.key /keyring/runtime/*.json
                    fi
                  '
              resources:
                requests: { cpu: 5m, memory: 16Mi }
                limits: { cpu: 50m, memory: 64Mi }
              volumeMounts:
                - { name: keyring, mountPath: /keyring }
                - { name: keyring-bootstrap, mountPath: /bootstrap, readOnly: true }
          containers:
            - name: refresh-pv
              image: ghcr.io/rhanka/radar-api:latest
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/api
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              # `--all` : toutes les villes configurées. Un slug en dur ici est
              # exactement le bug #734 — le job tournait, et ne rafraîchissait
              # qu'une seule ville. `verify-renders` refuse désormais un rendu
              # sans `--all`.
              command: ["/usr/bin/flock", "-n", "/keyring/runtime/.refresh.lock", "node", "dist/scripts/refresh-pv.js", "--all"]
              envFrom:
                - configMapRef: { name: radar-api }
              env:
                - { name: NODE_OPTIONS, value: "--max-old-space-size=1024 --dns-result-order=ipv4first" }
                - { name: REFRESH_PROVIDER, value: "openai" }
                - { name: REFRESH_MODEL, value: "gpt-6-astra" }
                - { name: REFRESH_REASONING_EFFORT, value: "medium" }
                - { name: REFRESH_PRIMARY_QUALITY_ATTEMPTS, value: "2" }
                - { name: REFRESH_FALLBACK_PROVIDER, value: "gemini" }
                - { name: REFRESH_FALLBACK_MODEL, value: "gemini-3.8-flash" }
                - { name: REFRESH_FALLBACK_REASONING_EFFORT, value: "low" }
                - { name: REFRESH_VERIFY_ENABLED, value: "1" }
                - { name: REFRESH_VERIFY_PROVIDER, value: "gemini" }
                - { name: REFRESH_VERIFY_MODEL, value: "gemini-3.8-flash" }
                - { name: REFRESH_VERIFY_REASONING_EFFORT, value: "low" }
                - { name: REFRESH_FORCE_FALLBACK, value: "0" }
                - { name: REFRESH_MAXIMUM_ATTEMPTS, value: "1" }
                - { name: REFRESH_TIMEOUT_MS, value: "900000" }
                - { name: REFRESH_BUDGET_LIMIT, value: "20000" }
                # Gemini output ceiling. Pinned mesh 0.19.2 omits this on Codex.
                - { name: REFRESH_MAX_OUTPUT_TOKENS, value: "32768" }
                # Plafond d'ÉCRITURES CAS nouvelles par ville et par passage. Un
                # document déjà collecté ne le consomme pas : la fenêtre entière
                # est parcourue de toute façon, c'est le coût dominant du balayage.
                - { name: REFRESH_ACQUISITION_LIMIT, value: "1" }
                # Fenêtre de la source, en jours. Valeur par défaut de l'adaptateur,
                # et celle du balayage 528 villes mesuré à 2 h 41. La réduire
                # accélère le passage mais rétrécit l'ensemble des documents
                # candidats : à ne faire que sur mesure.
                - { name: REFRESH_WINDOW_DAYS, value: "183" }
                # 4 h 15 : le balayage s'arrête avant activeDeadlineSeconds.
                - { name: REFRESH_SWEEP_DEADLINE_MS, value: "15300000" }
                # Plafond de documents EXTRAITS par passage — la borne de la
                # dépense modèle quotidienne. 17/jour tient sous le plafond mesuré
                # de 532 documents/mois du siège Gemini dédié. Le delta réel
                # attendu est bien inférieur ; c'est un plafond, pas une cible.
                - { name: REFRESH_SWEEP_MAX_DOCUMENTS, value: "17" }
                # On ne démarre pas une ville s'il reste moins que cela.
                - { name: REFRESH_SWEEP_CITY_RESERVE_MS, value: "120000" }
                # Taux d'échecs INATTENDUS à partir duquel le passage est
                # systémique et sort en 1. Les sources cassées (93/528 au dernier
                # balayage complet) ne sont pas comptées ici.
                - { name: REFRESH_SWEEP_MAX_FAILURE_RATE, value: "0.9" }
                - { name: SENTROPIC_LLM_MESH_KEYRING_DIR, value: "/keyring/runtime" }
                - name: REFRESH_PRINCIPAL_REF
                  valueFrom: { secretKeyRef: { name: radar-refresh-runtime, key: REFRESH_PRINCIPAL_REF } }
                - name: REFRESH_OWNER_SCOPE_REF
                  valueFrom: { secretKeyRef: { name: radar-refresh-runtime, key: REFRESH_OWNER_SCOPE_REF } }
                - name: POSTGRES_USER
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
                - name: POSTGRES_PASSWORD
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
                - name: POSTGRES_DB
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
                - name: SCRAPE_S3_ENDPOINT
                  valueFrom: { configMapKeyRef: { name: radar-api, key: SCRAPE_S3_ENDPOINT } }
                - name: SCRAPE_S3_BUCKET
                  valueFrom: { configMapKeyRef: { name: radar-api, key: SCRAPE_S3_BUCKET } }
                - name: SCRAPE_S3_REGION
                  valueFrom: { configMapKeyRef: { name: radar-api, key: SCRAPE_S3_REGION } }
                - name: SCRAPE_S3_FORCE_PATH_STYLE
                  valueFrom: { configMapKeyRef: { name: radar-api, key: SCRAPE_S3_FORCE_PATH_STYLE } }
                - name: SCRAPE_S3_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_ACCESS_KEY } }
                - name: SCRAPE_S3_SECRET_KEY
                  valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_SECRET_KEY } }
              resources:
                # Keep this network-bound pilot within the live preprod quota;
                # 1Gi of Node heap retains 512Mi for native/runtime overhead.
                requests: { cpu: 50m, memory: 512Mi }
                limits: { cpu: 150m, memory: 1536Mi }
              volumeMounts:
                - { name: keyring, mountPath: /keyring }
                - { name: scratch, mountPath: /tmp }
          volumes:
            - name: keyring
              persistentVolumeClaim: { claimName: radar-refresh-keyring }
            - name: keyring-bootstrap
              # Secret volumes are projected root:fsGroup. Group-read is needed
              # by the non-root bootstrap initContainer; the copied keyring is
              # immediately tightened to 0600 on the private PVC.
              secret: { secretName: radar-refresh-keyring-bootstrap, defaultMode: 0440 }
            - name: scratch
              emptyDir: { sizeLimit: 512Mi }
