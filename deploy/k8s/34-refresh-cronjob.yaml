# refresh-cronjob.yaml — RAFRAÎCHISSEMENT PÉRIODIQUE des procès-verbaux → signaux.
#
# Un seul CronJob : radar-refresh-pv, lancé avec `--all`, QUATRE fois par jour.
# Chaque passage balaie la liste déterministe des ~528 villes config-only.
#
# Pour chaque ville, dans cet ordre :
#   1. lecture du graphe canonique. Pas de graphe ⇒ `no-baseline`, et la ville
#      est passée SANS être rescrapée : un rafraîchissement n'a rien sur quoi
#      construire, et l'acquisition est le coût dominant du balayage ;
#   2. rescrape de la source sur REFRESH_WINDOW_DAYS ;
#   3. au plus UN document extrait : le plus récemment publié que le registre de
#      couverture de la ville (`refresh/018/<ville>/coverage.json`) doit encore.
#
# Ce que le balayage traite : ce qui APPARAÎT. La première visite d'une ville
# AMORCE son registre — tout ce que la source offre alors est réputé couvert,
# sans un seul appel modèle — et les passages suivants ne paient que les
# documents publiés depuis (décision owner du 2026-09-20 : nouveaux documents
# seulement ; les procès-verbaux déjà projetés ne sont pas ré-extraits).
#
# Ce que le balayage garantit, et ce qu'il ne garantit pas :
#   - il REPREND au curseur durable `refresh/018/sweep/cursor.json`, écrit AVANT
#     chaque ville : un passage coupé par activeDeadlineSeconds continue là où il
#     s'est arrêté, et aucune ville ne peut bloquer la rotation ;
#   - il n'y a PAS de plafond quotidien de documents. Ce qu'un passage ne traite
#     pas reste `pending` dans le registre de sa ville et revient au passage
#     suivant : une file de reprise, pas un abandon. REFRESH_SWEEP_MAX_SUBMISSIONS
#     existe comme levier (0 = pas de plafond) et, s'il est armé, il coupe
#     l'EXTRACTION sans couper la VISITE — les villes restantes sont quand même
#     rescrapées et leur registre tenu à jour ;
#   - un document qui échoue REFRESH_MAX_DOCUMENT_FAILURES fois est mis à
#     l'écart (`abandoned`) et cesse de bloquer les documents derrière lui ;
#   - le balayage s'arrête sur REFRESH_SWEEP_DEADLINE_MS, sur SIGTERM, ou quand
#     le siège de repli est à sec (sortie en 1, raison `fallback-quota-exhausted`) ;
#   - une ville en erreur — source injoignable, aucun PV dans la fenêtre, pas
#     encore de graphe canonique — est comptée et le balayage continue. Seul un
#     TAUX systémique d'échecs inattendus, mesuré sur les villes ayant TENTÉ une
#     extraction, fait sortir le Job en 1 ;
#   - il NE rattrape PAS un arriéré en un passage : un document par ville et par
#     passage. Une ville qui publie quatre PV le même jour les voit en un jour,
#     pas en un passage.
#
# Pourquoi quatre passages et pas un : ce n'est pas une question de quota. Au
# volume attendu (quelques documents par jour), aucune fenêtre de session de
# siège n'est approchée — 17 documents valent 4,3 min de Gemini low (p50 15,3 s)
# ou 42 min d'Astra low (p50 147,8 s). Quatre passages servent à VIDER la file
# par ville : une ville qui publie plusieurs documents, ou un document refusé en
# qualité (~15 % sous repli Gemini), est traité ou tranché dans la journée au
# lieu de la semaine. Le nombre de passages est borné par la DURÉE d'un passage,
# pas par les sièges : passages/jour ≤ 24 h / (durée mesurée × 1,25). Seule
# durée disponible : 2 h 41 pour une acquisition 528 villes, mesurée sur
# `worker-live` — un PROXY de ce chemin de code, pas une mesure. À revoir sur le
# premier balayage réel en préproduction.
#
# Avancement mesurable : toutes les lignes `refresh_document_outcomes` d'un
# passage portent le même `cycle_id`, donc l'état d'un passage se lit d'un seul
# GROUP BY. Le rapport complet du passage (villes visitées, issues, curseur) est
# persisté dans `refresh/018/sweep/reports/<cycle_id>.json` et
# `refresh/018/sweep/latest.json` : les logs du pod, eux, expirent en 24 h.
#
# Base dormante (suspend: true) ; l'overlay préprod l'active,
# l'overlay prod (refresh-cronjobs-prod) l'active derrière la promotion gardée.
#
# Retirés le 2026-09-18 (décision owner) : radar-refresh-scrape (scrape
# déterministe nocturne des ~528 villes) et radar-refresh-projection (projection
# nocturne graph → PG). Suspendus depuis le 2026-07-01 et remplacés par
# radar-refresh-pv, qui acquiert et projette lui-même. Le scrape en masse reste
# disponible à la demande via le Job ponctuel 33-scrape-job.yaml.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: radar-refresh-pv
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: graph-projection
spec:
  # Production-dormant base. Only the preprod overlay activates this workload.
  suspend: true
  # Quatre passages par jour, créneaux de 6 h. Voir l'en-tête : le nombre est
  # borné par la durée d'un passage, pas par une fenêtre de session de siège.
  schedule: "17 5,11,17,23 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A later cycle resumes durable, hash-checked state; do not duplicate a
      # provider call automatically inside the same scheduled execution.
      backoffLimit: 0
      # Le balayage complet, pas un document isolé. Le créneau vaut 6 h ; 5 h 30
      # ici, contre 5 h 15 pour REFRESH_SWEEP_DEADLINE_MS : le balayage s'arrête
      # de lui-même, curseur à jour, avant le SIGKILL du contrôleur, et le
      # passage suivant ne trouve jamais le précédent encore en vol.
      activeDeadlineSeconds: 19800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: radar-immobilier
            app.kubernetes.io/part-of: sentropic
            app.kubernetes.io/component: graph-projection
        spec:
          restartPolicy: Never
          # Le SIGTERM d'activeDeadlineSeconds arme le signal d'arrêt du
          # balayage : il faut lui laisser le temps de finir sa ville proprement
          # (écriture du registre, fermeture du pool) avant le SIGKILL.
          terminationGracePeriodSeconds: 60
          serviceAccountName: radar-app
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: seed-keyring-once
              image: ghcr.io/rhanka/radar-api:latest
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              command:
                - /bin/sh
                - -ceu
                - |
                  mkdir -p /keyring/runtime
                  flock -x /keyring/runtime/.bootstrap.lock -c '
                    if [ ! -f /keyring/runtime/.key ]; then
                      cp -a /bootstrap/. /keyring/runtime/
                      chmod 0700 /keyring/runtime
                      chmod 0600 /keyring/runtime/.key /keyring/runtime/*.json
                    fi
                  '
              resources:
                requests: { cpu: 5m, memory: 16Mi }
                limits: { cpu: 50m, memory: 64Mi }
              volumeMounts:
                - { name: keyring, mountPath: /keyring }
                - { name: keyring-bootstrap, mountPath: /bootstrap, readOnly: true }
          containers:
            - name: refresh-pv
              image: ghcr.io/rhanka/radar-api:latest
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/api
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              # `--all` : toutes les villes configurées. Un slug en dur ici est
              # exactement le bug #734 — le job tournait, et ne rafraîchissait
              # qu'une seule ville. `verify-renders` refuse désormais un rendu
              # sans `--all`.
              command: ["/usr/bin/flock", "-n", "/keyring/runtime/.refresh.lock", "node", "dist/scripts/refresh-pv.js", "--all"]
              envFrom:
                - configMapRef: { name: radar-api }
              env:
                - { name: NODE_OPTIONS, value: "--max-old-space-size=1024 --dns-result-order=ipv4first" }
                - { name: REFRESH_PROVIDER, value: "openai" }
                - { name: REFRESH_MODEL, value: "gpt-6-astra" }
                - { name: REFRESH_REASONING_EFFORT, value: "medium" }
                - { name: REFRESH_PRIMARY_QUALITY_ATTEMPTS, value: "2" }
                - { name: REFRESH_FALLBACK_PROVIDER, value: "gemini" }
                - { name: REFRESH_FALLBACK_MODEL, value: "gemini-3.8-flash" }
                - { name: REFRESH_FALLBACK_REASONING_EFFORT, value: "low" }
                - { name: REFRESH_VERIFY_ENABLED, value: "1" }
                - { name: REFRESH_VERIFY_PROVIDER, value: "gemini" }
                - { name: REFRESH_VERIFY_MODEL, value: "gemini-3.8-flash" }
                - { name: REFRESH_VERIFY_REASONING_EFFORT, value: "low" }
                - { name: REFRESH_FORCE_FALLBACK, value: "0" }
                - { name: REFRESH_MAXIMUM_ATTEMPTS, value: "1" }
                - { name: REFRESH_TIMEOUT_MS, value: "900000" }
                - { name: REFRESH_BUDGET_LIMIT, value: "20000" }
                # Gemini output ceiling. Pinned mesh 0.19.2 omits this on Codex.
                - { name: REFRESH_MAX_OUTPUT_TOKENS, value: "32768" }
                # Plafond d'ÉCRITURES CAS nouvelles par ville et par passage. Un
                # document déjà collecté ne le consomme pas, mais RECUEIL CESSE
                # de lister dès qu'il a écrit ce nombre : à 1, la liste des
                # candidats était tronquée au premier document inédit, et une
                # page d'index du plus ancien au plus récent ne révélait sa
                # fenêtre qu'à un document par passage.
                - { name: REFRESH_ACQUISITION_LIMIT, value: "5" }
                # Fenêtre de la source, en jours. Valeur par défaut de l'adaptateur,
                # et celle du balayage 528 villes mesuré à 2 h 41. La réduire
                # accélère le passage mais rétrécit l'ensemble des documents
                # candidats : à ne faire que sur mesure.
                - { name: REFRESH_WINDOW_DAYS, value: "183" }
                # 5 h 15 : le balayage s'arrête avant activeDeadlineSeconds. Un
                # SIGTERM et cette échéance arment tous deux le signal d'arrêt,
                # si bien qu'une ville n'est plus tuée en plein document.
                - { name: REFRESH_SWEEP_DEADLINE_MS, value: "18900000" }
                # Plafond de SOUMISSIONS modèle par passage — appels réellement
                # envoyés, refus compris. 0 = pas de plafond : c'est le régime
                # décidé par l'owner le 2026-09-20. Une valeur non nulle ne
                # termine pas le passage, elle coupe l'extraction et laisse la
                # visite se poursuivre, les documents non traités restant en file.
                - { name: REFRESH_SWEEP_MAX_SUBMISSIONS, value: "0" }
                # Échecs après lesquels un document est mis à l'écart, au lieu
                # d'être repayé à chaque rotation en bloquant sa ville.
                - { name: REFRESH_MAX_DOCUMENT_FAILURES, value: "3" }
                # On ne démarre pas une ville s'il reste moins que cela : une
                # ville peut devoir un document, donc la réserve doit couvrir un
                # appel modèle entier (REFRESH_TIMEOUT_MS).
                - { name: REFRESH_SWEEP_CITY_RESERVE_MS, value: "900000" }
                # Taux d'échecs INATTENDUS à partir duquel le passage est
                # systémique et sort en 1. Mesuré sur les villes ayant TENTÉ une
                # extraction, et seulement à partir de cinq tentatives. Les
                # sources cassées (93/528 au dernier balayage complet) comptent
                # en `no-input`, pas ici.
                - { name: REFRESH_SWEEP_MAX_FAILURE_RATE, value: "0.9" }
                - { name: SENTROPIC_LLM_MESH_KEYRING_DIR, value: "/keyring/runtime" }
                - name: REFRESH_PRINCIPAL_REF
                  valueFrom: { secretKeyRef: { name: radar-refresh-runtime, key: REFRESH_PRINCIPAL_REF } }
                - name: REFRESH_OWNER_SCOPE_REF
                  valueFrom: { secretKeyRef: { name: radar-refresh-runtime, key: REFRESH_OWNER_SCOPE_REF } }
                - name: POSTGRES_USER
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
                - name: POSTGRES_PASSWORD
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
                - name: POSTGRES_DB
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
                - name: SCRAPE_S3_ENDPOINT
                  valueFrom: { configMapKeyRef: { name: radar-api, key: SCRAPE_S3_ENDPOINT } }
                - name: SCRAPE_S3_BUCKET
                  valueFrom: { configMapKeyRef: { name: radar-api, key: SCRAPE_S3_BUCKET } }
                - name: SCRAPE_S3_REGION
                  valueFrom: { configMapKeyRef: { name: radar-api, key: SCRAPE_S3_REGION } }
                - name: SCRAPE_S3_FORCE_PATH_STYLE
                  valueFrom: { configMapKeyRef: { name: radar-api, key: SCRAPE_S3_FORCE_PATH_STYLE } }
                - name: SCRAPE_S3_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_ACCESS_KEY } }
                - name: SCRAPE_S3_SECRET_KEY
                  valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_SECRET_KEY } }
              resources:
                # Keep this network-bound pilot within the live preprod quota;
                # 1Gi of Node heap retains 512Mi for native/runtime overhead.
                requests: { cpu: 50m, memory: 512Mi }
                limits: { cpu: 150m, memory: 1536Mi }
              volumeMounts:
                - { name: keyring, mountPath: /keyring }
                - { name: scratch, mountPath: /tmp }
          volumes:
            - name: keyring
              persistentVolumeClaim: { claimName: radar-refresh-keyring }
            - name: keyring-bootstrap
              # Secret volumes are projected root:fsGroup. Group-read is needed
              # by the non-root bootstrap initContainer; the copied keyring is
              # immediately tightened to 0600 on the private PVC.
              secret: { secretName: radar-refresh-keyring-bootstrap, defaultMode: 0440 }
            - name: scratch
              emptyDir: { sizeLimit: 512Mi }
