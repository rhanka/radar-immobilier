# populate-geo-job.yaml — one-shot pull geo → PG + résolution mapper.
#
# Usage :
#   kubectl apply -f deploy/k8s/35a-populate-geo-job.yaml -n radar-immobilier
#   kubectl wait job/radar-populate-geo --for=condition=complete -n radar-immobilier --timeout=3600s
#   kubectl logs -l job-name=radar-populate-geo -n radar-immobilier -f
#   kubectl delete job radar-populate-geo -n radar-immobilier
#
# Cibler : env CITIES="longueuil,gatineau" / LOT_CITIES="longueuil,saguenay".
apiVersion: batch/v1
kind: Job
metadata:
  name: radar-populate-geo
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: populate-geo
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        # Même contrainte NetworkPolicy que graph-projection/geo-mapper pour joindre postgres.
        app.kubernetes.io/component: graph-projection
    spec:
      restartPolicy: Never
      serviceAccountName: radar-app
      containers:
        - name: populate-geo
          image: rg.fr-par.scw.cloud/radar-immobilier/radar-api:latest
          imagePullPolicy: Always
          workingDir: /workspace/api
          command: ["node", "dist/services/geo/run-populate-geo.js"]
          envFrom:
            - configMapRef:
                name: radar-api
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512 --dns-result-order=ipv4first"
            - name: POPULATE_LOTS
              value: "1"
            - name: RUN_RESOLUTION
              value: "1"
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 768Mi }
