# Obscura headless-browser (CDP) service for radar scraping (BR-07).
# Brought in from draft PR #8 (deploy/k8s/obscura.yaml), aligned to the
# sentropic tenant conventions (radar-app ServiceAccount, part-of label).
#
# Image: built from obscura/Dockerfile (wrapper around the upstream
# h4ckf0r0day/obscura release binary) and pushed to PUBLIC GHCR by
# .github/workflows/build-push-images.yml (matrix `obscura`), like
# radar-api / radar-ui / radar-grounding. No pull secret needed — the legacy
# SCW registry (rg.fr-par.scw.cloud) is decommissioned.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar-obscura
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: obscura
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: radar-immobilier
      app.kubernetes.io/component: obscura
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/part-of: sentropic
        app.kubernetes.io/component: obscura
    spec:
      serviceAccountName: radar-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: obscura
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image: ghcr.io/rhanka/radar-obscura:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: cdp
              containerPort: 9222
          readinessProbe:
            httpGet: { path: /json/version, port: cdp }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 400m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: radar-obscura
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: obscura
spec:
  selector:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/component: obscura
  ports:
    - name: cdp
      port: 9222
      targetPort: cdp
