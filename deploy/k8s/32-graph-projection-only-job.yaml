# graph-projection-only-job.yaml — PROJECTION SEULE (sans migrate, sans backfill).
#
# Variante allégée de 31-graph-projection-job.yaml pour le cas où le schéma PG est
# DÉJÀ à jour (migrations + backfill 0004 déjà appliqués une fois). N'exécute que
# l'étape 3 : lire graph/<ville>/latest.json depuis le stockage objet et upsert dans PG.
#
# C'EST LE JOB À UTILISER POUR LES REPROJECTIONS RÉPÉTÉES (re-graphify v2.x, etc.) :
# upsert ON CONFLICT → 100 % idempotent, aucune mutation de schéma, aucun risque
# de re-jeu de migration. Plus court, plus sûr, plus léger.
#
# Le premier déploiement (ou après un reset DB) DOIT passer par
# 31-graph-projection-job.yaml (qui chaîne backfill-0004 → migrate → projection).
# Ensuite, ce job-ci suffit.
#
# Run it through the run-job workflow (it renders the placeholders, refuses to start
# alongside a refresh/backup/projection/recovery Job, deletes the previous Job, applies):
#   gh workflow run run-job.yaml -f job=projection                                  # every city
#   gh workflow run run-job.yaml -f job=projection -f project_cities="sherbrooke ogden"
#   __IMAGE__           = recovery_image input, else the image served by deploy/radar-api
#                         (never :latest — on the preprod-first CD, :latest is main, not
#                         the release tag prod serves)
#   __PROJECT_CITIES__  = space-separated slugs (empty ⇒ every city)
# Preprod twin: deploy/k8s/graph-projection-preprod/job.yaml (run-job target=preprod).
apiVersion: batch/v1
kind: Job
metadata:
  name: radar-graph-projection-only
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: graph-projection
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/component: graph-projection
    spec:
      restartPolicy: Never
      serviceAccountName: radar-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: project-graph
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/api
          # __PROJECT_CITIES__ = slugs espace-séparés (sed par run-job). Vide ⇒ toutes
          # les villes (comportement par défaut préservé) ; ciblé ⇒ projection additive
          # d'une ville (ex. acquisition brossard). sh -c pour splitter les slugs en argv.
          command: ["sh", "-c"]
          args:
            - |
              node dist/scripts/project-graph-from-s3.js __PROJECT_CITIES__
          envFrom:
            - configMapRef:
                name: radar-api
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=200 --dns-result-order=ipv4first"
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
            # Complete required GRAPH_S3 bindings prevent resolver fallbacks.
            - name: GRAPH_S3_ENDPOINT
              valueFrom: { configMapKeyRef: { name: radar-api, key: GRAPH_S3_ENDPOINT } }
            - name: GRAPH_S3_BUCKET
              valueFrom: { configMapKeyRef: { name: radar-api, key: GRAPH_S3_BUCKET } }
            - name: GRAPH_S3_REGION
              valueFrom: { configMapKeyRef: { name: radar-api, key: GRAPH_S3_REGION } }
            - name: GRAPH_S3_FORCE_PATH_STYLE
              valueFrom: { configMapKeyRef: { name: radar-api, key: GRAPH_S3_FORCE_PATH_STYLE } }
            - name: GRAPH_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-graph-s3-credentials, key: GRAPH_S3_ACCESS_KEY } }
            - name: GRAPH_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: radar-graph-s3-credentials, key: GRAPH_S3_SECRET_KEY } }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 150m, memory: 256Mi }
