# The account binding reads only the application account and membership tables.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-immo-mcp-to-postgres
  namespace: radar-immobilier
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: radar-immobilier
      app.kubernetes.io/component: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: radar-immobilier
              app.kubernetes.io/component: mcp
      ports:
        - protocol: TCP
          port: 5432
