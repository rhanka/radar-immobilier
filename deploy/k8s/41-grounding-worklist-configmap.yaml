# 41-grounding-worklist-configmap.yaml — the citation-grounding cohort worklist.
#
# 98 cities whose signals lack verbatim citations and whose graph carries docSha
# targets the corrected Gate 7bis (baseline-relative, merged on main) can now
# publish. sainte-martine is FIRST — it is the proven case (29 verbatim citations,
# gate PASSES) so the very first in-cluster run validates the whole path on the
# smallest, known-good blast radius before the rest of the cohort.
#
# This is the finite cohort that (a) bounds the HOST grounding run = the cost-gate (finite
# worklist + hard call-ceiling), and (b) the dispatch (i-arch #590) iterates to fire the
# per-city publish-only Job (env CITY), sainte-martine first. The per-city Job does NOT mount
# this — it publishes the single CITY the dispatch injects (pull staged candidate → MinIO graph/).
#
# ~7 of the 98 are expected to stay BLOCKED as grounded_empty (genuine source-gaps
# — no citable PV text); that is normal, not a failure.
apiVersion: v1
kind: ConfigMap
metadata:
  name: radar-grounding-worklist
  namespace: radar-immobilier-preprod
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/component: grounding
data:
