# Public route for the remote immo MCP server on the SAME host as the radar
# UI: https://immo.sent-tech.ca/mcp (Streamable HTTP transport, OAuth-gated,
# AND the RFC 9728 PRM at https://immo.sent-tech.ca/mcp/.well-known/oauth-protected-resource,
# unauthenticated).
#
# PREPARED, NOT APPLIED — not wired into kustomization.yaml yet (mirrors how
# 31/32/33 one-shot Jobs are deliberately left out: `kubectl apply -f` by hand
# once the prerequisites below are resolved). See
# docs/spec/mcp/immo-mcp-remote-deploy.md and
# docs/spec/mcp/immo-mcp-remote-deploy-BLOCKERS.md (§1/§2 now RESOLVED — see
# below — the remaining gate is the real IdP issuer, runbook §4).
#
# Why a SEPARATE Ingress object (not a path added to 60-ingress.yaml)
# ---------------------------------------------------------------------
# 60-ingress.yaml already owns `immo.sent-tech.ca` with a single catch-all
# `path: /` (Prefix) -> radar-ui. Kubernetes Ingress controllers (Traefik
# included) MERGE all Ingress objects that share a host into one routing
# table and dispatch by MOST-SPECIFIC path match, so a second Ingress object
# adding more specific paths on the same host is standard practice and avoids
# touching the working UI Ingress. This file is that second object.
#
# ONE path routes to the mcp Service (was two — history below)
# ---------------------------------------------------------------------
# `/mcp` (Prefix) covers BOTH the MCP transport (`POST/GET/DELETE /mcp`) AND
# the RFC 9728 PRM (`GET /mcp/.well-known/oauth-protected-resource`), because
# `server-http.ts`'s `createImmoHttpApp()` now mounts `@sentropic/mcp-auth`'s
# `mcpAuthRoutes()` under `/mcp` (`app.route("/mcp", mcpAuthRoutes(mcp))`),
# matching what `protectedResourceMetadataUrl()` advertises in the 401
# `WWW-Authenticate: ... resource_metadata="https://immo.sent-tech.ca/mcp/.well-known/oauth-protected-resource"`
# challenge. This FIXES BLOCKERS.md item 1 (previously: `mcpAuthRoutes()` was
# mounted at the Hono app's own root, serving the PRM at the BARE
# `/.well-known/oauth-protected-resource` — a different URL than the one
# advertised, and a strict RFC 9728 client following the header literally
# 404'd). The extra `Exact /.well-known/oauth-protected-resource` rule this
# file used to carry is GONE: the app no longer serves anything there, so
# routing to it would just 404 at the mcp Service instead of (as before)
# falling through to the UI's SPA catch-all — either way dead weight, so it
# was dropped rather than kept as a no-op.
#
# No `cert-manager.io/cluster-issuer` annotation here on purpose: 60-ingress.yaml
# already requests the `immo.sent-tech.ca` cert into the SAME `radar-immo-tls`
# Secret; repeating the annotation on a second Ingress for the same host+secret
# would make cert-manager create a second, redundant Certificate object racing
# the first. `tls.secretName` below only tells Traefik which Secret to
# terminate with — it does not itself trigger issuance.
#
# NetworkPolicy dependency (mirrors "Ingress reaches the UI pod, not the api"
# in deploy/k8s/README.md): the poc-k8s operator baseline only opens
# Traefik -> {component: api}:3000; this repo's own 70-networkpolicy.yaml only
# additionally opens Traefik -> {component: ui}:8080. Neither opens
# Traefik -> {component: mcp}:8848, so under the namespace's default-deny
# ingress this Ingress would resolve/route but every request would be DROPPED
# before reaching the pod. See the `allow-traefik-to-immo-mcp` NetworkPolicy
# appended to 70-networkpolicy.yaml (same additive pattern as
# `allow-traefik-to-ui`) — required before this Ingress is applied.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radar-immo-mcp
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: mcp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - immo.sent-tech.ca
      secretName: radar-immo-tls
  rules:
    - host: immo.sent-tech.ca
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: radar-immo-mcp
                port:
                  name: http
