# document-date-recovery — PREPROD one-shot Job: project documentary dates from raw
# sidecars onto the refs of the served graphs (api/src/scripts/recover-document-dates.ts).
#
# No model call. Preview (dry-run) by default; `--apply` writes graph/<city>/latest.json
# (archived first) and re-projects the city in PG. Idempotent; never overwrites a date.
#
# NOT applied directly: the Make target renders the two placeholders and applies it to
# radar-immobilier-preprod only (namespace is hardcoded, the context is checked):
#   KUBECONFIG=<preprod admin kubeconfig> make document-date-recovery-preprod RECOVERY_MODE=preview ENV=preprod
#   KUBECONFIG=<preprod admin kubeconfig> make document-date-recovery-preprod RECOVERY_MODE=apply RECOVERY_CONFIRM=1 ENV=preprod
#   __IMAGE__          = the radar-api image currently served by preprod (or RECOVERY_IMAGE)
#   __RECOVERY_ARGS__  = "" (preview) | "--apply" [+ "--heal"] [+ city slugs]
#
# Network: labelled `component: graph-projection` so the existing projection egress
# policies (PG + object storage) apply unchanged.
apiVersion: batch/v1
kind: Job
metadata:
  name: radar-document-date-recovery
  namespace: radar-immobilier-preprod
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: graph-projection
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 5400
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/component: graph-projection
    spec:
      restartPolicy: Never
      serviceAccountName: radar-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recover-document-dates
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/api
          command: ["sh", "-c"]
          args:
            - |
              node dist/scripts/recover-document-dates.js __RECOVERY_ARGS__
          envFrom:
            - configMapRef:
                name: radar-api
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384 --dns-result-order=ipv4first"
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
            # Graph snapshots and raw sidecars share the preprod docs bucket (SCRAPE_S3_* from the
            # radar-api ConfigMap). Same credentials as the preprod refresh CronJob:
            # radar-scrape-s3-credentials does not exist in preprod.
            - name: SCRAPE_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-docs-s3-credentials, key: DOCS_S3_ACCESS_KEY } }
            - name: SCRAPE_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: radar-docs-s3-credentials, key: DOCS_S3_SECRET_KEY } }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 200m, memory: 640Mi }
