apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar-api
  namespace: radar-immobilier-preprod
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: S3_ENDPOINT
              valueFrom: { secretKeyRef: { name: radar-raw-s3-credentials, key: RAW_S3_ENDPOINT } }
            - name: S3_REGION
              valueFrom: { secretKeyRef: { name: radar-raw-s3-credentials, key: RAW_S3_REGION } }
            - name: S3_BUCKET
              valueFrom: { secretKeyRef: { name: radar-raw-s3-credentials, key: RAW_S3_BUCKET } }
            - name: S3_FORCE_PATH_STYLE
              valueFrom: { secretKeyRef: { name: radar-raw-s3-credentials, key: RAW_S3_FORCE_PATH_STYLE } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-raw-s3-credentials, key: RAW_S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: radar-raw-s3-credentials, key: RAW_S3_SECRET_KEY } }
