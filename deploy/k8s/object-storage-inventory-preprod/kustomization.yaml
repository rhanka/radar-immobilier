apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: radar-immobilier-preprod

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: radar-immobilier
      app.kubernetes.io/part-of: sentropic

resources:
  - checkpoint-pvc.yaml
  - minio-ingress.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/component: object-storage-inventory

configMapGenerator:
  - name: radar-object-storage-inventory-tool
    files:
      - migrate-object-storage.sh=../../ci/migrate-object-storage.sh
      - object-storage-checkpoint.sh=../../ci/object-storage-checkpoint.sh
      - prove-docs-conditional-writes.sh=../../ci/prove-docs-conditional-writes.sh
      - build-docs-expected-manifest.sh=../../ci/build-docs-expected-manifest.sh
      - copy-canonical-docs.sh=../../ci/copy-canonical-docs.sh
      - copy-canonical-docs.mjs=../../ci/copy-canonical-docs.mjs
      - copy-canonical-docs-progress.sh=../../ci/copy-canonical-docs-progress.sh
