apiVersion: batch/v1
kind: Job
metadata:
  generateName: radar-object-storage-inventory-raw-
  namespace: radar-immobilier-preprod
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: object-storage-inventory
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/part-of: sentropic
        app.kubernetes.io/component: object-storage-inventory
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory
          image: amazon/aws-cli:2.34.53@sha256:cf53765c0de54ad3a8ea21818f1c4c845a8cf7ca87831c078a00fef244031493
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ceu", "--"]
          args:
            - |
              umask 077
              checkpoint=/evidence/raw-checkpoint
              report="/evidence/reports/${MIGRATION_RUN_ID}"
              resume=()
              fence=()
              if [ -r "$checkpoint/config.json" ]; then resume=(--resume); fi
              if [ -s /fence/fence.txt ]; then fence=(--fence-record /fence/fence.txt); fi
              set +e
              /bin/bash /tool/migrate-object-storage.sh inventory \
                --environment preprod --plane RAW \
                --source-endpoint "$SOURCE_ENDPOINT" \
                --source-region "$SOURCE_REGION" --source-bucket "$SOURCE_BUCKET" \
                --source-path-style "$SOURCE_PATH_STYLE" \
                --destination-endpoint "$DESTINATION_ENDPOINT" \
                --destination-region "$DESTINATION_REGION" \
                --destination-bucket "$DESTINATION_BUCKET" \
                --destination-path-style "$DESTINATION_PATH_STYLE" \
                --prefix raw/ --prefix ontology/ --prefix ciblage/ \
                --prefix jobs/ --prefix state/ --report-dir "$report" \
                --checkpoint-dir "$checkpoint" --page-size 100 \
                --time-budget-seconds 300 --concurrency 1 --retries 3 \
                --max-failures 20 --max-object-bytes 1000000000 \
                "${fence[@]}" "${resume[@]}"
              status=$?
              set -e
              marker="/evidence/export-ready/${MIGRATION_RUN_ID}"
              mkdir -p "$(dirname "$marker")"
              printf '%s\n' "$status" >"$marker.tmp"
              sync -f "$marker.tmp"
              mv "$marker.tmp" "$marker"
              sleep 300
              exit "$status"
          env:
            - name: MIGRATION_RUN_ID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: MIGRATION_SOURCE_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_ACCESS_KEY } }
            - name: MIGRATION_SOURCE_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_SECRET_KEY } }
            - name: SOURCE_ENDPOINT
              valueFrom: { configMapKeyRef: { name: radar-api, key: S3_ENDPOINT } }
            - name: SOURCE_REGION
              valueFrom: { configMapKeyRef: { name: radar-api, key: S3_REGION } }
            - name: SOURCE_BUCKET
              valueFrom: { configMapKeyRef: { name: radar-api, key: S3_BUCKET } }
            - name: SOURCE_PATH_STYLE
              valueFrom: { configMapKeyRef: { name: radar-api, key: S3_FORCE_PATH_STYLE } }
            - name: MIGRATION_DESTINATION_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: radar-raw-s3-credentials, key: RAW_S3_ACCESS_KEY } }
            - name: MIGRATION_DESTINATION_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-raw-s3-credentials, key: RAW_S3_SECRET_KEY } }
            - name: DESTINATION_ENDPOINT
              valueFrom: { secretKeyRef: { name: radar-raw-s3-credentials, key: RAW_S3_ENDPOINT } }
            - name: DESTINATION_REGION
              valueFrom: { secretKeyRef: { name: radar-raw-s3-credentials, key: RAW_S3_REGION } }
            - name: DESTINATION_BUCKET
              valueFrom: { secretKeyRef: { name: radar-raw-s3-credentials, key: RAW_S3_BUCKET } }
            - name: DESTINATION_PATH_STYLE
              valueFrom: { secretKeyRef: { name: radar-raw-s3-credentials, key: RAW_S3_FORCE_PATH_STYLE } }
          resources:
            requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 64Mi }
            limits: { cpu: 500m, memory: 1Gi, ephemeral-storage: 1200Mi }
          readinessProbe:
            exec:
              command: ["/bin/bash", "-c", "test -f /evidence/export-ready/${MIGRATION_RUN_ID}"]
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 300
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tool, mountPath: /tool, readOnly: true }
            - { name: fence, mountPath: /fence, readOnly: true }
            - { name: evidence, mountPath: /evidence }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tool
          configMap:
            name: radar-object-storage-inventory-tool
            defaultMode: 365
        - name: evidence
          persistentVolumeClaim:
            claimName: radar-object-storage-inventory-checkpoint
        - name: fence
          configMap:
            name: radar-object-storage-inventory-fence
            optional: true
        - name: tmp
          emptyDir:
            sizeLimit: 1100Mi
