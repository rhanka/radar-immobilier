# Remote MCP HTTP server (Streamable HTTP + OAuth 2.1 Resource Server) for the
# `@radar/immo-mcp` provider, so claude.ai (Settings → Connectors → Add custom)
# can reach it at https://immo.sent-tech.ca/mcp. Mirrors the `radar-api`
# Deployment/Service pattern (30-api.yaml): radar-app ServiceAccount, tight
# resources, envFrom a dedicated non-secret ConfigMap.
#
# PREPARED, NOT APPLIED — not wired into kustomization.yaml yet (see
# kustomization.yaml's own comment and docs/spec/mcp/immo-mcp-remote-deploy.md;
# the remaining gate is the placeholder IdP issuer below, not a code/infra
# blocker).
#
# What this Pod runs (verified locally, see the runbook for the exact
# commands + pasted output):
#   packages/immo-mcp/src/server-http.ts, built to
#   packages/immo-mcp/dist/server-http.js — Hono app exposing:
#     GET  /mcp/.well-known/oauth-protected-resource  → RFC 9728 PRM (200, no auth)
#     *    /mcp                                        → OAuth RS guard, then the
#                                                         MCP Streamable HTTP transport
#   via @sentropic/mcp-auth (createMcpAuth/requireMcpAuth) +
#   @sentropic/oauth-verify (remote-JWKS bearer verification), MCP SDK 1.29.
#
# ── Image gap RESOLVED (was: NOT YET DEPLOYABLE) ────────────────────────────
# `api/Dockerfile` now also `COPY packages/immo-mcp[/package.json]`, installs
# its deps in the same `npm install --workspaces --include-workspace-root`
# layer, runs a SECOND esbuild call (`entryPoints:
# ['packages/immo-mcp/src/server-http.ts']`, `outdir:
# 'packages/immo-mcp/dist'`, `outbase: 'packages/immo-mcp/src'`, same
# external-bare-specifier plugin) and COPYs `packages/immo-mcp/dist` into the
# runtime stage — option (A) from the runbook §2 / BLOCKERS.md item 2, reusing
# the existing `build-push-images.yml` `api` matrix entry (no new CI job).
# `node packages/immo-mcp/dist/server-http.js` against `radar-api:latest`
# (built from this Dockerfile) now resolves. See
# docs/spec/mcp/immo-mcp-remote-deploy-BLOCKERS.md item 2 for the local
# verification evidence (esbuild output + boot + curl, without building the
# full image).
#
# Still gating a REAL go-live (not a code/infra blocker, a cadrage step): the
# ConfigMap below ships a PLACEHOLDER `IMMO_MCP_OAUTH_ISSUER` — see §4 below
# and the runbook's "Demandes à architect/sentropic" before folding this
# Deployment into `kustomization.yaml`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: immo-mcp-config
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: mcp
data:
  # IPv4-first DNS on the IPv4-only POC egress path (mirrors 30-api.yaml) —
  # matters here because the OAuth RS fetches the IdP's JWKS over the network
  # on first token verification (@sentropic/oauth-verify `fromRemoteJwks`).
  NODE_OPTIONS: "--dns-result-order=ipv4first"
  # ── OAuth 2.1 Resource Server wiring (loadHttpConfig in server-http.ts) ───
  # Issuer CONFIRMED by sentropic (env:conductor-20260702-immo-authmode-ack-relay,
  # 2026-07-02): the real sentropic-operated IdP is https://auth.sent-tech.ca
  # (OIDC discovery there provides jwks_uri; exact path confirmed at client mint).
  # Still awaiting from architect at merge/prod-promote: the minted PUBLIC+PKCE
  # client_id (registered IdP-side; the RS only needs issuer+JWKS+audience here).
  # Do NOT fold 40/41 into kustomization.yaml until architect confirms the client
  # is minted and the auth build is rolled (see immo-mcp-remote-deploy-BLOCKERS.md).
  IMMO_MCP_OAUTH_ISSUER: "https://auth.sent-tech.ca"
  # Canonical resource URI = token audience. Deliberately scoped to the /mcp
  # path (not the bare origin), so a token minted for this resource cannot be
  # replayed against the unrelated radar-api/radar-ui surface on the same host.
  IMMO_MCP_OAUTH_RESOURCE: "https://immo.sent-tech.ca/mcp"
  # Space-separated, advertised verbatim in the RFC 9728 PRM `scopes_supported`.
  IMMO_MCP_OAUTH_SCOPES_SUPPORTED: "immo:read immo:search immo:documents:read"
  # Left UNSET on purpose: @sentropic/mcp-auth defaults to
  # `${issuer}/.well-known/jwks.json` when absent (see core.js `getKeySource`).
  # Only set IMMO_MCP_OAUTH_JWKS_URI if the IdP publishes its JWKS at a
  # different path.
  # IMMO_MCP_OAUTH_JWKS_URI: ""
  IMMO_MCP_HTTP_PORT: "8848"
  # "http" → dataMode "real" in loadHttpConfig / audit context. Source SELECTION
  # is keyed off RADAR_API_BASE_URL (below), same var as the raw seam: with it
  # set, `search_signals` targets the REAL /api/graph-signals/:city feed (the SAME
  # signals the web app reads — D12). The other v0 DOMAIN tools (search_lots,
  # get_lot_card, get_opportunity_dossier, list_documents, read_document_excerpt)
  # remain not_wired_yet (real lots/zones/PV are served by the raw tools below).
  IMMO_MCP_DATA_MODE: "http"
  # ── Real radar-API wiring (search_signals + the 4 raw-data tools) ──────────
  # Setting RADAR_API_BASE_URL points `search_signals` AND the raw tools
  # (get_zones_geojson / get_lots_geojson / get_grille_pdf / get_pv_pdf —
  # packages/immo-mcp/src/{data-source,raw-data}.ts) at the REAL radar API
  # (in-cluster Service, 30-api.yaml). Requires the additive NetworkPolicy
  # `allow-immo-mcp-to-api` (70-networkpolicy.yaml): under the namespace
  # default-deny, the mcp -> api:3000 hop is otherwise DROPPED.
  #  - raw tools call /api/geo/collections + /api/documents/raw → PUBLIC_PREFIXES
  #    (api/src/routes/auth.ts): public data, no session.
  #  - search_signals calls /api/graph-signals which is SESSION-PROTECTED (D4):
  #    it forwards the CURRENT USER's own bearer token (no machine credential, no
  #    env secret here). The api ACCEPTS that user bearer (option A): it verifies
  #    it against OUR IdP JWKS (derived from SENTROPIC_IDP_ISSUER on radar-api,
  #    30-api.yaml — no new env), audience bounded to the app origin + `${origin}/mcp`,
  #    then authorises the approved account → per-user, end-to-end.
  RADAR_API_BASE_URL: "http://radar-api:3000"
  # Public base used in the URLs handed back to the MCP client (get_pv_pdf):
  # the nginx ui pod proxies /api/* on this host to radar-api (50-ui.yaml).
  RADAR_PUBLIC_BASE_URL: "https://immo.sent-tech.ca"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar-immo-mcp
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  strategy:
    # Sessions live in an in-memory Map (server-http.ts `sessions`) — not
    # shared across replicas/pods. Recreate avoids two pods briefly holding
    # different session state during a rollout (mirrors 30-api.yaml/50-ui.yaml).
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radar-immobilier
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/part-of: sentropic
        app.kubernetes.io/component: mcp
    spec:
      serviceAccountName: radar-app
      containers:
        - name: mcp
          image: rg.fr-par.scw.cloud/radar-immobilier/radar-api:latest
          imagePullPolicy: Always
          workingDir: /workspace
          command: ["node", "packages/immo-mcp/dist/server-http.js"]
          ports:
            - name: http
              containerPort: 8848
          envFrom:
            - configMapRef:
                name: immo-mcp-config
          # No secrets: this pod only VERIFIES bearer tokens against the IdP's
          # public JWKS (remote-JWKS resource server) — it holds no client
          # secret or signing key of its own.
          readinessProbe:
            # `/mcp` itself always 401s without a bearer token (by design), so
            # probe the PRM well-known instead — it is served unauthenticated
            # and returns 200 as soon as the Hono app is up. Path is
            # `/mcp/.well-known/...` (under the resource's own path), NOT the
            # bare `/.well-known/...` — `server-http.ts` mounts
            # `mcpAuthRoutes()` under `/mcp` (BLOCKERS.md item 1 fix); see that
            # file's `createImmoHttpApp()` comment.
            httpGet: { path: /mcp/.well-known/oauth-protected-resource, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /mcp/.well-known/oauth-protected-resource, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 150m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: radar-immo-mcp
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: mcp
spec:
  selector:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/component: mcp
  ports:
    - name: http
      port: 8848
      targetPort: http
