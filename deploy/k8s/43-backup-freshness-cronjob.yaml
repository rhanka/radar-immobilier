apiVersion: batch/v1
kind: CronJob
metadata:
  name: radar-backup-freshness
  namespace: radar-immobilier
spec:
  suspend: false
  schedule: "45 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: radar-immobilier
            radar-pra: "true"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
          volumes:
            - { name: work, emptyDir: { sizeLimit: 2Gi } }
            - { name: scratch, emptyDir: { sizeLimit: 6Gi } }

          containers:
            - name: freshness
              image: ghcr.io/rhanka/radar-backup:PIN-BEFORE-APPLY
              args: [freshness]
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              resources:
                requests: { cpu: 50m, memory: 64Mi, ephemeral-storage: 1Gi }
                limits: { cpu: 500m, memory: 128Mi, ephemeral-storage: 8Gi }
              envFrom: [{ configMapRef: { name: radar-pra-settings } }]
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: radar-pra-reader, key: S3_ACCESS_KEY } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: radar-pra-reader, key: S3_SECRET_KEY } }
              volumeMounts:
                - { name: work, mountPath: /work }
