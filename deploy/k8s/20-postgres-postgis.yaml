# Postgres + PostGIS StatefulSet for radar. Brought in from draft PR #8
# (feat/k8s-tenant-radar-and-infra: deploy/k8s/postgres-postgis.yaml) and
# aligned to the sentropic tenant conventions (part-of: sentropic, the
# radar-app ServiceAccount, app.kubernetes.io/* labels).
apiVersion: v1
kind: Service
metadata:
  name: radar-postgres
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: postgres
spec:
  # The selector names ONE pod. Two PostgreSQL StatefulSets coexist during a
  # major upgrade (radar-postgres = PG16, radar-pg18 = PG18, deploy/k8s/pg18/),
  # and both carry component: postgres; a label-only selector would split the
  # traffic between them. `make -f deploy/cutover/operator.mk pg-switch` is the
  # only writer of this field in a live namespace (deploy/cutover/PG18-UPGRADE.md).
  selector:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/component: postgres
    statefulset.kubernetes.io/pod-name: radar-postgres-0
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: radar-postgres
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: postgres
spec:
  serviceName: radar-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: radar-immobilier
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/part-of: sentropic
        app.kubernetes.io/component: postgres
    spec:
      serviceAccountName: radar-app
      containers:
        - name: postgres
          # PG16 until the PG18 switch (deploy/cutover/PG18-UPGRADE.md); the digest is
          # the one already running, so pinning it changes no binary.
          image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
          # Logical decoding feeds the PG18 subscriber (pg-replicate). The slot cap
          # keeps a stalled subscriber from filling the volume with retained WAL.
          args: ["-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=2GB"]
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
            # Required so postgres initialises (and finds existing data) in the
            # pgdata/ subdirectory, avoiding the lost+found directory collision
            # that triggers initdb failure when the PVC root is not empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { cpu: 600m, memory: 768Mi }
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: block-standard
        resources:
          requests:
            storage: 5Gi
