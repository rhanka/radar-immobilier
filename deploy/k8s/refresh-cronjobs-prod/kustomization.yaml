# Activate only the causal PV-to-Signal refresh at 05:17 UTC.
# Storage comes from the base (legacy scrape/projection CronJobs removed 2026-09-18).
#
# Applied only by the gated promote-prod "Deploy refresh CronJobs (prod)" step.
# The fail-loud image placeholder must be replaced by `kustomize edit set image`
# before rendering or applying this overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: radar-immobilier

resources:
  - ../34-refresh-cronjob.yaml
  - ../34-refresh-keyring-pvc.yaml

images:
  - name: ghcr.io/rhanka/radar-api
    newTag: PINNED-BY-CI-AT-RELEASE-DO-NOT-APPLY-UNEDITED

patches:
  - target:
      kind: CronJob
      name: radar-refresh-pv
    patch: |
      - op: replace
        path: /spec/suspend
        value: false
  # Fit the pilot into the production 768Mi release headroom. The heap leaves
  # 256Mi for native PDF extraction and runtime overhead; validate peak RSS.
  - target:
      kind: CronJob
      name: radar-refresh-pv
    patch: |
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: radar-refresh-pv
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: refresh-pv
                    env:
                      - { name: NODE_OPTIONS, value: "--max-old-space-size=512 --dns-result-order=ipv4first" }
                    resources:
                      requests: { cpu: 50m, memory: 256Mi }
                      limits: { cpu: 150m, memory: 768Mi }
