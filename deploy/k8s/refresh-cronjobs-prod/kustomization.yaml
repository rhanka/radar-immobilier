# refresh-cronjobs-prod — deploys one causal production PV-to-Signal CronJob,
# pins it to the accepted release image, and keeps both legacy schedules
# suspended. This is the production twin of refresh-cronjobs.
#
# Production storage coordinates and dedicated credentials are owned by T2's
# provider-neutral base. This overlay never overrides them or adds a fallback.
#
# Applied only by the gated promote-prod "Deploy refresh CronJobs (prod)" step.
# The fail-loud image placeholder must be replaced by `kustomize edit set image`
# before rendering or applying this overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: radar-immobilier

resources:
  - ../34-refresh-cronjob.yaml
  - ../34-refresh-keyring-pvc.yaml

images:
  - name: ghcr.io/rhanka/radar-api
    newTag: PINNED-BY-CI-AT-RELEASE-DO-NOT-APPLY-UNEDITED

patches:
  - target:
      kind: CronJob
      name: radar-refresh-pv
    patch: |
      - op: replace
        path: /spec/suspend
        value: false
