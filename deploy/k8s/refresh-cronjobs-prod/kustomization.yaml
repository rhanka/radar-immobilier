# refresh-cronjobs-prod — deploys one causal production PV-to-Signal CronJob,
# pins it to the accepted release image, and keeps both legacy schedules
# suspended. This is the production twin of refresh-cronjobs.
#
# Production storage coordinates come from the radar-api ConfigMap after T2;
# credentials use the dedicated OVH DOCS Secret. The base is provider-neutral
# after T2 and this overlay never adds a MinIO or SCW fallback.
#
# Applied only by the gated promote-prod "Deploy refresh CronJobs (prod)" step.
# The fail-loud image placeholder must be replaced by `kustomize edit set image`
# before rendering or applying this overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: radar-immobilier

resources:
  - ../34-refresh-cronjob.yaml
  - ../34-refresh-keyring-pvc.yaml

images:
  - name: ghcr.io/rhanka/radar-api
    newTag: PINNED-BY-CI-AT-RELEASE-DO-NOT-APPLY-UNEDITED

patches:
  - target:
      kind: CronJob
      name: radar-refresh-pv
    patch: |
      - op: replace
        path: /spec/suspend
        value: false

  - target:
      kind: CronJob
      name: radar-refresh-pv
    patch: |
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: radar-refresh-pv
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: refresh-pv
                    env:
                      - name: SCRAPE_S3_ACCESS_KEY
                        valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_ACCESS_KEY } }
                      - name: SCRAPE_S3_SECRET_KEY
                        valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_SECRET_KEY } }
