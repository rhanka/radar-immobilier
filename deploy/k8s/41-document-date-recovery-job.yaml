# 41-document-date-recovery-job.yaml — PROD one-shot Job: project documentary dates from
# raw sidecars onto the refs of the served graphs (api/src/scripts/recover-document-dates.ts).
# Production twin of deploy/k8s/document-date-recovery/job.yaml (preprod).
#
# No model call. Preview (dry-run) by default; `--apply` writes graph/<city>/latest.json
# (archived first under a per-run backup prefix) and re-projects the city in PG.
# Idempotent; never overwrites a date already on a ref.
#
# NOT applied directly and NOT in kustomization.yaml: run it through the run-job workflow,
# which renders the two placeholders, deletes the previous Job and applies this one:
#   gh workflow run run-job.yaml -f job=document-date-recovery -f recovery_mode=preview
#   gh workflow run run-job.yaml -f job=document-date-recovery -f recovery_mode=apply
#   __IMAGE__          = recovery_image, else the image served by deploy/radar-api
#   __RECOVERY_ARGS__  = "" (preview) | "--apply" [+ "--heal"] [+ city slugs]
# Procedure and windows: docs/spec/SPEC_EVOL_DOCUMENT_DATES.md (Production run).
#
# Network: labelled `component: graph-projection` so the projection policy
# allow-graph-projection-to-postgres (70-networkpolicy.yaml) admits it to PG.
#
# Storage: graph snapshots and raw sidecars live in the prod docs bucket. Same binding as
# the prod refresh CronJob (34-refresh-cronjob.yaml): coordinates from ConfigMap radar-api,
# credentials from Secret radar-scrape-s3-credentials. Guarded by
# deploy/ci/check-object-storage-bindings.sh (SCRAPE family).
apiVersion: batch/v1
kind: Job
metadata:
  name: radar-document-date-recovery
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: graph-projection
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 5400
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/component: graph-projection
    spec:
      restartPolicy: Never
      serviceAccountName: radar-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recover-document-dates
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/api
          command: ["sh", "-c"]
          args:
            - |
              node dist/scripts/recover-document-dates.js __RECOVERY_ARGS__
          envFrom:
            - configMapRef:
                name: radar-api
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384 --dns-result-order=ipv4first"
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
            - name: SCRAPE_S3_ENDPOINT
              valueFrom: { configMapKeyRef: { name: radar-api, key: SCRAPE_S3_ENDPOINT } }
            - name: SCRAPE_S3_BUCKET
              valueFrom: { configMapKeyRef: { name: radar-api, key: SCRAPE_S3_BUCKET } }
            - name: SCRAPE_S3_REGION
              valueFrom: { configMapKeyRef: { name: radar-api, key: SCRAPE_S3_REGION } }
            - name: SCRAPE_S3_FORCE_PATH_STYLE
              valueFrom: { configMapKeyRef: { name: radar-api, key: SCRAPE_S3_FORCE_PATH_STYLE } }
            - name: SCRAPE_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_ACCESS_KEY } }
            - name: SCRAPE_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: radar-scrape-s3-credentials, key: SCRAPE_S3_SECRET_KEY } }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 200m, memory: 640Mi }
