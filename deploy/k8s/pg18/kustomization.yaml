# PostgreSQL 18 target of the major upgrade (deploy/cutover/PG18-UPGRADE.md).
#
# NOT listed in deploy/k8s/kustomization.yaml: it is operator-applied, once per
# environment, after the radar-postgres Service selector pin is live (otherwise
# the label selector would route traffic to the empty PG18 pod). Preprod applies
# deploy/overlays/preprod-pg18; production waits for its own approval.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: radar-immobilier

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: sentropic
      sentropic.dev/workspace: radar-immobilier

resources:
  - 21-postgres-pg18.yaml
