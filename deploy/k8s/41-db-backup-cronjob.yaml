# Scheduled logical backup. Production remains suspended until owner GO.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: radar-db-backup
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/component: db-backup
spec:
  suspend: true
  schedule: "15 2 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: radar-immobilier
            app.kubernetes.io/component: db-backup
        spec:
          restartPolicy: Never
          serviceAccountName: radar-app
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: work
              emptyDir: {}
            - name: scripts
              configMap: { name: radar-db-backup-scripts, defaultMode: 0555 }
          initContainers:
            - name: dump
              image: postgis/postgis:16-3.4
              command: ["/scripts/dump.sh"]
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: { drop: ["ALL"] } }
              env: &backup-env
                - { name: PGHOST, value: radar-postgres }
                - { name: BACKUP_ENV, value: production }
                - { name: BACKUP_S3_BUCKET, value: radar-immobilier-backups }
                - { name: BACKUP_S3_ENDPOINT, value: https://s3.bhs.io.cloud.ovh.net }
                - { name: BACKUP_RETAIN_DAILY, value: "7" }
                - { name: BACKUP_RETAIN_WEEKLY, value: "4" }
                - { name: BACKUP_RETAIN_MONTHLY, value: "1" }
                - name: POSTGRES_USER
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } }
                - name: POSTGRES_PASSWORD
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } }
                - name: POSTGRES_DB
                  valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } }
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: radar-backup-s3-credentials, key: S3_ACCESS_KEY } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: radar-backup-s3-credentials, key: S3_SECRET_KEY } }
              volumeMounts: [{ name: work, mountPath: /work }, { name: scripts, mountPath: /scripts, readOnly: true }]
          containers:
            - name: upload-and-retain
              image: public.ecr.aws/aws-cli/aws-cli:2.17.0
              command: ["/bin/sh", "-ec"]
              args: ["/scripts/upload.sh && /scripts/retention.sh"]
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
              env: *backup-env
              volumeMounts: [{ name: work, mountPath: /work }, { name: scripts, mountPath: /scripts, readOnly: true }]
