# radar UI (Svelte SPA, built with `vite build` -> static dist/) served by
# nginx, which also reverse-proxies /api -> radar-api:3000 so the browser stays
# same-origin (no CORS) — mirrors sentropic's deploy/k8s/40-ui.yaml, where the
# nginx baked into the ui image proxies /api -> api:8787.
#
# Delivery (option A, in effect): a dedicated `radar-ui` image (ui/Dockerfile,
# multi-stage `vite build` + unprivileged nginx) ships the SPA at
# /usr/share/nginx/html AND a baked default.conf. The stock-nginx-only approach
# served NO bundle (empty html root → blank page); this image fixes that.
#
# The radar-ui-nginx ConfigMap is NO LONGER inline here: it is produced by the
# base kustomization's configMapGenerator from deploy/k8s/nginx/default.conf
# (hash-suffixed → a content change rolls this Deployment automatically, fixing
# the #608 CM-drift where the live CM lagged git). That conf `proxy_pass
# http://radar-api:3000` directly because the `radar-api` Service DNS always
# exists in the namespace. (The image's baked default.conf resolves the upstream
# lazily instead, so the container also boots standalone where the api may be
# absent — see ui/nginx/default.conf, which keeps identical security headers.)
#
# The SPA is built with `VITE_API_BASE_URL` empty so it calls same-origin
# /api/* (Makefile default), which nginx forwards to the api Service.
apiVersion: v1
kind: Service
metadata:
  name: radar-ui
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: ui
spec:
  selector:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar-ui
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  # RollingUpdate keeps >=1 replica up during a roll (never 0 pods on a failed
  # new-pod create). radar-ui is stateless — its only volume is the radar-ui-nginx
  # ConfigMap, and that CM is now hash-suffixed (generated in kustomization.yaml),
  # so a conf change already rolls a fresh pod: Recreate is no longer needed for
  # the mount. maxUnavailable:0 = never below 1; maxSurge:1 needs quota headroom.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: radar-immobilier
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/part-of: sentropic
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: radar-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          # radar-ui image (ui/Dockerfile): SPA bundle + nginx baked in, built
          # and pushed by CI to the SCW registry. This is the image that
          # actually serves the static SPA (the previous stock-nginx image had
          # an empty html root and served a blank page).
          image: rg.fr-par.scw.cloud/radar-immobilier/radar-ui:main-8909943-pdfgeo
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 30m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
      volumes:
        - name: nginx-conf
          configMap:
            name: radar-ui-nginx
