apiVersion: batch/v1
kind: Job
metadata:
  generateName: radar-object-storage-copy-docs-prod-
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: object-storage-inventory
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/part-of: sentropic
        app.kubernetes.io/component: object-storage-inventory
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        - name: radar-registry-pull
      containers:
        - name: copy
          image: ghcr.io/rhanka/radar-api@sha256:4d062b88cd983aa1eef288475cded34f735084e1771a7639cbf8392df0277010
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ceu", "--"]
          args:
            - |
              umask 077
              canonical=/evidence/docs-prod-canonical/source-manifest.jsonl
              summary=/evidence/docs-prod-canonical/summary.json
              proof=/evidence/docs-prod-conditional-write-proof.json
              test -s "$canonical" && test -s "$summary" && test -s "$proof"
              digest=$(node -e 'const fs=require("node:fs");process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).manifestSha256)' "$summary")
              report="/evidence/reports/${MIGRATION_RUN_ID}"
              mkdir -p "$report"
              set +e
              CANONICAL_MANIFEST="$canonical" CANONICAL_DIGEST="$digest" \
                CONDITIONAL_WRITE_PROOF="$proof" REPORT_DIR="$report" CONCURRENCY=128 \
                SOURCE_ENDPOINT=https://s3.fr-par.scw.cloud SOURCE_REGION=fr-par \
                SOURCE_BUCKET=radar-immobilier-docs-pocs \
                node /tool/copy-canonical-docs.mjs
              status=$?
              set -e
              marker="/evidence/export-ready/${MIGRATION_RUN_ID}"
              mkdir -p "$(dirname "$marker")"
              STATUS="$status" MARKER="$marker.tmp" node -e 'require("node:fs").writeFileSync(process.env.MARKER,JSON.stringify({status:Number(process.env.STATUS)})+"\n",{mode:0o600})'
              sync -f "$marker.tmp" && mv "$marker.tmp" "$marker"
              sleep 300
              exit "$status"
          env:
            - name: MIGRATION_RUN_ID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: MIGRATION_SOURCE_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_ACCESS_KEY } }
            - name: MIGRATION_SOURCE_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_SECRET_KEY } }
            - name: MIGRATION_DESTINATION_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: radar-docs-s3-credentials, key: DOCS_S3_ACCESS_KEY } }
            - name: MIGRATION_DESTINATION_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-docs-s3-credentials, key: DOCS_S3_SECRET_KEY } }
            - name: DESTINATION_ENDPOINT
              valueFrom: { secretKeyRef: { name: radar-docs-s3-credentials, key: DOCS_S3_ENDPOINT } }
            - name: DESTINATION_REGION
              valueFrom: { secretKeyRef: { name: radar-docs-s3-credentials, key: DOCS_S3_REGION } }
            - name: DESTINATION_BUCKET
              valueFrom: { secretKeyRef: { name: radar-docs-s3-credentials, key: DOCS_S3_BUCKET } }
          resources:
            requests: { cpu: 100m, memory: 384Mi, ephemeral-storage: 128Mi }
            limits: { cpu: 500m, memory: 1152Mi, ephemeral-storage: 6Gi }
          readinessProbe:
            exec:
              command: ["/bin/bash", "-c", "test -f /evidence/export-ready/${MIGRATION_RUN_ID}"]
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3600
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tool, mountPath: /tool, readOnly: true }
            - { name: evidence, mountPath: /evidence }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tool
          configMap: { name: radar-object-storage-docs-prod-tool, defaultMode: 365 }
        - name: evidence
          persistentVolumeClaim: { claimName: radar-object-storage-docs-prod-checkpoint }
        - name: tmp
          emptyDir: { sizeLimit: 6Gi }
