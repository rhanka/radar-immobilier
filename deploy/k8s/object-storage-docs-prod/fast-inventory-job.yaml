apiVersion: batch/v1
kind: Job
metadata:
  generateName: radar-object-storage-fast-inventory-docs-prod-
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: object-storage-inventory
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/part-of: sentropic
        app.kubernetes.io/component: object-storage-inventory
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: inventory
          image: ghcr.io/rhanka/radar-api:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "-ceu", "--"]
          args:
            - |
              umask 077
              output=/evidence/docs-prod-canonical
              mkdir -p "$output"
              [ ! -e "$output/summary.json" ] || {
                echo 'ERROR: canonical PROD inventory already completed' >&2
                exit 2
              }
              node /tool/inventory-docs-prod-fast.mjs
              sleep 300
          env:
            - name: SOURCE_ENDPOINT
              value: https://s3.fr-par.scw.cloud
            - name: SOURCE_REGION
              value: fr-par
            - name: SOURCE_BUCKET
              value: radar-immobilier-docs-pocs
            - name: OUTPUT_DIR
              value: /evidence/docs-prod-canonical
            - name: CONCURRENCY
              value: "128"
            - name: MIGRATION_SOURCE_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_ACCESS_KEY } }
            - name: MIGRATION_SOURCE_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: radar-s3-credentials, key: S3_SECRET_KEY } }
          resources:
            requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 128Mi }
            limits: { cpu: 500m, memory: 1152Mi, ephemeral-storage: 6Gi }
          readinessProbe:
            exec:
              command: ["/bin/bash", "-c", "test -f /evidence/docs-prod-canonical/summary.json"]
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1800
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tool, mountPath: /tool, readOnly: true }
            - { name: evidence, mountPath: /evidence }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tool
          configMap: { name: radar-object-storage-docs-prod-tool, defaultMode: 365 }
        - name: evidence
          persistentVolumeClaim: { claimName: radar-object-storage-docs-prod-checkpoint }
        - name: tmp
          emptyDir: { sizeLimit: 6Gi }
