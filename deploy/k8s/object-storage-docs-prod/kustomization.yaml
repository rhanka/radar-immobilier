apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: radar-immobilier

resources:
  - checkpoint-pvc.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/component: object-storage-inventory

configMapGenerator:
  - name: radar-object-storage-docs-prod-tool
    files:
      - migrate-object-storage.sh=../../ci/migrate-object-storage.sh
      - object-storage-checkpoint.sh=../../ci/object-storage-checkpoint.sh
      - inventory-docs-prod-fast.mjs=../../ci/inventory-docs-prod-fast.mjs
      - prove-docs-conditional-writes.sh=../../ci/prove-docs-conditional-writes.sh
      - copy-canonical-docs.mjs=../../ci/copy-canonical-docs.mjs
      - copy-canonical-docs-parity.mjs=../../ci/copy-canonical-docs-parity.mjs
