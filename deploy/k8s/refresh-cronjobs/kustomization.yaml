# refresh-cronjobs — Kustomize overlay that deploys the two refresh CronJobs to
# PREPROD (radar-immobilier-preprod), pinned to the release image and
# UN-SUSPENDED. §6 is PREPROD-ONLY (owner directive: the refresh runs on
# preprod.immo.sent-tech.ca; no prod tag, no promote-prod path).
#
# It transforms the base ../34-refresh-cronjob.yaml (ns radar-immobilier,
# suspend:true — the prod-dormant default) into the preprod-active instance:
#   - namespace -> radar-immobilier-preprod
#   - suspend   -> false (the CronJobs RUN)
#   - image     -> pinned by CI to the deploy-preprod release :<sha> (no :latest)
#
# Applied ONLY by the deploy-preprod "Deploy refresh CronJobs (preprod)" step, in
# the CI run only (release-ephemeral pin, no commit-back):
#   cd deploy/k8s/refresh-cronjobs
#   kustomize edit set image \
#     rg.fr-par.scw.cloud/radar-immobilier/radar-api=rg.fr-par.scw.cloud/radar-immobilier/radar-api:<sha>
#   kustomize build --load-restrictor LoadRestrictionsNone . | kubectl apply -f -
#
# NB command: `kubectl apply -k` can NOT be used — the base CronJob lives one dir
# up (../34) and kustomize's default load-restrictor forbids a parent-dir
# resource. `kustomize build --load-restrictor LoadRestrictionsNone` still emits
# ONLY the two CronJobs (never the full bundle).
#
# The `newTag` placeholder is FAIL-LOUD: building/applying this overlay WITHOUT
# the `kustomize edit set image` step yields an unpullable tag (not :latest), so
# an un-pinned apply fails visibly instead of silently running stale code.
#
# RBAC: applying + un-suspending CronJobs needs `batch/cronjobs` on the preprod
# deployer SA (radar-ci-deployer-preprod) — added to
# deploy/k8s/11-ci-deployer-preprod-rbac.yaml in this PR; the owner applies it
# (owner-direct, the SA never self-grants). batch/jobs alone (§1a) is NOT enough.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: radar-immobilier-preprod

resources:
  - ../34-refresh-cronjob.yaml

images:
  - name: rg.fr-par.scw.cloud/radar-immobilier/radar-api
    newTag: PINNED-BY-CI-AT-RELEASE-DO-NOT-APPLY-UNEDITED

patches:
  # §6 preprod is ACTIVE: un-suspend BOTH CronJobs (base 34 ships suspend:true,
  # the prod-dormant default). `target: kind=CronJob` matches both.
  - target:
      kind: CronJob
    patch: |
      - op: replace
        path: /spec/suspend
        value: false

  # CITATIONS/BUCKET ALIGNMENT (i-infra) — the projection CronJob's base 34
  # hardcodes GRAPH_S3 on the SCW bucket `radar-immobilier-docs-pocs`. In PREPROD
  # the graph store is the IN-CLUSTER MinIO `radar-minio:9000` /
  # `radar-immobilier-docs-preprod` — the SAME store the app reads and the
  # grounding publishes to. Override GRAPH_S3 to that MinIO so
  # projection-read == app-store == grounding-publish (else citations break: the
  # projection would read a different bucket). Creds stay radar-s3-credentials
  # (= the MinIO creds); MinIO needs path-style. (i-infra co-vals endpoint/bucket/
  # path-style.)
  - target:
      kind: CronJob
      name: radar-refresh-projection
    patch: |
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: radar-refresh-projection
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: project-graph
                    env:
                      - name: GRAPH_S3_ENDPOINT
                        value: http://radar-minio:9000
                      - name: GRAPH_S3_BUCKET
                        value: radar-immobilier-docs-preprod
                      - name: GRAPH_S3_FORCE_PATH_STYLE
                        value: "true"

  # SCRAPE bucket/path-style alignment (i-infra) — base 34 ship SCRAPE_S3_ENDPOINT/
  # BUCKET en `valueFrom: secretKeyRef` (héritage SCW) + SCRAPE_S3_FORCE_PATH_STYLE
  # =false (SCW → virtual-host → ENOTFOUND sur MinIO). En PREPROD le store est le
  # MinIO in-cluster `radar-minio:9000` / `radar-immobilier-docs-preprod`
  # (path-style), le MÊME que l'app + la projection. On aligne SCRAPE_S3 dessus
  # pour que le scrape écrive raw/ dans le bucket préprod unique.
  #
  # FIX du patch d'alignement (remplace l'ancien JSON6902 indices 4/5/9, devenu
  # STALE depuis #629 qui a inséré POSTGRES_USER/PASSWORD/DB en 2-4 et décalé
  # SCRAPE_S3_ENDPOINT à l'index 7 : l'ancien patch clobbait POSTGRES_DB(4) +
  # S3_ACCESS_KEY(5), dupliquait ENDPOINT/BUCKET (value shadowé par le valueFrom
  # base = last-wins → alignement ineffectif) et FORCE_PATH_STYLE "true"(9) shadowé
  # par "false"(12) → path-style OFF).
  #
  # Mécanisme = strategic-merge PAR NOM (index-free) → robuste au ré-ordonnancement
  # FUTUR de la base : aucun index à maintenir (c'était la cause racine du bug).
  # `valueFrom: null` supprime le secretKeyRef de base pour rendre une entrée
  # value-only propre (un `value:` seul créerait un env INVALIDE value+valueFrom,
  # rejeté par kubectl — la raison du JSON6902 d'origine ; `valueFrom: null` lève
  # cette contrainte). Rendu VÉRIFIÉ : ENDPOINT/BUCKET/FORCE_PATH_STYLE en value
  # propre UNIQUE (0 doublon, 0 entrée value+valueFrom), path-style "true", et
  # POSTGRES_DB / S3_ACCESS_KEY / SCRAPE_S3_REGION (secretKeyRef) INTACTS. NB : le
  # strategic-merge ré-ordonne cosmétiquement l'env (entrées mergées en tête) —
  # sémantiquement inerte, AUCUN nom dupliqué.
  #
  # NIGHTLY MEM+CPU BUMP (scrape) foldé dans le même patch :
  #  - mémoire évidencée (saint-henri 199 docs OOM@512Mi, succès@3Gi au run r4) ;
  #    heap 2560 < 3Gi ; requests 768Mi scheduling.
  #  - CPU évidencé par le run r4 (radar-refresh-all-r4 : 528 villes en 80 min à
  #    100m/500m, << deadline 7200s ; le 150m base throttlerait le scrape
  #    séquentiel) → requests.cpu 100m / limits.cpu 500m. Tient dans le quota
  #    préprod ACTUEL (co-check k8s) → 0 relèvement de quota namespace.
  #
  # PROJECTION : PAS de patch resources ici — sa mesure est MOOT (input-starved :
  # 1 seule ville a graph/<ville>/latest.json en préprod), on ne la dimensionne
  # pas. Elle reste à la base (256Mi/96Mi, 150m/50m, heap200) ; seul son patch
  # GRAPH_S3 d'alignement bucket (ci-dessus) s'applique.
  #
  # NIGHTLY BACKOFF+DEADLINE (scrape) foldé dans le même patch :
  #  - base 34 ship backoffLimit:1. L'interim backoffLimit:0 (#633) évitait un
  #    RE-scrape nocturne gaspilleur quand worker-live sortait exit 1 sur des
  #    source-errors par-ville TOLÉRABLES (APRÈS un done + upsert PG réussi). Ce
  #    bug app est CORRIGÉ : le fix exit-code worker-live (#637, exit-code=
  #    job-health : source-errors tolérables → exit 0 → Job=Complete) est mergé,
  #    déployé ET run-validé sur la nightly (Job=Complete, 90/528 source-errors
  #    tolérées) → on REVERT backoffLimit 0→1 : un seul retry ne se déclenche plus
  #    que sur un échec transitoire GÉNUIN (blip S3/PG/réseau), plus sur des
  #    source-errors par-ville tolérables. Le filet retry est restauré.
  #  - activeDeadlineSeconds 7200→10800 CONSERVÉ : temps de run unique observé =
  #    80–110min sur les runs r4 et manual-0905 ; 7200s (120min) tombe DANS cette
  #    variance → deadline 10800s (3h) GARDÉE pour qu'un run un peu plus lent
  #    atteigne quand même done + feed PG avant la deadline.
  - target:
      kind: CronJob
      name: radar-refresh-scrape
    patch: |
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: radar-refresh-scrape
      spec:
        jobTemplate:
          spec:
            backoffLimit: 1
            activeDeadlineSeconds: 10800
            template:
              spec:
                containers:
                  - name: scrape
                    env:
                      - name: NODE_OPTIONS
                        value: "--max-old-space-size=2560 --dns-result-order=ipv4first"
                      - name: SCRAPE_S3_ENDPOINT
                        value: "http://radar-minio:9000"
                        valueFrom: null
                      - name: SCRAPE_S3_BUCKET
                        value: "radar-immobilier-docs-preprod"
                        valueFrom: null
                      - name: SCRAPE_S3_FORCE_PATH_STYLE
                        value: "true"
                    resources:
                      requests:
                        cpu: 100m
                        memory: 768Mi
                      limits:
                        cpu: 500m
                        memory: 3Gi
