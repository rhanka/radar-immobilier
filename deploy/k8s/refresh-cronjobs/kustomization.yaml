# refresh-cronjobs — Kustomize overlay that deploys the refresh CronJob to
# PREPROD (radar-immobilier-preprod), pinned to the release image. The
# scheduled PV-to-Signal refresh stays ACTIVE (spec.suspend: false) at one
# pass per day (`0 6 * * *` Etc/UTC, see
# docs/decisions/2026-11-20-refresh-preprod-1-par-jour.md); ad hoc runs remain
# available via `.github/workflows/bascule-refresh.yml` (force preprod refresh)
# or `kubectl create job --from=cronjob/radar-refresh-pv`. Production uses the
# separate refresh-cronjobs-prod twin (4 passes/day, `0 5,11,17,23 * * *`),
# independently gated in the promote-prod path.
#
# It transforms the base ../34-refresh-cronjob.yaml (ns radar-immobilier,
# suspend:true — the prod-dormant default) into the preprod instance:
#   - namespace -> radar-immobilier-preprod
#   - suspend   -> false for radar-refresh-pv and radar-refresh-pending-watchdog
#   - schedule  -> `0 6 * * *` UTC for radar-refresh-pv: one daily pass, one
#                  hour after the 05:00 prod pass, still on the hour (incident
#                  2026-10-09: same minute, same node, RWO keyring attach race)
#   - image     -> pinned by CI to the deploy-preprod release :<sha> (no :latest)
#
# Applied ONLY by the deploy-preprod "Deploy refresh CronJobs (preprod)" step, in
# the CI run only (release-ephemeral pin, no commit-back):
#   cd deploy/k8s/refresh-cronjobs
#   kustomize edit set image \
#     ghcr.io/rhanka/radar-api=ghcr.io/rhanka/radar-api:<sha>
#   kustomize build --load-restrictor LoadRestrictionsNone . | kubectl apply -f -
#
# NB command: `kubectl apply -k` can NOT be used — the base CronJob lives one dir
# up (../34) and kustomize's default load-restrictor forbids a parent-dir
# resource. `kustomize build --load-restrictor LoadRestrictionsNone` still emits
# ONLY the refresh CronJob, its keyring PVC and the pending-pod watchdog CronJob
# (never the full bundle).
#
# The `newTag` placeholder is FAIL-LOUD: building/applying this overlay WITHOUT
# the `kustomize edit set image` step yields an unpullable tag (not :latest), so
# an un-pinned apply fails visibly instead of silently running stale code.
#
# RBAC: applying + un-suspending CronJobs needs `batch/cronjobs` on the preprod
# deployer SA (radar-ci-deployer-preprod) — added to
# deploy/k8s/11-ci-deployer-preprod-rbac.yaml in this PR; the owner applies it
# (owner-direct, the SA never self-grants). batch/jobs alone (§1a) is NOT enough.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: radar-immobilier-preprod

resources:
  - ../34-refresh-cronjob.yaml
  - ../34-refresh-keyring-pvc.yaml
  - ../34-refresh-pending-watchdog.yaml

images:
  - name: ghcr.io/rhanka/radar-api
    newTag: PINNED-BY-CI-AT-RELEASE-DO-NOT-APPLY-UNEDITED

patches:
  # One causally ordered acquisition -> Graphify -> publish -> PG workload is
  # the only preprod refresh (legacy scrape/projection CronJobs removed 2026-09-18).
  # Preprod runs once a day on the hour, one hour after the 05:00 prod pass:
  # 06:00 UTC. Intended divergence n°4 (refresh-contract.awk): only the HOUR
  # LIST differs (prod 5,11,17,23 vs preprod 6); the minute and the day fields
  # stay shared, and verify-renders requires >= 15 minutes between the closest
  # prod and preprod starts.
  - target:
      kind: CronJob
      name: radar-refresh-pv
    patch: |
      - op: replace
        path: /spec/suspend
        value: false
      - op: replace
        path: /spec/schedule
        # 1 run/jour : décision owner du 20/11/2026, voir docs/decisions/2026-11-20-refresh-preprod-1-par-jour.md
        value: "0 6 * * *"

  - target:
      kind: CronJob
      name: radar-refresh-pending-watchdog
    patch: |
      - op: replace
        path: /spec/suspend
        value: false

  - target:
      kind: CronJob
      name: radar-refresh-pv
    patch: |
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: radar-refresh-pv
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: refresh-pv
                    env:
                      # Bucket/endpoint/region/force-path-style are INHERITED from the
                      # radar-api ConfigMap (SCRAPE_S3_* → radar-immobilier-docs-preprod,
                      # set per-env in deploy/overlays/preprod). No literal here — that is
                      # exactly the block that silently diverged to graph-preprod.
                      # Only the WRITE creds are repointed, because
                      # radar-scrape-s3-credentials does not exist in preprod;
                      # radar-docs-s3-credentials writes docs-preprod (proven by the
                      # SCW→OVH migration df6h2), and via config.ts GRAPH_S3→SCRAPE creds
                      # fallback it also lands the graph in docs-preprod — as in prod.
                      - name: SCRAPE_S3_ACCESS_KEY
                        valueFrom: { secretKeyRef: { name: radar-docs-s3-credentials, key: DOCS_S3_ACCESS_KEY } }
                      - name: SCRAPE_S3_SECRET_KEY
                        valueFrom: { secretKeyRef: { name: radar-docs-s3-credentials, key: DOCS_S3_SECRET_KEY } }
                      # Fallback provider, PREPROD ONLY (intended divergence n°5,
                      # refresh-contract.awk): the muse account is imported in
                      # the preprod keyring PVC only. In off mode the code
                      # reads REFRESH_FALLBACK_*; REFRESH_CLASSIFY_FALLBACK_*
                      # is aligned so a later single-pass switch keeps the
                      # same fallback. Prod keeps gemini (its keyring has no
                      # muse account: the route would refuse no-route).
                      - { name: REFRESH_FALLBACK_PROVIDER, value: "muse" }
                      - { name: REFRESH_FALLBACK_MODEL, value: "muse-wonder-1.0" }
                      - { name: REFRESH_FALLBACK_REASONING_EFFORT, value: "low" }
                      - { name: REFRESH_CLASSIFY_FALLBACK_PROVIDER, value: "muse" }
                      - { name: REFRESH_CLASSIFY_FALLBACK_MODEL, value: "muse-wonder-1.0" }
                      - { name: REFRESH_CLASSIFY_FALLBACK_REASONING_EFFORT, value: "low" }
