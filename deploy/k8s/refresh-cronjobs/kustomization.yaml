# refresh-cronjobs — Kustomize overlay that deploys the refresh CronJob to
# PREPROD (radar-immobilier-preprod), pinned to the release image and
# with the causal PV-to-Signal refresh UN-SUSPENDED. Production uses the
# separate refresh-cronjobs-prod twin,
# independently gated in the promote-prod path.
#
# It transforms the base ../34-refresh-cronjob.yaml (ns radar-immobilier,
# suspend:true — the prod-dormant default) into the preprod-active instance:
#   - namespace -> radar-immobilier-preprod
#   - suspend   -> false only for radar-refresh-pv
#   - image     -> pinned by CI to the deploy-preprod release :<sha> (no :latest)
#
# Applied ONLY by the deploy-preprod "Deploy refresh CronJobs (preprod)" step, in
# the CI run only (release-ephemeral pin, no commit-back):
#   cd deploy/k8s/refresh-cronjobs
#   kustomize edit set image \
#     ghcr.io/rhanka/radar-api=ghcr.io/rhanka/radar-api:<sha>
#   kustomize build --load-restrictor LoadRestrictionsNone . | kubectl apply -f -
#
# NB command: `kubectl apply -k` can NOT be used — the base CronJob lives one dir
# up (../34) and kustomize's default load-restrictor forbids a parent-dir
# resource. `kustomize build --load-restrictor LoadRestrictionsNone` still emits
# ONLY the refresh CronJob and its keyring PVC (never the full bundle).
#
# The `newTag` placeholder is FAIL-LOUD: building/applying this overlay WITHOUT
# the `kustomize edit set image` step yields an unpullable tag (not :latest), so
# an un-pinned apply fails visibly instead of silently running stale code.
#
# RBAC: applying + un-suspending CronJobs needs `batch/cronjobs` on the preprod
# deployer SA (radar-ci-deployer-preprod) — added to
# deploy/k8s/11-ci-deployer-preprod-rbac.yaml in this PR; the owner applies it
# (owner-direct, the SA never self-grants). batch/jobs alone (§1a) is NOT enough.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: radar-immobilier-preprod

resources:
  - ../34-refresh-cronjob.yaml
  - ../34-refresh-keyring-pvc.yaml

images:
  - name: ghcr.io/rhanka/radar-api
    newTag: PINNED-BY-CI-AT-RELEASE-DO-NOT-APPLY-UNEDITED

patches:
  # One causally ordered acquisition -> Graphify -> publish -> PG workload is
  # the only preprod refresh (legacy scrape/projection CronJobs removed 2026-09-18).
  - target:
      kind: CronJob
      name: radar-refresh-pv
    patch: |
      - op: replace
        path: /spec/suspend
        value: false

  - target:
      kind: CronJob
      name: radar-refresh-pv
    patch: |
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: radar-refresh-pv
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: refresh-pv
                    env:
                      # Bucket/endpoint/region/force-path-style are INHERITED from the
                      # radar-api ConfigMap (SCRAPE_S3_* → radar-immobilier-docs-preprod,
                      # set per-env in deploy/overlays/preprod). No literal here — that is
                      # exactly the block that silently diverged to graph-preprod.
                      # Only the WRITE creds are repointed, because
                      # radar-scrape-s3-credentials does not exist in preprod;
                      # radar-docs-s3-credentials writes docs-preprod (proven by the
                      # SCW→OVH migration df6h2), and via config.ts GRAPH_S3→SCRAPE creds
                      # fallback it also lands the graph in docs-preprod — as in prod.
                      - name: SCRAPE_S3_ACCESS_KEY
                        valueFrom: { secretKeyRef: { name: radar-docs-s3-credentials, key: DOCS_S3_ACCESS_KEY } }
                      - name: SCRAPE_S3_SECRET_KEY
                        valueFrom: { secretKeyRef: { name: radar-docs-s3-credentials, key: DOCS_S3_SECRET_KEY } }
