# Rendered with its Secret radar-refresh-keyring-account-import (encrypted
# owner keyring + .key) by `refresh-018.mk import-keyring-account`, applied
# once by `run-keyring-import`, which ALWAYS runs `cleanup-keyring-import`
# afterwards (success or failure): Job, Secret and the script ConfigMap.
# ttlSecondsAfterFinished below only removes the Job, never the Secret.
# IMPORT_TRANSPORT is substituted at render time by refresh-018.mk
# (import-keyring-account IMPORT_TRANSPORT=codex|cloud-code); the placeholder
# is fail-loud: the script refuses any transport it does not know.
apiVersion: batch/v1
kind: Job
metadata:
  name: radar-refresh-keyring-account-import
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/component: refresh-keyring-import
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: radar-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: import-account
          image: ghcr.io/rhanka/radar-api:PINNED-BY-CI-AT-RELEASE-DO-NOT-APPLY-UNEDITED
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - { name: IMPORT_TRANSPORT, value: "IMPORT-TRANSPORT-SET-BY-RENDER" }
            - name: REFRESH_OWNER_SCOPE_REF
              valueFrom: { secretKeyRef: { name: radar-refresh-runtime, key: REFRESH_OWNER_SCOPE_REF } }
          command:
            - /bin/sh
            - -ceu
            - |
              exec 9>/keyring/runtime/.refresh.lock
              flock -x 9
              exec 8>/keyring/runtime/.bootstrap.lock
              flock -x 8
              test -f /keyring/runtime/.key
              test -f /import/.key
              cmp -s /keyring/runtime/.key /import/.key \
                || { echo "source and runtime keyring master keys differ" >&2; exit 1; }
              mkdir -p /keyring/runtime/.import
              trap 'rm -rf /keyring/runtime/.import' EXIT
              cp -a /import/. /keyring/runtime/.import/
              node /workspace/account-import.mjs "$IMPORT_TRANSPORT" /keyring/runtime /keyring/runtime/.import
          volumeMounts:
            - { name: keyring, mountPath: /keyring }
            - { name: account-import, mountPath: /import, readOnly: true }
            - { name: import-script, mountPath: /workspace/account-import.mjs, subPath: account-import.mjs, readOnly: true }
      volumes:
        - name: keyring
          persistentVolumeClaim: { claimName: radar-refresh-keyring }
        - name: account-import
          secret:
            secretName: radar-refresh-keyring-account-import
            defaultMode: 0440
        - name: import-script
          configMap:
            name: radar-refresh-keyring-import-script
            defaultMode: 0444
