services:
  postgres:
    image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    pull_policy: never
    environment:
      POSTGRES_USER: radar
      POSTGRES_DB: radar_cutover_owner_20261113
      POSTGRES_PASSWORD_FILE: /run/local-password
    ports: ["127.0.0.1:25433:5432"]
    volumes:
      - copy-data:/var/lib/postgresql/data
      - ${HOME:?}/.local/share/radar-prod-copy/local-password:/run/local-password:ro
      - ./rehearsal-roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    networks: [copy-only]
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U radar -d radar_cutover_owner_20261113]
      interval: 1s
      retries: 30
  baseline-probe:
    image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    pull_policy: never
    profiles: [proof]
    entrypoint: [/bin/sh, -ec]
    command: ['export PGPASSWORD="$$(cat /run/local-password)"; exec psql -X -v ON_ERROR_STOP=1 -c "SELECT current_database();"']
    environment:
      PGHOST: postgres
      PGUSER: radar
      PGDATABASE: radar_cutover_owner_20261113
    volumes:
      - ${HOME:?}/.local/share/radar-prod-copy/local-password:/run/local-password:ro
    networks: [copy-only]
networks:
  copy-only:
    internal: true
volumes:
  copy-data:
