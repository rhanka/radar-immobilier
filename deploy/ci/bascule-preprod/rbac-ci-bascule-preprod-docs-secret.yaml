# docs-sync Secret written by the bascule — RBAC ADDITION for the SA
# radar-ci-bascule-preprod (kubeconfig KUBE_CONFIG_DATA_BASCULE_PREPROD), ns
# radar-immobilier-preprod. Applied by the k8s lane after review (install-time).
#
# The bascule rewrites the PRE-CREATED Opaque Secret radar-docs-src-preprod at
# every run, right before S3 (docs-sync-secret.mjs: `kubectl get` of its
# labels/annotations, then `kubectl replace --dry-run=server` and `kubectl
# replace`). Nothing else on Secrets: no create, no delete, no list, no watch,
# no other Secret name.
#
# The Secret itself (keys S3_ACCESS_KEY, S3_SECRET_KEY, no ownerReference) is
# pre-created by the k8s lane; its values come from the GitHub environment
# radar-bascule (secrets RADAR_DOCS_SYNC_ACCESS_KEY / RADAR_DOCS_SYNC_SECRET_KEY).
# Never a SealedSecret.
#
# ServiceAccount namespace assumed = radar-immobilier-preprod (same pattern as
# radar-ci-trigger-prod in its target namespace); adjust `subjects` if the SA
# lives elsewhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radar-ci-bascule-preprod-docs-secret
  namespace: radar-immobilier-preprod
  labels: { role: ci-bascule-preprod, usage: bascule-docs-secret }
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update"]
    resourceNames: ["radar-docs-src-preprod"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radar-ci-bascule-preprod-docs-secret
  namespace: radar-immobilier-preprod
  labels: { role: ci-bascule-preprod, usage: bascule-docs-secret }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: radar-ci-bascule-preprod-docs-secret }
subjects:
  - { kind: ServiceAccount, name: radar-ci-bascule-preprod, namespace: radar-immobilier-preprod }
