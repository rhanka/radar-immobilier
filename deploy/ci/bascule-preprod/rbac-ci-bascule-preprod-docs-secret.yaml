# Bascule preprod — RBAC ADDITIONS (ns radar-immobilier-preprod), applied by the
# k8s lane after review (install-time). Never a SealedSecret.
#
# 1. SA radar-ci-bascule-preprod (the bascule runner, kubeconfig
#    KUBE_CONFIG_DATA_BASCULE_PREPROD):
#    - secrets get + update on the 3 PRE-CREATED Secrets it rewrites from the
#      GitHub environment radar-bascule (ci-secrets.mjs: `kubectl get` of their
#      labels/annotations, `kubectl replace --dry-run=server`, `kubectl replace`):
#        radar-docs-src-preprod       docs-sync (MODE=chain, S3)
#        radar-backup-reader-preprod  backup reader (MODE=restore|list)
#        radar-backup-restore-docs    S3' copy signer (MODE=restore)
#      nothing else on Secrets: no create, patch, delete, list, watch, other name;
#    - configmaps get on immo-served-refs-0..3 (e2e O1: reads what the served-refs
#      Job published).
# 2. SA radar-bascule-refs-writer (the served-refs Job only; token projected into
#    its `publish` container only): configmaps get + update on immo-served-refs-0..3.
#    The 4 ConfigMaps are pre-created by served-refs-configmaps.yaml (update is
#    name-scopable, create is not).
#
# ServiceAccount namespace assumed = radar-immobilier-preprod (same pattern as
# radar-ci-trigger-prod in its target namespace); adjust `subjects` otherwise.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radar-ci-bascule-preprod-docs-secret
  namespace: radar-immobilier-preprod
  labels: { role: ci-bascule-preprod, usage: bascule-secrets }
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update"]
    resourceNames: ["radar-docs-src-preprod", "radar-backup-reader-preprod", "radar-backup-restore-docs"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
    resourceNames: ["immo-served-refs-0", "immo-served-refs-1", "immo-served-refs-2", "immo-served-refs-3"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radar-ci-bascule-preprod-docs-secret
  namespace: radar-immobilier-preprod
  labels: { role: ci-bascule-preprod, usage: bascule-secrets }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: radar-ci-bascule-preprod-docs-secret }
subjects:
  - { kind: ServiceAccount, name: radar-ci-bascule-preprod, namespace: radar-immobilier-preprod }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar-bascule-refs-writer
  namespace: radar-immobilier-preprod
  labels: { role: bascule-refs-writer, usage: bascule-served-refs }
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radar-bascule-refs-writer
  namespace: radar-immobilier-preprod
  labels: { role: bascule-refs-writer, usage: bascule-served-refs }
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update"]
    resourceNames: ["immo-served-refs-0", "immo-served-refs-1", "immo-served-refs-2", "immo-served-refs-3"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radar-bascule-refs-writer
  namespace: radar-immobilier-preprod
  labels: { role: bascule-refs-writer, usage: bascule-served-refs }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: radar-bascule-refs-writer }
subjects:
  - { kind: ServiceAccount, name: radar-bascule-refs-writer, namespace: radar-immobilier-preprod }
