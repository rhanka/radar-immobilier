# =============================================================================
# s3-check-job.tmpl.yaml — CHECK S3 verdict-only (freshness / recon / runs).
#
# RUNNER KUBECTL-ONLY : le runner ne touche plus S3 (0 cred S3 runner ; OVH n'a
# pas de scope list-only → toute cred runner pourrait GET le dump PII). Les 3
# vérifs S3 sont ce Job PRÉPROD (aws-cli, cred in-cluster) qui fait le
# LIST/HEAD/--dryrun DANS le pod et renvoie UNIQUEMENT un exit code (0/non-0).
# Le runner ne lit que `.status` (JAMAIS `kubectl logs` ni le stdout du pod, qui
# porteraient clés/listings). Runner PII-free, logs runner compris.
#
#   CHECK_MODE=freshness : poll interne (jusqu'à CHECK_TIMEOUT_SEC) un dump FRAIS
#       sous s3://CHECK_BUCKET/CHECK_PREFIX (récursif) : LastModified epoch >
#       CHECK_T1_EPOCH, clé ⊇ CHECK_EXPECTED_DATABASE, suffixe CHECK_KEY_SUFFIX,
#       Size>0. Cred = backups (radar-pra-admin, S3_*).
#   CHECK_MODE=recon     : aws s3 sync --dryrun src→dst ; sortie VIDE = dest ⊇ src
#       (exit 0), sinon exit 1. Cred = docs (radar-docs-s3-credentials, DOCS_S3_*).
#   CHECK_MODE=runs      : aws s3api list runs/ ; peuplé = exit 0, vide/denied = exit 1.
#
# FAIL-CLOSED : backoffLimit 0 + restartPolicy Never = un seul essai.
#
# Placeholders rendus par bascule.mjs (dispatchS3Check) : ${JOB_NAME} ${NAMESPACE}
# ${AWSCLI_IMAGE} ${CHECK_SECRET} ${CHECK_ACCESS_KEY} ${CHECK_SECRET_KEY}
# ${S3_ENDPOINT} ${S3_REGION} ${CHECK_MODE} ${CHECK_BUCKET} ${CHECK_PREFIX}
# ${CHECK_SRC_BUCKET} ${CHECK_DST_BUCKET} ${CHECK_T1_EPOCH} ${CHECK_EXPECTED_DATABASE}
# ${CHECK_KEY_SUFFIX} ${CHECK_TIMEOUT_SEC} ${CHECK_POLL_SEC} ${TTL_SECONDS}.
# Les $CHECK_* du pod sont référencés SANS accolades (variables RUNTIME).
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: s3-check
    sentropic.io/bascule: s3-check
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: ${TTL_SECONDS}
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/part-of: sentropic
        app.kubernetes.io/component: s3-check
        sentropic.io/bascule: s3-check
    spec:
      restartPolicy: Never
      serviceAccountName: radar-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          image: ${AWSCLI_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -o pipefail
              common=(--no-cli-pager --endpoint-url "$CHECK_S3_ENDPOINT")
              [ -n "$CHECK_S3_REGION" ] && common+=(--region "$CHECK_S3_REGION")
              case "$CHECK_MODE" in
                freshness)
                  end=$(( $(date +%s) + CHECK_TIMEOUT_SEC ))
                  while : ; do
                    fresh=$(aws "${common[@]}" s3api list-objects-v2 --bucket "$CHECK_BUCKET" ${CHECK_PREFIX:+--prefix "$CHECK_PREFIX"} \
                              --query "Contents[?Size>\`0\`].[LastModified,Key]" --output text 2>/dev/null \
                            | while read -r lm key; do
                                [ -z "$key" ] && continue
                                case "$key" in *"$CHECK_KEY_SUFFIX") ;; *) continue ;; esac
                                if [ -n "$CHECK_EXPECTED_DATABASE" ]; then
                                  case "$key" in *"$CHECK_EXPECTED_DATABASE"*) ;; *) continue ;; esac
                                fi
                                e=$(date -d "$lm" +%s 2>/dev/null || echo 0)
                                if [ "$e" -gt "$CHECK_T1_EPOCH" ]; then echo FRESH; break; fi
                              done)
                    if [ "$fresh" = "FRESH" ]; then echo "[check freshness] dump frais present (verdict-only)"; exit 0; fi
                    now=$(date +%s)
                    if [ "$now" -ge "$end" ]; then echo "[check freshness] timeout — aucun dump frais"; exit 1; fi
                    sleep "$CHECK_POLL_SEC"
                  done
                  ;;
                recon)
                  out=$(aws "${common[@]}" s3 sync --dryrun "s3://$CHECK_SRC_BUCKET/" "s3://$CHECK_DST_BUCKET/" 2>/dev/null)
                  rc=$?
                  if [ "$rc" -ne 0 ]; then echo "[check recon] erreur aws (creds/endpoint ?)"; exit 1; fi
                  if [ -n "$out" ]; then echo "[check recon] PENDING — dest ne contient pas src"; exit 1; fi
                  echo "[check recon] OK — dest contient src"; exit 0
                  ;;
                runs)
                  n=$(aws "${common[@]}" s3api list-objects-v2 --bucket "$CHECK_BUCKET" --prefix "$CHECK_PREFIX" --max-keys 1 \
                        --query 'length(Contents)' --output text 2>/dev/null)
                  rc=$?
                  if [ "$rc" -ne 0 ] || [ -z "$n" ] || [ "$n" = "None" ]; then echo "[check runs] runs/ vide ou LIST refuse"; exit 1; fi
                  if [ "$n" -lt 1 ] 2>/dev/null; then echo "[check runs] runs/ vide"; exit 1; fi
                  echo "[check runs] runs/ peuple"; exit 0
                  ;;
                *)
                  echo "[check] CHECK_MODE inconnu: $CHECK_MODE"; exit 2
                  ;;
              esac
          env:
            - name: HOME
              value: /tmp
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: ${CHECK_SECRET}, key: ${CHECK_ACCESS_KEY} } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: ${CHECK_SECRET}, key: ${CHECK_SECRET_KEY} } }
            - name: CHECK_S3_ENDPOINT
              value: "${S3_ENDPOINT}"
            - name: CHECK_S3_REGION
              value: "${S3_REGION}"
            - name: CHECK_MODE
              value: "${CHECK_MODE}"
            - name: CHECK_BUCKET
              value: "${CHECK_BUCKET}"
            - name: CHECK_PREFIX
              value: "${CHECK_PREFIX}"
            - name: CHECK_SRC_BUCKET
              value: "${CHECK_SRC_BUCKET}"
            - name: CHECK_DST_BUCKET
              value: "${CHECK_DST_BUCKET}"
            - name: CHECK_T1_EPOCH
              value: "${CHECK_T1_EPOCH}"
            - name: CHECK_EXPECTED_DATABASE
              value: "${CHECK_EXPECTED_DATABASE}"
            - name: CHECK_KEY_SUFFIX
              value: "${CHECK_KEY_SUFFIX}"
            - name: CHECK_TIMEOUT_SEC
              value: "${CHECK_TIMEOUT_SEC}"
            - name: CHECK_POLL_SEC
              value: "${CHECK_POLL_SEC}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests: { cpu: 25m, memory: 64Mi, ephemeral-storage: 32Mi }
            limits: { cpu: 250m, memory: 256Mi, ephemeral-storage: 128Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
