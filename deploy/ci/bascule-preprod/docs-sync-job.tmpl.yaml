# =============================================================================
# docs-sync-job.tmpl.yaml — COPIE DOCS prod → préprod (S3/S4), Job in-cluster.
# OPTION A CANONIQUE (server-side aws-sdk CopyObject, co-val k8s + i-infra).
#
# RUNNER KUBECTL-ONLY : la copie ne transite JAMAIS par le runner (0 S3 runner).
# The Secret ${DOCS_SYNC_READ_SECRET} (radar-docs-src-preprod = creds
# immo-docs-prod, durable least-privilege) is PRE-CREATED by k8s; the bascule
# REWRITES it at every run from the GitHub secrets of the environment
# radar-bascule right before this Job (`docs-secret-fill`, kubectl replace,
# get/update by name) — docs-sync-secret.mjs. No k8s watcher, no ownerReference.
# The pod references the Secret by NAME.
#
#   container `sync` (image radar-api = aws-sdk @aws-sdk/client-s3, 0 python) :
#     `node -e` : (1) PRÉ-CHECK GET fail-closed (HEAD 1 objet prod — l'owner
#     immo-docs-prod passe, sinon exit 1) ; (2) boucle List(s3://${SRC_BUCKET},
#     ${COPY_PREFIX} optionnel) → CopyObject(s3://${DST_BUCKET}, MÊME clé,
#     GrantFullControl id=${COPY_GRANTEE}) = CopyObject SERVER-SIDE (0 octet par
#     le pod), ADDITIF (pas de delete), IDEMPOTENT. Le grant explicite rend les
#     objets copiés lisibles par l'API préprod (sinon 403 propagé).
#
#   PARITÉ geo (rhanka/geo#396, self-test 57/57) : copie INCRÉMENTALE + CONCURRENTE.
#   Chez geo (~13 400 objets / ~40 GB déjà présents en préprod), recopier tout en
#   SÉRIE (~1,9 obj/s, latence CopyObject, CPU nul) dépassait le délai runner
#   (5400s). Le run evidence immo (EVIDENCE_CAPTURE_RUN.md §g) mesure ~2057
#   objets — sous le mur aujourd'hui, mais MÊME boucle série = même risque si le
#   jeu de docs grossit. Correctif identique : on LISTE la destination et on ne
#   copie que les clés absentes ou différentes — « à jour » = même Size ET (même
#   ETag OU LastModified préprod ≥ LastModified prod, i.e. copiée après la
#   dernière écriture prod) —, avec COPY_CONCURRENCY CopyObject en parallèle
#   (défaut 8, borné 1..32). LIST destination refusée ⇒ repli sur la copie
#   complète (plus lent, même résultat). Comportement fonctionnel INCHANGÉ
#   (additif, idempotent, même clé, même source-vide=exit 0 immo) — juste
#   incrémental + concurrent.
#
# La recon (dest ⊇ src) est un Job séparé (s3-check-job mode=recon).
#
# FAIL-CLOSED : backoffLimit 0 + restartPolicy Never. Runner ne lit que .status.
#
# PRÉREQUIS : secret ${DOCS_SYNC_READ_SECRET} pre-created (keys
# S3_ACCESS_KEY/S3_SECRET_KEY, rewritten by the bascule: read prod + rw préprod) ;
# ${COPY_GRANTEE} = canonical id radar-docs préprod.
#
# Placeholders : ${NAMESPACE} ${IMAGE} ${DOCS_SYNC_READ_SECRET} ${S3_ENDPOINT}
# ${S3_REGION} ${S3_FORCE_PATH_STYLE} ${SRC_BUCKET} ${DST_BUCKET} ${COPY_GRANTEE}
# ${COPY_PREFIX}. Le script node lit process.env.* (aucun ${...} dans le script).
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  # Stable name (evidence/runbooks); the Secret no longer depends on it.
  name: docs-sync-prod-to-preprod
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: docs-sync
    sentropic.io/bascule: docs-sync
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/part-of: sentropic
        app.kubernetes.io/component: docs-sync
        sentropic.io/bascule: docs-sync
    spec:
      restartPolicy: Never
      serviceAccountName: radar-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image: ${IMAGE}
          imagePullPolicy: Always
          workingDir: /workspace/api
          # aws-sdk CopyObject (0 python). Le script lit process.env.* (0 ${...}).
          command: ["node", "-e"]
          args:
            - |
              const {S3Client,ListObjectsV2Command,CopyObjectCommand,HeadObjectCommand}=require('@aws-sdk/client-s3');
              const endpoint=process.env.S3_ENDPOINT;
              const region=process.env.S3_REGION||'us-east-1';
              const forcePathStyle=(process.env.S3_FORCE_PATH_STYLE||'true')==='true';
              const src=process.env.SRC_BUCKET;
              const dst=process.env.DST_BUCKET;
              const grantee=process.env.COPY_GRANTEE||'';
              const prefix=process.env.COPY_PREFIX||undefined;
              const s3=new S3Client({endpoint,region,forcePathStyle,credentials:{accessKeyId:process.env.AWS_ACCESS_KEY_ID,secretAccessKey:process.env.AWS_SECRET_ACCESS_KEY}});
              const enc=(k)=>encodeURIComponent(k).replace(/%2F/g,'/');
              const grant=grantee?{GrantFullControl:'id='+grantee}:{};
              const concurrency=Math.max(1,Math.min(32,Math.floor(Number(process.env.COPY_CONCURRENCY||'8'))||8));
              // A jour en preprod = meme Size ET (meme ETag OU copie posterieure a la derniere ecriture prod).
              const upToDate=(o,d)=>!!d&&Number(d.Size)===Number(o.Size)&&(d.ETag===o.ETag||(!!d.LastModified&&!!o.LastModified&&new Date(d.LastModified).getTime()>=new Date(o.LastModified).getTime()));
              const listAll=async(Bucket)=>{const all=[];let token=undefined;do{const out=await s3.send(new ListObjectsV2Command({Bucket,Prefix:prefix,ContinuationToken:token}));for(const o of (out.Contents||[]))all.push(o);token=out.IsTruncated?out.NextContinuationToken:undefined;}while(token);return all;};
              (async()=>{
                const probe=await s3.send(new ListObjectsV2Command({Bucket:src,Prefix:prefix,MaxKeys:1}));
                const seed=(probe.Contents||[]);
                if(seed.length===0){console.log('[docs-sync] bucket PROD/prefix vide — rien a copier');return;}
                await s3.send(new HeadObjectCommand({Bucket:src,Key:seed[0].Key}));
                console.log('[docs-sync] pre-check GET OK (owner immo-docs-prod) grant='+(grantee||'<none>'));
                if(!grantee){console.warn('[docs-sync] WARN — COPY_GRANTEE vide : objets copies potentiellement illisibles par l API preprod (403).');}
                const srcObjs=await listAll(src);
                let dstIndex=new Map();
                try{for(const d of (await listAll(dst)))dstIndex.set(d.Key,d);}
                catch(e){console.warn('[docs-sync] WARN LIST destination impossible ('+(e&&e.name)+') — copie complete (plus lente, meme resultat)');dstIndex=new Map();}
                const todo=srcObjs.filter((o)=>!upToDate(o,dstIndex.get(o.Key)));
                const fresh=srcObjs.length-todo.length;
                console.log('[docs-sync] source='+srcObjs.length+' deja_a_jour='+fresh+' a_copier='+todo.length+' concurrence='+concurrency);
                let next=0,copied=0;
                const worker=async()=>{while(next<todo.length){const o=todo[next++];await s3.send(new CopyObjectCommand(Object.assign({Bucket:dst,Key:o.Key,CopySource:'/'+src+'/'+enc(o.Key),MetadataDirective:'COPY'},grant)));copied++;if(copied%500===0)console.log('[docs-sync] progression '+copied+'/'+todo.length);}};
                await Promise.all(Array.from({length:Math.min(concurrency,todo.length)},()=>worker()));
                console.log('[docs-sync] ok '+copied+' objets copies, '+fresh+' deja a jour (server-side, 0 octet pod, additif, idempotent)');
              })().catch((e)=>{console.error('[docs-sync] ERROR',e&&e.name,(e&&e.message)||e);process.exit(1);});
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: ${DOCS_SYNC_READ_SECRET}, key: S3_ACCESS_KEY } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: ${DOCS_SYNC_READ_SECRET}, key: S3_SECRET_KEY } }
            - name: S3_ENDPOINT
              value: "${S3_ENDPOINT}"
            - name: S3_REGION
              value: "${S3_REGION}"
            - name: S3_FORCE_PATH_STYLE
              value: "${S3_FORCE_PATH_STYLE}"
            - name: SRC_BUCKET
              value: "${SRC_BUCKET}"
            - name: DST_BUCKET
              value: "${DST_BUCKET}"
            - name: COPY_GRANTEE
              value: "${COPY_GRANTEE}"
            - name: COPY_PREFIX
              value: "${COPY_PREFIX}"
          resources:
            # cpu 25m (était 100m) : le container ne fait QUE List/CopyObject
            # server-side (0 octet transitant par le pod, cf. commentaire de
            # tête) — même profil CPU que s3-check-job (25m), même argument que
            # geo #394 pour son propre docs-sync. Trim CPU nœud préprod (node
            # saturé 95%/1749m requests, breakdown k8s du 2026-09-25) ; mémoire
            # inchangée (192Mi, non concernée par la pression CPU).
            requests: { cpu: 25m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
