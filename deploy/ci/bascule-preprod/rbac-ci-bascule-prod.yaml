# SA CD DÉDIÉ PERMANENT `radar-ci-bascule-prod` (option B2) — appliqué UNE fois à l'install cluster (comme les autres
# KUBE_CONFIG), puis le CD standard applique le bundle bascule au merge. 0 token éphémère, 0 owner, 0 fenêtre.
# COMMITTÉ (PR CD-native-v2). Isole les droits élevés (VAP cluster + impersonate) hors du déployeur général étroit.
#
# ⚠ 0 `secrets:create` : les creds (radar-db-ro-prod, radar-pra-admin-prod) arrivent en **SealedSecret committées** ;
#   le controller sealed-secrets (ns sealed-secrets) matérialise les core Secrets. Le CD n'applique que des manifests.
# `create` non name-scopable (RBAC) → create ns-wide ; get/patch/update/delete name-scopés aux objets EXACTS du bundle.
# impersonate name-scopé radar-ci-trigger-prod (gate anti-RCE `--dry-run=server`).
# Daily prod backup (deploy/ci/backup/README.md) : the same SA, in job `apply-backup` of bascule-bundle-cd.yml,
# WRITES the core Secrets radar-backup-writer/-reader/-purger from the GitHub Environment radar-backup-prod (NO
# SealedSecret for them), and applies the ConfigMap radar-backup-daily-script and the CronJobs radar-backup-daily +
# radar-backup-freshness → those 6 names are in the name-scoped verbs below. The 3 Secrets are PRE-CREATED by the
# k8s lane: secrets = get/patch/update on these 3 names ONLY — 0 secrets:create/list/watch/delete.
# RE-APPLY this file (install-time, cluster-admin) BEFORE the CD writes them.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar-ci-bascule-prod
  namespace: radar-immobilier
  labels: { app.kubernetes.io/name: radar-immobilier, role: ci-bascule-prod, usage: bascule-cd-permanent }
---
# ── Cluster-scoped : VAP (non-namespacé) ──────────────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: radar-ci-bascule-prod-vap
  labels: { app.kubernetes.io/name: radar-immobilier, role: ci-bascule-prod }
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["create"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["radar-ci-trigger-suspend-only"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: radar-ci-bascule-prod-vap
  labels: { app.kubernetes.io/name: radar-immobilier, role: ci-bascule-prod }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: radar-ci-bascule-prod-vap }
subjects: [ { kind: ServiceAccount, name: radar-ci-bascule-prod, namespace: radar-immobilier } ]
---
# ── Namespaced : bundle intratenant (ns radar-immobilier) — core secrets : les 3 identités backup SEULEMENT ────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radar-ci-bascule-prod
  namespace: radar-immobilier
  labels: { app.kubernetes.io/name: radar-immobilier, role: ci-bascule-prod }
rules:
  # SealedSecrets (CR bitnami) : le CD applique les SealedSecret committées ; le controller matérialise les core Secrets.
  - apiGroups: ["bitnami.com"]
    resources: ["sealedsecrets"]
    verbs: ["create"]
  - apiGroups: ["bitnami.com"]
    resources: ["sealedsecrets"]
    verbs: ["get", "patch", "update"]
    resourceNames: ["radar-db-ro-prod", "radar-pra-admin-prod"]
  # core secrets : ONLY the 3 daily prod backup identities (deploy/ci/backup/, job apply-backup), written from the
  # GitHub Environment radar-backup-prod by `kubectl replace` (get + update). Pre-created by the k8s lane.
  # NO create (a missing Secret stays missing), NO list/watch, NO delete.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch", "update"]
    resourceNames: ["radar-backup-writer", "radar-backup-reader", "radar-backup-purger"]
  # configmaps (SQL du rôle RO + script du backup quotidien radar-backup-daily-script) :
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch", "update"]
    resourceNames: ["radar-db-ro-role-sql", "radar-backup-daily-script"]
  # serviceaccounts (SA trigger T1) :
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
    resourceNames: ["radar-ci-trigger-prod"]
  # roles/rolebindings (T1) — SANS escalate/bind (bascule est superset de T1) :
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["radar-ci-trigger-prod"]
  # jobs (RO-role provision one-shot + observe) :
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # cronjobs (dump bascule + backup quotidien radar-backup-daily + contrôle de fraîcheur radar-backup-freshness) :
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "patch", "update"]
    resourceNames: ["radar-db-backup-prod", "radar-backup-daily", "radar-backup-freshness"]
  # deployments : LECTURE SEULE (vérif iso-prod/readiness) :
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # impersonate : SEULEMENT la SA trigger, gate anti-RCE `--dry-run=server` :
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["impersonate"]
    resourceNames: ["radar-ci-trigger-prod"]
  # pods/pods/log : observer le Job RO (diagnostic), lecture seule :
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radar-ci-bascule-prod
  namespace: radar-immobilier
  labels: { app.kubernetes.io/name: radar-immobilier, role: ci-bascule-prod }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: radar-ci-bascule-prod }
subjects: [ { kind: ServiceAccount, name: radar-ci-bascule-prod, namespace: radar-immobilier } ]
---
# EXCLUS : core secrets (tous verbes, sauf get/patch/update sur les 3 identités backup radar-backup-*),
#   secrets:create/list/watch/delete, pods/exec, deployments:patch/scale, PV/PVC,
#   namespaces, nodes, autres ns, impersonate users/groups.
# INSTALL : appliqué UNE fois (cluster-admin/install). Token permanent → KUBE_CONFIG_DATA_PROD (secret CD standard).
#   Réversible : delete SA/Role/RB/ClusterRole/CRB.
