# =============================================================================
# db-migrate-job.tmpl.yaml — MIGRATE iso-prod (S2c), Job one-shot in-cluster.
#
# Patron de deploy/k8s/36-db-migrate-job.yaml, paramétré pour la BASCULE :
# rendu (placeholders remplacés) + appliqué + poll fail-closed par bascule.mjs
# dans le namespace PRÉPROD, avec l'image radar-api EXACTE servie en préprod
# (iso-prod). `node dist/db/migrate.js` applique le delta de migrations `main`
# sur les données prod fraîchement restaurées — c'est le test iso-prod.
#
# FAIL-CLOSED : backoffLimit 0 + restartPolicy Never = un seul essai, aucun
# retry qui masquerait un échec ; le poll du CLI transforme un Job failed/timeout
# en abort de l'étape. Idempotent : drizzle saute les migrations déjà appliquées.
#
# Placeholders rendus par bascule.mjs : ${NAMESPACE} ${IMAGE} ${DB_SECRET}
# ${S3_SECRET} ${TTL_SECONDS}. Les $POSTGRES_* / $S3_* du pod restent littéraux
# (résolus au runtime depuis les Secrets in-cluster, jamais au rendu).
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: radar-db-migrate-bascule
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: api
    sentropic.io/bascule: migrate
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: ${TTL_SECONDS}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/part-of: sentropic
        app.kubernetes.io/component: api
        sentropic.io/bascule: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: radar-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-migrate
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image: ${IMAGE}
          imagePullPolicy: Always
          workingDir: /workspace/api
          command: ["node", "dist/db/migrate.js"]
          envFrom:
            - configMapRef:
                name: radar-api
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: ${DB_SECRET}, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ${DB_SECRET}, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: ${DB_SECRET}, key: POSTGRES_DB } }
            # Creds S3 = ${S3_SECRET} (= radar-docs-s3-credentials, clés DOCS_S3_*) —
            # aligné sur radar-refresh-pv (#738 ; l'ancien secret S3 par défaut avait
            # un access-key bidon). Mount-only si db-migrate n'exerce pas S3, wiring
            # corrigé quand même.
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: ${S3_SECRET}, key: DOCS_S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: ${S3_SECRET}, key: DOCS_S3_SECRET_KEY } }
