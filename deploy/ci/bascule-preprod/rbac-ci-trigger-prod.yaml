# T1 — déclencheur ÉTROIT (name-scopé), 0 foothold. DRY, apply=GO owner-direct. ns prod radar-immobilier.
# Permet à la CI de get/patch UNIQUEMENT le cronjob nommé (un-suspend / éditer schedule) → PAS de create jobs, PAS de pod arbitraire.
# Limite : ne donne PAS un "run now" immédiat (le CronJob crée le Job au prochain slot planifié). Pour du quasi-immédiat = schedule fréquent.
apiVersion: v1
kind: ServiceAccount
metadata: { name: radar-ci-trigger-prod, namespace: radar-immobilier, labels: { role: ci-trigger-prod, usage: bascule-dump } }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: radar-ci-trigger-prod, namespace: radar-immobilier, labels: { role: ci-trigger-prod } }
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "patch"]                 # name-scopable (contrairement à create)
    resourceNames: ["radar-db-backup-prod"] # UN SEUL objet — 0 accès aux autres cronjobs/jobs/pods
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]         # observer le Job produit par le cronjob (get/list/watch non name-scopables mais lecture seule)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: radar-ci-trigger-prod, namespace: radar-immobilier, labels: { role: ci-trigger-prod } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: radar-ci-trigger-prod }
subjects: [ { kind: ServiceAccount, name: radar-ci-trigger-prod, namespace: radar-immobilier } ]
