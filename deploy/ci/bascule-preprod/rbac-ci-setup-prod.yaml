# CD bootstrap cred — SA `radar-ci-setup-prod` : appliqué UNE fois pour poser le bundle bascule prod via le CD.
# DESIGN/DONNÉE (committé, PR #745). APPLY = bootstrap one-time OWNER-DIRECT (toi/owner) ; ENSUITE : je génère un
#   token → GH secret `KUBE_CONFIG_DATA_PROD_SETUP` → le workflow apply-bundle l'utilise ; plus aucun kubectl manuel.
#
# ⚠ CRED À HAUTE VALEUR — À FAIRE VALIDER PAR L'OWNER (concentration de privilège en GH secret) :
#   - peut CRÉER des secrets/roles/rolebindings/cronjobs en ns prod + CRÉER des VAP cluster-scoped + IMPERSONATE.
#     `create` n'est PAS name-scopable en RBAC → create ns-wide (inhérent à un applieur). get/patch/update/delete
#     sont name-scopés aux objets du bundle. impersonate est name-scopé à radar-ci-trigger-prod.
#   - Mitigations RECOMMANDÉES (à cadrer côté CD/owner, hors ce manifeste) :
#       (1) token COURT + rotation ; (2) GH environment protégé (required reviewers, run sur merge/main SEULEMENT,
#       jamais sur PR non-fusionnée) ; (3) SA `radar-ci-setup-prod` SUPPRIMÉE après le bootstrap réussi (usage one-time) ;
#       (4) idéalement OIDC fédéré plutôt qu'un KUBE_CONFIG_DATA long-vécu.
#   - Gate anti-RCE conservé : le workflow, après apply VAP+RBAC T1, prouve par impersonation `--dry-run=server`
#       (jobTemplate DENIED / suspend ALLOWED) avant de générer/mint le token T1 ; sinon ABORT.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar-ci-setup-prod
  namespace: radar-immobilier
  labels: { app.kubernetes.io/name: radar-immobilier, role: ci-setup-prod, usage: bascule-bootstrap-one-time }
---
# ── Cluster-scoped : VAP (non-namespacé) ──────────────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: radar-ci-setup-prod-vap
  labels: { app.kubernetes.io/name: radar-immobilier, role: ci-setup-prod }
rules:
  # create ns-wide (non name-scopable) — la VAP + son binding du bundle.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["create"]
  # get/update/patch name-scopés au SEUL objet du bundle (idempotence apply).
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["radar-ci-trigger-suspend-only"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: radar-ci-setup-prod-vap
  labels: { app.kubernetes.io/name: radar-immobilier, role: ci-setup-prod }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: radar-ci-setup-prod-vap }
subjects: [ { kind: ServiceAccount, name: radar-ci-setup-prod, namespace: radar-immobilier } ]
---
# ── Namespaced : bundle intratenant (ns radar-immobilier) ─────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radar-ci-setup-prod
  namespace: radar-immobilier
  labels: { app.kubernetes.io/name: radar-immobilier, role: ci-setup-prod }
rules:
  # create ns-wide (RBAC ne name-scope pas create) pour les ressources du bundle :
  - apiGroups: [""]
    resources: ["serviceaccounts", "secrets", "configmaps"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create"]                                    # SANS escalate/bind : setup est superset de T1
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create"]
  # get/patch/update/delete name-scopés aux objets EXACTS du bundle :
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "patch", "update"]
    resourceNames: ["radar-ci-trigger-prod"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch", "update"]
    resourceNames: ["radar-db-ro-prod", "radar-pra-admin-prod"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch", "update"]
    resourceNames: ["radar-db-ro-role-sql"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["radar-ci-trigger-prod"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "patch", "update"]
    resourceNames: ["radar-db-backup-prod"]
  # jobs : observer le Job RO one-shot (get/list/watch) + delete (replay idempotent).
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "delete"]
  # deployments : LECTURE SEULE (vérif iso-prod / readiness au setup).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # impersonate : SEULEMENT la SA trigger, pour le gate anti-RCE `--dry-run=server`.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["impersonate"]
    resourceNames: ["radar-ci-trigger-prod"]
  # pods/pods/log : observer le Job RO (diagnostic). Lecture seule.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radar-ci-setup-prod
  namespace: radar-immobilier
  labels: { app.kubernetes.io/name: radar-immobilier, role: ci-setup-prod }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: radar-ci-setup-prod }
subjects: [ { kind: ServiceAccount, name: radar-ci-setup-prod, namespace: radar-immobilier } ]
---
# EXCLUS (moindre privilège) : pods/exec, secrets:list (0 énumération), deployments:patch/scale, namespaces, PV/PVC,
#   nodes, tout autre ns, impersonate users/groups. `secrets:list` volontairement absent → pas d'exfil de masse.
# TOKEN : après bootstrap owner-direct, `kubectl -n radar-immobilier create token radar-ci-setup-prod --duration=<COURTE>`
#   → kubeconfig (server+CA) → base64 → GH secret KUBE_CONFIG_DATA_PROD_SETUP. Réversible : delete SA/Role/RB/CR/CRB.
