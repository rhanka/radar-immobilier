# =============================================================================
# docs-restore-backup-job.tmpl.yaml — S3'/S3b' of the bascule MODE=restore:
# restore into the preprod docs bucket the docs state AT DAY D, from the backup.
#
# BR_STEP=docs  : manifests/<D>.json (sha256 == PIN) → docs-inventory/<D>.json
#                 (sha256 == manifest) → ListObjectVersions(<backup>/docs/) → plan:
#                 every `backed-up` inventory entry whose preprod copy is not already
#                 the same content (size + ETag) is copied SERVER-SIDE (CopyObject,
#                 0 byte through the pod) from <backup>/docs/<key>?versionId=<v>, v =
#                 the recorded version, else the version whose ETag is the inventory's
#                 (object rewritten since D). ADDITIVE (no delete). Then recon
#                 dest ⊇ inventory(D) (Key + Size). DOCS_DRY=1 = plan only, no copy.
#                 Any inventory object not in the backup or without a restorable
#                 version ⇒ refusal (exit 2) before the first copy.
# BR_STEP=recon : recon only (G4 re-check right before the flip).
#
# Identities (keys S3_ACCESS_KEY / S3_SECRET_KEY):
#   reader ${READER_SECRET} (radar-backup-reader, + key BACKUP_BUCKET): manifest,
#          inventory, version listing — GetObject(+versionId), ListBucket(Versions).
#   copy   ${COPY_SECRET}: SIGNS the server-side CopyObject and lists the preprod
#          bucket. It needs GetObject + GetObjectVersion on <backup>/docs/* AND
#          ListBucket + PutObject (+ PutObjectAcl for the grant) on the preprod docs
#          bucket. Default = the reader Secret (then the reader user needs those
#          preprod rights) — see README "Restore from a backup — identities".
# GrantFullControl id=${COPY_GRANTEE} (preprod API canonical id) keeps the copied
# objects readable by the preprod API, as in docs-sync.
#
# Runner = kubectl only (.status + termination message: counts only).
# Placeholders: ${JOB_NAME} ${NAMESPACE} ${IMAGE} ${BR_STEP} ${READER_SECRET}
# ${COPY_SECRET} ${S3_ENDPOINT} ${S3_REGION} ${S3_FORCE_PATH_STYLE}
# ${EXPECTED_BACKUP_BUCKET} ${BACKUP_DATE} ${PIN_MANIFEST_SHA256} ${DST_BUCKET}
# ${FORBIDDEN_DST_BUCKETS} ${COPY_GRANTEE} ${COPY_CONCURRENCY} ${DOCS_DRY}
# ${TTL_SECONDS}, plus the BR_SCRIPT placeholder under `args:` (never written in a
# comment: it spans many lines).
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: docs-restore
    sentropic.io/bascule: docs-restore
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: ${TTL_SECONDS}
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-immobilier
        app.kubernetes.io/part-of: sentropic
        app.kubernetes.io/component: docs-restore
        sentropic.io/bascule: docs-restore
    spec:
      restartPolicy: Never
      serviceAccountName: radar-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
      containers:
        - name: docs
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/api
          command: ["node", "-e"]
          args:
            - |
${BR_SCRIPT}
          env:
            - { name: BR_STEP, value: "${BR_STEP}" }
            - { name: NODE_PATH, value: "/workspace/node_modules" }
            # inventory (~60k entries) + version index + preprod listing in memory.
            - { name: NODE_OPTIONS, value: "--max-old-space-size=768" }
            - { name: AWS_EC2_METADATA_DISABLED, value: "true" }
            - { name: S3_ENDPOINT, value: "${S3_ENDPOINT}" }
            - { name: S3_REGION, value: "${S3_REGION}" }
            - { name: S3_FORCE_PATH_STYLE, value: "${S3_FORCE_PATH_STYLE}" }
            - { name: EXPECTED_BACKUP_BUCKET, value: "${EXPECTED_BACKUP_BUCKET}" }
            - { name: BACKUP_DATE, value: "${BACKUP_DATE}" }
            - { name: PIN_MANIFEST_SHA256, value: "${PIN_MANIFEST_SHA256}" }
            - { name: DST_BUCKET, value: "${DST_BUCKET}" }
            - { name: FORBIDDEN_DST_BUCKETS, value: "${FORBIDDEN_DST_BUCKETS}" }
            - { name: COPY_GRANTEE, value: "${COPY_GRANTEE}" }
            - { name: COPY_CONCURRENCY, value: "${COPY_CONCURRENCY}" }
            - { name: DOCS_DRY, value: "${DOCS_DRY}" }
            - { name: READER_ACCESS_KEY, valueFrom: { secretKeyRef: { name: ${READER_SECRET}, key: S3_ACCESS_KEY } } }
            - { name: READER_SECRET_KEY, valueFrom: { secretKeyRef: { name: ${READER_SECRET}, key: S3_SECRET_KEY } } }
            - { name: BACKUP_BUCKET, valueFrom: { secretKeyRef: { name: ${READER_SECRET}, key: BACKUP_BUCKET } } }
            - { name: COPIER_ACCESS_KEY, valueFrom: { secretKeyRef: { name: ${COPY_SECRET}, key: S3_ACCESS_KEY } } }
            - { name: COPIER_SECRET_KEY, valueFrom: { secretKeyRef: { name: ${COPY_SECRET}, key: S3_SECRET_KEY } } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests: { cpu: 25m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
