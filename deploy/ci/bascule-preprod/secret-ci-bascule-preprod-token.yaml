# Owner decision 2026-10-29: the daily preprod restore credential must not expire.
# Kubernetes populates data.token and data.ca.crt; never copy them into git.
# Manual rotation and recovery: CRED_CYCLE.md, "Preprod bascule CI kubeconfig".
apiVersion: v1
kind: Secret
metadata:
  name: radar-ci-bascule-preprod-token
  namespace: radar-immobilier-preprod
  labels:
    role: ci-bascule-preprod
  annotations:
    kubernetes.io/service-account.name: radar-ci-bascule-preprod
type: kubernetes.io/service-account-token
