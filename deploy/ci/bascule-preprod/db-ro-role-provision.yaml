# Provision the STRICT READ-ONLY Postgres login role radar_db_ro_prod, consumed
# by the prod DB backup CronJob (radar-db-backup-prod) as its SELECT-only pg_dump
# identity. COMMITTED CODE (option B): a one-shot k8s Job runs the SQL via psql as
# the SUPERUSER radar-db-credentials; the RO password is injected from the minted
# secret radar-db-ro-prod (key POSTGRES_PASSWORD) via psql \getenv — NEVER a
# literal here. Idempotent / replayable (OPS-3). Applied owner-direct to ns
# radar-immobilier (prod one-shot Jobs are out of kustomization by convention,
# like deploy/k8s/36-db-migrate-job.yaml). Single unit: kubectl apply -f <this>.
#   Prereq: secret radar-db-ro-prod minted (GH secret + .env backup, cred cycle).
#   Verify after: role exists, LOGIN, member of pg_read_all_data, CONNECT on radar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: radar-db-ro-role-sql
  namespace: radar-immobilier
  labels: { app.kubernetes.io/name: radar-immobilier, app.kubernetes.io/part-of: sentropic, role: pra-backup }
data:
  provision-ro-role.sql: |
    -- =============================================================================
    -- DRAFT_ro_role_provisioning.sql
    -- Provision the STRICT READ-ONLY Postgres login role consumed by the prod DB
    -- backup CronJob (.remote/cronjob-db-backup-prod-DRY.yaml, secret radar-db-ro-prod).
    --
    -- WHO RUNS THIS: a one-shot k8s Job connecting as the SUPERUSER identity
    --   radar-db-credentials (the initdb bootstrap user `radar`, a Postgres
    --   SUPERUSER per deploy/k8s/20-postgres-postgis.yaml:56-61), via `psql`.
    --   It is NOT run by the drizzle migrator (`node dist/db/migrate.js`), which
    --   executes STATIC SQL through node-postgres and has NO psql meta-commands
    --   and NO variable/env interpolation — so it cannot inject the RO password.
    --   That limitation is exactly why option (B) is recommended over (A).
    --
    -- INVOKE:  psql -v ON_ERROR_STOP=1 -f DRAFT_ro_role_provisioning.sql
    --   Connection (superuser) via libpq env: PGHOST/PGUSER/PGPASSWORD/PGDATABASE
    --     sourced from secret radar-db-credentials.
    --   RO password via env RO_PASSWORD sourced from secret radar-db-ro-prod
    --     (key POSTGRES_PASSWORD). NEVER a literal in this committed file.
    --
    -- IDEMPOTENT + REPLAYABLE (OPS-3): safe to run any number of times; re-running
    --   after a secret rotation simply re-asserts the (new) password (rotation cycle).
    --
    -- SECRET HYGIENE: the ONLY interpolated value here is the password, and it is
    --   read from the environment with psql `\getenv` (psql 16, shipped in the
    --   in-cluster postgis/postgis:16-3.4 image). It is referenced only at TOP
    --   LEVEL as :'ro_pwd' — psql performs NO interpolation inside dollar-quoted
    --   ($$...$$) blocks, so the password literal is deliberately kept out of every
    --   DO block. The role NAME and DB NAME are NOT secrets and stay hardcoded.
    -- =============================================================================
    
    \set ON_ERROR_STOP on
    
    -- Pull the RO password from the pod env (secretKeyRef radar-db-ro-prod). If the
    -- env var is unset, `\getenv` leaves the psql var undefined; pre-seed to '' so
    -- the emptiness guard below is deterministic.
    \set ro_pwd ''
    \getenv ro_pwd RO_PASSWORD
    
    -- Fail-closed guard: never create or keep a LOGIN role with an empty password.
    SELECT length(:'ro_pwd') > 0 AS ro_ok \gset
    \if :ro_ok
    \else
      \warn 'FATAL: env RO_PASSWORD is empty/unset — refusing to provision a passwordless RO login'
      DO $guard$ BEGIN
        RAISE EXCEPTION 'RO_PASSWORD env empty/unset (fail-closed)';
      END $guard$;
    \endif
    
    BEGIN;
    
    -- 1) Create the login role if absent (Postgres has no CREATE ROLE ... IF NOT
    --    EXISTS, hence the DO block). Least-privilege attributes are explicit.
    --    The role name is a stable convention (matches secret radar-db-ro-prod's
    --    POSTGRES_USER) and is NOT sensitive.
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'radar_db_ro_prod') THEN
        CREATE ROLE radar_db_ro_prod
          LOGIN
          NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
        RAISE NOTICE 'created role radar_db_ro_prod';
      ELSE
        RAISE NOTICE 'role radar_db_ro_prod already exists — reusing (password re-asserted below)';
      END IF;
    END
    $$;
    
    -- 2) Set/rotate the password from the minted secret. TOP LEVEL on purpose so
    --    :'ro_pwd' interpolates (it would NOT inside a $$...$$ block). PG16's
    --    default password_encryption=scram-sha-256 means the STORED form is a SCRAM
    --    verifier; only the ALTER ROLE wire statement carries the plaintext (see
    --    the log caveat in DRAFT_ro_role_FINDINGS.md).
    ALTER ROLE radar_db_ro_prod WITH LOGIN PASSWORD :'ro_pwd';
    
    -- 3) Least-privilege READ. The predefined role pg_read_all_data (PG14+) grants,
    --    implicitly and at access-check time, SELECT on ALL tables/views/sequences
    --    and USAGE on ALL schemas — INCLUDING objects created in the FUTURE. This
    --    is why NO `GRANT SELECT ON ALL TABLES` + `ALTER DEFAULT PRIVILEGES` dance
    --    is needed. Re-granting an existing membership is a NOTICE, not an error.
    GRANT pg_read_all_data TO radar_db_ro_prod;
    
    -- 4) CONNECT is a database-level privilege NOT covered by pg_read_all_data.
    --    Grant it explicitly so pg_dump can attach even if PUBLIC CONNECT was
    --    revoked. `radar` is the prod DB (EXPECTED_DATABASE in the backup CronJob,
    --    line 52; POSTGRES_DB default in api/drizzle.config.ts:12). Idempotent.
    GRANT CONNECT ON DATABASE radar TO radar_db_ro_prod;
    
    COMMIT;
    
    -- Post-conditions (optional smoke, read-only):
    --   \echo membership:
    --   SELECT r.rolname, r.rolcanlogin,
    --          pg_has_role('radar_db_ro_prod','pg_read_all_data','MEMBER') AS reads_all
    --     FROM pg_roles r WHERE r.rolname = 'radar_db_ro_prod';
---
apiVersion: batch/v1
kind: Job
metadata:
  name: radar-db-ro-role-provision
  namespace: radar-immobilier
  labels: { app.kubernetes.io/name: radar-immobilier, app.kubernetes.io/part-of: sentropic, role: pra-backup }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: radar-immobilier, app.kubernetes.io/component: db-backup, role: pra-backup }
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - { name: sql, configMap: { name: radar-db-ro-role-sql, defaultMode: 0444 } }
        - { name: home, emptyDir: { sizeLimit: 16Mi } }
      containers:
        # psql 16 (ships \getenv, verified) from the in-cluster postgis image — 0 new image (supply-chain).
        - name: provision
          image: postgis/postgis:16-3.4
          command: ["/usr/lib/postgresql/16/bin/psql"]
          args: ["-v", "ON_ERROR_STOP=1", "-f", "/sql/provision-ro-role.sql"]
          env:
            - { name: HOME, value: /home/psql }
            # SUPERUSER connection (can CREATE ROLE / GRANT) — the initdb bootstrap user `radar`.
            - { name: PGHOST, value: "radar-postgres" }
            - { name: PGPORT, value: "5432" }
            - { name: PGUSER,     valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_USER } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_PASSWORD } } }
            - { name: PGDATABASE, valueFrom: { secretKeyRef: { name: radar-db-credentials, key: POSTGRES_DB } } }
            # RO password from the minted secret (read by psql \getenv, kept out of argv/pod-spec).
            - { name: RO_PASSWORD, valueFrom: { secretKeyRef: { name: radar-db-ro-prod, key: POSTGRES_PASSWORD } } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: sql, mountPath: /sql, readOnly: true }
            - { name: home, mountPath: /home/psql }
