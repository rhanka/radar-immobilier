# =============================================================================
# radar-backup-freshness — daily FRESHNESS check of the prod backup, ns radar-immobilier.
#
# Reads s3://radar-immobilier-backup/manifests/latest.json with the READ-ONLY
# identity radar-backup-reader and FAILS (exit 5) when:
#   - the newest backup is older than FRESHNESS_MAX_AGE_DAYS (1: today or yesterday);
#   - the last `complete` backup (or, before any, the first backup) is older than
#     FRESHNESS_MAX_INCOMPLETE_DAYS (3) — i.e. partial/incomplete for too long;
#   - the pointer does not match what it points to (manifest sha256, dump size).
# SIGNAL: the alert destination is not decided yet; for now the FAILED Job of
# this CronJob is the signal (failedJobsHistoryLimit 7, TTL 7 days). Logs are
# verdict only (`FRESHNESS OK|FAIL …`).
#
# Same script as the backup (ConfigMap radar-backup-daily-script, mode
# `freshness`), same pinned radar-api image: 0 python, 0 new image. No DB access,
# no write right. Applied by bascule-bundle-cd.yml job `apply-backup`.
# 06:53 UTC: after the backup window (02:23 + 3 h activeDeadlineSeconds).
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: radar-backup-freshness
  namespace: radar-immobilier
  labels:
    app.kubernetes.io/name: radar-immobilier
    app.kubernetes.io/part-of: sentropic
    app.kubernetes.io/component: backup-freshness
    role: daily-backup
spec:
  schedule: "53 6 * * *"
  timeZone: "Etc/UTC"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: radar-immobilier
            app.kubernetes.io/part-of: sentropic
            app.kubernetes.io/component: backup-freshness
            role: daily-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - { name: scratch, emptyDir: { sizeLimit: 64Mi } }
            - name: script
              configMap:
                name: radar-backup-daily-script
                defaultMode: 0444
          containers:
            - name: freshness
              image: "ghcr.io/rhanka/radar-api@sha256:cb2ab4ec8bde643d0b7d0799b7c737f007f1ba7dd2f54392221275e042c22ac8"
              command: ["node", "/opt/backup/backup-daily.cjs", "freshness"]
              env:
                - { name: NODE_PATH, value: "/workspace/node_modules" }
                - { name: NODE_OPTIONS, value: "--max-old-space-size=128 --dns-result-order=ipv4first" }
                - { name: AWS_EC2_METADATA_DISABLED, value: "true" }
                # Identity radar-backup-reader: GetObject, ListBucket, ListBucketVersions.
                - { name: S3_ENDPOINT,   valueFrom: { secretKeyRef: { name: radar-backup-reader, key: S3_ENDPOINT } } }
                - { name: S3_REGION,     valueFrom: { secretKeyRef: { name: radar-backup-reader, key: S3_REGION } } }
                - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: radar-backup-reader, key: S3_ACCESS_KEY } } }
                - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: radar-backup-reader, key: S3_SECRET_KEY } } }
                - { name: BACKUP_BUCKET, valueFrom: { secretKeyRef: { name: radar-backup-reader, key: BACKUP_BUCKET } } }
                - { name: S3_FORCE_PATH_STYLE, value: "false" }
                - { name: EXPECTED_BACKUP_BUCKET, value: "radar-immobilier-backup" }
                - { name: FRESHNESS_MAX_AGE_DAYS, value: "1" }
                - { name: FRESHNESS_MAX_INCOMPLETE_DAYS, value: "3" }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
              resources:
                requests: { cpu: 10m, memory: 64Mi }
                limits: { cpu: 200m, memory: 256Mi }
              volumeMounts:
                - { name: scratch, mountPath: /tmp }
                - { name: script, mountPath: /opt/backup, readOnly: true }
