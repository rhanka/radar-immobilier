# Preprod activation values for scoped MCP signal writes (PR #1107).
# Applied only through this overlay, after the commissioning runbook.
# Announcing the scope before the preprod IdP declares it makes
# authorization requests fail with invalid_scope.
apiVersion: v1
kind: ConfigMap
metadata:
  name: immo-mcp-config
data:
  IMMO_MCP_OAUTH_SCOPES_SUPPORTED: "immo:read immo:search immo:documents:read immo:artifacts:read immo:artifacts:write immo:signals:write offline_access"
  IMMO_MCP_SIGNALS_WRITE_ENABLED: "1"
