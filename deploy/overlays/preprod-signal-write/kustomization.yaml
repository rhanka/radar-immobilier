# PREPROD signal-write ACTIVATION overlay (PR #1107 follow-up). NOT wired
# into any CD: deploy-preprod applies only deploy/overlays/preprod, which
# stays inert (flag "0", scope not announced). An operator applies THIS
# overlay by hand, once, after the commissioning runbook prerequisites for
# preprod: role immo_mcp_signal_writer, migration 0048 + migrator grants,
# Secret immo-mcp-signal-writer, and immo:signals:write declared at the
# preprod IdP. See docs/operator/mcp-signal-write-runbook.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../preprod
patches:
  - path: patch-immo-mcp-signal-write.yaml
    target:
      kind: ConfigMap
      name: immo-mcp-config
