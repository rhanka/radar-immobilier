# Preprod API publication and reader bindings. Optional references keep the
# application available when provisioning is incomplete; the capability closes.
# Persist all signing keys across restarts and share them across API instances.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ARTIFACTS_S3_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-preprod
        key: ARTIFACTS_S3_ACCESS_KEY
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ARTIFACTS_S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-preprod
        key: ARTIFACTS_S3_SECRET_KEY
        optional: true
# Browser upload page (files parity LOT 2): dedicated page-cookie secret on
# its own Secret so rotation never touches storage credentials. The
# conductor creates radar-artifacts-upload-page-preprod (key `secret`);
# this overlay only references it (no literal value: a literal here would
# conflict on server-side apply).
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ARTIFACTS_UPLOAD_PAGE_SECRET
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-upload-page-preprod
        key: secret
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ARTIFACTS_READER_GRANT_SECRET
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-reader-preprod
        key: ARTIFACTS_READER_GRANT_SECRET
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ARTIFACTS_READER_SESSION_SECRET
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-reader-preprod
        key: ARTIFACTS_READER_SESSION_SECRET
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: CLASSIFICATION_CURSOR_SECRET
    valueFrom:
      secretKeyRef:
        name: radar-classification-cursor-preprod
        key: CLASSIFICATION_CURSOR_SECRET
        optional: true
# Published write (artifact pages may prepare write intents). Secrets live in
# the operator-held Secret radar-published-write-preprod (never in git);
# missing optional references keep the app alive but close the capability.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: PW_IDENTITY_TIER
    value: preprod
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: PW_WRITE_GRANT_SECRET
    valueFrom:
      secretKeyRef:
        name: radar-published-write-preprod
        key: PW_WRITE_GRANT_SECRET
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: PW_CHALLENGE_SECRET
    valueFrom:
      secretKeyRef:
        name: radar-published-write-preprod
        key: PW_CHALLENGE_SECRET
        optional: true
# Admission sync, preprod side (lot I1). ADMISSION_PROD_PUBLIC_KEYS is a PUBLIC
# key entry (kid.base64(jwk-json), kid HHrnyG0BNHfS7DGw); its value lives in
# the operator-held ConfigMap radar-admission-preprod (key of the same name),
# referenced here with optional: true so a missing ConfigMap keeps the
# capability closed (syncEnabled requires keys). ADMISSION_TRUSTED_ISSUERS
# lists the preprod issuer only: in preprod, sessions come only from
# https://preprod.auth.sent-tech.ca, so the prod issuer is not needed for JIT.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ADMISSION_SYNC_ENABLED
    value: "1"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ADMISSION_TRUSTED_ISSUERS
    value: https://preprod.auth.sent-tech.ca
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ADMISSION_PROD_PUBLIC_KEYS
    valueFrom:
      configMapKeyRef:
        name: radar-admission-preprod
        key: ADMISSION_PROD_PUBLIC_KEYS
        optional: true
# Git-backed artifact mode, PREPROD ONLY (docs/operator/git-artifact-mode.md).
# Secret radar-artifacts-git-preprod is minted by the conductor through the
# documented rotation cycle (never in git); optional references keep the
# process alive and close the matching port (fail-closed) while a key is absent.
# radar-api: inbound SG4b routes (receipt key), live edge (HMAC keyring), git tools.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: IMMO_ARTIFACTS_SERVICE_OAUTH_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-git-preprod
        key: IMMO_ARTIFACTS_SERVICE_OAUTH_CLIENT_ID
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: IMMO_ARTIFACTS_SERVICE_OAUTH_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-git-preprod
        key: IMMO_ARTIFACTS_SERVICE_OAUTH_CLIENT_SECRET
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: IMMO_ARTIFACTS_GIT_CURSOR_KEY
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-git-preprod
        key: IMMO_ARTIFACTS_GIT_CURSOR_KEY
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: IMMO_ARTIFACTS_RECEIPT_SIGNING_KEY
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-git-preprod
        key: IMMO_ARTIFACTS_RECEIPT_SIGNING_KEY
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: IMMO_ARTIFACTS_LIVE_HOST_KEYS
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-git-preprod
        key: IMMO_ARTIFACTS_LIVE_HOST_KEYS
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: IMMO_ARTIFACTS_LIVE_DRAFT_KEYS
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-git-preprod
        key: IMMO_ARTIFACTS_LIVE_DRAFT_KEYS
        optional: true
