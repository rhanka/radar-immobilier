# Operator-applied Deployment: CD reconciles its ConfigMap, not these bindings.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: IMMO_MCP_ARTIFACT_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: immo-mcp-artifact-writer
        key: IMMO_MCP_ARTIFACT_DATABASE_URL
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ARTIFACTS_S3_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-preprod
        key: ARTIFACTS_S3_ACCESS_KEY
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ARTIFACTS_S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-preprod
        key: ARTIFACTS_S3_SECRET_KEY
        optional: true
# Browser upload page (files parity LOT 2): same dedicated page-cookie
# Secret as the API so both processes share the secret, the application
# origin and the pageBaseUrl. The conductor creates
# radar-artifacts-upload-page-preprod (key `secret`); this overlay only
# references it (no literal value: a literal here would conflict on
# server-side apply).
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ARTIFACTS_UPLOAD_PAGE_SECRET
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-upload-page-preprod
        key: secret
        optional: true
# Git-backed artifact mode, PREPROD ONLY (docs/operator/git-artifact-mode.md).
# Secret radar-artifacts-git-preprod is minted by the conductor through the
# documented rotation cycle (never in git); optional references keep the
# process alive and close the matching port (fail-closed) while a key is absent.
# radar-immo-mcp: git tools and live service (no receipt key, no live edge keyring).
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: IMMO_ARTIFACTS_SERVICE_OAUTH_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-git-preprod
        key: IMMO_ARTIFACTS_SERVICE_OAUTH_CLIENT_ID
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: IMMO_ARTIFACTS_SERVICE_OAUTH_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-git-preprod
        key: IMMO_ARTIFACTS_SERVICE_OAUTH_CLIENT_SECRET
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: IMMO_ARTIFACTS_GIT_CURSOR_KEY
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-git-preprod
        key: IMMO_ARTIFACTS_GIT_CURSOR_KEY
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: IMMO_ARTIFACTS_LIVE_DRAFT_KEYS
    valueFrom:
      secretKeyRef:
        name: radar-artifacts-git-preprod
        key: IMMO_ARTIFACTS_LIVE_DRAFT_KEYS
        optional: true
