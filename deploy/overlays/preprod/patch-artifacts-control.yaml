# Preprod general opening. Provision these coordinates BEFORE CD reconciliation;
# see docs/runbooks/ARTIFACTS_PREPROD_ACTIVATION.md. No user allowlist or window.
apiVersion: v1
kind: ConfigMap
metadata:
  name: radar-api
data:
  ARTIFACTS_CONTROL_MODE: "general"
  ARTIFACTS_STORAGE_SCOPE: "radar-immobilier-preprod"
  ARTIFACTS_ORG_ID: "radar-immobilier-preprod"
  ARTIFACTS_S3_BUCKET: "radar-immobilier-artifacts-preprod"
  ARTIFACTS_S3_ENDPOINT: "https://s3.bhs.io.cloud.ovh.net"
  ARTIFACTS_S3_REGION: "bhs"
  ARTIFACTS_CONTENT_BASE: "pages.preprod.immo.sent-tech.ca"
  # Shared blob deadline of one publish, in ms. Tuning only: covers a 32-file
  # publish at 1.3-1.5 s per S3 request on OVH BHS, plus margin. Kept in the
  # ConfigMap (not the Deployment patch) so the workload render guards keep
  # their exact ARTIFACTS_ env counts.
  ARTIFACTS_PUBLISH_BLOB_DEADLINE_MS: "120000"
  ARTIFACTS_READER_ISSUER: "https://preprod.immo.sent-tech.ca"
  ARTIFACTS_READER_AUDIENCE: "https://preprod.immo.sent-tech.ca/reader"
  ARTIFACTS_READER_TIER: "preprod"
  CLASSIFICATION_CURSOR_KEY_ID: "preprod-v1"
  # Git-backed artifact mode, PREPROD ONLY (docs/operator/git-artifact-mode.md).
  # Same value on radar-immo-mcp (patch-immo-mcp-config.yaml): both compose the
  # artifacts host and the profile digest depends on it. Requires the
  # @sentropic/artifacts 0.2.20 qualification commit: on 0.2.18 the stage
  # refuses to boot (artifact_git_mode_provider_unqualified).
  IMMO_ARTIFACTS_GIT_MODE: "bindings"
