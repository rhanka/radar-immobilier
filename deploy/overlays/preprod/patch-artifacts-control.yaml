# Preprod general opening. Provision these coordinates BEFORE CD reconciliation;
# see docs/runbooks/ARTIFACTS_PREPROD_ACTIVATION.md. No user allowlist or window.
apiVersion: v1
kind: ConfigMap
metadata:
  name: radar-api
data:
  ARTIFACTS_CONTROL_MODE: "general"
  ARTIFACTS_STORAGE_SCOPE: "radar-immobilier-preprod"
  ARTIFACTS_ORG_ID: "radar-immobilier-preprod"
  ARTIFACTS_S3_BUCKET: "radar-immobilier-artifacts-preprod"
  ARTIFACTS_S3_ENDPOINT: "https://s3.bhs.io.cloud.ovh.net"
  ARTIFACTS_S3_REGION: "bhs"
  ARTIFACTS_CONTENT_BASE: "pages.preprod.immo.sent-tech.ca"
  # Shared blob deadline of one publish, in ms. Tuning only: covers a 32-file
  # publish at 1.3-1.5 s per S3 request on OVH BHS, plus margin. Kept in the
  # ConfigMap (not the Deployment patch) so the workload render guards keep
  # their exact ARTIFACTS_ env counts.
  ARTIFACTS_PUBLISH_BLOB_DEADLINE_MS: "120000"
  ARTIFACTS_READER_ISSUER: "https://preprod.immo.sent-tech.ca"
  ARTIFACTS_READER_AUDIENCE: "https://preprod.immo.sent-tech.ca/reader"
  ARTIFACTS_READER_TIER: "preprod"
  CLASSIFICATION_CURSOR_KEY_ID: "preprod-v1"
  # Git-backed artifact mode, PREPROD ONLY (docs/operator/git-artifact-mode.md).
  # Same value on radar-immo-mcp (patch-immo-mcp-config.yaml): both compose the
  # artifacts host and the profile digest depends on it. Requires the
  # @sentropic/artifacts 0.2.20 qualification commit: on 0.2.18 the stage
  # refuses to boot (artifact_git_mode_provider_unqualified).
  IMMO_ARTIFACTS_GIT_MODE: "live"
  # Owner identity for the git-backed mode (owner rhanka; preprod OIDC sub of fabien.antoine@gmail.com).
  IMMO_ARTIFACTS_GIT_COMMITTER_NAME: "rhanka"
  IMMO_ARTIFACTS_GIT_COMMITTER_EMAIL: "24390932+rhanka@users.noreply.github.com"
  # Code readers (OIDC subs): owner, plus Farid and Steve as live participants (owner, 08/11 ~02 h 20).
  IMMO_ARTIFACTS_GIT_CODE_READERS: "1b9b9e15-2956-4df4-9ee1-a42273f0d096,efd67056-fb60-42e6-a386-6264c854da55,92c90751-aa0e-49a9-ad61-1dfa21934b8a"
  IMMO_ARTIFACTS_GIT_HUMANS: '[{"principalId":"1b9b9e15-2956-4df4-9ee1-a42273f0d096","name":"rhanka","email":"24390932+rhanka@users.noreply.github.com"}]'
  # Non-secret git mode configuration (preprod values, Sentropic 2026-11-07).
  # Builder hostId on the Sentropic side: immo-preprod.
  IMMO_ARTIFACTS_SERVICE_OAUTH_TOKEN_ENDPOINT: "https://preprod.auth.sent-tech.ca/api/v1/auth/oauth/token"
  IMMO_ARTIFACTS_GIT_BROKER_ORIGIN: "https://preprod.sentropic.sent-tech.ca"
  # SG0-app enrollment ref (owner fabien.antoine, 08/11 ~06:30), repo rhanka/radar-immobilier only.
  IMMO_ARTIFACTS_GIT_INSTALLATION_REF: "enroll_d6fac2e1-8328-4e74-8bc4-08aeafe54f11"
  IMMO_ARTIFACTS_BUILDER_URL: "https://preprod.sentropic.sent-tech.ca/api/v1/artifacts/builder"
  IMMO_ARTIFACTS_RECEIPT_KEY_ID: "immo-preprod-receipt-1"
  IMMO_ARTIFACTS_LIVE_HOST_KID: "immo-preprod-live-1"
  IMMO_ARTIFACTS_LIVE_HOST: "pages.preprod.immo.sent-tech.ca"
  # A-LIVE §8.2 live edge forward, PREPROD ONLY (radar-api reader mount; the
  # flag is also set on radar-immo-mcp for the live worker client). It
  # fails closed: with an incomplete configuration live paths show « live
  # indisponible » and the release keeps being served
  # (packages/artifacts-host/src/git-mode/live-forward.ts).
  IMMO_ARTIFACTS_LIVE_EDGE_ENABLED: "1"
  # GB4 GO preprod (owner, recorded 07/11 ~22 h 10 Montreal in the sentropic
  # owner-authorization.md): live worker and generic invitations qualified,
  # PREPROD ONLY. Same values on radar-immo-mcp. Only the literal `true` counts.
  IMMO_ARTIFACTS_LIVE_QUALIFIED: "true"
  IMMO_ARTIFACTS_LIVE_INVITATIONS_QUALIFIED: "true"
  IMMO_ARTIFACTS_LIVE_EDGE_URL: "http://artifact-content.sentropic-preprod.svc.cluster.local:8791"
  IMMO_ARTIFACTS_LIVE_CONTROL_URL: "https://pages.preprod.immo.sent-tech.ca/_live-control/v1"
  IMMO_ARTIFACTS_LIVE_DRAFT_KEY_CURRENT: "v1"
  # SG4b inbound host (radar-api only: radar-immo-mcp reads neither key).
  # Exact builder image digests admitted at handoff, comma-separated
  # (empty: every handoff refused with image_not_allowed).
  IMMO_ARTIFACTS_BUILDER_IMAGE_ALLOWLIST: "docker.io/library/node@sha256:add5c17c14752c54d2f3d519ec46a3815684d41c33f198bcb09fb998f7dcbf68"
  # Sentropic preprod builder handoff PUBLIC key, `kid=base64(SPKI DER)`
  # Ed25519, comma-separated during a rotation (public, not a secret).
  IMMO_ARTIFACTS_BUILDER_HANDOFF_PUBLIC_KEYS: "sentropic-preprod-builder-1=MCowBQYDK2VwAyEA+Y5el4OTdFqjiwyJv9XOLZneUWzx/bedvt1ddoBYcq0="
