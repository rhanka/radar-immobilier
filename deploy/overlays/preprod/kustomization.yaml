# PREPROD overlay — the CD (build-push-images.yml, deploy-preprod) applies THIS
# so the live preprod state tracks git (not just images). It fixes three drifts
# that "kubectl set image" alone never reconciled:
#   1. stale radar-ui-nginx ConfigMap (#608 headers not served) — the base's
#      configMapGenerator hashes deploy/k8s/nginx/default.conf, so a content
#      change rolls the radar-ui Deployment automatically; this overlay now
#      REPLACES that generator's default.conf (behavior: replace) with a preprod
#      copy that repoints /api/geo/collections at geo-preprod (cross-tenant
#      isolation vs the base's prod-pointing conf), so the generated CM still
#      hash-rolls the radar-ui Deployment on content change but no longer serves
#      the prod geo upstream;
#   2. missing securityContext on the durable workloads (#611) — reconciled by
#      applying the base manifests;
#   3. missing PSS labels on the namespace — the kustomize `namespace` transformer
#      renames the base Namespace object to radar-immobilier-preprod and PRESERVES
#      its pod-security.kubernetes.io/* labels (00-namespace.yaml).
#
# LOCATION: OUTSIDE deploy/k8s on purpose. An overlay nested INSIDE its base dir
# (deploy/k8s/overlays/preprod referencing ../../) makes kustomize refuse with
# "cycle detected: candidate root deploy/k8s contains visited root …/overlays".
# Siting it at deploy/overlays/preprod referencing ../../k8s keeps base and
# overlay in separate trees.
#
# The base (../../k8s) hardcodes namespace: radar-immobilier (PROD). This overlay
# retargets EVERYTHING to radar-immobilier-preprod, so an accidental apply can
# never hit prod. The base already EXCLUDES the one-shot Jobs (31/32/33) and the
# refresh CronJobs (34, overlay-managed image-pin), so this overlay renders
# durables only — no one-shot Job ("0 Job" is structural, no kind filter needed).
#
# ⚠ Build/apply with `--load-restrictor LoadRestrictionsNone`: `resources:
# [../../k8s]` references a parent dir, which the default root-only restrictor
# forbids. The CD renders with
# `kustomize build --load-restrictor LoadRestrictionsNone deploy/overlays/preprod`
# and pipes to `kubectl apply --server-side` (kubectl apply -k cannot pass the
# restrictor flag) — same pattern as deploy/k8s/refresh-cronjobs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: radar-immobilier-preprod

resources:
  - ../../k8s

configMapGenerator:
  - name: radar-ui-nginx
    behavior: replace
    files:
      - default.conf=nginx/default.conf

# Per-env object-storage bucket. The base ConfigMap radar-api carries the PROD
# buckets (SCRAPE/GRAPH_S3_BUCKET=radar-immobilier-docs); in preprod, scrape AND
# graph must land in the SERVED preprod bucket. The refresh CronJob reads
# SCRAPE_S3_BUCKET from THIS ConfigMap (configMapKeyRef), and the api serves from
# it too, so both converge on one value — no per-workload literal that can
# silently diverge (this is the fix for the graph-preprod PDF misroute).
# `replace` because both keys already exist in the base ConfigMap.
# NB: reconcile-preprod.sh whitelists ConfigMap radar-api so this override is
# actually applied to the live preprod ConfigMap (it was previously excluded to
# avoid leaking the base's PROD buckets — safe now that the override exists).
patches:
  - target:
      kind: ConfigMap
      name: radar-api
    patch: |
      - op: replace
        path: /data/SCRAPE_S3_BUCKET
        value: radar-immobilier-docs-preprod
      - op: replace
        path: /data/GRAPH_S3_BUCKET
        value: radar-immobilier-docs-preprod

# CPU pressure fix (nœud préprod unique OVH saturé, 95%/1749m requests — pod
# radar-api Pending "Insufficient cpu" sur le rollout image 0e8807b, breakdown
# k8s confirmé) :
#   - requests.cpu 100m -> 40m (iso prod) : le préprod n'a pas de trafic réel
#     justifiant 2,5x le request prod ; libère 60m persistants sur le nœud.
#   - strategy Recreate (au lieu du RollingUpdate maxSurge:1/maxUnavailable:0 de
#     la base) : sur un nœud plein, le surge pod RollingUpdate ne trouve jamais
#     de place (il lui faut le request ENTIER en plus, pendant que l'ancien pod
#     tourne encore) -> Pending permanent. Recreate libère les 40m de l'ancien
#     pod AVANT de créer le nouveau : ~30s d'indispo préprod, acceptable (pas de
#     SLA préprod), et le rollout peut enfin scheduler. PROD reste RollingUpdate
#     (base, inchangée) : c'est un choix préprod uniquement, où la dispo
#     continue importe moins que débloquer le déploiement sur nœud contraint.
  - target:
      kind: Deployment
      name: radar-api
    patch: |
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 40m
