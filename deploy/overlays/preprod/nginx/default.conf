# Variante PREPROD de la conf nginx cluster de radar-ui (source du ConfigMap
# radar-ui-nginx). Copie complète de deploy/k8s/nginx/default.conf ne différant
# QUE sur l'upstream /api/geo/collections, repointé vers geo-PREPROD
# (geo-api.geo-preprod.svc + Host api.preprod.geo.sent-tech.ca) : ainsi l'immo
# preprod ne proxifie JAMAIS vers geo PROD (isolation cross-tenant ; la
# NetworkPolicy prod jette les appels cross-namespace → hang).
# Suivi : cette copie intégrale duplique la conf de base ; à réduire plus tard à
# un endpoint geo paramétré (env/include) pour éviter la dérive d'en-têtes. Les
# security headers ci-dessous DOIVENT rester identiques à la base (vérifiés avec
# le bloc worker par check-header-parity.sh, qui compare base-cluster, compose
# et preprod).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers & information disclosure mitigation
  server_tokens off;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), clipboard-write=(self)" always;
  add_header Content-Security-Policy "worker-src 'self'" always;

  # MapLibre and pdf.js workers require JS MIME and must never receive SPA HTML.
  location ~ \.(js|mjs)$ {
    types { }
    default_type text/javascript;
    try_files $uri =404;
  }

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API proxy to the radar api Service (incl. the sentropic
  # OIDC callback /api/v1/auth/oauth/callback handled by the api RP glue).
  # Same-origin proxy to geo OGC API for immo consumers.
  # Only /api/geo/collections is owned by geo-api; radar-api owns the
  # application-specific /api/geo/:city/zones routes.
  location /api/geo/collections {
    rewrite ^/api/geo/(.*)$ /$1 break;
    proxy_pass http://geo-api.geo-preprod.svc.cluster.local;
    proxy_set_header Host api.preprod.geo.sent-tech.ca;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/geo/ {
    proxy_pass http://radar-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # H3 control publication (861C unit 10): the transport envelope may reach
  # 2 MiB so a valid JSON publication above 1 MiB still reaches the API. The
  # decoded publication budget (256 KiB) stays enforced by the API itself.
  # The path boundary bounds the 2 MiB envelope to the control subtree:
  # /api/v1/artifacts/control-other and other neighbors keep the 1 MiB
  # default from the generic location below.
  location ~ ^/api/v1/artifacts/control(?:/|$) {
    client_max_body_size 2m;
    proxy_pass http://radar-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://radar-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://radar-api:3000/health;
  }
}
