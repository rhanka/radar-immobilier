# PREPROD settings of the immo MCP server (ConfigMap immo-mcp-config, read by
# the radar-immo-mcp Deployment through envFrom; base:
# deploy/k8s/40-immo-mcp-http-deploy.yaml, which carries the PROD values).
# Strategic-merge patch: only the keys that name an environment are changed;
# every other key (data mode, port, api wiring) is inherited from the base so
# preprod and prod stay aligned by construction (GH #835). Exception: the
# artifact scopes below, because the artifact tools are active in preprod only.
#
# - IMMO_MCP_OAUTH_RESOURCE: the canonical resource = token audience, advertised
#   in the RFC 9728 PRM at <resource>/.well-known/oauth-protected-resource and in
#   the 401 `WWW-Authenticate: resource_metadata=...` challenge. Before this
#   patch preprod advertised the PROD resource, so a client following the
#   challenge was sent to prod.
# - IMMO_MCP_OAUTH_ISSUER: same mechanism as prod, where the MCP issuer is the
#   app's own IdP (prod: auth.sent-tech.ca for both radar-api and the MCP).
#   search_signals exchanges the human bearer for a delegated API token.
#   Both hops use the preprod issuer, with distinct MCP and API audiences.
# - RADAR_PUBLIC_BASE_URL: base of the URLs the MCP hands back (get_pv_pdf).
# - IMMO_MCP_OAUTH_SCOPES_SUPPORTED: the base list plus the explicit artifact
#   scopes immo:artifacts:read (artifacts_list, artifacts_get) and
#   immo:artifacts:write (artifacts_ensure, artifacts_publish), plus
#   offline_access. Advertised in the PRM, so clients request them at consent.
#   offline_access is what lets claude.ai obtain a refresh token from the
#   preprod IdP (whose immo-mcp client row is refresh-eligible): without it
#   the 1 h access TTL forces a manual OAuth round-trip after every expiry
#   or pod restart. PRECONDITION: the preprod IdP catalogue and the
#   immo-mcp client must know these scopes before this value rolls out,
#   otherwise an authorization request carrying them can be refused.
#   PROD deliberately keeps the base three scopes (no offline_access): the
#   prod immo-mcp client row is not refresh-eligible, so advertising it
#   there would only produce invalid_scope errors. Enabling it in prod is
#   an owner decision (client row upsert first, advertisement second).
# - IMMO_MCP_ARTIFACTS_LEGACY_READ_SCOPE: transition flag. "true" lets immo:read
#   still satisfy the READ artifact tools for clients consented before the
#   explicit scopes existed; writes always require immo:artifacts:write. Remove
#   (or set "false") once connected clients have re-consented.
#
# Guarded by deploy/ci/check-preprod-auth-isolation.sh (CI + reconcile), which
# also requires the MCP issuer to equal the radar-api issuer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: immo-mcp-config
data:
  IMMO_MCP_OAUTH_ISSUER: "https://preprod.auth.sent-tech.ca"
  IMMO_MCP_OAUTH_RESOURCE: "https://preprod.immo.sent-tech.ca/mcp"
  RADAR_PUBLIC_BASE_URL: "https://preprod.immo.sent-tech.ca"
  IMMO_MCP_API_AUDIENCE: "https://preprod.immo.sent-tech.ca"
  IMMO_MCP_EXCHANGE_TOKEN_ENDPOINT: "https://preprod.auth.sent-tech.ca/api/v1/auth/oauth/token"
  IMMO_MCP_EXCHANGE_ENV: "preprod"
  # Must match radar-api: one physical namespace shared by all approved users.
  IMMO_MCP_OAUTH_SCOPES_SUPPORTED: "immo:read immo:search immo:documents:read immo:artifacts:read immo:artifacts:write offline_access"
  IMMO_MCP_ARTIFACTS_LEGACY_READ_SCOPE: "true"
  ARTIFACTS_CONTROL_MODE: "general"
  ARTIFACTS_STORAGE_SCOPE: "radar-immobilier-preprod"
  ARTIFACTS_ORG_ID: "radar-immobilier-preprod"
  ARTIFACTS_S3_BUCKET: "radar-immobilier-artifacts-preprod"
  ARTIFACTS_S3_ENDPOINT: "https://s3.bhs.io.cloud.ovh.net"
  ARTIFACTS_S3_REGION: "bhs"
  ARTIFACTS_CONTENT_BASE: "pages.preprod.immo.sent-tech.ca"
  # Shared blob deadline of one publish, in ms. Same value as ConfigMap
  # radar-api: both workloads compose an artifacts host that runs publish
  # dispatch. Kept in the ConfigMap (not the Deployment patch) so the
  # workload render guard keeps its exact ARTIFACTS_ env count.
  ARTIFACTS_PUBLISH_BLOB_DEADLINE_MS: "120000"
  # Git-backed artifact mode, PREPROD ONLY (docs/operator/git-artifact-mode.md).
  # Same value on radar-api (patch-artifacts-control.yaml): both compose the
  # artifacts host and the profile digest depends on it. Requires the
  # @sentropic/artifacts 0.2.20 qualification commit: on 0.2.18 the stage
  # refuses to boot (artifact_git_mode_provider_unqualified).
  IMMO_ARTIFACTS_GIT_MODE: "live"
  # Owner identity for the git-backed mode (owner rhanka; preprod OIDC sub of fabien.antoine@gmail.com).
  IMMO_ARTIFACTS_GIT_COMMITTER_NAME: "rhanka"
  IMMO_ARTIFACTS_GIT_COMMITTER_EMAIL: "24390932+rhanka@users.noreply.github.com"
  # Code readers (OIDC subs): owner, plus Farid and Steve as live participants (owner, 08/11 ~02 h 20).
  IMMO_ARTIFACTS_GIT_CODE_READERS: "1b9b9e15-2956-4df4-9ee1-a42273f0d096,efd67056-fb60-42e6-a386-6264c854da55,92c90751-aa0e-49a9-ad61-1dfa21934b8a"
  IMMO_ARTIFACTS_GIT_HUMANS: '[{"principalId":"1b9b9e15-2956-4df4-9ee1-a42273f0d096","name":"rhanka","email":"24390932+rhanka@users.noreply.github.com"}]'
  # Non-secret git mode configuration (preprod values, Sentropic 2026-11-07).
  # Builder hostId on the Sentropic side: immo-preprod.
  IMMO_ARTIFACTS_SERVICE_OAUTH_TOKEN_ENDPOINT: "https://preprod.auth.sent-tech.ca/api/v1/auth/oauth/token"
  IMMO_ARTIFACTS_GIT_BROKER_ORIGIN: "https://preprod.sentropic.sent-tech.ca"
  # SG0-app enrollment ref (owner fabien.antoine, 08/11 ~06:30), repo rhanka/radar-immobilier only.
  IMMO_ARTIFACTS_GIT_INSTALLATION_REF: "enroll_d6fac2e1-8328-4e74-8bc4-08aeafe54f11"
  IMMO_ARTIFACTS_BUILDER_URL: "https://preprod.sentropic.sent-tech.ca/api/v1/artifacts/builder"
  IMMO_ARTIFACTS_RECEIPT_KEY_ID: "immo-preprod-receipt-1"
  IMMO_ARTIFACTS_LIVE_HOST_KID: "immo-preprod-live-1"
  IMMO_ARTIFACTS_LIVE_HOST: "pages.preprod.immo.sent-tech.ca"
  IMMO_ARTIFACTS_LIVE_CONTROL_URL: "https://pages.preprod.immo.sent-tech.ca/_live-control/v1"
  IMMO_ARTIFACTS_LIVE_DRAFT_KEY_CURRENT: "v1"
  # W9 edge flag, PREPROD ONLY: on radar-immo-mcp it composes the live worker
  # client (packages/artifacts-host/src/git-mode/compose.ts), so the MCP tools
  # live_write and live_control(start) reach the builder instead of answering
  # builder_unavailable. The forward URL stays on radar-api (reader mount).
  IMMO_ARTIFACTS_LIVE_EDGE_ENABLED: "1"
  # Durable live re-drive (@sentropic/artifacts 0.2.27), PREPROD ONLY and in
  # THIS workload only (never on radar-api): boot pass + every 15 s, SIGTERM
  # drain. The package overlap guards are process-local, so exactly one
  # process per storage scope may run it. radar-immo-mcp carries the MCP live
  # flow (live_write, live_control) and runs 1 replica with a Recreate
  # strategy, so a rollout never runs two loops; radar-api has 1 to 2
  # replicas. Only the literal `true` counts.
  IMMO_ARTIFACTS_LIVE_REDRIVE_ENABLED: "true"
  # GB4 GO preprod (owner, recorded 07/11 ~22 h 10 Montreal): live worker and
  # generic invitations qualified, PREPROD ONLY. Only the literal `true` counts.
  IMMO_ARTIFACTS_LIVE_QUALIFIED: "true"
  IMMO_ARTIFACTS_LIVE_INVITATIONS_QUALIFIED: "true"
